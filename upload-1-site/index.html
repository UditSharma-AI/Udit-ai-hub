LABS.nlAnalogy = XH.calc({ p: "ana", title: "Vector arithmetic: king − man + woman", cap: "Toy 2-D embeddings with a 'royalty' axis and a 'gender' axis. Good embeddings place relations as consistent offsets, so analogies become arithmetic. One-hot vectors can't do this: every pair has dot product 0.",
  inputs: [["a", "a", ["king", "paris", "walking"]], ["noise", "embedding noise", 0, 0.5, 0.05, 0.1]],
  out: v => { const r = prng(3), n = () => v.noise * gauss(r);
    const sets = { king: { a: ["king", [2, 1]], b: ["man", [0, 1]], c: ["woman", [0, -1]], d: ["queen", [2, -1]], others: [["prince", [1.6, 1.2]], ["princess", [1.6, -1.2]], ["boy", [0.2, 1.3]]] },
      paris: { a: ["paris", [2, 1]], b: ["france", [0, 1]], c: ["italy", [0, -1]], d: ["rome", [2, -1]], others: [["berlin", [2.1, 0.2]], ["germany", [0.1, 0.2]], ["madrid", [1.9, -0.3]]] },
      walking: { a: ["walking", [2, 1]], b: ["walk", [0, 1]], c: ["swim", [0, -1]], d: ["swimming", [2, -1]], others: [["walked", [1.2, 1.1]], ["swam", [1.2, -1.1]], ["run", [0, 0.2]]] } }[v.a];
    const E = {}; [sets.a, sets.b, sets.c, sets.d, ...sets.others].forEach(([w, x]) => E[w] = [x[0] + n(), x[1] + n()]);
    const t = [E[sets.a[0]][0] - E[sets.b[0]][0] + E[sets.c[0]][0], E[sets.a[0]][1] - E[sets.b[0]][1] + E[sets.c[0]][1]];
    const cos = (p, q) => (p[0] * q[0] + p[1] * q[1]) / (Math.hypot(...p) * Math.hypot(...q));
    const cand = Object.entries(E).filter(([w]) => ![sets.a[0], sets.b[0], sets.c[0]].includes(w)).map(([w, x]) => [w, cos(t, x)]).sort((p, q) => q[1] - p[1]);
    return XH.lines([], { xmin: -0.5, xmax: 2.8, ymin: -1.8, ymax: 1.8 }, { x: "dimension 1 (y: dimension 2)" }, (sx, sy) => Object.entries(E).map(([w, x]) => `<circle cx="${sx(x[0])}" cy="${sy(x[1])}" r="4" fill="var(--nl)"/><text x="${sx(x[0]) + 5}" y="${sy(x[1]) - 4}" font-size="10" fill="var(--ink)">${w}</text>`).join("") + `<circle cx="${sx(t[0])}" cy="${sy(t[1])}" r="7" fill="none" stroke="var(--path)" stroke-width="2"/>`) + `<div class="readout"><span>${sets.a[0]} − ${sets.b[0]} + ${sets.c[0]} = (${XH.f(t[0], 2)}, ${XH.f(t[1], 2)}) (orange ring); closest word by cosine: <b>${cand[0][0]}</b> (${XH.f(cand[0][1], 3)}).</span><span>Word2Vec embeddings learned from large corpora show such regularities; they're approximate, and noise or bias can break them.</span></div>`; } });

LABS.nlSkipPairs = XH.calc({ p: "skp", title: "Skip-gram training pairs", cap: "Skip-gram slides a window over the text and turns each centre word into (centre, context) training pairs: predict each neighbour from the centre word.",
  inputs: [["s", "sentence", ["the quick brown fox jumps over the lazy dog", "I like deep learning and I like NLP"]], ["w", "window size", 1, 4, 1, 2], ["c", "centre position", 0, 8, 1, 3]],
  out: v => { const T = v.s.split(" "), c = Math.min(v.c, T.length - 1), pairs = []; for (let j = Math.max(0, c - v.w); j <= Math.min(T.length - 1, c + v.w); j++) if (j !== c) pairs.push(`(${T[c]}, ${T[j]})`);
    const all = T.reduce((s, _, i) => s + Math.min(T.length - 1, i + v.w) - Math.max(0, i - v.w), 0);
    return `<div style="display:flex;flex-wrap:wrap;gap:4px">${T.map((t, i) => `<span class="chip" style="${i === c ? "background:var(--nl);color:var(--surface)" : Math.abs(i - c) <= v.w ? "background:var(--nl-soft);color:var(--ink)" : ""}">${t}</span>`).join("")}</div><div class="formula">pairs for '${T[c]}': ${pairs.join(", ")}</div><div class="readout"><span>Whole sentence with window ${v.w}: ${all} pairs. Larger windows give more pairs and capture more topical (related) meaning; smaller windows capture more syntactic (similar) meaning.</span></div>`; } });

LABS.nlSoftmaxCost = XH.calc({ p: "smc", title: "Why full softmax is too expensive", cap: "Plain skip-gram computes P(c|w) = exp(u_c·v_w) / Σ_k exp(u_k·v_w) over the whole vocabulary for every training pair. Negative sampling replaces this with 1 + K binary decisions.",
  inputs: [["V", "vocabulary size", 1000, 1000000, 1000, 100000], ["K", "negative samples K", 2, 20, 1, 5], ["D", "embedding size D", 50, 300, 50, 100]],
  out: v => { const full = v.V * v.D, neg = (1 + v.K) * v.D;
    return XH.table(["", "dot products per pair", "multiply-adds"], [["full softmax", v.V.toLocaleString(), full.toLocaleString()], ["negative sampling", (1 + v.K).toLocaleString(), neg.toLocaleString()]]) + `<div class="readout"><span>Negative sampling is <b>${XH.f(full / neg, 0)}×</b> cheaper per training pair. With billions of pairs, that is the difference between days and minutes.</span><span>The 'security guard' view: instead of naming the right word among 100,000, just check 'is this pair real or fake?' for one real and K fake pairs.</span></div>`; } });

LABS.nlSgnsStep = XH.calc({ p: "sgn", title: "One SGNS update, worked", cap: "Centre 'king' v = [0.1, 0.3]; positive context 'rules' u⁺ = [0.2, 0.9]; negative 'table' u⁻ = [0.7, 0.1]; α = 0.1. Loss = −log σ(v·u⁺) − log σ(−v·u⁻). Raise the positive score, lower the negative one.",
  inputs: [["v1", "v₁", -1, 1, 0.05, 0.1], ["v2", "v₂", -1, 1, 0.05, 0.3], ["al", "α", 0.01, 1, 0.01, 0.1]],
  out: v => { const sg = x => 1 / (1 + Math.exp(-x)), V = [v.v1, v.v2], up = [0.2, 0.9], un = [0.7, 0.1], dp = V[0] * up[0] + V[1] * up[1], dn = V[0] * un[0] + V[1] * un[1], sp = sg(dp), sn = sg(dn);
    const g = [-(1 - sp) * up[0] + sn * un[0], -(1 - sp) * up[1] + sn * un[1]], nv = [V[0] - v.al * g[0], V[1] - v.al * g[1]], nup = [up[0] + v.al * (1 - sp) * V[0], up[1] + v.al * (1 - sp) * V[1]], nun = [un[0] - v.al * sn * V[0], un[1] - v.al * sn * V[1]];
    const L = -Math.log(sp) - Math.log(1 - sn);
    return XH.table(["quantity", "value"], [["score v·u⁺, σ", `${XH.f(dp)}, ${XH.f(sp)}`], ["score v·u⁻, σ", `${XH.f(dn)}, ${XH.f(sn)}`], ["loss", XH.f(L)], ["∂L/∂v = −(1−σ⁺)u⁺ + σ⁻u⁻", `[${XH.f(g[0])}, ${XH.f(g[1])}]`], ["v new", `<b>[${XH.f(nv[0])}, ${XH.f(nv[1])}]</b>`], ["u⁺ new (pulled toward v)", `[${XH.f(nup[0])}, ${XH.f(nup[1])}]`], ["u⁻ new (pushed away)", `[${XH.f(nun[0])}, ${XH.f(nun[1])}]`]]) + `<div class="readout"><span>Defaults: scores 0.29 and 0.10; v → [0.0718, 0.3333] (with σ rounded to 0.57/0.52 by hand: [0.0722, 0.3335]); u⁺ → [0.2043, 0.9128]; u⁻ → [0.6948, 0.0843].</span><span>Uses 1 − σ(x) = σ(−x). Push–pull: real neighbours attract, sampled noise words repel.</span></div>`; } });

LABS.nlNoiseDist = XH.calc({ p: "nzd", title: "Negative-sampling noise distribution and subsampling", cap: "Negatives are drawn from P(w) ∝ count(w)^0.75, which flattens the distribution so rare words are sampled a bit more. Frequent words in the training text are randomly discarded with probability 1 − √(t/f(w)), t ≈ 10⁻⁵.",
  inputs: [["e", "exponent", 0, 1, 0.05, 0.75], ["t", "subsampling threshold t (×10⁻⁵)", 0.1, 10, 0.1, 1]],
  out: v => { const W = [["the", 0.05], ["of", 0.03], ["dog", 0.0005], ["ongchoi", 0.000001]], tot = W.reduce((s, [, f]) => s + Math.pow(f, v.e), 0);
    return XH.table(["word", "frequency f", "unigram share", `share with f^${v.e}`, "discard prob. 1 − √(t/f)"], W.map(([w, f]) => [w, f, XH.f(f / W.reduce((s, x) => s + x[1], 0)), XH.f(Math.pow(f, v.e) / tot), XH.f(Math.max(0, 1 - Math.sqrt(v.t * 1e-5 / f)))])) + `<div class="readout"><span>The 0.75 power gives rare words more chances to be negatives than their raw frequency would; 'the' is discarded from training text most of the time, speeding training and improving rare-word vectors.</span></div>`; } });

LABS.nlSgnsTrain = {
  title: "Watch skip-gram embeddings organise themselves", cap: "Synthetic text mixes two topics (royalty, food) plus the filler word 'the'. SGNS learns 2-D input vectors (window 2, K = 3 negatives from counts^0.75). Press Play: topics separate as training proceeds.",
  html: () => `<div class="row">${ctrlBtns("sgt")}<span class="status-pill run" id="sgt-k"></span></div><div class="grid2" style="margin-top:6px"><div id="sgt-p"></div><div class="readout" id="sgt-r"></div></div>`,
  mount(root) {
    const royal = ["king", "queen", "prince", "crown", "palace"], food = ["bread", "soup", "cheese", "rice", "spoon"], vocab = [...royal, ...food, "the"], I = Object.fromEntries(vocab.map((w, i) => [w, i])), V = vocab.length;
    let r, Vin, U, text, pos, noise;
    const reset = () => { r = prng(5); Vin = vocab.map(() => [gauss(r) * 0.5, gauss(r) * 0.5]); U = vocab.map(() => [0, 0]); text = []; for (let k = 0; k < 600; k++) { const T = r() < 0.5 ? royal : food; for (let j = 0; j < 5; j++) text.push(I[T[Math.floor(r() * 5)]]); text.push(I.the); }
      const cnt = Array(V).fill(0); text.forEach(x => cnt[x]++); const p = cnt.map(c => Math.pow(c, 0.75)), s = p.reduce((a, b) => a + b, 0); noise = p.map(x => x / s); pos = 0; show(); };
    const samp = () => { let u = r(), i = 0; while (u > noise[i] && i < V - 1) { u -= noise[i]; i++; } return i; }, sg = x => 1 / (1 + Math.exp(-x));
    const upd = (w, c, lab) => { const v = Vin[w], u = U[c], g = sg(v[0] * u[0] + v[1] * u[1]) - lab; for (let d = 0; d < 2; d++) { const vd = v[d]; v[d] -= 0.05 * g * u[d]; u[d] -= 0.05 * g * vd; } };
    const step = () => { for (let k = 0; k < 600; k++) { const i = pos % text.length, w = text[i]; for (let j = Math.max(0, i - 2); j <= Math.min(text.length - 1, i + 2); j++) { if (j === i) continue; upd(w, text[j], 1); for (let n = 0; n < 3; n++) upd(w, samp(), 0); } pos++; } show(); };
    const show = () => { const xs = Vin.map(v => v[0]), ys = Vin.map(v => v[1]), m = Math.max(1, ...xs.map(Math.abs), ...ys.map(Math.abs)) * 1.15;
      el_(root, "#sgt-p").innerHTML = XH.lines([], { xmin: -m, xmax: m, ymin: -m, ymax: m }, { x: "embedding dim 1 (y: dim 2)" }, (sx, sy) => vocab.map((w, i) => `<circle cx="${sx(Vin[i][0])}" cy="${sy(Vin[i][1])}" r="4" fill="${royal.includes(w) ? "var(--nl)" : food.includes(w) ? "var(--dr)" : "var(--muted)"}"/><text x="${sx(Vin[i][0]) + 5}" y="${sy(Vin[i][1]) - 3}" font-size="9" fill="var(--ink)">${w}</text>`).join(""));
      const cos = (a, b) => (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(...a) * Math.hypot(...b) + 1e-9);
      el_(root, "#sgt-k").textContent = pos.toLocaleString() + " centre words";
      el_(root, "#sgt-r").innerHTML = `<span>cos(king, queen) = ${XH.f(cos(Vin[I.king], Vin[I.queen]), 2)} · cos(bread, soup) = ${XH.f(cos(Vin[I.bread], Vin[I.soup]), 2)} · cos(king, bread) = ${XH.f(cos(Vin[I.king], Vin[I.bread]), 2)}</span><span>Nothing told the model which words belong together; sharing contexts did. 'the' appears everywhere and ends up in between.</span>`; };
    player(root, "sgt", step, reset, 120, () => pos >= 30000); reset(); return show;
  }
};

LABS.nlEmbedSorter = sorterLab("Skip-gram, CBOW or GloVe?", "Skip-gram predicts context words from the centre word; CBOW predicts the centre word from the average of its context; GloVe fits vectors to global co-occurrence counts with weighted least squares.", { sg: "Skip-gram", cbow: "CBOW", glove: "GloVe" }, [
  ["Average the context vectors, then predict the missing middle word", "cbow", "Continuous bag of words."],
  ["For each centre word, predict each neighbour separately", "sg", "Many pairs per position; good for rare words."],
  ["Build a word–word count matrix first, then train on its non-zero cells", "glove", "Global statistics."],
  ["Faster to train, smooths over context, slightly weaker on rare words", "cbow", "One prediction per position."],
  ["Objective: f(Xᵢⱼ)(vᵢ·uⱼ + bᵢ + b̃ⱼ − log Xᵢⱼ)²", "glove", "Weighted least squares on log counts."],
  ["Usually trained with negative sampling, one (centre, context) pair at a time", "sg", "SGNS."]
]);

LABS.nlCooc = XH.calc({ p: "coo", title: "Co-occurrence counts and probability ratios", cap: "GloVe starts from a word–word co-occurrence matrix X. Ratios of conditional probabilities reveal meaning: for probe word k, P(k|ice)/P(k|steam) is large if k relates to ice only, small if to steam only, and ≈ 1 if to both or neither.",
  inputs: [["k", "probe word k", ["solid", "gas", "water", "fashion"]]],
  out: v => { const T = { solid: [1.9e-4, 2.2e-5], gas: [6.6e-5, 7.8e-4], water: [3.0e-3, 2.2e-3], fashion: [1.7e-5, 1.8e-5] }[v.k], ratio = T[0] / T[1];
    const cnt = XH.table(["", "I", "cats", "dogs", "like", "love"], [["I", 0, 0, 0, 2, 1], ["cats", 0, 0, 0, 1, 0], ["dogs", 0, 0, 0, 1, 1], ["like", 2, 1, 1, 0, 0], ["love", 1, 0, 1, 0, 0]]);
    return `<p class="small"><b>Toy corpus</b> "I like cats. I like dogs. I love dogs." (window 1): P(like | I) = 2/3.</p>` + cnt + XH.table(["probe k", "P(k | ice)", "P(k | steam)", "ratio"], [[v.k, T[0].toExponential(1), T[1].toExponential(1), `<b>${ratio >= 1 ? XH.f(ratio, 2) : XH.f(ratio, 3)}</b>`]]) + `<div class="readout"><span>${ratio > 3 ? "Large ratio: k is related to ice but not steam." : ratio < 0.3 ? "Small ratio: k relates to steam, not ice." : "Ratio ≈ 1: k relates to both (water) or neither (fashion): uninformative."}</span><span>GloVe chooses vectors so that (vᵢ − vⱼ)·uₖ ≈ log of this ratio.</span></div>`; } });

LABS.nlGloveStep = XH.calc({ p: "glv", title: "GloVe objective and one update", cap: "J = Σ f(Xᵢⱼ)(vᵢ·uⱼ + bᵢ + b̃ⱼ − log Xᵢⱼ)², with weighting f(x) = (x/x_max)^α for x < x_max (else 1), x_max = 100, α = 0.75. Worked pair 'cat'/'milk': v = [0.5, 0.2], u = [0.1, 0.9], b = 0.1, b̃ = 0.3, f = 0.8, log X = 3, η = 0.05.",
  inputs: [["lx", "log Xᵢⱼ", 0, 6, 0.1, 3], ["fx", "weight f(Xᵢⱼ)", 0, 1, 0.05, 0.8], ["eta", "η", 0.01, 0.2, 0.01, 0.05]],
  out: v => { const V = [0.5, 0.2], U = [0.1, 0.9], b = 0.1, bt = 0.3, pred = V[0] * U[0] + V[1] * U[1] + b + bt, e = pred - v.lx, J = v.fx * e * e, g = 2 * v.fx * e, nv = [V[0] - v.eta * g * U[0], V[1] - v.eta * g * U[1]], nu = [U[0] - v.eta * g * V[0], U[1] - v.eta * g * V[1]];
    const pts = []; for (let x = 0; x <= 150; x += 2) pts.push([x, x < 100 ? Math.pow(x / 100, 0.75) : 1]);
    return XH.table(["quantity", "value"], [["prediction v·u + b + b̃", XH.f(pred)], ["error", XH.f(e)], ["J (this pair)", XH.f(J)], ["2 f · error", XH.f(g)], ["v new", `<b>[${XH.f(nv[0], 5)}, ${XH.f(nv[1], 5)}]</b>`], ["u new", `[${XH.f(nu[0], 5)}, ${XH.f(nu[1], 5)}]`], ["b new", XH.f(b - v.eta * g, 4)]]) + XH.lines([{ pts, color: "var(--nl)" }], { xmin: 0, xmax: 150, ymin: 0, ymax: 1.1 }, { x: "co-occurrence count x (y: weight f(x))" }) + `<div class="readout"><span>Defaults: prediction 0.63, error −2.37, J = 4.49, v → [0.51896, 0.37064], u → [0.1948, 0.93792], b → 0.2896.</span><span>f caps very frequent pairs (weight 1 beyond x_max) and gives rare, noisy pairs little weight; zero counts are skipped entirely.</span></div>`; } });

}
/* ---- labs_x_nl4.js ---- */
{
/* ===== NLP M4 labs: language modelling ===== */
LABS.nlLmUses = sorterLab("Which application is the language model helping?", "A language model scores how probable a word sequence is. Many systems generate several candidates and let the LM pick the most fluent.", { mt: "Machine translation", sp: "Spelling correction", asr: "Speech recognition", ac: "Autocomplete" }, [
  ["'high winds tonight' preferred over 'large winds tonight'", "mt", "Both are possible translations; the LM knows which phrase is fluent."],
  ["'about fifteen minutes from' over 'about fifteen minuets from'", "sp", "Both are real words; context decides."],
  ["'I saw a van' over 'eyes awe of an'", "asr", "Similar sounds, very different probabilities."],
  ["Suggesting 'restaurant' after 'I'm looking for a cheap'", "ac", "Next-word prediction."],
  ["Choosing 'their' vs 'there' in 'put it over ___'", "sp", "Real-word error correction."]
]);

LABS.nlChainRule = XH.stepLab({ p: "chr", title: "Chain rule and the Markov assumption", cap: "P(w₁…wₙ) = Π P(wₖ | w₁…wₖ₋₁) exactly. Long histories are never seen often enough to count, so n-gram models condition only on the last n − 1 words.",
  steps: [
    { html: "P(its water is so transparent) = P(its) × P(water | its) × P(is | its water) × P(so | its water is) × P(transparent | its water is so)." },
    { html: "To estimate P(transparent | its water is so) by counting we'd need many occurrences of 'its water is so' in the corpus: almost never available. Most long histories occur zero times." },
    { html: "<b>Markov assumption (bigram)</b>: P(transparent | its water is so) ≈ P(transparent | so). Trigram: ≈ P(transparent | is so)." },
    { html: "Bigram model: P(its water is so transparent) ≈ P(its | &lt;s&gt;) P(water | its) P(is | water) P(so | is) P(transparent | so) P(&lt;/s&gt; | transparent), with sentence-boundary symbols." },
    { html: "Limitation: long-distance dependencies. 'The <u>computer</u> which I had just put into the machine room on the fifth floor <u>crashed</u>': agreement spans many words. Higher n helps a little; neural models (M5, M11) help much more." }
  ] });

LABS.nlBigramCounter = {
  title: "Count bigrams from your own corpus", cap: "Type sentences (one per line). Each gets &lt;s&gt; and &lt;/s&gt; markers; maximum-likelihood bigram estimates are P(w | prev) = C(prev w) / C(prev).",
  html: () => `<div class="slidergrid xh"><label for="bc-t" style="flex-direction:column;align-items:stretch">corpus (one sentence per line)<textarea id="bc-t" rows="3" style="width:100%;font:inherit;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:4px">I am Sam\nSam I am\nI do not like green eggs and ham</textarea></label><label for="bc-w">condition on previous word <select id="bc-w"></select></label></div><div id="bc-o" style="margin-top:8px"></div>`,
  mount(root) {
    const draw = (keepSel) => { const S = el_(root, "#bc-t").value.split("\n").map(l => l.trim()).filter(Boolean).map(l => ["<s>", ...l.split(/\s+/), "</s>"]);
      const U = {}, B = {}; S.forEach(t => t.forEach((w, i) => { U[w] = (U[w] || 0) + 1; if (i) { const k = t[i - 1] + "\u0001" + w; B[k] = (B[k] || 0) + 1; } }));
      const sel = el_(root, "#bc-w"), prevs = Object.keys(U).filter(w => w !== "</s>"), cur = keepSel && prevs.includes(sel.value) ? sel.value : (prevs.includes("I") ? "I" : prevs[0]);
      sel.innerHTML = prevs.map(w => `<option ${w === cur ? "selected" : ""}>${w.replace("<", "&lt;").replace(">", "&gt;")}</option>`).join("");
      const rows = Object.entries(B).filter(([k]) => k.split("\u0001")[0] === cur).map(([k, c]) => { const w = k.split("\u0001")[1]; return [`P(${w.replace("<", "&lt;").replace(">", "&gt;")} | ${cur.replace("<", "&lt;").replace(">", "&gt;")})`, `${c} / ${U[cur]}`, `<b>${XH.f(c / U[cur])}</b>`]; });
      el_(root, "#bc-o").innerHTML = XH.table(["bigram", "counts", "MLE"], rows) + `<div class="readout"><span>Default corpus: P(I | &lt;s&gt;) = 2/3, P(am | I) = 2/3, P(do | I) = 1/3, P(&lt;/s&gt; | Sam) = 1/2. Probabilities after any word sum to 1.</span><span>Any bigram not in the table gets probability 0 under MLE.</span></div>`; };
    el_(root, "#bc-t").addEventListener("input", () => draw(false)); el_(root, "#bc-w").addEventListener("input", () => draw(true)); draw(false); return draw;
  }
};

LABS.nlRestaurant = XH.calc({ p: "rst", title: "Sentence probability from bigrams", cap: "Bigram estimates from a corpus of restaurant queries. Multiply the conditional probabilities; in practice add log-probabilities to avoid numeric underflow.",
  inputs: [["s", "sentence (with start/end markers)", ["i want english food", "i want chinese food", "i want to eat", "i to eat"]]],
  out: v => { const P = { "<s> i": 0.25, "i want": 0.33, "want english": 0.0011, "want chinese": 0.0065, "english food": 0.5, "chinese food": 0.52, "food </s>": 0.68, "want to": 0.66, "to eat": 0.28, "eat </s>": 0.1, "i to": 0 };
    const t = ["<s>", ...v.s.split(" "), "</s>"], terms = []; for (let i = 1; i < t.length; i++) { const k = t[i - 1] + " " + t[i]; terms.push([k, P[k] === undefined ? 0 : P[k]]); }
    const prod = terms.reduce((s, [, p]) => s * p, 1), lg = terms.reduce((s, [, p]) => s + Math.log(p), 0);
    return XH.table(["bigram", "P(w | prev)"], terms.map(([k, p]) => [k.replace(/</g, "&lt;").replace(/>/g, "&gt;"), p])) + `<div class="formula">P = ${terms.map(x => x[1]).join(" × ")} = <b>${prod ? prod.toExponential(2) : "0"}</b> · log P = ${isFinite(lg) ? XH.f(lg) : "−∞"}</div><div class="readout"><span>${prod === 0 ? "A single zero bigram (C(i to) = 0) makes the whole sentence impossible: the zero-count problem that smoothing fixes." : "Worked: .25 × .33 × .0011 × .5 × .68 = 0.000031 for 'i want english food'."}</span><span>The 'chinese' and 'eat &lt;/s&gt;' estimates are illustrative; the others match the worked numbers in this session.</span></div>`; } });

LABS.nlLaplace = XH.calc({ p: "lap", title: "Add-1 (Laplace) and add-k smoothing", cap: "P*(w | prev) = (C(prev w) + k) / (C(prev) + kV). The reconstituted count c* = (C + k)·C(prev)/(C(prev) + kV) shows how much probability mass was moved to unseen pairs.",
  inputs: [["c", "C(prev w)", 0, 1000, 1, 827], ["h", "C(prev)", 1, 5000, 1, 2533], ["V", "vocabulary size V", 10, 5000, 1, 1446], ["k", "k", 0.01, 1, 0.01, 1]],
  out: v => { const mle = v.c / v.h, p = (v.c + v.k) / (v.h + v.k * v.V), cs = (v.c + v.k) * v.h / (v.h + v.k * v.V);
    return XH.table(["", "value"], [["MLE C/C(prev)", XH.f(mle)], ["smoothed P*", `<b>${XH.f(p)}</b>`], ["reconstituted count c*", XH.f(cs, 1)], ["real count", v.c]]) + `<div class="readout"><span>Defaults ('i want', V = 1446): 828/3979 = 0.21 (MLE 0.33); c* ≈ 527 instead of 827: add-1 steals a lot from frequent pairs. Unseen 'i to': 1/3979 = 0.00025.</span><span>Smaller k (add-k) is gentler; add-1 is fine for text classification but too blunt for n-gram LMs.</span></div>`; } });

LABS.nlInterp = XH.calc({ p: "itp", title: "Interpolation and stupid backoff", cap: "Linear interpolation blends trigram, bigram and unigram estimates with weights λ summing to 1 (tuned on held-out data). Backoff uses the highest order with evidence; stupid backoff multiplies by 0.4 per step down and returns scores, not probabilities.",
  inputs: [["p3", "P(w | u v) trigram", 0, 1, 0.01, 0], ["p2", "P(w | v) bigram", 0, 1, 0.01, 0.2], ["p1", "P(w) unigram", 0, 0.1, 0.001, 0.01], ["l3", "λ₃", 0, 1, 0.05, 0.5], ["l2", "λ₂", 0, 1, 0.05, 0.3]],
  out: v => { const l1 = 1 - v.l3 - v.l2, ok = l1 >= -1e-9, pi = v.l3 * v.p3 + v.l2 * v.p2 + Math.max(0, l1) * v.p1, sb = v.p3 > 0 ? v.p3 : v.p2 > 0 ? 0.4 * v.p2 : 0.16 * v.p1;
    return XH.table(["method", "value"], [["λ₁ = 1 − λ₃ − λ₂", ok ? XH.f(l1) : "invalid (λs must sum to 1)"], ["interpolated P", `<b>${ok ? XH.f(pi) : "—"}</b>`], ["stupid backoff score", XH.f(sb)]]) + `<div class="readout"><span>With an unseen trigram (0) interpolation still gives a non-zero probability from lower orders. Interpolation generally beats backoff in practice.</span><span>Stupid backoff (for web-scale n-grams): use the trigram relative frequency if seen, else 0.4 × bigram, else 0.4² × unigram.</span></div>`; } });

LABS.nlShannon = {
  title: "Generate text from n-gram models", cap: "Train unigram, bigram and trigram models on a small built-in text, then sample sentences word by word (the 'Shannon game'). Higher orders sound more fluent but start copying the training text.",
  html: () => `<div class="slidergrid xh"><label for="sh-n">model <select id="sh-n"><option value="1">unigram</option><option value="2" selected>bigram</option><option value="3">trigram</option></select></label></div><div class="row" style="margin-top:6px"><button class="btn primary sm" id="sh-g">Generate 3 sentences</button></div><div id="sh-o" class="panel small" style="margin-top:8px"></div>`,
  mount(root) {
    const TXT = ["i want to eat chinese food", "i want to find a cheap restaurant", "i would like to eat lunch", "tell me about a cheap chinese restaurant", "i want to eat italian food tonight", "show me a restaurant that serves lunch", "i would like a cheap lunch", "find me italian food near campus", "i want lunch", "tell me about italian restaurants"].map(s => ["<s>", "<s>", ...s.split(" "), "</s>"]);
    let r = prng(2);
    const gen = n => { const out = ["<s>", "<s>"]; for (let k = 0; k < 20; k++) { const h = out.slice(out.length - (n - 1)).join(" "), cands = []; TXT.forEach(t => { for (let i = 2; i < t.length; i++) { if (n === 1 || t.slice(i - (n - 1), i).join(" ") === h) cands.push(t[i]); } }); const w = cands[Math.floor(r() * cands.length)]; if (!w || w === "</s>") break; out.push(w); } return out.slice(2).join(" "); };
    const go = () => { const n = +el_(root, "#sh-n").value; el_(root, "#sh-o").innerHTML = [1, 2, 3].map(() => "• " + gen(n)).join("<br>") + `<br><span class="muted">${n === 1 ? "Unigram: words by frequency, no grammar." : n === 2 ? "Bigram: locally plausible pairs, drifting topic." : "Trigram: fluent but often a near-copy of a training sentence (overfitting a small corpus)."}</span>`; };
    el_(root, "#sh-g").onclick = go; el_(root, "#sh-n").addEventListener("input", go); go(); return go;
  }
};

LABS.nlPerplexity = XH.calc({ p: "ppx", title: "Perplexity", cap: "PP(W) = P(w₁…w_N)^(−1/N): the inverse probability of the test set, normalised by length. Lower is better. It is the weighted average branching factor: how many equally likely next words the model is choosing among.",
  inputs: [["b", "equally likely choices per word", 2, 1000, 1, 10], ["N", "test length N (words)", 1, 50, 1, 10], ["z", "one test word unseen (probability 0)", "check"]],
  out: v => { const pp = v.z ? Infinity : v.b;

  /* generic Viterbi over dict-based HMM; returns {V, back, path} */
  vit(obs, S, pi, A, B) { const V = [], bk = [];
    V.push(S.map(s => (pi[s] || 0) * ((B[s] || {})[obs[0]] || 0))); bk.push(S.map(() => -1));
    for (let t = 1; t < obs.length; t++) { const row = [], br = []; S.forEach(s => { let bi = -1, bv = 0; S.forEach((sp, j) => { const c = V[t - 1][j] * ((A[sp] || {})[s] || 0); if (c > bv) { bv = c; bi = j; } }); row.push(bv * ((B[s] || {})[obs[t]] || 0)); br.push(bi); }); V.push(row); bk.push(br); }
    let last = 0; V[V.length - 1].forEach((x, i) => { if (x > V[V.length - 1][last]) last = i; }); const path = [last]; for (let t = obs.length - 1; t > 0; t--) path.push(bk[t][path[path.length - 1]]); return { V, bk, path: path.reverse() }; },
  table(obs, S, R, hi) { return XH.table(["state", ...obs.map(String)], S.map((s, i) => [s, ...R.V.map((col, t) => { const on = R.path[t] === i, x = col[i]; return `<span style="${on ? "color:var(--nl);font-weight:700" : ""}">${x ? (x < 0.001 ? x.toExponential(2) : XH.f(x, 6)) : "0"}${t && x ? ` <span class="muted">←${S[R.bk[t][i]]}</span>` : ""}</span>`; })])); }
};

LABS.nlViterbiCell = XH.calc({ p: "vtc", title: "Fill one Viterbi cell", cap: "V[s, t] = max over previous states s′ of V[s′, t−1] · P(s | s′), then × P(wₜ | s). Store which s′ won: the backpointer.",
  inputs: [["vv", "V[Verb, t−1]", 0, 0.05, 0.001, 0.03], ["vn", "V[Noun, t−1]", 0, 0.05, 0.0005, 0.0015], ["av", "P(Prep | Verb)", 0, 1, 0.05, 0.2], ["an", "P(Prep | Noun)", 0, 1, 0.05, 0.3], ["e", "P(in | Prep)", 0, 1, 0.05, 1]],
  out: v => { const a = v.vv * v.av, b = v.vn * v.an, best = Math.max(a, b);
    return XH.table(["from", "V × transition"], [["Verb", `${v.vv} × ${v.av} = <b>${XH.f(a, 5)}</b>`], ["Noun", `${v.vn} × ${v.an} = <b>${XH.f(b, 5)}</b>`]]) + `<div class="formula">V[Prep] = ${XH.f(best, 5)} × ${v.e} = <b>${XH.f(best * v.e, 5)}</b>, backpointer → ${a >= b ? "Verb" : "Noun"}</div><div class="readout"><span>Defaults: 0.006 (from Verb) beats 0.00045 (from Noun), so V[Prep] = 0.006 with backpointer Verb. Only one max per cell: no list of whole paths is kept.</span></div>`; } });

LABS.nlViterbiDoctor = (() => { const S = ["Det", "Noun", "Verb", "Prep", "Adv"], obs = ["the", "doctor", "is", "in"],
  R = NL7.vit(obs, S, { Det: 0.3 }, { Det: { Noun: 0.9, Verb: 0.01 }, Noun: { Noun: 0.2, Verb: 0.4, Prep: 0.3 }, Verb: { Verb: 0.05, Prep: 0.2, Adv: 0.1 } }, { Det: { the: 0.7 }, Noun: { doctor: 0.4, is: 0.1 }, Verb: { doctor: 0.1, is: 0.9 }, Prep: { in: 1 }, Adv: { in: 0.1 } });
  const snap = k => { const C = { V: R.V.slice(0, k), bk: R.bk.slice(0, k), path: k === 4 ? R.path : [] }; return NL7.table(obs.slice(0, k), S, C); };
  return XH.stepLab({ p: "vtd", title: "Viterbi on 'the doctor is in'", cap: "Tags Det, Noun, Verb, Prep, Adv. Transitions: P(Det | ⟨s⟩) 0.3, Det→Noun 0.9, Det→Verb 0.01, Noun→Noun 0.2, Noun→Verb 0.4, Noun→Prep 0.3, Verb→Verb 0.05, Verb→Prep 0.2, Verb→Adv 0.1. Emissions: the|Det 0.7, doctor|Noun 0.4, doctor|Verb 0.1, is|Noun 0.1, is|Verb 0.9, in|Prep 1.0, in|Adv 0.1.",
    steps: [
      { html: "<b>Column 1, 'the'</b>: only Det can emit it. V[Det] = 0.3 × 0.7 = 0.21." + snap(1) },
      { html: "<b>Column 2, 'doctor'</b>: Noun = 0.21 × 0.9 × 0.4 = 0.0756; Verb = 0.21 × 0.01 × 0.1 = 0.00021. Both point back to Det." + snap(2) },
      { html: "<b>Column 3, 'is'</b>: Verb from Noun 0.0756 × 0.4 = 0.03024 beats Verb from Verb (0.00021 × 0.05); × 0.9 = 0.027216. Noun from Noun: 0.0756 × 0.2 × 0.1 = 0.001512." + snap(3) },
      { html: "<b>Column 4, 'in'</b>: Prep from Verb 0.027216 × 0.2 × 1.0 = 0.005443 (from Noun only 0.001512 × 0.3); Adv = 0.027216 × 0.1 × 0.1 = 0.000272." + snap(4) },
      { html: "<b>Backtrace</b> from the best final cell (Prep, 0.005443): Prep ← Verb ← Noun ← Det. Result: <b>the/Det doctor/Noun is/Verb in/Prep</b>." + snap(4) }
    ] }); })();

LABS.nlViterbiWeather = XH.calc({ p: "vtw", title: "Viterbi on the weather HMM", cap: "Hidden H/C, observed ice creams. π: H 0.8, C 0.2. A: H→H 0.6, H→C 0.4, C→H 0.5, C→C 0.5. B: 3|H 0.4, 1|H 0.2, 3|C 0.1, 1|C 0.5, 2|either 0.4. Highlighted cells form the best path; ← shows backpointers.",
  inputs: [["o1", "day 1", ["3", "1", "2"]], ["o2", "day 2", ["1", "3", "2"]], ["o3", "day 3", [["-", "(none)"], "1", "2", "3"]], ["o4", "day 4", [["-", "(none)"], "1", "2", "3"]]],
  out: v => { const obs = [v.o1, v.o2, v.o3, v.o4].filter(x => x !== "-").map(Number), S = ["H", "C"];
    const R = NL7.vit(obs, S, { H: 0.8, C: 0.2 }, { H: { H: 0.6, C: 0.4 }, C: { H: 0.5, C: 0.5 } }, { H: { 1: 0.2, 2: 0.4, 3: 0.4 }, C: { 1: 0.5, 2: 0.4, 3: 0.1 } });
    return NL7.table(obs, S, R) + `<div class="readout"><span>Best weather: <b>${R.path.map(i => S[i]).join(" ")}</b>. For 3, 1: day 1 H 0.32, C 0.02; day 2 H = 0.32 × 0.6 × 0.2 = 0.0384, C = 0.32 × 0.4 × 0.5 = 0.064 → H C.</span><span>Work: 2² × ${obs.length} cell updates instead of 2^${obs.length} = ${2 ** obs.length} whole paths.</span></div>`; } });

LABS.nlHmmLimits = sorterLab("Which HMM limitation is this?", "HMM taggers are limited by unknown words (no emission counts), narrow context (one previous tag, the current word only), data sparsity, and reading in one direction only.", { unk: "Unknown words", ctx: "Limited context / features", sp: "Sparsity", dir: "One direction only" }, [
  ["'blorfing' never appeared in training, so P(blorfing | tag) = 0 for every tag", "unk", "Needs suffix models or smoothing."],
  ["The tagger can't use the fact that the word is capitalised or ends in -ing", "ctx", "Emissions only model whole word identity."],
  ["Many valid tag pairs and word–tag pairs never occur in a small corpus", "sp", "Zero counts: smooth."],
  ["Deciding 'that' needs the word after it, but the model only looks back", "dir", "Bidirectional models read both ways."],
  ["The tag can't depend on the next word 'tomorrow'", "ctx", "Output independence and Markov assumptions."]
]);

LABS.nlMemmFeatures = XH.calc({ p: "mmf", title: "MEMM: a tag from features", cap: "A MEMM is logistic regression along the sentence: P(tᵢ | wᵢ, tᵢ₋₁) = softmax over tags of Σ θ·features. Toggle features for the word 'back' and see the tag distribution.",
  inputs: [["md", "previous tag is MD ('will back')", "check", true], ["dt", "previous tag is DT ('the back')", "check"], ["ck", "word ends in -ck", "check", true], ["lc", "word is lowercase", "check", true]],
  out: v => { const T = ["VB", "NN", "RB", "JJ"], W = { md: [2.5, -1, -0.5, -1], dt: [-1.5, 1.5, -1, 1.2], ck: [0.2, 0.2, 0.1, 0.1], lc: [0.1, 0.1, 0.1, 0.1] }, b = [0, 0.4, 0.6, 0];
    const sc = T.map((_, j) => b[j] + Object.keys(W).reduce((s, k) => s + (v[k] ? W[k][j] : 0), 0)), p = XH.softmax(sc);
    return XH.bars(T.map((t, j) => [`${t} (score ${XH.f(sc[j])})`, p[j], "var(--nl)"]), 1) + `<div class="readout"><span>Weights are illustrative. With only 'MD' on, VB dominates; with 'DT', NN/JJ win. Two scores 2.0 and 0.5 give 0.82 / 0.18 after softmax.</span><span>Unlike an HMM, any overlapping clue (spelling, neighbours, capitalisation) can be a feature.</span></div>`; } });

LABS.nlGreedyVsViterbi = XH.calc({ p: "gvv", title: "Greedy vs Viterbi decoding of a MEMM", cap: "'the old man the boats': local MEMM distributions P(tag | word, previous tag). Greedy locks in the best tag at each word; Viterbi maximises the product over the whole sentence.",
  inputs: [["pj", "P(JJ | old, DT)  (NN gets the rest)", 0.05, 0.95, 0.05, 0.6], ["pn", "P(NN | man, JJ)  (VB gets the rest)", 0.05, 0.95, 0.05, 0.5]],
  out: v => { const pj = v.pj, pn = v.pn, g1 = pj >= 1 - pj ? "JJ" : "NN";
    let greedy, gs; if (g1 === "JJ") { const m = pn >= 1 - pn ? "NN" : "VB"; greedy = ["DT", "JJ", m, "DT", "NNS"]; gs = pj * Math.max(pn, 1 - pn); } else { greedy = ["DT", "NN", "VB", "DT", "NNS"]; gs = 1 - pj; }
    const c1 = pj * Math.max(pn, 1 - pn), c2 = (1 - pj) * 1, vit = c2 >= c1 ? ["DT", "NN", "VB", "DT", "NNS"] : ["DT", "JJ", pn >= 1 - pn ? "NN" : "VB", "DT", "NNS"], vs = Math.max(c1, c2);
    const w = "the old man the boats".split(" "), show = t => w.map((x, i) => `${x}/<b>${t[i]}</b>`).join(" ");
    return XH.table(["decoder", "tags", "score"], [["greedy", show(greedy), XH.f(gs)], ["Viterbi", show(vit), XH.f(vs)]]) + `<div class="readout"><span>Defaults: greedy takes JJ (0.6) and ends with 0.6 × 0.5 = 0.30; Viterbi finds old/NN man/VB (0.4 × 1.0 = 0.40): 'the old (people) man (crew) the boats'.</span><span>Label bias: P(DT | 'the', prev NN) is still 1.0 because each local distribution must sum to 1, so the ungrammatical greedy path is never penalised. CRFs fix this by normalising over whole sequences.</span></div>`; } });

LABS.nlGenDisc = sorterLab("HMM (generative) or MEMM (discriminative)?", "The HMM models P(words, tags) through P(tag | previous tag) and P(word | tag). The MEMM models P(tag | word, previous tag, features) directly with logistic regression. Both decode with Viterbi.", { hmm: "HMM", memm: "MEMM", both: "Both" }, [
  ["Uses P(word | tag) emission probabilities", "hmm", "Generative direction."],
  ["Can use 'word ends in -ing' and 'next word is the' as features", "memm", "Arbitrary overlapping features."],
  ["Finds the best tag sequence with Viterbi", "both", "Same dynamic programming."],
  ["Trained by counting and dividing", "hmm", "MLE from a tagged corpus."],
  ["Weights trained by gradient descent on conditional likelihood", "memm", "Logistic regression."],
  ["Suffers from the label-bias problem", "memm", "Local normalisation."]
]);

}

{
/* ===== NLP M8 labs: neural, LLM and agentic POS tagging ===== */
LABS.nlUnigramTagger = XH.calc({ p: "ugt", title: "The most-frequent-tag baseline", cap: "Tag every word with the tag it had most often in training, ignoring context. Compare with the correct tags.",
  inputs: [["s", "sentence", ["She books a flight .", "Read the books .", "I will back the plan .", "The plays were long ."]]],
  out: v => { const MF = { She: "PRP", books: "NNS", a: "DT", flight: "NN", ".": ".", Read: "VB", the: "DT", The: "DT", I: "PRP", will: "MD", back: "RB", plan: "NN", plays: "VBZ", were: "VBD", long: "JJ" };
    const G = { "She books a flight .": ["PRP", "VBZ", "DT", "NN", "."], "Read the books .": ["VB", "DT", "NNS", "."], "I will back the plan .": ["PRP", "MD", "VB", "DT", "NN", "."], "The plays were long .": ["DT", "NNS", "VBD", "JJ", "."] }[v.s];
    const w = v.s.split(" "), ok = w.filter((x, i) => MF[x] === G[i]).length;
    return XH.table(["word", "baseline", "correct"], w.map((x, i) => [x, MF[x] === G[i] ? MF[x] : `<b style="color:var(--bad)">${MF[x]}</b>`, G[i]])) + `<div class="readout"><span>${ok}/${w.length} correct (${XH.f(100 * ok / w.length, 0)}%). Assumed most-frequent tags: books → NNS, back → RB, plays → VBZ (illustrative).</span><span>The baseline misses exactly the ambiguous, informative words; every later method adds context to fix them.</span></div>`; } });

LABS.nlEmbedOov = {
  title: "Word vectors and character clues", cap: "Known words get a learned vector (cosine compares directions). Unknown words get a vector built from their spelling; here a few suffix rules stand in for a character network.",
  html: () => `<div class="slidergrid xh"><label for="eo-w">word <input id="eo-w" type="text" value="blorfingly"></label></div><div id="eo-o" style="margin-top:8px"></div>`,
  mount(root) {
    const E = { king: [0.9, 0.8], queen: [0.85, 0.9], cat: [-0.7, 0.6], dog: [-0.6, 0.7] }, cs = (a, b) => (a[0] * b[0] + a[1] * b[1]) / Math.hypot(...a) / Math.hypot(...b);
    const SUF = [["ingly", "RB"], ["ly", "RB"], ["ing", "VBG"], ["ed", "VBD"], ["tion", "NN"], ["ness", "NN"], ["ous", "JJ"], ["ful", "JJ"], ["s", "NNS"]];
    const draw = () => { const w = el_(root, "#eo-w").value.trim().toLowerCase();
      if (E[w]) { el_(root, "#eo-o").innerHTML = XH.table(["neighbour", "cosine"], Object.keys(E).filter(x => x !== w).map(x => [x, XH.f(cs(E[w], E[x]))])) + `<div class="readout"><span>Known word: vector [${E[w].join(", ")}]. cos(king, queen) = 0.996; cos(king, cat) = −0.135.</span></div>`; return; }
      const s = SUF.find(([x]) => w.endsWith(x)), cap = /^[A-Z]/.test(el_(root, "#eo-w").value.trim());
      el_(root, "#eo-o").innerHTML = XH.table(["clue", "value"], [["in vocabulary?", "no (out-of-vocabulary)"], ["suffix", s ? s[0] : "none"], ["capitalised", cap ? "yes" : "no"], ["likely tag", `<b>${cap ? "NNP" : s ? s[1] : "NN (default for open class)"}</b>`]]) + `<div class="readout"><span>The input to the tagger is the concatenation [word part ; character part], e.g. [0.9, 0.8, −0.2, 0.1 ; 0.7, −0.3]. For an unknown word the word part is a shared 'unknown' vector, so the character part carries the evidence.</span><span>Try king, cat, Zorblax, unhappiness.</span></div>`; };
    el_(root, "#eo-w").addEventListener("input", draw); draw(); return draw;
  }
};

LABS.nlLstmStep = XH.calc({ p: "lst", title: "One LSTM step", cap: "Scalar LSTM with weights f: (0.5, 0.4, 0.1), i: (0.6, 0.3, 0), g: (0.7, 0.2, 0), o: (0.4, 0.5, 0.1) for (W, U, b). The gates are dials between 0 and 1.",
  inputs: [["cp", "old memory cₜ₋₁", -1, 1, 0.1, 0.5], ["hp", "old summary hₜ₋₁", -1, 1, 0.1, 0.3], ["x", "input xₜ", -2, 2, 0.1, 1]],
  out: v => { const s = z => 1 / (1 + Math.exp(-z)), f = s(0.5 * v.x + 0.4 * v.hp + 0.1), i = s(0.6 * v.x + 0.3 * v.hp), g = Math.tanh(0.7 * v.x + 0.2 * v.hp), o = s(0.4 * v.x + 0.5 * v.hp + 0.1), c = f * v.cp + i * g, h = o * Math.tanh(c);
    return XH.bars([["forget f (keep old)", f, "var(--nl)"], ["input i (write new)", i, "var(--nl)"], ["output o (read out)", o, "var(--nl)"]], 1) + `<div class="formula">g = ${XH.f(g)}; c = f·cₜ₋₁ + i·g = ${XH.f(f)}·${v.cp} + ${XH.f(i)}·${XH.f(g)} = <b>${XH.f(c)}</b>; h = o·tanh(c) = <b>${XH.f(h)}</b></div><div class="readout"><span>Defaults: f 0.673, i 0.666, g 0.641, o 0.657 → c 0.763, h 0.422.</span><span>A Bi-LSTM runs one LSTM left-to-right and one right-to-left and concatenates their h for each word.</span></div>`; } });

LABS.nlCrfPlays = XH.calc({ p: "crf", title: "CRF: score whole tag sequences for 'the plays'", cap: "Score(t₁, t₂) = E₁[t₁] + T[t₁→t₂] + E₂[t₂]. Emissions: the = (DT 5, NN 0, VBZ −2); plays = (DT −3, NN 2, VBZ 3). P(sequence) = exp(score)/Z over all 9 sequences.",
  inputs: [["tdn", "transition T[DT→NN]", -3, 6, 0.5, 4], ["evz", "emission E[plays, VBZ]", 0, 8, 0.5, 3]],
  out: v => { const tg = ["DT", "NN", "VBZ"], E1 = [5, 0, -2], E2 = [-3, 2, v.evz], T = [[-2, v.tdn, -1], [-1, 1, 3], [2, 2, -3]], rows = [];
    for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) rows.push([tg[a] + " " + tg[b], E1[a] + T[a][b] + E2[b]]);
    const Z = rows.reduce((s, r) => s + Math.exp(r[1]), 0); rows.sort((x, y) => y[1] - x[1]); const gr = tg[E2.indexOf(Math.max(...E2))];
    return XH.table(["sequence", "score", "P"], rows.slice(0, 5).map((r, k) => [k ? r[0] : `<b>${r[0]}</b>`, r[1], XH.f(Math.exp(r[1]) / Z)])) + `<div class="readout"><span>Greedy (largest emission per word): DT ${gr}. CRF best: <b>${rows[0][0]}</b>. Z = ${XH.f(Z, 1)}.</span><span>Defaults: DT NN scores 11 (P = 0.975) beating greedy DT VBZ (7, P = 0.018): the DT→NN transition reward outweighs VBZ's higher emission. Viterbi finds the best without listing all sequences.</span></div>`; } });

LABS.nlSentenceAcc = XH.calc({ p: "sac", title: "Token accuracy vs whole-sentence accuracy", cap: "If each token is right with probability a (independently), an n-word sentence is entirely right with probability aⁿ.",
  inputs: [["a", "per-token accuracy a", 0.9, 0.999, 0.001, 0.97], ["n", "sentence length n", 1, 60, 1, 20]],
  out: v => { const ns = Array.from({ length: 60 }, (_, i) => i + 1);
    return XH.lines([{ pts: ns.map(n => [n, Math.pow(v.a, n)]), color: "var(--nl)" }, { pts: ns.map(n => [n, Math.pow(0.99, n)]), color: "var(--muted)", dash: "4 3" }], { xmin: 1, xmax: 60, ymin: 0, ymax: 1 }, { x: "sentence length n", aria: "sentence accuracy" }, (sx, sy) => `<circle cx="${sx(v.n)}" cy="${sy(Math.pow(v.a, v.n))}" r="4" fill="var(--nl)"/>`) + XH.legend([["var(--nl)", "your a"], ["var(--muted)", "a = 0.99", "4 3"]]) + XH.table(["", "value"], [["whole sentence correct", `<b>${XH.f(Math.pow(v.a, v.n))}</b>`], ["wrong tags per 1M tokens", Math.round((1 - v.a) * 1e6).toLocaleString()]]) + `<div class="readout"><span>0.97²⁰ ≈ 0.544 vs 0.99²⁰ ≈ 0.818; 30,000 vs 10,000 errors per million tokens. Errors aren't truly independent, so aⁿ is an estimate.</span></div>`; } });

LABS.nlAttnBank = XH.calc({ p: "atb", title: "Self-attention: what does 'bank' look at?", cap: "Query q(bank) is compared with each key; weights αⱼ = softmax(q·kⱼ/√d); output = Σ αⱼvⱼ. Keys: river [1, 2], the [2, 0], '.' [0, 1]. Values: river [0, 1] (noun signal), the [1, 0], '.' [0.5, 0.5].",
  inputs: [["q1", "q(bank) component 1", -2, 3, 0.1, 1], ["q2", "q(bank) component 2", -2, 3, 0.1, 2]],
  out: v => { const K = [[1, 2], [2, 0], [0, 1]], V = [[0, 1], [1, 0], [0.5, 0.5]], nm = ["river", "the", "."], s = K.map(k => (v.q1 * k[0] + v.q2 * k[1]) / Math.SQRT2), a = XH.softmax(s), o = [0, 1].map(d => a.reduce((t, w, j) => t + w * V[j][d], 0));
    return XH.bars(nm.map((n, j) => [`${n} (scaled score ${XH.f(s[j])})`, a[j], j ? "var(--muted)" : "var(--nl)"]), 1) + `<div class="formula">output = [${XH.f(o[0])}, <b>${XH.f(o[1])}</b>] (second number = noun signal)</div><div class="readout"><span>Defaults: scores 3.54, 1.41, 1.41 → weights 0.807, 0.097, 0.097 → output [0.145, 0.855]. Distance doesn't matter; relevance does.</span></div>`; } });

LABS.nlBertHead = XH.calc({ p: "brt", title: "Fine-tuned BERT: a linear head per token", cap: "Each token's contextual vector h passes through logits = Wh + b and softmax. Rows: DT [0.1, 0.2, −0.5, 0], NN [0.3, 0.1, 0.4, −0.2], VBZ [−0.2, −0.3, 0.9, 0.5]. The vectors h are illustrative.",
  inputs: [["c", "context of 'plays'", [["v", "she plays well"], ["n", "the plays were long"]]], ["sub", "show subword split of 'replaying'", "check"]],
  out: v => { const h = v.c === "v" ? [0.5, -1, 2, 0.3] : [1.5, 1.0, 0.8, -1.5], W = [[0.1, 0.2, -0.5, 0], [0.3, 0.1, 0.4, -0.2], [-0.2, -0.3, 0.9, 0.5]], L = W.map(r => r.reduce((s, x, k) => s + x * h[k], 0)), p = XH.softmax(L);
    return `<div class="formula">h = [${h.join(", ")}] → logits DT ${XH.f(L[0])}, NN ${XH.f(L[1])}, VBZ ${XH.f(L[2])}</div>` + XH.bars(["DT", "NN", "VBZ"].map((t, k) => [t, p[k], "var(--nl)"]), 1) + (v.sub ? `<div class="panel small" style="margin-top:6px">replaying → <code>re</code> <code>##play</code> <code>##ing</code>: predict the tag on the first piece only and ignore the rest when scoring.</div>` : "") + `<div class="readout"><span>'she plays well': logits −1.15, 0.79, 2.15 → VBZ 0.773. The same word in another sentence gets a different contextual h, so a different tag.</span></div>`; } });

LABS.nlPromptTag = XH.calc({ p: "ptg", title: "Prompting an LLM to tag", cap: "Zero-shot gives only instructions; few-shot adds solved examples in the exact tagset. The outputs shown are typical illustrations, not live model calls.",
  inputs: [["m", "prompt style", [["z", "zero-shot"], ["f", "few-shot (2 examples)"]]]],
  out: v => { const pr = v.m === "z" ? "Tag the following sentence using the Penn Treebank tagset.\nOutput only the word/tag pairs.\nSentence: The concert was great." : "Tag each sentence with Penn Treebank tags.\nDogs/NNS bark/VBP ./.\nShe/PRP left/VBD ./.\nSentence: The concert was great.";

/* ===== NLP M9 labs: constituency parsing, PCFGs, CKY ===== */
var NL9 = {
  lex: { astronomers: { NP: 0.1 }, saw: { V: 1, NP: 0.04 }, stars: { NP: 0.18 }, with: { P: 1 }, ears: { NP: 0.18 } },
  bin: [["S", "NP", "VP", 1], ["NP", "NP", "PP", 0.4], ["PP", "P", "NP", 1], ["VP", "V", "NP", 0.7], ["VP", "VP", "PP", 0.3]],
  cky(w, lex, bin) { const n = w.length, C = {}, key = (i, j) => i + "," + j;
    w.forEach((x, i) => { C[key(i, i + 1)] = Object.assign({}, lex[x] || {}); });
    for (let s = 2; s <= n; s++) for (let i = 0; i + s <= n; i++) { const j = i + s, cell = {}; for (let k = i + 1; k < j; k++) bin.forEach(([A, B, Cc, p]) => { const l = C[key(i, k)][B], r = C[key(k, j)][Cc]; if (l && r && p * l * r > (cell[A] || 0)) cell[A] = p * l * r; }); C[key(i, j)] = cell; }
    return C; },
  grid(w, C, maxSpan) { const n = w.length, fmt = x => x < 0.001 ? x.toExponential(3) : +x.toPrecision(4);
    return XH.table(["start \\ end", ...w.map((x, j) => `${j + 1} ${x}`)], w.map((x, i) => [`${i} ${x}`, ...w.map((_, j) => { if (j < i) return ""; const s = j + 1 - i, c = C[i + "," + (j + 1)]; if (s > maxSpan) return `<span class="muted">·</span>`; const e = Object.entries(c); return e.length ? e.map(([A, p]) => `${A} ${fmt(p)}`).join("<br>") : "—"; })])); }
};

LABS.nlPpGrowth = XH.calc({ p: "ppg", title: "How fast does attachment ambiguity grow?", cap: "Each extra prepositional phrase can attach to several earlier phrases. The number of parses follows the Catalan numbers: n PPs give C(n+1) trees.",
  inputs: [["n", "number of PPs", 1, 8, 1, 1], ["r", "show the two readings of 'I saw the man with the telescope'", "check", true]],
  out: v => { const cat = m => { let c = 1; for (let i = 0; i < m; i++) c = c * 2 * (2 * i + 1) / (i + 2); return Math.round(c); };
    return XH.table(["PPs", "parses"], Array.from({ length: v.n }, (_, i) => [i + 1, i + 1 === v.n ? `<b>${cat(i + 2)}</b>` : cat(i + 2)])) + (v.r ? `<div class="row" style="gap:8px;flex-wrap:wrap"><div style="flex:1;min-width:240px">${NLH.tree("(S (NP I) (VP (VP (V saw) (NP the man)) (PP with the telescope)))")}<div class="small muted">PP attached to VP: I used the telescope.</div></div><div style="flex:1;min-width:240px">${NLH.tree("(S (NP I) (VP (V saw) (NP (NP the man) (PP with the telescope))))")}<div class="small muted">PP attached to NP: the man had the telescope.</div></div></div>` : "") + `<div class="readout"><span>…with the telescope: 2; …on the hill with the telescope: 5; …on the hill in Texas with the telescope: 14; five PPs: 132.</span></div>`; } });

LABS.nlTopDownBottomUp = XH.calc({ p: "tdb", title: "Top-down vs bottom-up on 'the dog barks'", cap: "Grammar: S → NP VP; NP → Det N | N; VP → V | V NP; Det → the; N → dog | barks; V → barks. Top-down expands from S toward the words; bottom-up combines words into larger phrases.",
  inputs: [["d", "strategy", [["t", "top-down (architect)"], ["b", "bottom-up (builder)"]]]],
  out: v => { const T = [["S", "goal: build S"], ["NP VP", "S → NP VP"], ["Det N VP", "try NP → Det N"], ["the N VP", "Det → the ✓ matches word 1"], ["the dog VP", "N → dog ✓"], ["the dog V NP", "try VP → V NP first: needs an NP after 'barks' ✗, backtrack"], ["the dog V", "VP → V; V → barks ✓ done"]],
      B = [["the dog barks", "start from words"], ["Det dog barks", "Det → the"], ["Det N barks", "N → dog"], ["Det N N / Det N V", "barks could be N or V: both built"], ["NP N / NP V", "NP → Det N; also NP → N over 'barks' (useless)"], ["NP VP", "VP → V"], ["S", "S → NP VP ✓"]], R = v.d === "t" ? T : B;

LABS.nlChartDots = XH.stepLab({ p: "chd", title: "Chart parsing with dotted rules", cap: "A bottom-up chart parser keeps: the key (constituent being processed), the agenda (to-do list), the chart (completed constituents with spans) and active arcs (partially matched rules, with • marking progress). Input: 'the large can'.",
  steps: [
    { html: "Agenda: ART(0–1) from 'the'. Key = ART. Rule NP → ART ADJ N starts an active arc: <code>NP → ART • ADJ N</code> (0–1). ART is added to the chart." },
    { html: "Key = ADJ(1–2) from 'large'. It extends the arc: <code>NP → ART ADJ • N</code> (0–2)." },
    { html: "Key = N(2–3) from 'can' (also V and AUX are possible; each goes on the agenda). N completes the arc: <code>NP → ART ADJ N •</code> (0–3)." },
    { html: "The completed NP(0–3) goes onto the agenda and then into the chart. It is never rebuilt, however many times later rules need 'the large can'." },
    { html: "This is dynamic programming: partial results are stored once and reused, eliminating the exponential duplicate work of naive backtracking (CKY and Earley are chart parsers)." }
  ] });

LABS.nlPcfgTrees = XH.calc({ p: "pcf", title: "Which tree does the PCFG prefer?", cap: "'astronomers saw stars with ears'. P(tree) = product of its rule probabilities. Rules: S → NP VP 1.0; PP → P NP 1.0; NP → astronomers 0.1, stars 0.18, ears 0.18; V → saw 1.0; P → with 1.0.",
  inputs: [["np", "P(NP → NP PP)", 0.05, 0.7, 0.05, 0.4], ["vp", "P(VP → VP PP)  (VP → V NP gets the rest)", 0.05, 0.95, 0.05, 0.3], ["t", "show tree", [["2", "T2: PP attached to NP"], ["1", "T1: PP attached to VP"]]]],

    const tr = v.t === "1" ? "(S (NP astronomers) (VP (VP (V saw) (NP stars)) (PP (P with) (NP ears))))" : "(S (NP astronomers) (VP (V saw) (NP (NP stars) (PP (P with) (NP ears)))))";
    return NLH.tree(tr) + XH.table(["tree", "rule product", "P"], [["T1 (VP attach)", `1 × 0.1 × ${v.vp} × ${XH.f(vnp)} × 1 × 0.18 × 1 × 1 × 0.18`, `<b>${t1.toExponential(3)}</b>`], ["T2 (NP attach)", `1 × 0.1 × ${XH.f(vnp)} × 1 × ${v.np} × 0.18 × 1 × 1 × 0.18`, `<b>${t2.toExponential(3)}</b>`]]) + `<div class="readout"><span>Preferred: <b>${t2 > t1 ? "T2 (stars with ears)" : "T1 (saw with ears)"}</b>. Defaults: T1 = 0.0006804, T2 = 0.0009072.</span><span>Rule probabilities for each left-hand side must sum to 1, and are estimated from a treebank by counting.</span></div>`; } });

{
/* ===== Software Engineering for ML: shared lab helpers (global SEH) ===== */
var SEH = {
  flow: (id, labels) => `<div class="flow" id="${id}">${labels.map((t, i) => `<div class="fbox" data-i="${i}"><span class="num">${i + 1}</span>${t}</div>`).join('<div class="farrow" aria-hidden="true">→</div>')}</div>`,
  meter: (label, v, max, txt, color) => `<div class="meter" style="grid-template-columns:minmax(90px,30%) minmax(0,1fr) auto"><span class="small">${label}</span><div class="bar"><i style="width:${Math.max(0, Math.min(100, 100 * v / max)).toFixed(1)}%;${color ? "background:" + color : ""}"></i></div><b class="small num">${txt}</b></div>`,
  pill: (txt, kind) => `<span class="status-pill ${kind || ""}">${txt}</span>`,
  /* A stepper lab: a row of boxes plus a narrated step box. steps: [{on: index or [indices], html}] */
  stepLab(o) {
    return { title: o.title, cap: o.cap,
      html: () => `${o.boxes ? SEH.flow(o.p + "-f", o.boxes) : ""}<div class="stepbox" id="${o.p}-s" style="margin-top:10px" aria-live="polite"></div><div class="row" style="margin-top:8px">${ctrlBtns(o.p)}<span class="status-pill run" id="${o.p}-n"></span></div>`,
      mount(root) {
        let k = 0; const show = () => { const s = o.steps[k], on = [].concat(s.on === undefined ? [] : s.on);
          if (o.boxes) $$(".fbox", el_(root, "#" + o.p + "-f")).forEach((b, i) => b.classList.toggle("on", on.includes(i)));
          el_(root, "#" + o.p + "-s").innerHTML = s.html; el_(root, "#" + o.p + "-n").textContent = `step ${k + 1} of ${o.steps.length}`; };
        player(root, o.p, () => { if (k < o.steps.length - 1) { k++; show(); } }, () => { k = 0; show(); }, o.ms || 1400, () => k >= o.steps.length - 1);
        show(); return show; } };
  },
  rng: seed => prng(seed),
  fmt: (x, d = 2) => (Math.abs(x) >= 1e6 ? x.toExponential(2) : (+x).toFixed(d))
};

    const acc = (P, a, b) => P.filter(([x, s, y]) => ((x >= a && s >= b) ? 1 : 0) === y).length / P.length;
    const draw = () => { const P = data(), a = +el_(root, "#sv-i").value, b = +el_(root, "#sv-s").value;
      const p = new Plot(el_(root, "#sv-c"), { xmin: 10, xmax: 90, ymin: 400, ymax: 850 }), G = p.g; p.axes("income (₹ thousand / month)", "credit score");
      G.fillStyle = p.col.soft; G.fillRect(p.sx(a), p.sy(850), p.sx(90) - p.sx(a), p.sy(b) - p.sy(850));
      p.dots(P.filter(d => d[2]).map(d => [d[0], d[1]]), p.col.accent, 3.2); p.dots(P.filter(d => !d[2]).map(d => [d[0], d[1]]), p.col.bad, 3.2);
      if (learned) { G.strokeStyle = p.col.path; G.setLineDash([5, 4]); G.lineWidth = 2; G.strokeRect(p.sx(learned[0]), p.sy(850), p.sx(90) - p.sx(learned[0]), p.sy(learned[1]) - p.sy(850)); G.setLineDash([]); }
      el_(root, "#sv-r").innerHTML = `<span>your rule: income ≥ ${a} and score ≥ ${b} → accuracy <b>${(100 * acc(P, a, b)).toFixed(1)}%</b></span>${learned ? `<span style="color:${p.col.path}">learned rule: income ≥ ${learned[0]} and score ≥ ${learned[1]} → <b>${(100 * acc(P, learned[0], learned[1])).toFixed(1)}%</b></span>` : `<span>press Learn to let the computer search</span>`}<span>The true pattern is a diagonal trade-off (more income can make up for a lower score), which no single pair of thresholds captures exactly.</span>`; };
    el_(root, "#sv-l").onclick = () => { const P = data(); let best = [50, 600], bv = -1; for (let a = 10; a <= 90; a += 1) for (let b = 400; b <= 850; b += 5) { const v = acc(P, a, b); if (v > bv) { bv = v; best = [a, b]; } } learned = best; draw(); };

  }
};

LABS.seDataGates = {
  title: "Data validation gates before training", cap: "Each record passes a schema gate (columns and types), a value gate (impossible ranges, formats) and a label gate (missing labels, class balance). The action gateway halts the pipeline when too much data fails, instead of silently training on garbage.",
  html: () => `<div class="slidergrid"><label for="dg-t">halt if failure rate exceeds <input id="dg-t" type="range" min="10" max="90" step="10" value="50"></label></div><div class="tablewrap" style="margin-top:8px"><table class="cmp" id="dg-o"></table></div><div class="row" style="margin-top:6px" id="dg-b"></div><div class="readout" id="dg-r"></div>`,
  mount(root) {
    const R = [["c1", { age: 34, spend: 52, date: "2024-02-11", label: 0 }], ["c2", { age: -5, spend: 18, date: "2024-03-02", label: 1 }], ["c3", { spend: 40, date: "2024-01-20", label: 0 }], ["c4", { age: 51, spend: 77.5, date: "11/05/2024", label: 0 }], ["c5", { age: 29, spend: 12, date: "2024-04-30", label: 1 }], ["c6", { age: 42, spend: "n/a", date: "2024-05-14", label: 0 }], ["c7", { age: 38, spend: 61, date: "2024-06-01" }]];
    const on = {}; R.forEach(r => on[r[0]] = true);
    const check = d => { if (d.age === undefined) return ["schema", "age: field required"]; if (typeof d.spend !== "number") return ["schema", "monthly_spend: not a number"]; if (d.age < 0 || d.age > 120) return ["value", "age must be 0–120"]; if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) return ["value", "date must be YYYY-MM-DD"]; if (d.label === undefined) return ["label", "missing label"]; return null; };
    const draw = () => { const th = +el_(root, "#dg-t").value; const use = R.filter(r => on[r[0]]); let bad = 0;
      el_(root, "#dg-o").innerHTML = `<tr><th>id</th><th>record</th><th>result</th></tr>` + use.map(([id, d]) => { const c = check(d); if (c) bad++; return `<tr><td>${id}</td><td class="small" style="overflow-wrap:anywhere">${JSON.stringify(d)}</td><td>${c ? SEH.pill(c[0] + " gate", "bad") + ` <span class="small">${c[1]}</span>` : SEH.pill("passed", "ok")}</td></tr>`; }).join("");

    el_(root, "#dg-t").addEventListener("input", draw); draw(); return draw;

LABS.seTrafficRouting = {
  title: "A/B, shadow and canary releases", cap: "Three ways to test a new model (v2) on live traffic. Suppose v2 has a hidden bug affecting 8% of requests. See how many real users each strategy exposes, and what you learn.",
  html: () => `<div class="slidergrid"><label for="tr-m">strategy <select id="tr-m"><option value="ab">A/B test (90% v1, 10% v2)</option><option value="shadow">shadow (v1 serves, v2 gets a silent copy)</option><option value="canary">canary (1% v2, increase gradually)</option></select></label><label for="tr-b"><input id="tr-b" type="checkbox" checked> v2 has a bug on 8% of inputs</label></div><div class="flow" style="margin-top:8px"><div class="fbox on">requests 20,000</div><div class="farrow">→</div><div class="fbox on" id="tr-1"></div><div class="farrow">+</div><div class="fbox" id="tr-2"></div></div><div class="readout" id="tr-r"></div>`,

      el_(root, "#tr-r").innerHTML = `<span>users exposed to v2: <b>${v2.toLocaleString()}</b> · users hit by the bug: <b style="color:${hurt ? "var(--bad)" : "inherit"}">${hurt}</b></span><span>${learn}</span>`; };

LABS.seRagas = {

      el_(root, "#rs-r").innerHTML = `<span>${t}</span><span>BLEU and ROUGE only compare word overlap with a reference; they can't detect hallucination or irrelevant context. (Illustrative scores.)</span>`; };
    el_(root, "#rs-s").addEventListener("input", draw); draw(); return draw;
  }
};

LABS.seK8sCluster = {
  title: "Kubernetes keeps the desired state", cap: "A Deployment declares how many pod replicas should run. The scheduler places new pods on nodes with spare capacity (preferring less-loaded ones); the controller manager replaces pods that die; kubelet restarts failed containers on its node.",
  html: () => `<div class="row"><button class="btn sm" id="k8-up">replicas +1</button><button class="btn sm" id="k8-dn">replicas −1</button><button class="btn sm" id="k8-kp">kill a pod</button><button class="btn sm" id="k8-kn">fail a node</button><button class="btn sm ghost" id="k8-rs">reset</button></div><div id="k8-n" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px"></div><div class="readout" id="k8-r"></div>`,
  mount(root) {
    let N, P, want, id, log;
    const reset = () => { N = [["node-a", 4, true], ["node-b", 4, true], ["node-c", 2, true]]; P = []; want = 3; id = 0; log = "kubectl apply -f deployment.yaml (replicas: 3)"; recon(); };
    const load = n => P.filter(p => p.n === n).length;
    const recon = () => { P = P.filter(p => N.find(x => x[0] === p.n)[2]); let pend = 0;
      while (P.length < want) { const ok = N.filter(([n, c, u]) => u && load(n) < c).sort((a, b) => load(a[0]) / a[1] - load(b[0]) / b[1]); if (!ok.length) { pend = want - P.length; break; } P.push({ n: ok[0][0], id: ++id }); }
      while (P.length > want) P.pop(); draw(pend); };
    const draw = (pend = 0) => { el_(root, "#k8-n").innerHTML = N.map(([n, c, u]) => `<div class="panel" style="padding:8px;opacity:${u ? 1 : .45}"><b class="small">${n}</b> <span class="small muted">${u ? `${load(n)}/${c}` : "down"}</span><div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${P.filter(p => p.n === n).map(p => `<span class="status-pill ok">pod-${p.id}</span>`).join("")}</div></div>`).join("");
      el_(root, "#k8-r").innerHTML = `<span>desired <b>${want}</b> · running <b>${P.length}</b>${pend ? ` · <b style="color:var(--bad)">${pend} Pending</b> (no capacity)` : ""}</span><span>${log}</span>`; };
    el_(root, "#k8-up").onclick = () => { want++; log = `scaled to ${want}: scheduler picks the least-loaded node with room`; recon(); };
    el_(root, "#k8-dn").onclick = () => { want = Math.max(0, want - 1); log = `scaled to ${want}`; recon(); };
    el_(root, "#k8-kp").onclick = () => { if (P.length) { const p = P.splice(Math.floor(P.length / 2), 1)[0]; log = `pod-${p.id} crashed → ReplicaSet controller creates a replacement`; } recon(); };
    el_(root, "#k8-kn").onclick = () => { const up = N.filter(x => x[2]); if (up.length > 1) { up[0][2] = false; log = `${up[0][0]} failed → its pods are rescheduled on healthy nodes`; } recon(); };
    el_(root, "#k8-rs").onclick = reset; reset(); return () => draw();
  }
};

  title: "Training-serving skew from re-implemented encoding", cap: "The model was trained with one-hot 'plan' columns in the order [basic, standard, premium]. A serving team re-implements the encoder with a different order. Same customer, different prediction, and no error is raised.",
  html: () => `<div class="slidergrid"><label for="sk-p">plan <select id="sk-p"><option>basic</option><option>standard</option><option>premium</option></select></label><label for="sk-e">serving encoder <select id="sk-e"><option value="shared">import the shared encode()</option><option value="re">re-implemented: [premium, standard, basic]</option></select></label></div><div class="grid2" style="margin-top:8px"><div class="panel small" id="sk-v"></div><div class="panel" id="sk-o"></div></div><div class="readout" id="sk-r"></div>`,
  mount(root) {
    const W = [1.9, 0.2, -1.6], b = -0.4;

      const train = ["basic", "standard", "premium"], serve = e === "shared" ? train : ["premium", "standard", "basic"];
      const v = serve.map(x => x === p ? 1 : 0), z = b + v.reduce((s, x, i) => s + x * W[i], 0), pr = 1 / (1 + Math.exp(-z));
      const vt = train.map(x => x === p ? 1 : 0), zt = b + vt.reduce((s, x, i) => s + x * W[i], 0), prt = 1 / (1 + Math.exp(-zt));

LABS.seDriftLoop = {
  title: "Drift monitoring with PSI triggers retraining", cap: "The population stability index compares the live distribution of a feature with the training distribution: PSI = Σ (aᵢ − eᵢ) ln(aᵢ/eᵢ) over bins. Rule of thumb: < 0.1 stable, 0.1–0.2 watch, > 0.2 significant drift → retrain.",
  html: () => `<div class="slidergrid"><label for="dl-s">shift in mean glucose (mg/dL) <input id="dl-s" type="range" min="0" max="40" step="1" value="8"></label><label for="dl-w">spread change (%) <input id="dl-w" type="range" min="-30" max="30" step="5" value="0"></label></div><svg id="dl-c" viewBox="0 0 400 140" style="width:100%;height:auto;max-height:240px;margin-top:8px"></svg><div class="readout" id="dl-r"></div>`,
  mount(root) {
    const pdf = (x, m, s) => Math.exp(-0.5 * ((x - m) / s) ** 2) / (s * Math.sqrt(2 * Math.PI));
    const cdf = (x, m, s) => { const z = (x - m) / (s * Math.SQRT2), t = 1 / (1 + 0.3275911 * Math.abs(z)); const y = 1 - (((((1.061405429 * t - 1.453152027) * t) + 1.421413741) * t - 0.284496736) * t + 0.254829592) * t * Math.exp(-z * z); return 0.5 * (1 + (z >= 0 ? y : -y)); };
    const draw = () => { const sh = +el_(root, "#dl-s").value, sp = 1 + +el_(root, "#dl-w").value / 100; const m0 = 120, s0 = 30, m1 = m0 + sh, s1 = s0 * sp;
      const edges = [-Infinity]; for (let i = 1; i < 10; i++) { let lo = 0, hi = 300; for (let j = 0; j < 40; j++) { const md = (lo + hi) / 2; cdf(md, m0, s0) < i / 10 ? lo = md : hi = md; } edges.push((lo + hi) / 2); } edges.push(Infinity);
      let psi = 0; for (let i = 0; i < 10; i++) { const e = 0.1, a = Math.max(1e-4, cdf(edges[i + 1], m1, s1) - cdf(edges[i], m1, s1)); psi += (a - e) * Math.log(a / e); }
      const pk = Math.max(pdf(m0, m0, s0), pdf(m1, m1, s1)), X = x => (x - 20) * 400 / 240, Y = v => 132 - v * 118 / pk; let p0 = "", p1 = ""; for (let x = 20; x <= 260; x += 3) { p0 += `${p0 ? "L" : "M"}${X(x).toFixed(1)},${Y(pdf(x, m0, s0)).toFixed(1)}`; p1 += `${p1 ? "L" : "M"}${X(x).toFixed(1)},${Y(pdf(x, m1, s1)).toFixed(1)}`; }
      el_(root, "#dl-c").innerHTML = `<line x1="0" y1="130" x2="400" y2="130" stroke="var(--line)"/><path d="${p0}" fill="none" stroke="var(--muted)" stroke-width="2"/><path d="${p1}" fill="none" stroke="${psi > 0.2 ? "var(--bad)" : "var(--se)"}" stroke-width="2.5"/><text x="6" y="12" font-size="9" fill="var(--muted)">grey: training · coloured: live</text>`;
      el_(root, "#dl-r").innerHTML = `<span>PSI = <b>${psi.toFixed(3)}</b> → ${psi < 0.1 ? SEH.pill("stable", "ok") : psi < 0.2 ? SEH.pill("watch", "warn") : SEH.pill("drift: retrain", "bad")}</span><span>Loop: simulate/ingest → validate → features → train → evaluate & register → deploy (rolling, blue/green or canary) → monitor → drift check → retrain.</span>`; };
    $$("input", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.seAccPrec = {
  title: "Accuracy vs precision of a measurement", cap: "Twenty repeated measurements of the same thing (say, user satisfaction). Bias shifts the average away from the true value (the centre): that is poor accuracy. Spread scatters repeated measurements: that is poor precision.",
  html: () => `<canvas id="ap-c" style="height:280px" aria-label="Target with measurements"></canvas><div class="slidergrid"><label for="ap-b">bias (systematic error) <input id="ap-b" type="range" min="0" max="1.5" step="0.05" value="0.9"></label><label for="ap-s">spread (random error) <input id="ap-s" type="range" min="0.05" max="1" step="0.05" value="0.15"></label></div><div class="readout" id="ap-r"></div>`,
  mount(root) {
    const draw = () => { const b = +el_(root, "#ap-b").value, s = +el_(root, "#ap-s").value, r = prng(13);
      const P = Array.from({ length: 20 }, () => [b * 0.8 + s * gauss(r), b * 0.6 + s * gauss(r)]);
      const p = new Plot(el_(root, "#ap-c"), { xmin: -2.4, xmax: 2.4, ymin: -1.8, ymax: 1.8, pad: { l: 12, r: 12, t: 12, b: 12 } }), G = p.g;
      [1.6, 1.1, 0.6, 0.2].forEach((rad, k) => { G.beginPath(); G.arc(p.sx(0), p.sy(0), Math.abs(p.sx(rad) - p.sx(0)), 0, 7); G.fillStyle = k % 2 ? p.col.surface2 : p.col.soft; G.fill(); G.strokeStyle = p.col.line; G.stroke(); });
      p.dots(P, p.col.path, 4); const m = [P.reduce((a, q) => a + q[0], 0) / 20, P.reduce((a, q) => a + q[1], 0) / 20]; p.dots([m], p.col.bad, 6, p.col.bg);
      const off = Math.hypot(...m), sd = Math.sqrt(P.reduce((a, q) => a + (q[0] - m[0]) ** 2 + (q[1] - m[1]) ** 2, 0) / 20);
      const acc = off < 0.25 ? "accurate" : "inaccurate", pre = sd < 0.35 ? "precise" : "imprecise";
      el_(root, "#ap-r").innerHTML = `<span>average is <b>${off.toFixed(2)}</b> from the true value → <b>${acc}</b></span><span>spread of repeats <b>${sd.toFixed(2)}</b> → <b>${pre}</b></span><span>${acc === "inaccurate" && pre === "precise" ? "Consistently wrong: e.g. a survey question that always nudges users to answer higher." : acc === "accurate" && pre === "imprecise" ? "Right on average but noisy: e.g. tiny survey samples." : acc === "accurate" ? "Both: a good measure." : "Neither: fix the measure before trusting it."}</span>`; };
    $$("input", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

  title: "A sale-day traffic spike", cap: "Synthetic traffic for a sale that opens at 8 am. A fixed-capacity monolith must scale as one block (slowly); a microservice-based system scales only the busy services, quickly. Requests beyond capacity fail. Illustrative model, not measurements.",
  html: () => `<canvas id="fs-c" style="height:260px" aria-label="Traffic vs capacity"></canvas><div class="slidergrid"><label for="fs-a">architecture <select id="fs-a"><option value="mono">monolith, manual scaling</option><option value="micro">microservices + autoscaling</option></select></label><label for="fs-p">peak traffic (× normal) <input id="fs-p" type="range" min="2" max="20" step="1" value="12"></label><label for="fs-l">scaling reaction time (minutes) <input id="fs-l" type="range" min="1" max="60" step="1" value="30"></label></div><div class="readout" id="fs-r"></div>`,
  mount(root) {

      const T = 360, demand = [], cap = []; let c = 3, failed = 0, total = 0;
      for (let t = 0; t <= T; t++) { const d = 1 + (pk - 1) * Math.exp(-Math.pow((t - 60) / 55, 2)) * (t < 60 ? Math.exp(-(60 - t) / 4) : 1); demand.push([t / 60, d]);
        const target = Math.min(arch === "micro" ? pk * 1.1 : 3 + Math.floor(t / 120) * 2, arch === "micro" ? 50 : 8); const past = demand[Math.max(0, t - lag)][1];

LABS.sePipeFilter = {
  title: "Pipe-and-filter: build a prediction pipeline", cap: "A synthetic diabetes-style dataset (500 patients; some readings recorded as an invalid 0). Each filter takes the previous filter's output through a pipe. Switch filters on and off; the model (logistic regression trained in your browser) and its test accuracy update. The output filter always reports the result.",
  html: () => `<div class="flow" id="pf-f"></div><div class="row" style="margin-top:8px;gap:12px"><label><input type="checkbox" id="pf-clean" checked> Cleaning filter (replace invalid 0 with median)</label><label><input type="checkbox" id="pf-scale" checked> Scaling filter (standardise)</label></div><div class="readout" id="pf-r"></div>`,
  mount(root) {
    const r = prng(42), n = 500, D = [];
    for (let i = 0; i < n; i++) { const glu = 120 + 30 * gauss(r), bmi = 32 + 6 * gauss(r), age = 33 + 11 * Math.abs(gauss(r)), preg = Math.max(0, Math.round(3 + 3 * gauss(r)));
      const z = 0.045 * (glu - 120) + 0.09 * (bmi - 32) + 0.03 * (age - 33) + 0.08 * (preg - 3) - 0.6 + 0.6 * gauss(r); const y = z > 0 ? 1 : 0;
      D.push([r() < 0.08 ? 0 : glu, r() < 0.12 ? 0 : bmi, age, preg, y]); }
    const fit = (X, y) => { const d = X[0].length; let w = new Array(d).fill(0), b = 0; for (let it = 0; it < 300; it++) { const gw = new Array(d).fill(0); let gb = 0; X.forEach((x, i) => { const p = 1 / (1 + Math.exp(-(b + x.reduce((a, v, j) => a + v * w[j], 0)))), e = p - y[i]; gb += e; x.forEach((v, j) => gw[j] += e * v); }); w = w.map((v, j) => v - 0.1 * gw[j] / X.length); b -= 0.1 * gb / X.length; } return { w, b }; };
    const draw = () => { const cl = el_(root, "#pf-clean").checked, sc = el_(root, "#pf-scale").checked;
      el_(root, "#pf-f").innerHTML = [["Input filter", "load 500 rows", true], ["Cleaning filter", cl ? "0 → median" : "skipped", cl], ["Scaling filter", sc ? "standardise" : "skipped", sc], ["Training filter", "split 70/30, fit", true], ["Output filter", "accuracy, report", true]].map((f, i) => `<div class="fbox ${f[2] ? "on" : ""}"><span class="num">${i + 1}</span>${f[0]}<small>${f[1]}</small></div>`).join('<div class="farrow">→</div>');
      let X = D.map(d => d.slice(0, 4)), y = D.map(d => d[4]);
      if (cl) [0, 1].forEach(j => { const v = X.map(x => x[j]).filter(x => x > 0).sort((a, b) => a - b), med = v[Math.floor(v.length / 2)]; X.forEach(x => { if (x[j] === 0) x[j] = med; }); });
      if (sc) for (let j = 0; j < 4; j++) { const m = X.reduce((a, x) => a + x[j], 0) / n, s = Math.sqrt(X.reduce((a, x) => a + (x[j] - m) ** 2, 0) / n); X.forEach(x => x[j] = (x[j] - m) / s); }
      const tr = Math.floor(0.7 * n), M = fit(X.slice(0, tr), y.slice(0, tr));
      const pred = X.slice(tr).map(x => (M.b + x.reduce((a, v, j) => a + v * M.w[j], 0)) > 0 ? 1 : 0), acc = pred.filter((p, i) => p === y[tr + i]).length / (n - tr);
      el_(root, "#pf-r").innerHTML = `<span>test accuracy: <b>${(100 * acc).toFixed(1)}%</b></span><span>${!sc ? "Without scaling, features on very different scales (glucose ~120 vs pregnancies ~3) make gradient descent crawl: same model, worse result in the same number of steps." : !cl ? "Invalid zeros pass straight through: the model learns from impossible values." : "Each filter does one job; swapping or removing one doesn't require changing the others."}</span>`; };
    $$("input", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.seCqrsSim = {
  title: "Eventual consistency in a CQRS model rollout", cap: "A new model version is registered on the command (write) side at time 0. Read replicas in four regions receive the update through an event stream after a delay. Step through time to see which users get which version: all regions converge eventually.",
  html: () => `<div class="slidergrid"><label for="cq-d">average propagation delay (min) <input id="cq-d" type="range" min="1" max="15" step="1" value="6"></label><label for="cq-t">time since release (min) <input id="cq-t" type="range" min="0" max="30" step="1" value="3"></label></div><div class="grid2" style="margin-top:8px"><div class="panel"><h4 style="margin-top:0">Command side (write store)</h4><div id="cq-w"></div></div><div class="panel"><h4 style="margin-top:0">Query side (read replicas)</h4><div id="cq-r"></div></div></div><div class="readout" id="cq-o"></div>`,
  mount(root) {
    const R = [["Mumbai", 0.4, 30], ["Frankfurt", 0.9, 20], ["Virginia", 1.3, 35], ["Singapore", 1.8, 15]];
    const draw = () => { const d = +el_(root, "#cq-d").value, t = +el_(root, "#cq-t").value;
      el_(root, "#cq-w").innerHTML = `<p class="small" style="margin:0">model registry: <b>v6.0</b> (written at 12:00)</p><p class="small muted" style="margin:4px 0 0">event <code>ModelVersionPromoted(v6.0)</code> published to the stream</p>`;
      let users = 0, newUsers = 0;
      el_(root, "#cq-r").innerHTML = R.map(([n, f, share]) => { const arr = d * f, done = t >= arr; users += share; if (done) newUsers += share; return `<div class="row" style="justify-content:space-between"><span class="small">${n}</span>${SEH.pill(done ? "v6.0" : "v5.2 (stale)", done ? "ok" : "bad")}<span class="small muted">${done ? "synced" : "syncs at +" + arr.toFixed(1) + " min"}</span></div>`; }).join("");
      el_(root, "#cq-o").innerHTML = `<span>users on the new version: <b>${(100 * newUsers / users).toFixed(0)}%</b></span><span>${newUsers === users ? "Converged: every endpoint serves the same version." : "Inconsistent for now: some users see v5.2. Acceptable for model rollouts; not for account balances."}</span>`; };

LABS.seRagToy = {
  title: "A tiny RAG pipeline in your browser", cap: "Ingestion (write side): documents are split into chunks and embedded (here: simple word-count vectors, not a neural embedding). Query (read side): the question is embedded the same way, the most similar chunks are retrieved, and a prompt is assembled for the LLM. Change the chunk size and top-k to see what context the model would receive.",
  html: () => `<div class="slidergrid"><label for="rg-q">question <select id="rg-q"><option>How many days of annual leave do new employees get?</option><option>Can I carry over unused leave?</option><option>What is the laptop refresh policy?</option><option>How do I claim travel expenses?</option></select></label><label for="rg-c">chunk size (words) <input id="rg-c" type="range" min="8" max="40" step="4" value="16"></label><label for="rg-k">top-k <input id="rg-k" type="range" min="1" max="4" step="1" value="2"></label></div><div id="rg-o" style="margin-top:8px"></div><div class="readout" id="rg-r"></div>`,
  mount(root) {
    const DOCS = [["leave-policy", "New employees receive 18 days of annual leave per year, accrued monthly. Up to 5 unused days can be carried over into the next year; the rest lapse on 31 March. Sick leave is separate and does not count toward annual leave."], ["it-policy", "Laptops are refreshed every 3 years. Employees can request an early refresh if the device fails a hardware check. All laptops must have disk encryption enabled before connecting to the network."], ["travel-policy", "Travel expenses are claimed through the expense portal within 30 days of the trip. Attach receipts for every item above 500 rupees. Economy class is standard for flights under 6 hours."], ["canteen", "The canteen is open from 8 am to 8 pm. Weekly menus are posted on the intranet every Monday."]];
    const STOP = new Set("the a an of to and is are for in on be can do i how what any are per into does not if must by with from every all up rest".split(" "));
    const tok = s => s.toLowerCase().replace(/[^a-z0-9 ]/g, " ").split(/\s+/).filter(w => w && !STOP.has(w)).map(w => w.replace(/s$/, ""));
    const vec = ws => ws.reduce((m, w) => (m[w] = (m[w] || 0) + 1, m), {});
    const cos = (a, b) => { let d = 0, na = 0, nb = 0; for (const k in a) { na += a[k] * a[k]; if (b[k]) d += a[k] * b[k]; } for (const k in b) nb += b[k] * b[k]; return d / (Math.sqrt(na * nb) || 1); };
    const draw = () => { const q = el_(root, "#rg-q").value, cs = +el_(root, "#rg-c").value, k = +el_(root, "#rg-k").value;
      const chunks = []; DOCS.forEach(([id, t]) => { const w = t.split(" "); for (let i = 0; i < w.length; i += cs) chunks.push({ id: `${id}#${Math.floor(i / cs) + 1}`, text: w.slice(i, i + cs).join(" ") }); });
      chunks.forEach(c => c.v = vec(tok(c.text))); const qv = vec(tok(q)); chunks.forEach(c => c.s = cos(qv, c.v));
      const top = [...chunks].sort((a, b) => b.s - a.s).slice(0, k);
      el_(root, "#rg-o").innerHTML = `<div class="small muted">${chunks.length} chunks indexed. Retrieved:</div>` + top.map(c => `<div class="stepbox" style="min-height:0;margin-top:6px"><span class="chip">${c.id}</span> <span class="small muted">similarity ${c.s.toFixed(2)}</span><br>${c.text}</div>`).join("") + `<div class="stepbox" style="min-height:0;margin-top:6px;font-family:var(--f-mono);font-size:.8rem">PROMPT → "Answer using only the context below. If the answer is not there, say you don't know.<br>Context: ${top.map(c => c.text).join(" … ").slice(0, 220)}…<br>Question: ${q}"</div>`;
      el_(root, "#rg-r").innerHTML = `<span>${cs <= 8 ? "Very small chunks: facts get split from their context (e.g. a number without what it refers to)." : cs >= 36 ? "Very large chunks: more irrelevant text competes for the model's attention and the prompt costs more tokens." : "A balanced chunk size keeps each fact with its context."}</span>`; };
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.seMonoMicro = {

  mount(root) {
    const P = [["UI / API gateway", 1], ["Preprocessing", 1], ["Model inference", 4], ["Logging", 1]];
    const draw = () => { const L = +el_(root, "#mm-l").value, fail = el_(root, "#mm-f").checked, need = Math.ceil(L);
      const monoRep = need, monoRes = monoRep * P.reduce((a, p) => a + p[1], 0);
