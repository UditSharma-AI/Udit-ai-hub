{
/* ===== DRL M11 labs: policy gradient methods ===== */
var CORR = { J(p) { const a = p, b = 1 - p; /* V0 = -1 + p V1 + (1-p) V0; V1 = -1 + p V0 + (1-p) V2; V2 = -1 + (1-p) V1 */
  const M = [[a, -a, 0], [-a, 1, -b], [0, -b, 1]], B = [-1, -1, -1]; const x = solve(M, B); return x ? x[0] : -Infinity; } };

LABS.drCorridor = XH.calc({ p: "cor", title: "When the best policy must be random", cap: "Short corridor: start left, goal right, −1 per step; in the second cell the actions are reversed; all cells look identical to the agent. A policy is just p = P(right). Deterministic policies (p = 0 or 1) never reach the goal; the value of the start state is best near p ≈ 0.59.",
  inputs: [["p", "P(right)", 0.02, 0.98, 0.01, 0.5]],
  out: v => { const pts = []; for (let p = 0.05; p <= 0.951; p += 0.01) pts.push([p, CORR.J(p)]); const cur = CORR.J(v.p);
    return XH.lines([{ pts, color: "var(--dr)" }], { xmin: 0, xmax: 1, ymin: -100, ymax: 0 }, { x: "P(right) (y: value of start state)" }, (sx, sy) => `<circle cx="${sx(v.p)}" cy="${sy(Math.max(-100, cur))}" r="5" fill="var(--path)"/>`) + `<div class="readout"><span>p = ${v.p}: value <b>${XH.f(cur, 2)}</b> (best ≈ −11.6 at p ≈ 0.59).</span><span>An ε-greedy policy derived from action values can only be 'mostly left' or 'mostly right' (p = ε/2 or 1 − ε/2); a policy-gradient method can learn any p. With aliased states or in games (rock–paper–scissors) the optimal policy is stochastic.</span></div>`; } });

LABS.drSoftmaxPolicy = XH.calc({ p: "smp", title: "Softmax policy over action preferences", cap: "π(a|s, θ) = e^{h(s,a,θ)} / Σ_b e^{h(s,b,θ)}, with preferences h = θᵀx(s, a). Preferences can drive probabilities toward deterministic or keep them stochastic.",
  inputs: [["h1", "h(left)", -3, 3, 0.1, 0.5], ["h2", "h(right)", -3, 3, 0.1, -0.2], ["h3", "h(stay)", -3, 3, 0.1, -3], ["T", "temperature", 0.1, 3, 0.1, 1]],
  out: v => { const p = XH.softmax([v.h1 / v.T, v.h2 / v.T, v.h3 / v.T]);
    return XH.bars([["left", p[0], "var(--dr)"], ["right", p[1], "var(--dr)"], ["stay", p[2], "var(--dr)"]], 1) + `<div class="readout"><span>Only differences between preferences matter (adding a constant to all changes nothing). Low temperature → near-greedy; high → near-uniform.</span><span>With two actions and h = (0.5, −0.2): π = (0.668, 0.332), the worked example's starting policy.</span></div>`; } });

LABS.drGaussianPolicy = XH.calc({ p: "gpo", title: "A Gaussian policy for continuous actions", cap: "For a continuous action (e.g. a steering angle), π(a|s, θ) = N(μ(s, θ), σ(s, θ)²). The policy outputs a mean and a standard deviation; actions are sampled. ∇ log π pushes μ toward actions that did better than expected.",
  inputs: [["m", "μ (mean action)", -2, 2, 0.05, 0.3], ["s", "σ (exploration)", 0.05, 1.5, 0.05, 0.5], ["a", "sampled action a", -2, 2, 0.05, 0.8], ["adv", "advantage of a", -3, 3, 0.1, 2]],
  out: v => { const pts = []; for (let x = -3; x <= 3.001; x += 0.05) pts.push([x, Math.exp(-((x - v.m) ** 2) / (2 * v.s * v.s)) / (v.s * Math.sqrt(2 * Math.PI))]); const gm = (v.a - v.m) / (v.s * v.s), gs = ((v.a - v.m) ** 2 - v.s * v.s) / (v.s ** 3);
    return XH.lines([{ pts, color: "var(--dr)" }], { xmin: -3, xmax: 3, ymin: 0, ymax: Math.max(1, 1 / (v.s * 2.5)) }, { x: "action" }, (sx, sy) => `<line x1="${sx(v.a)}" x2="${sx(v.a)}" y1="${sy(0)}" y2="${sy(Math.max(1, 1 / (v.s * 2.5)) * 0.9)}" stroke="var(--path)" stroke-width="2"/>`) + `<div class="readout"><span>∂ log π/∂μ = (a − μ)/σ² = ${XH.f(gm)}; ∂ log π/∂σ = ((a − μ)² − σ²)/σ³ = ${XH.f(gs)}.</span><span>Update ∝ A × gradient: μ moves ${v.adv * gm > 0 ? "toward" : "away from"} a by ${XH.f(Math.abs(v.adv * gm))} × α; σ ${Math.abs(v.adv * gs) < 1e-9 ? "stays the same" : v.adv * gs > 0 ? "grows (explore more)" : "shrinks (explore less)"}.</span></div>`; } });

LABS.drReinforceStep = XH.calc({ p: "rfs", title: "One REINFORCE update", cap: "θ ← θ + α Gₜ ∇ log π(Aₜ|Sₜ, θ). For a softmax over two actions with preferences θ, ∇ log π(a) = x(a) − Σ_b π(b)x(b) = one-hot(a) − π.",
  inputs: [["t1", "θ₁", -2, 2, 0.05, 0.5], ["t2", "θ₂", -2, 2, 0.05, -0.2], ["a", "action taken", [["0", "action 1"], ["1", "action 2"]]], ["G", "return G", -5, 5, 0.5, 2], ["al", "α", 0.01, 0.5, 0.01, 0.1]],
  out: v => { const pi = XH.softmax([v.t1, v.t2]), a = +v.a, sc = [(a === 0 ? 1 : 0) - pi[0], (a === 1 ? 1 : 0) - pi[1]], n = [v.t1 + v.al * v.G * sc[0], v.t2 + v.al * v.G * sc[1]], pn = XH.softmax(n);
    return `<div class="formula">π = (${XH.f(pi[0])}, ${XH.f(pi[1])}); ∇log π = (${XH.f(sc[0])}, ${XH.f(sc[1])}); θ ← θ + ${v.al}·${v.G}·∇ = <b>(${XH.f(n[0])}, ${XH.f(n[1])})</b></div>${XH.bars([["P(action 1) before", pi[0], "var(--muted)"], ["P(action 1) after", pn[0], "var(--dr)"]], 1)}<div class="readout"><span>${v.G > 0 ? "Positive return: the taken action becomes more likely." : v.G < 0 ? "Negative return: the taken action becomes less likely." : "Zero return: no change."} Defaults reproduce the worked example: (0.5, −0.2) → (0.566, −0.266).</span><span>Note every return here has the same sign (e.g. all −1 per step) → every action is pushed up; only the relative sizes teach. A baseline fixes this.</span></div>`; } });

LABS.drBaselineRun = {
  title: "REINFORCE with and without a baseline", cap: "Short-corridor task, 5 runs each. Without a baseline the update is G·∇log π; with a learned baseline b ≈ average return it is (G − b)·∇log π, which has the same expected direction but far less variance, allowing a 10× larger step size here.",
  html: () => `<div class="row"><button class="btn primary sm" id="br-g">Run 600 episodes × 5 seeds</button></div><div id="br-c" style="margin-top:6px"></div><div class="readout" id="br-r"></div>`,
  mount(root) {
    const go = () => { const res = [false, true].map(bl => { const curves = []; let fp = 0;
        for (let sd = 0; sd < 5; sd++) { const r = prng(100 + sd); let th = [-1.47, 1.47], w = 0; const L = [];
          for (let e = 0; e < 600; e++) { const pi = XH.softmax(th); let s = 0; const tr = []; while (s !== 3 && tr.length < 400) { const a = r() < pi[1] ? 1 : 0; tr.push(a); s = Math.max(0, s + (a ? 1 : -1) * (s === 1 ? -1 : 1)); }
            const T = tr.length; tr.forEach((a, t) => { const G = -(T - t); let d; if (bl) { d = G - w; w += 0.02 * d; } else d = G; const g = [-pi[0], -pi[1]]; g[a] += 1; const al = bl ? 0.002 : 0.0002; th = [th[0] + al * d * g[0], th[1] + al * d * g[1]]; }); L.push(T); }
          curves.push(L); fp += XH.softmax(th)[1]; }
        const avg = []; for (let e = 0; e < 600; e += 10) { let s = 0; for (const c of curves) for (let k = e; k < e + 10; k++) s += c[k]; avg.push([e + 10, s / 50]); } return [avg, fp / 5]; });
      el_(root, "#br-c").innerHTML = XH.lines([{ pts: res[0][0], color: "var(--path)" }, { pts: res[1][0], color: "var(--dr)" }, { pts: [[0, 11.66], [600, 11.66]], color: "var(--muted)", dash: "4 3", w: 1 }], { xmin: 0, xmax: 600, ymin: 0, ymax: 60 }, { x: "episodes (y: steps to goal, lower is better)" }) + XH.legend([["var(--path)", "REINFORCE, α = 2×10⁻⁴"], ["var(--dr)", "with baseline, α = 2×10⁻³"], ["var(--muted)", "best possible ≈ 11.7", "4 3"]]);
      el_(root, "#br-r").innerHTML = `<span>Final P(right): ${res[0][1].toFixed(2)} without, ${res[1][1].toFixed(2)} with a baseline (optimum ≈ 0.59).</span><span>All returns are negative here, so without a baseline every taken action is pushed down; only differences between returns carry signal, and the noise forces a tiny step size.</span>`; };
    el_(root, "#br-g").onclick = go; go(); return null;
  }
};

LABS.drActorCriticStep = XH.stepLab({ p: "acs", title: "One-step actor–critic", cap: "The critic learns v̂(s, w); its TD error both trains the critic and serves as the advantage signal for the actor.",
  boxes: ["Act: A ~ π(·|S, θ)", "Observe R, S′", "δ = R + γv̂(S′) − v̂(S)", "Critic: w += α_w δ ∇v̂(S)", "Actor: θ += α_θ δ ∇log π(A|S)"],
  steps: [
    { on: 0, html: "Sample an action from the current policy (the actor)." },
    { on: 1, html: "Take it; observe reward and next state. No need to wait for the episode to end." },
    { on: 2, html: "TD error: was the outcome better (δ > 0) or worse (δ < 0) than the critic expected? E.g. R = −1, v̂(S′) = −9.7, v̂(S) = −11.7, γ = 1: δ = −1 − 9.7 + 11.7 = +1.0: better than expected." },
    { on: 3, html: "Critic moves v̂(S) toward R + γv̂(S′) (semi-gradient TD)." },
    { on: 4, html: "Actor makes A more likely if δ > 0, less if δ < 0. δ is a one-step estimate of the advantage A(S, A) = q(S, A) − v(S): low variance, some bias (bootstrapping)." },
    { on: [0, 1, 2, 3, 4], html: "Repeat every step. Variants: n-step returns or GAE instead of one-step δ (A2C/A3C, PPO), and entropy bonuses to keep exploring." }
  ] });

LABS.drPpoClip = XH.calc({ p: "ppo", title: "PPO's clipped surrogate", cap: "L(θ) = min(rₜ Aₜ, clip(rₜ, 1 − ε, 1 + ε) Aₜ) with rₜ = πθ(a|s)/πθ_old(a|s). Once the ratio moves outside [1 − ε, 1 + ε] in the direction the advantage favours, the objective goes flat: no incentive to move further.",
  inputs: [["A", "advantage Aₜ", -3, 3, 0.5, 3], ["e", "ε", 0.05, 0.4, 0.05, 0.2], ["r", "current ratio rₜ", 0.4, 1.8, 0.05, 1.3]],
  out: v => { const L = r => Math.min(r * v.A, Math.min(Math.max(r, 1 - v.e), 1 + v.e) * v.A), pts = [], un = []; for (let r = 0.4; r <= 1.801; r += 0.01) { pts.push([r, L(r)]); un.push([r, r * v.A]); }
    const cur = L(v.r), flat = cur !== v.r * v.A; const lo = Math.min(...un.map(p => p[1]), ...pts.map(p => p[1])) - 0.2, hi = Math.max(...un.map(p => p[1]), ...pts.map(p => p[1])) + 0.2;
    return XH.lines([{ pts: un, color: "var(--muted)", dash: "4 3" }, { pts, color: "var(--dr)", w: 2.5 }], { xmin: 0.4, xmax: 1.8, ymin: lo, ymax: hi }, { x: "ratio r = πθ/πθ_old" }, (sx, sy) => `<circle cx="${sx(v.r)}" cy="${sy(cur)}" r="5" fill="var(--path)"/>`) + XH.legend([["var(--muted)", "unclipped r·A", "4 3"], ["var(--dr)", "PPO objective"]]) + `<div class="readout"><span>At r = ${v.r}: r·A = ${XH.f(v.r * v.A)}, clipped = ${XH.f(Math.min(Math.max(v.r, 1 - v.e), 1 + v.e) * v.A)}, objective = <b>${XH.f(cur)}</b> ${flat ? "(flat: zero gradient, the update is capped)" : "(gradient flows)"}.</span><span>Worked: r = 1.3, A = 3, ε = 0.2 → min(3.9, 3.6) = 3.6. For negative advantages the clip acts below 1 − ε instead; pessimism (the min) means clipping never makes the objective look better.</span></div>`; } });

LABS.drContinuousSorter = sorterLab("DDPG, TD3 or SAC?", "Off-policy actor–critic methods for continuous actions. DDPG: deterministic actor trained through a Q-critic. TD3: DDPG plus twin critics (min), delayed actor updates and target smoothing. SAC: stochastic actor maximising reward plus entropy.", { ddpg: "DDPG", td3: "TD3", sac: "SAC" }, [

LABS.drGae = XH.calc({ p: "gae", title: "Generalised advantage estimation", cap: "Âₜ = δₜ + (γλ)δₜ₊₁ + (γλ)²δₜ₊₂ + …, with δₜ = Rₜ₊₁ + γV(Sₜ₊₁) − V(Sₜ). λ = 0: one-step TD error (low variance, more bias). λ = 1: Monte Carlo advantage (no bootstrap bias, high variance).",

LABS.drPpoBatch = {

  mount(root) {
    const draw = () => { const e = +el_(root, "#pb-e").value; el_(root, "#pb-ev").textContent = e; const rows = [], terms = [], wrong = [];
      for (let i = 0; i < 4; i++) { const r = +el_(root, "#pb-r" + i).value, a = +el_(root, "#pb-a" + i).value, c = Math.min(Math.max(r, 1 - e), 1 + e), t = Math.min(r * a, c * a); terms.push(t); wrong.push(Math.min(r, c) * a); rows.push([i + 1, r, a, XH.f(r * a), XH.f(c * a), `<b>${XH.f(t)}</b>`, t !== r * a ? "clipped (no gradient)" : "unclipped"]); }
      const L = terms.reduce((x, y) => x + y, 0) / 4, W = wrong.reduce((x, y) => x + y, 0) / 4;
      el_(root, "#pb-o").innerHTML = XH.table(["#", "r", "Â", "r·Â", "clip(r)·Â", "min", "branch"], rows) + `<div class="readout"><span>L_CLIP = <b>${XH.f(L)}</b> (defaults: (2.40 − 0.80 + 1.20 − 1.60)/4 = 0.30).</span><span>Wrong order, min(r, clip r)·Â: ${XH.f(W)}. Sample 2 shows why: with Â &lt; 0 the clipped product −0.80 is the pessimistic choice, not −0.70.</span></div>`; };
    $$("input", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.drLmPolicy = XH.stepLab({ p: "lmp", title: "A language model as an RL policy", cap: "πθ(y|x) = Πₜ πθ(yₜ | x, y<ₜ): generating a response is a sequence of decisions.",

LABS.drBradleyTerry = XH.calc({ p: "btm", title: "Reward models and the KL-shaped reward", cap: "A reward model r_φ is trained so that P(y_w ≻ y_l) = σ(r_φ(x, y_w) − r_φ(x, y_l)) (Bradley–Terry). PPO then maximises the shaped reward r̃ = r_φ(x, y) − β log[πθ(y|x)/π_ref(y|x)], which penalises drifting from the reference (SFT) model.",
  inputs: [["rw", "r_φ(winner)", -3, 3, 0.1, 1.2], ["rl", "r_φ(loser)", -3, 3, 0.1, 0.2], ["lr", "log πθ(y)/π_ref(y)", -2, 4, 0.1, 1.5], ["b", "β", 0, 1, 0.05, 0.1]],
  out: v => { const p = 1 / (1 + Math.exp(-(v.rw - v.rl))), sh = v.rw - v.b * v.lr;
    return `<div class="formula">P(winner ≻ loser) = σ(${v.rw} − ${v.rl}) = <b>${XH.f(p)}</b>; reward-model loss −log σ = ${XH.f(-Math.log(p))}</div><div class="formula">shaped reward for the winner: ${v.rw} − ${v.b} × ${v.lr} = <b>${XH.f(sh)}</b></div><div class="readout"><span>The KL term discourages the policy from exploiting reward-model quirks by moving far from the reference.</span><span>Don't confuse the two denominators: PPO's ratio uses π_old (the policy that generated this batch); the KL anchor uses π_ref (the frozen SFT model).</span></div>`; } });

LABS.drDpo = XH.calc({ p: "dpo", title: "One DPO pair", cap: "DPO trains directly on preference triples (x, y_w, y_l) with no reward model or RL loop. Margin m = [log πθ(y_w) − log π_ref(y_w)] − [log πθ(y_l) − log π_ref(y_l)]; loss = −log σ(βm).",
  inputs: [["w", "log-ratio of winner", -2, 2, 0.1, 0.4], ["l", "log-ratio of loser", -2, 2, 0.1, -0.3], ["b", "β", 0.1, 3, 0.1, 1]],
  out: v => { const m = v.w - v.l, s = 1 / (1 + Math.exp(-v.b * m)), L = -Math.log(s);
    return `<div class="formula">m = ${v.w} − (${v.l}) = ${XH.f(m)}; σ(βm) = ${XH.f(s)}; loss = <b>${XH.f(L)}</b></div>${XH.bars([["loss", L, "var(--bad)"], ["σ(βm) = implied P(winner preferred)", s, "var(--dr)"]], Math.max(1, L))}<div class="readout"><span>Defaults: m = 0.7 → loss 0.403. After training sharpens the ratios to +0.8 and −0.5: m = 1.3 → loss 0.241.</span><span>The gradient raises the winner's and lowers the loser's probability relative to the reference, weighted by how wrong the model currently is (1 − σ(βm)).</span></div>`; } });

LABS.drDpoTrain = {
  title: "DPO on a toy model with four possible answers", cap: "A tiny 'model' chooses among four responses to one prompt. People compared random pairs; true quality order is C > B > A > D. Train with DPO from a reference policy (0.4, 0.3, 0.2, 0.1) and watch the policy shift. β controls how far it may move from the reference.",
  html: () => `<div class="slidergrid xh"><label for="dt-b">β <b class="num" id="dt-bv"></b><input id="dt-b" type="range" min="0.1" max="2" step="0.1" value="0.5"></label></div><div class="row" style="margin-top:6px">${ctrlBtns("dt")}<span class="status-pill run" id="dt-k"></span></div><div id="dt-o" style="margin-top:8px"></div><div class="readout" id="dt-r"></div>`,
  mount(root) {
    const ref = [0.4, 0.3, 0.2, 0.1].map(Math.log), q = [0, 1, 2, -1], N = ["A", "B", "C", "D"]; let th, it, pairs;
    const reset = () => { const r = prng(4); pairs = []; for (let k = 0; k < 400; k++) { let i = Math.floor(r() * 4), j = Math.floor(r() * 3); if (j >= i) j++; pairs.push(r() < 1 / (1 + Math.exp(-(q[i] - q[j]))) ? [i, j] : [j, i]); } th = ref.slice(); it = 0; show(); };
    const step = () => { const b = +el_(root, "#dt-b").value; for (let rep = 0; rep < 10; rep++) { const g = [0, 0, 0, 0]; pairs.forEach(([w, l]) => { const m = (th[w] - ref[w]) - (th[l] - ref[l]), c = b * (1 - 1 / (1 + Math.exp(-b * m))); g[w] += c; g[l] -= c; }); th = th.map((t, i) => t + 0.1 * g[i] / pairs.length); it++; } show(); };
    const show = () => { el_(root, "#dt-bv").textContent = el_(root, "#dt-b").value; const pi = XH.softmax(th), pr = ref.map(Math.exp), kl = pi.reduce((s, p, i) => s + p * Math.log(p / pr[i]), 0);
      el_(root, "#dt-o").innerHTML = XH.table(["response", "true quality", "reference", "DPO policy"], N.map((n, i) => [n, q[i], pr[i].toFixed(2), `<b>${pi[i].toFixed(2)}</b>`]));
      el_(root, "#dt-k").textContent = it + " steps"; el_(root, "#dt-r").innerHTML = `<span>KL(π ‖ π_ref) = ${kl.toFixed(3)}. The best response C gains probability and D is suppressed, learned only from pairwise comparisons, with no reward model and no sampling.</span><span>Larger β makes each preference 'satisfied' with a smaller shift from the reference, so the policy stays closer to it.</span>`; };
    player(root, "dt", step, reset, 120, () => it >= 600); el_(root, "#dt-b").addEventListener("input", reset); reset(); return show;
  }
};

LABS.drGrpo = XH.calc({ p: "grp", title: "GRPO: group-relative advantages", cap: "Sample a group of G answers for one prompt, score each (e.g. 1 if a maths answer is correct), and use Âᵢ = (rᵢ − mean)/std as the advantage in a PPO-style clipped objective. No value network (critic) is needed.",

LABS.drDynaMaze = {
  title: "Dyna-Q: learning, model building and planning", cap: "Maze 6×9 (walls dark), start S, goal G (+1), γ = 0.95, ε = 0.1, α = 0.1. After every real step, Dyna-Q also performs n simulated Q-learning updates from remembered transitions. Compare n = 0 (plain Q-learning) with planning.",
  html: () => `<div class="slidergrid xh"><label for="dm-n">planning steps n <select id="dm-n"><option>0</option><option selected>5</option><option>50</option></select></label></div><div class="row" style="margin-top:6px"><button class="btn primary sm" id="dm-e">Run 1 episode</button><button class="btn sm" id="dm-t">Run 10</button><button class="btn sm ghost" id="dm-z">Reset</button><span class="status-pill run" id="dm-k"></span></div><div class="grid2" style="margin-top:8px"><div id="dm-g"></div><div id="dm-c"></div></div><div class="readout" id="dm-r"></div>`,
  mount(root) {
    const R = 6, C = 9, W = new Set(["1,2", "2,2", "3,2", "4,5", "0,7", "1,7", "2,7"]), S = [2, 0], G = [0, 8], MV = [[-1, 0], [0, 1], [1, 0], [0, -1]];
    let r, Q, M, lens;
    const k = (a, b) => a + "," + b, st = (s, a) => { let nr = s[0] + MV[a][0], nc = s[1] + MV[a][1]; if (nr < 0 || nr >= R || nc < 0 || nc >= C || W.has(k(nr, nc))) { nr = s[0]; nc = s[1]; } return [[nr, nc], nr === G[0] && nc === G[1] ? 1 : 0]; };
    const q = s => Q[s[0] * C + s[1]], am = v => { let b = 0; for (let i = 1; i < 4; i++) if (v[i] > v[b] || (v[i] === v[b] && r() < 0.5)) b = i; return b; };
    const reset = () => { r = prng(9); Q = Array.from({ length: R * C }, () => [0, 0, 0, 0]); M = new Map(); lens = []; show(); };
    const episode = () => { const n = +el_(root, "#dm-n").value; let s = S, cnt = 0;
      while (!(s[0] === G[0] && s[1] === G[1]) && cnt < 3000) { cnt++; const a = r() < 0.1 ? Math.floor(r() * 4) : am(q(s)), [s2, rw] = st(s, a), done = rw > 0;
        q(s)[a] += 0.1 * (rw + (done ? 0 : 0.95 * Math.max(...q(s2))) - q(s)[a]); M.set(k(s[0], s[1]) + "|" + a, [s, a, rw, s2]); const keys = [...M.values()];
        for (let j = 0; j < n; j++) { const [ps, pa, pr, ps2] = keys[Math.floor(r() * keys.length)], d = ps2[0] === G[0] && ps2[1] === G[1]; q(ps)[pa] += 0.1 * (pr + (d ? 0 : 0.95 * Math.max(...q(ps2))) - q(ps)[pa]); }
        s = s2; }
      lens.push(cnt); };
    const show = () => { const path = new Set(); let s = S; for (let i = 0; i < 40; i++) { path.add(k(s[0], s[1])); if (s[0] === G[0] && s[1] === G[1]) break; s = st(s, am(q(s).map(x => x + 1e-12)))[0]; }
      const mx = Math.max(1e-9, ...Q.map(v => Math.max(...v)));
      el_(root, "#dm-g").innerHTML = XH.grid(R, C, (rr, cc) => { const key = k(rr, cc); if (W.has(key)) return { bg: "var(--ink)" }; if (rr === S[0] && cc === S[1]) return { txt: "S", bg: "var(--accent-soft)" }; if (rr === G[0] && cc === G[1]) return { txt: "G", bg: "var(--accent-soft)" }; const v = Math.max(...Q[rr * C + cc]); return { txt: lens.length && path.has(key) ? "•" : "", bg: v > 0 ? XH.heat(v, 0, mx, "var(--dr)") : "var(--surface-2)" }; }, 28);
      el_(root, "#dm-c").innerHTML = lens.length ? XH.lines([{ pts: lens.map((l, i) => [i + 1, Math.min(l, 800)]), color: "var(--dr)" }], { xmin: 0, xmax: Math.max(10, lens.length), ymin: 0, ymax: 800 }, { x: "episode (y: steps, capped at 800)" }) : "";
      el_(root, "#dm-k").textContent = lens.length + " episodes"; el_(root, "#dm-r").innerHTML = `<span>${lens.length ? `Last episode: ${lens[lens.length - 1]} steps (shortest possible 14). Shading = max Q; • = current greedy path.` : "Press Run."}</span><span>In the first episode only the step into the goal gets value. With planning, that value is propagated backwards through remembered transitions between real steps, so by episode 2 a long chain of states already points toward the goal.</span>`; };
    el_(root, "#dm-e").onclick = () => { episode(); show(); }; el_(root, "#dm-t").onclick = () => { for (let i = 0; i < 10; i++) episode(); show(); }; el_(root, "#dm-z").onclick = reset; el_(root, "#dm-n").addEventListener("input", reset); reset(); return show;
  }
};

LABS.drDynaBonus = XH.calc({ p: "dyb", title: "Dyna-Q+: an exploration bonus for stale transitions", cap: "When the environment changes (a shortcut opens, a path is blocked), a learned model becomes wrong. Dyna-Q+ adds a bonus κ√τ to the reward of simulated transitions not tried for τ time steps, encouraging the agent to re-test them.",
  inputs: [["r", "modelled reward r", 0, 1, 0.05, 0], ["k", "κ", 0, 0.01, 0.0005, 0.001], ["t", "τ (steps since last tried)", 0, 5000, 50, 1000]],
  out: v => { const b = v.k * Math.sqrt(v.t);
    return `<div class="formula">planning reward = r + κ√τ = ${v.r} + ${v.k}·√${v.t} = <b>${XH.f(v.r + b)}</b></div>${XH.bars([["bonus κ√τ", b, "var(--dr)"]], Math.max(0.1, b))}<div class="readout"><span>Old, untested state–action pairs look increasingly attractive in planning, so the agent eventually goes back to check them and discovers the change (e.g. a newly opened shortcut that plain Dyna-Q never revisits).</span><span>The bonus only enters simulated updates; it is curiosity built into the model.</span></div>`; } });

LABS.drUcb1 = XH.calc({ p: "u1", title: "UCB1 for tree search", cap: "In MCTS selection, pick the child maximising Q + c √(ln N / n), where N is the parent's visit count and n the child's. Rarely visited children get a large bonus.",
  inputs: [["q", "child win rate Q", 0, 1, 0.05, 0.6], ["c", "c", 0, 3, 0.01, 1.41], ["pn", "parent visits N", 2, 1000, 1, 100], ["n", "child visits n", 1, 200, 1, 10]],
  out: v => { const b = v.c * Math.sqrt(Math.log(v.pn) / v.n);
    return `<div class="formula">UCB1 = ${v.q} + ${v.c}·√(ln ${v.pn} / ${v.n}) = ${v.q} + ${XH.f(b)} = <b>${XH.f(v.q + b)}</b></div><div class="readout"><span>Worked: Q = 0.6, c = 1.41, N = 100: n = 10 → 1.557; n = 2 → 2.740 (much larger bonus).</span><span>c ≈ √2 balances exploration and exploitation; UCT applies UCB1 at every node of the tree.</span></div>`; } });

LABS.drMcts = XH.stepLab({ p: "mct", title: "One iteration of Monte Carlo tree search", cap: "MCTS grows a search tree from the current position by repeating four phases; it is an anytime algorithm: stop whenever time runs out and play the most-visited move.",

LABS.drDaggerSim = {
  title: "Behavioural cloning vs DAgger: driving in a lane", cap: "The expert steers back toward the centre. Its demonstrations stay near the centre, so a cloned policy has never seen large offsets and doesn't know how to recover. DAgger lets the learner drive, asks the expert to label the states it actually visits, aggregates and retrains.",
  html: () => `<div class="row"><button class="btn sm" id="dg-bc">Drive with BC</button><button class="btn primary sm" id="dg-it">DAgger: one more iteration</button><button class="btn sm ghost" id="dg-z">Reset</button><span class="status-pill run" id="dg-k"></span></div><div id="dg-c" style="margin-top:6px"></div><div class="readout" id="dg-r"></div>`,
  mount(root) {
    const A = [-1, -0.5, 0, 0.5, 1], B = Array.from({ length: 21 }, (_, i) => -3 + 0.3 * i), bin = x => { let k = 0; for (let i = 1; i < 21; i++) if (Math.abs(B[i] - x) < Math.abs(B[k] - x)) k = i; return k; };
    const expert = x => { let k = 0; for (let i = 1; i < 5; i++) if (Math.abs(A[i] + 0.5 * x) < Math.abs(A[k] + 0.5 * x)) k = i; return k; };
    let r, data, table, iters, lastTraj, lastName;
    const fit = () => { const C = Array.from({ length: 21 }, () => [0, 0, 0, 0, 0]); data.forEach(([x, a]) => C[bin(x)][a]++); table = C.map(c => c.some(v => v) ? c.indexOf(Math.max(...c)) : 2); };
    const roll = (pol, nz) => { let x = 0; const xs = []; for (let t = 0; t < 60; t++) { xs.push(x); x += A[pol(x)] + nz * gauss(r); } return xs; };
    const reset = () => { r = prng(6); data = []; for (let k = 0; k < 5; k++) roll(expert, 0.05).forEach(x => data.push([x, expert(x)])); fit(); iters = 0; lastTraj = null; show(); };
    const offFrac = pol => { let off = 0; for (let k = 0; k < 40; k++) roll(pol, 0.25).forEach(x => { if (Math.abs(x) > 2) off++; }); return off / 2400; };
    const show = () => { const cur = x => table[bin(x)];
      el_(root, "#dg-c").innerHTML = XH.lines([{ pts: [[0, 2], [60, 2]], color: "var(--bad)", dash: "4 3", w: 1 }, { pts: [[0, -2], [60, -2]], color: "var(--bad)", dash: "4 3", w: 1 }].concat(lastTraj ? [{ pts: lastTraj.map((x, t) => [t, x]), color: lastName === "BC" ? "var(--path)" : "var(--dr)" }] : []), { xmin: 0, xmax: 60, ymin: -5, ymax: 5 }, { x: "time (y: lateral offset; dashed = road edge)" });
      el_(root, "#dg-k").textContent = `DAgger iterations: ${iters} · labelled states: ${data.length}`;
      el_(root, "#dg-r").innerHTML = `<span>Current policy is off the road ${(100 * offFrac(cur)).toFixed(1)}% of the time (40 test drives).</span><span>${iters === 0 ? "Pure behavioural cloning: unseen offsets default to 'go straight', so one noisy drift away from the centre is never corrected (distribution shift)." : "After DAgger the training data include the learner's own off-centre states, labelled by the expert, so it has learned to recover."}</span>`; };
    el_(root, "#dg-bc").onclick = () => { lastTraj = roll(x => table[bin(x)], 0.25); lastName = iters ? "DAgger" : "BC"; show(); };
    el_(root, "#dg-it").onclick = () => { for (let k = 0; k < 5; k++) roll(x => table[bin(x)], 0.25).forEach(x => data.push([x, expert(x)])); fit(); iters++; lastTraj = roll(x => table[bin(x)], 0.25); lastName = "DAgger"; show(); };
    el_(root, "#dg-z").onclick = reset; reset(); return show;
  }
};

LABS.drIrlSorter = sorterLab("Which learning-from-humans method?", "Ways to learn without a hand-written reward: copy actions (behavioural cloning), fix the copier's distribution shift (DAgger), infer the reward (inverse RL, MaxEnt IRL), match the expert's state–action distribution adversarially (GAIL), or learn a reward from comparisons (preferences).", { bc: "Behavioural cloning", dag: "DAgger", irl: "Inverse RL", gail: "GAIL", pref: "Preference reward model" }, [

LABS.drMarlJoint = XH.calc({ p: "mrj", title: "Why multi-agent RL is hard: joint actions", cap: "In a Markov game the next state depends on the joint action of all agents. With m actions per agent and n agents there are mⁿ joint actions; a centralised Q-table or critic over joint actions explodes.",

LABS.drLagrangian = {
  title: "Safe RL: maximise reward subject to a cost budget", cap: "Three actions with (reward, cost) = (1.0, 0.9), (0.6, 0.3), (0.2, 0.0). Maximise E[R] s.t. E[C] ≤ d using a Lagrange multiplier λ: the policy ascends E[R] − λ(E[C] − d) while λ grows whenever the constraint is violated.",
  html: () => `<div class="slidergrid xh"><label for="lg-d">cost budget d <b class="num" id="lg-dv"></b><input id="lg-d" type="range" min="0" max="1" step="0.05" value="0.3"></label></div><div class="row" style="margin-top:6px">${ctrlBtns("lg")}<span class="status-pill run" id="lg-k"></span></div><div id="lg-c" style="margin-top:6px"></div><div class="readout" id="lg-r"></div>`,
  mount(root) {
    const R = [1, 0.6, 0.2], C = [0.9, 0.3, 0]; let th, lam, t, hr, hc, hl;
    const reset = () => { th = [0, 0, 0]; lam = 0; t = 0; hr = []; hc = []; hl = []; show(); };
    const step = () => { const d = +el_(root, "#lg-d").value; for (let k = 0; k < 50; k++) { const pi = XH.softmax(th), L = R.map((r, i) => r - lam * C[i]), m = pi.reduce((s, p, i) => s + p * L[i], 0); th = th.map((x, i) => x + 0.5 * pi[i] * (L[i] - m)); lam = Math.max(0, lam + 0.01 * (pi.reduce((s, p, i) => s + p * C[i], 0) - d)); t++; }
      const pi = XH.softmax(th); hr.push([t, pi.reduce((s, p, i) => s + p * R[i], 0)]); hc.push([t, pi.reduce((s, p, i) => s + p * C[i], 0)]); hl.push([t, Math.min(2, lam)]); show(); };
    const show = () => { const d = +el_(root, "#lg-d").value; el_(root, "#lg-dv").textContent = d; const pi = XH.softmax(th), X = Math.max(3000, t);
      el_(root, "#lg-c").innerHTML = XH.lines([{ pts: hr, color: "var(--dr)" }, { pts: hc, color: "var(--bad)" }, { pts: hl, color: "var(--muted)" }, { pts: [[0, d], [X, d]], color: "var(--bad)", dash: "4 3", w: 1 }], { xmin: 0, xmax: X, ymin: 0, ymax: 2 }, { x: "updates" }) + XH.legend([["var(--dr)", "E[reward]"], ["var(--bad)", "E[cost]"], ["var(--muted)", "λ (capped at 2)"], ["var(--bad)", "budget d", "4 3"]]);
      el_(root, "#lg-k").textContent = "t = " + t;
      el_(root, "#lg-r").innerHTML = `<span>π = (${pi.map(p => p.toFixed(2)).join(", ")}). Early on the policy chases reward and violates the budget; λ rises until cost comes down to d.</span><span>Report constraint violations during learning and worst cases, not just the final mean return: high reward is not evidence of safety.</span>`; };
    player(root, "lg", step, reset, 60, () => t >= 6000); el_(root, "#lg-d").addEventListener("input", reset); reset(); return show;
  }
};

LABS.drBellmanThread = XH.stepLab({ p: "blt", title: "The Bellman thread through the subject", cap: "Long-term value = immediate reward + discounted value of what follows. Each family uses this recursion differently.",
  steps: [
    { html: "<b>Definition</b>: v_π(s) = E_π[Rₜ₊₁ + γ v_π(Sₜ₊₁) | Sₜ = s]; q*(s, a) = E[Rₜ₊₁ + γ maxₐ′ q*(Sₜ₊₁, a′)]." },

LABS.drSrrvSorter = sorterLab("State, reward, return or value?", "Most RL confusions come from mixing these four objects: a state describes the situation; a reward is one immediate signal; a return accumulates future rewards; a value is the expected return under a policy.", { st: "State", rw: "Reward", rt: "Return", vl: "Value" }, [

LABS.drTargetZoo = XH.calc({ p: "tgz", title: "One transition, many targets", cap: "Transition with reward R and discount γ; the current estimate V(S) and next-state values. Methods differ only in the next-state part of their target; the TD error δ = target − current estimate drives critics and actors alike.",

LABS.drClassify = sorterLab("Which axis is this?", "Three classifications to keep separate: model-based vs model-free (is a model used to predict/simulate?), value-based vs policy-based (does the action rule come from values or a parameterised policy?), on-policy vs off-policy (does learning target the policy that generated the data?). They combine freely.", { mb: "Model-based (vs free)", vp: "Value-/policy-based axis", oo: "On-/off-policy axis" }, [

LABS.drUpdateForm = XH.calc({ p: "upf", title: "The reusable policy-update form", cap: "Δθ ∝ (quality signal) × ∇θ log πθ(Aₜ | Sₜ). The quality signal is the return (REINFORCE), the return minus a baseline (advantage), or the TD error (actor–critic). Here: two actions, uniform policy, action 1 taken, α = 0.1.",

LABS.drBanditPlay = {
  title: "Play a 5-armed bandit yourself", cap: "Each slot machine pays a noisy reward around a hidden mean. Pull arms to estimate their values (sample averages). You have 40 pulls: balance trying arms (exploration) with pulling the best-looking one (exploitation).",
  html: () => `<div class="row" id="bp-arms" style="flex-wrap:wrap;gap:6px"></div><div id="bp-q" style="margin-top:10px"></div><div class="readout" id="bp-r"></div><div class="row" style="margin-top:6px"><button class="btn sm" id="bp-auto">Let ε-greedy (ε = 0.1) play 40 pulls</button><button class="btn sm ghost" id="bp-new">New machines</button><button class="btn sm ghost" id="bp-show">Reveal true means</button></div>`,
  mount(root) {
    let r, q, Q, N, tot, t, seed = 3, reveal = false;
    const reset = () => { r = prng(seed); q = Array.from({ length: 5 }, () => +(gauss(r) * 1.2 + 1).toFixed(2)); Q = Array(5).fill(0); N = Array(5).fill(0); tot = 0; t = 0; reveal = false; draw(); };
    const pull = a => { if (t >= 40) return; const R = q[a] + gauss(r); N[a]++; Q[a] += (R - Q[a]) / N[a]; tot += R; t++; };
    const draw = () => { el_(root, "#bp-arms").innerHTML = q.map((_, a) => `<button class="btn sm${t >= 40 ? " ghost" : ""}" data-a="${a}">Arm ${a + 1}</button>`).join("");
      $$("[data-a]", root).forEach(b => b.onclick = () => { pull(+b.dataset.a); draw(); });
      const best = Math.max(...q);
      el_(root, "#bp-q").innerHTML = XH.bars(Q.map((v, a) => [`arm ${a + 1} · N=${N[a]}`, v + 2, a === Q.indexOf(Math.max(...Q)) && t ? "var(--dr)" : "var(--muted)", `Q=${v.toFixed(2)}${reveal ? ` · q*=${q[a].toFixed(2)}` : ""}`]), 7) + `<div class="small muted">bar scale −2 … +5</div>`;
      el_(root, "#bp-r").innerHTML = `<span>Pulls used: <b>${t}/40</b> · total reward <b>${tot.toFixed(1)}</b> · average ${(t ? tot / t : 0).toFixed(2)}</span><span>${t >= 40 ? `Best possible average ≈ ${best.toFixed(2)} (always pulling the best arm). Regret ≈ ${(40 * best - tot).toFixed(1)}.` : "Bars show your current estimates Q(a); green = greedy choice."}</span>`; };
    el_(root, "#bp-auto").onclick = () => { while (t < 40) { const g = Q.indexOf(Math.max(...Q)); pull(r() < 0.1 ? Math.floor(r() * 5) : (t < 5 ? t : g)); } draw(); };
    el_(root, "#bp-new").onclick = () => { seed++; reset(); }; el_(root, "#bp-show").onclick = () => { reveal = true; draw(); };
    reset(); return draw;
  }
};

LABS.drEpsGreedy = {
  title: "The 10-armed testbed: greedy vs ε-greedy", cap: "Averaged over many random 10-armed problems (q*(a) ~ N(0,1), rewards ~ N(q*(a),1)) with sample-average estimates. Pick two ε values to compare the percentage of optimal actions over time.",
  html: () => `<div class="slidergrid xh"><label for="eg-a">ε (method A) <b class="num" id="eg-av"></b><input id="eg-a" type="range" min="0" max="0.5" step="0.01" value="0"></label><label for="eg-b">ε (method B) <b class="num" id="eg-bv"></b><input id="eg-b" type="range" min="0" max="0.5" step="0.01" value="0.1"></label><label for="eg-p">problems averaged <select id="eg-p"><option>100</option><option selected>300</option><option>600</option></select></label></div><div id="eg-c"></div><div class="readout" id="eg-r"></div>`,
  mount(root) {
    const sim = (eps, P, T) => { const r = prng(42), opt = new Float64Array(T), rew = new Float64Array(T);
      for (let p = 0; p < P; p++) { const q = Array.from({ length: 10 }, () => gauss(r)), best = q.indexOf(Math.max(...q)), Q = Array(10).fill(0), N = Array(10).fill(0);
        for (let t = 0; t < T; t++) { let a; if (r() < eps) a = Math.floor(r() * 10); else { let m = -Infinity; for (let i = 0; i < 10; i++) { const v = Q[i] + r() * 1e-9; if (v > m) { m = v; a = i; } } }
          const R = q[a] + gauss(r); N[a]++; Q[a] += (R - Q[a]) / N[a]; opt[t] += a === best ? 1 : 0; rew[t] += R; } }
      const sm = (arr) => { const o = []; for (let t = 0; t < T; t += 10) { let s = 0; for (let k = t; k < t + 10; k++) s += arr[k]; o.push([t + 10, s / 10 / P]); } return o; };
      return [sm(opt), sm(rew)]; };
    const draw = () => { const a = +el_(root, "#eg-a").value, b = +el_(root, "#eg-b").value, P = +el_(root, "#eg-p").value; el_(root, "#eg-av").textContent = a; el_(root, "#eg-bv").textContent = b;
      const [oa, ra] = sim(a, P, 1000), [ob, rb] = sim(b, P, 1000);
      el_(root, "#eg-c").innerHTML = XH.lines([{ pts: oa.map(p => [p[0], p[1] * 100]), color: "var(--path)" }, { pts: ob.map(p => [p[0], p[1] * 100]), color: "var(--dr)" }], { xmin: 0, xmax: 1000, ymin: 0, ymax: 100 }, { x: "steps (y: % optimal action)", aria: "percent optimal action" }) + XH.legend([["var(--path)", "ε = " + a], ["var(--dr)", "ε = " + b]]);
      const last = arr => arr.slice(-10).reduce((s, p) => s + p[1], 0) / 10;
      el_(root, "#eg-r").innerHTML = `<span>Last 100 steps: ε=${a} → ${(100 * last(oa)).toFixed(0)}% optimal, avg reward ${last(ra).toFixed(2)}; ε=${b} → ${(100 * last(ob)).toFixed(0)}% optimal, avg reward ${last(rb).toFixed(2)}.</span><span>Greedy often locks onto a mediocre arm early. A larger ε finds the best arm sooner but keeps wasting a fraction ε of pulls forever (its ceiling is about (1 − ε) + ε/10 optimal).</span>`; };
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.drIncremental = {
  title: "Sample average vs constant step size", cap: "Feed rewards to one arm and watch two estimates: the sample average Qₙ₊₁ = Qₙ + (1/n)(Rₙ − Qₙ) and the constant-α estimate Qₙ₊₁ = Qₙ + α(Rₙ − Qₙ). The table shows how much weight each past reward gets in the constant-α estimate: α(1 − α)ⁿ⁻ⁱ, plus (1 − α)ⁿ on the initial guess Q₁.",
  html: () => `<div class="slidergrid xh"><label for="ic-a">α <b class="num" id="ic-av"></b><input id="ic-a" type="range" min="0.05" max="1" step="0.05" value="0.5"></label><label for="ic-q">initial Q₁ <b class="num" id="ic-qv"></b><input id="ic-q" type="range" min="-5" max="10" step="1" value="0"></label><label for="ic-s">reward stream <select id="ic-s"><option value="10,0,8,4">10, 0, 8, 4</option><option value="10,0,8">10, 0, 8</option><option value="1,1,1,1,5,5,5,5">1,1,1,1 then 5,5,5,5 (a change)</option></select></label></div><div id="ic-t" style="margin-top:8px"></div><div class="readout" id="ic-r"></div>`,
  mount(root) {
    const draw = () => { const a = +el_(root, "#ic-a").value, q1 = +el_(root, "#ic-q").value, Rs = el_(root, "#ic-s").value.split(",").map(Number); el_(root, "#ic-av").textContent = a; el_(root, "#ic-qv").textContent = q1;
      let s = q1, c = q1; const rows = Rs.map((R, i) => { s = i === 0 ? R : s + (R - s) / (i + 1); c = c + a * (R - c); return [i + 1, R, XH.f(s), XH.f(c)]; });
      const n = Rs.length, w = Rs.map((R, i) => a * (1 - a) ** (n - 1 - i));
      el_(root, "#ic-t").innerHTML = XH.table(["n", "Rₙ", "sample average", "constant α"], rows) + XH.table(["", "Q₁", ...Rs.map((R, i) => "R" + (i + 1) + "=" + R)], [["weight in Q" + (n + 1), XH.f((1 - a) ** n), ...w.map(x => XH.f(x))]]);
      el_(root, "#ic-r").innerHTML = `<span>Weights sum to ${XH.f((1 - a) ** n + w.reduce((x, y) => x + y, 0))}; recent rewards weigh most (an exponential recency-weighted average). The sample average ignores Q₁ (it is replaced at n = 1); the constant-α estimate keeps a bias (1 − α)ⁿ·Q₁ that fades but never vanishes.</span>`; };
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.drOptimistic = {
  title: "Optimistic initial values", cap: "Start every estimate at Q₁ = +5 (far above any real reward) and act purely greedily with α = 0.1. Each first try is a disappointment, so the agent moves on to other arms: built-in early exploration. Compare with realistic Q₁ = 0 and ε-greedy.",
  html: () => `<div class="slidergrid xh"><label for="op-q">optimistic Q₁ <b class="num" id="op-qv"></b><input id="op-q" type="range" min="0" max="10" step="1" value="5"></label><label for="op-e">ε for the realistic method <b class="num" id="op-ev"></b><input id="op-e" type="range" min="0" max="0.3" step="0.01" value="0.1"></label></div><div id="op-c"></div><div class="readout" id="op-r"></div>`,
  mount(root) {
    const sim = (q0, eps, P, T) => { const r = prng(9), opt = new Float64Array(T);
      for (let p = 0; p < P; p++) { const q = Array.from({ length: 10 }, () => gauss(r)), best = q.indexOf(Math.max(...q)), Q = Array(10).fill(q0);
        for (let t = 0; t < T; t++) { let a; if (r() < eps) a = Math.floor(r() * 10); else { let m = -Infinity; for (let i = 0; i < 10; i++) { const v = Q[i] + r() * 1e-9; if (v > m) { m = v; a = i; } } } Q[a] += 0.1 * (q[a] + gauss(r) - Q[a]); if (a === best) opt[t]++; } }
      const o = []; for (let t = 0; t < T; t += 5) { let s = 0; for (let k = t; k < t + 5; k++) s += opt[k]; o.push([t + 5, 100 * s / 5 / P]); } return o; };
    const draw = () => { const q0 = +el_(root, "#op-q").value, e = +el_(root, "#op-e").value; el_(root, "#op-qv").textContent = q0; el_(root, "#op-ev").textContent = e;
      const A = sim(q0, 0, 400, 400), B = sim(0, e, 400, 400);
      el_(root, "#op-c").innerHTML = XH.lines([{ pts: A, color: "var(--dr)" }, { pts: B, color: "var(--muted)" }], { xmin: 0, xmax: 400, ymin: 0, ymax: 100 }, { x: "steps (y: % optimal action)" }) + XH.legend([["var(--dr)", `optimistic Q₁=${q0}, greedy`], ["var(--muted)", `realistic Q₁=0, ε=${e}`]]);
      const l = arr => arr.slice(-20).reduce((s, p) => s + p[1], 0) / 20;
      el_(root, "#op-r").innerHTML = `<span>Last 100 steps: optimistic ${l(A).toFixed(0)}% vs realistic ${l(B).toFixed(0)}% optimal.</span><span>Note the early spike and dip: every arm gets tried in the first steps. The trick only helps at the start, so it is suited to stationary problems; it does nothing for exploration after the world changes.</span>`; };
    $$("input", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.drUCB = XH.calc({ p: "ucb", title: "Upper-confidence-bound selection", cap: "UCB picks Aₜ = argmaxₐ [Qₜ(a) + c √(ln t / Nₜ(a))]. The bonus is large for arms tried rarely and shrinks as an arm's count grows; ln t keeps it creeping up for arms that are neglected.",
  inputs: [["c", "exploration c", 0, 4, 0.1, 2], ["t", "time step t", 2, 1000, 1, 100], ["n1", "N(arm 1)", 1, 200, 1, 60], ["n2", "N(arm 2)", 1, 200, 1, 30], ["n3", "N(arm 3)", 1, 200, 1, 10]],
  out: v => { const Q = [1.2, 1.0, 0.6], N = [v.n1, v.n2, v.n3], B = N.map(n => v.c * Math.sqrt(Math.log(v.t) / n)), S = Q.map((q, i) => q + B[i]), k = S.indexOf(Math.max(...S));
    return XH.table(["arm", "Q(a)", "N(a)", "bonus c√(ln t/N)", "UCB score"], Q.map((q, i) => [`${i + 1}${i === k ? " ✓" : ""}`, q, N[i], XH.f(B[i]), `<b>${XH.f(S[i])}</b>`])) + `<div class="readout"><span>UCB chooses <b>arm ${k + 1}</b>${k === 0 ? " (also the greedy arm)" : " even though arm 1 has the highest estimate: its uncertainty bonus is larger"}.</span><span>c = 0 is pure greedy; large c explores a lot. Unlike ε-greedy, UCB explores <i>purposefully</i>, toward uncertain arms rather than at random.</span></div>`; } });

LABS.drGradBandit = {
  title: "Gradient bandit: learning preferences", cap: "Keep a preference Hₜ(a) per arm, act by softmax π(a) = e^{H(a)}/Σ e^{H(b)}. After reward R with baseline R̄: H(Aₜ) += α(R − R̄)(1 − π(Aₜ)); every other arm: H(a) −= α(R − R̄)π(a).",
  html: () => `<div class="slidergrid xh"><label for="gb-a">α <b class="num" id="gb-av"></b><input id="gb-a" type="range" min="0.05" max="1" step="0.05" value="0.1"></label><label for="gb-b"><input id="gb-b" type="checkbox" checked> use baseline R̄</label></div><div class="row" style="margin-top:6px">${ctrlBtns("gb")}<span class="status-pill run" id="gb-k"></span></div><div id="gb-o" style="margin-top:8px"></div><div class="readout" id="gb-r"></div>`,
  mount(root) {
    const q = [4.2, 4.8, 4.0]; let H, Rb, t, r, last;
    const reset = () => { H = [0, 0, 0]; Rb = 0; t = 0; r = prng(5); last = ""; show(); };
    const step = () => { const al = +el_(root, "#gb-a").value, base = el_(root, "#gb-b").checked, pi = XH.softmax(H); let u = r(), a = 0; while (u > pi[a] && a < 2) { u -= pi[a]; a++; }
      const R = q[a] + gauss(r); t++; if (base) Rb += (R - Rb) / t; const bl = base ? Rb : 0; H = H.map((h, i) => i === a ? h + al * (R - bl) * (1 - pi[i]) : h - al * (R - bl) * pi[i]);
      last = `Pulled arm ${a + 1}, R = ${R.toFixed(2)}, R̄ = ${bl.toFixed(2)}: ${R > bl ? "better than baseline → its preference rises, others fall" : "worse than baseline → its preference falls, others rise"}.`; show(); };
    const show = () => { el_(root, "#gb-av").textContent = el_(root, "#gb-a").value; const pi = XH.softmax(H);
      el_(root, "#gb-o").innerHTML = XH.bars(pi.map((p, i) => [`arm ${i + 1} (mean ${q[i]})`, p, i === 1 ? "var(--dr)" : "var(--muted)", `π=${p.toFixed(3)} · H=${H[i].toFixed(2)}`]), 1);
      el_(root, "#gb-k").textContent = "t = " + t; el_(root, "#gb-r").innerHTML = `<span>${last || "Press Step or Play. Arm 2 has the highest mean (4.8)."}</span><span>All rewards are around +4: without a baseline every pull looks 'good' and pushes up whatever was chosen, so learning is slow and erratic. The baseline makes the update depend on better or worse than average.</span>`; };
    player(root, "gb", step, reset, 120, () => t >= 300); el_(root, "#gb-a").addEventListener("input", show); reset(); return show;
  }
};

}
/* ---- labs_x_dr3.js ---- */
{
/* ===== DRL M3 labs: MDPs, returns, Bellman equations (noisy 3×4 grid world) ===== */
var GW = { R: 3, C: 4, wall: "1,1", exits: { "0,3": 1, "1,3": -1 }, mv: { N: [-1, 0], E: [0, 1], S: [1, 0], W: [0, -1] }, side: { N: "WE", S: "EW", E: "NS", W: "SN" }, arrow: { N: "↑", E: "→", S: "↓", W: "←" },
  states() { const o = []; for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) if (r + "," + c !== this.wall) o.push(r + "," + c); return o; },
  move(s, a) { const [r, c] = s.split(",").map(Number), nr = r + this.mv[a][0], nc = c + this.mv[a][1], k = nr + "," + nc; return nr < 0 || nr > 2 || nc < 0 || nc > 3 || k === this.wall ? s : k; },
  T(s, a, p) { p = p === undefined ? 0.8 : p; const q = (1 - p) / 2; return [[p, this.move(s, a)], [q, this.move(s, this.side[a][0])], [q, this.move(s, this.side[a][1])]]; },
  /* one sweep; mode 'rand' (equiprobable policy) or 'opt' (Bellman optimality) */
  sweep(V, mode, live, g, p) { const N = {}; this.states().forEach(s => { if (s in this.exits) { N[s] = this.exits[s]; return; }
    const qs = "NESW".split("").map(a => live + g * this.T(s, a, p).reduce((t, [pr, s2]) => t + pr * V[s2], 0)); N[s] = mode === "opt" ? Math.max(...qs) : qs.reduce((x, y) => x + y, 0) / 4; }); return N; },
  greedy(V, s, p) { let best = "N", bv = -Infinity; "NESW".split("").forEach(a => { const q = this.T(s, a, p).reduce((t, [pr, s2]) => t + pr * V[s2], 0); if (q > bv + 1e-12) { bv = q; best = a; } }); return best; },
  draw(V, opts) { opts = opts || {}; return XH.grid(3, 4, (r, c) => { const k = r + "," + c; if (k === this.wall) return { txt: "wall", bg: "var(--line)", fg: "var(--muted)" };
    if (k in this.exits) return { txt: (this.exits[k] > 0 ? "+1" : "−1") + "<br>exit", bg: this.exits[k] > 0 ? "var(--accent-soft)" : "var(--bad-soft)" };
    const v = V ? V[k] : 0; return { txt: (opts.pi ? `<span style="font-size:1.1rem">${this.arrow[opts.pi[k]]}</span><br>` : "") + (V ? XH.f(v, 2) : ""), bg: V ? XH.heat(v, opts.lo === undefined ? -1 : opts.lo, 1, "var(--dr)") : "var(--surface-2)", b: opts.hi === k ? "var(--path)" : "" }; }, opts.size || 64); }
};

LABS.drGridDyn = {
  title: "Noisy moves in grid world: p(s′ | s, a)", cap: "Pick a cell and an action. The intended move succeeds with probability p; otherwise the agent slips to either side ((1 − p)/2 each). Moving into the wall or the edge means staying put. These probabilities are the MDP's dynamics.",
  html: () => `<div class="slidergrid xh"><label for="gd-s">state <select id="gd-s">${GW.states().filter(s => !(s in GW.exits)).map(s => `<option value="${s}">row ${s.split(",")[0]}, col ${s.split(",")[1]}</option>`).join("")}</select></label><label for="gd-a">action <select id="gd-a"><option>N</option><option>E</option><option>S</option><option>W</option></select></label><label for="gd-p">success probability p <b class="num" id="gd-pv"></b><input id="gd-p" type="range" min="0.34" max="1" step="0.02" value="0.8"></label></div><div class="grid2" style="margin-top:8px"><div id="gd-g"></div><div id="gd-t"></div></div>`,
  mount(root) {
    const draw = () => { const s = el_(root, "#gd-s").value, a = el_(root, "#gd-a").value, p = +el_(root, "#gd-p").value; el_(root, "#gd-pv").textContent = p;
      const out = {}; GW.T(s, a, p).forEach(([pr, s2]) => out[s2] = (out[s2] || 0) + pr);
      el_(root, "#gd-g").innerHTML = XH.grid(3, 4, (r, c) => { const k = r + "," + c; if (k === GW.wall) return { txt: "wall", bg: "var(--line)", fg: "var(--muted)" }; const pr = out[k] || 0; return { txt: (k === s ? "you<br>" : "") + (pr ? pr.toFixed(2) : (k in GW.exits ? (GW.exits[k] > 0 ? "+1" : "−1") : "")), bg: pr ? XH.heat(pr, 0, 1, "var(--dr)") : "var(--surface-2)", b: k === s ? "var(--path)" : "" }; }, 60);
      el_(root, "#gd-t").innerHTML = XH.table(["next state s′", "p(s′ | s, " + a + ")"], Object.entries(out).map(([k, v]) => [k === s ? `${k} (stay)` : k, XH.f(v)])) + `<p class="small muted">Probabilities sum to 1. Because "North" doesn't reliably go north, planning must use expectations over s′.</p>`; };
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.drRewardSorter = sorterLab("Good reward design or a trap?", "The reward hypothesis: goals can be expressed as maximising expected cumulative reward. Rewards should say what you want achieved, not how to achieve it.", { good: "Rewards the goal", bad: "Rewards a method (trap)" }, [
  ["Chess: +1 for winning, −1 for losing, 0 otherwise", "good", "Says what is wanted (winning), leaves the how to the agent."],
  ["Chess: +1 for every piece captured", "bad", "The agent may walk into traps to grab pawns."],
  ["Vacuum: +1 per unit of dirt sucked up", "bad", "It can dump dirt and suck it up again."],
  ["Vacuum: −1 per dirty square each hour", "good", "Rewards the state you want (a clean floor)."],
  ["Maze: −1 per time step until escape", "good", "Encourages escaping quickly without prescribing a route."],
  ["Robot walker: +1 for each leg movement", "bad", "It may twitch legs in place; reward forward progress instead."],
  ["Delivery drone: +10 on correct delivery, −100 on crash", "good", "Outcome-based, with safety encoded as a penalty."],
  ["Customer support bot: +1 per message sent", "bad", "It learns to send many messages, not resolve issues."]
]);

LABS.drReturnCalc = XH.calc({ p: "rc", title: "Returns and discounting", cap: "The return Gₜ = Rₜ₊₁ + γRₜ₊₂ + γ²Rₜ₊₃ + … = Σ γᵏ Rₜ₊ₖ₊₁. The discount γ ∈ [0, 1] says how much future rewards are worth now; recursively Gₜ = Rₜ₊₁ + γGₜ₊₁.",
  inputs: [["seq", "reward sequence", [["1,2,3", "1, 2, 3"], ["3,2,1", "3, 2, 1"], ["0,0,0,0,10", "0, 0, 0, 0, 10"], ["-1,-1,-1,-1,-1,10", "−1 × 5 then 10"], ["inf1", "+1 forever (continuing)"]]], ["g", "discount γ", 0, 0.99, 0.01, 0.5], ["c", "constant c added", -2, 2, 0.5, 0]],
  out: v => { if (v.seq === "inf1") { const G = (1 + v.c) / (1 - v.g); return `<div class="formula">G = Σ γᵏ (1 + c) = (1 + c)/(1 − γ) = <b>${XH.f(G)}</b></div><div class="readout"><span>With γ = 0.9 and c = 0 this is 10. Adding c to every reward of a continuing task shifts every return by c/(1 − γ) = ${XH.f(v.c / (1 - v.g))}, so the ranking of policies is unchanged.</span></div>`; }
    const R = v.seq.split(",").map(Number).map(x => x + v.c); let G = 0; const terms = R.map((r, k) => { const w = Math.pow(v.g, k); G += w * r; return [k, XH.f(r), XH.f(w), XH.f(w * r)]; });
    const back = []; let g2 = 0; for (let k = R.length - 1; k >= 0; k--) { g2 = R[k] + v.g * g2; back.unshift(XH.f(g2)); }
    return XH.table(["k", "Rₜ₊ₖ₊₁", "γᵏ", "γᵏR"], terms) + `<div class="formula">G₀ = <b>${XH.f(G)}</b> · recursive returns G₀…G${R.length - 1}: ${back.join(", ")}</div><div class="readout"><span>${v.g === 0 ? "γ = 0: myopic, only the next reward counts." : v.g > 0.9 ? "γ near 1: far-sighted." : "Rewards further away count less."} Same rewards in reverse order give a different return: order matters when γ < 1.</span>${v.c !== 0 ? `<span>In an <b>episodic</b> task the shift depends on episode length, so adding a constant can change which policy is best (e.g. a positive living reward makes the agent avoid ending the episode).</span>` : ""}</div>`; } });

LABS.drEpisodicSorter = sorterLab("Episodic or continuing task?", "Episodic tasks break into episodes that end in a terminal state, then reset; continuing tasks go on without limit and need discounting (γ < 1) to keep returns finite.", { ep: "Episodic", cont: "Continuing" }, [
  ["A game of chess", "ep", "Ends in win, loss or draw; then a new game starts."],
  ["A thermostat controlling a building all year", "cont", "No natural end."],
  ["A robot escaping a maze", "ep", "Terminal state: the exit."],
  ["Managing a stock portfolio indefinitely", "cont", "Ongoing decisions."],
  ["One delivery trip of a drone", "ep", "Ends at delivery or crash."],
  ["A recommender system serving a website", "cont", "Interaction never stops."],
  ["Pole balancing that fails when the pole falls", "ep", "Treated as episodic with failure as terminal (−1 at failure), or continuing with discounting."]
]);

LABS.drBellmanBackup = XH.calc({ p: "bb", title: "One Bellman expectation backup", cap: "Under the equiprobable random policy (π = 0.25 for each of four moves, deterministic here, reward r), a state's value is the policy-weighted average of r + γv(s′) over its neighbours: v(s) = Σₐ π(a|s) [r + γ v(s′)].",
  inputs: [["n", "v(north)", -2, 5, 0.1, 2.3], ["e", "v(east)", -2, 5, 0.1, 0.7], ["s", "v(south)", -2, 5, 0.1, -0.4], ["w", "v(west)", -2, 5, 0.1, 0.4], ["g", "γ", 0, 1, 0.05, 0.9], ["r", "reward per move r", -1, 1, 0.1, 0]],
  out: v => { const nb = [["north", v.n], ["east", v.e], ["south", v.s], ["west", v.w]], tg = nb.map(([k, x]) => [k, v.r + v.g * x]), V = tg.reduce((s, x) => s + 0.25 * x[1], 0), best = Math.max(...tg.map(x => x[1]));
    return XH.table(["action", "π(a|s)", "v(s′)", "r + γv(s′)"], tg.map(([k, t], i) => [k, "0.25", XH.f(nb[i][1]), XH.f(t)])) + `<div class="formula">v<sub>π</sub>(s) = 0.25 × (${tg.map(x => XH.f(x[1])).join(" + ")}) = <b>${XH.f(V)}</b></div><div class="readout"><span>Expectation backup (average over the policy) = ${XH.f(V)}; an <b>optimality</b> backup would take the max instead: ${XH.f(best)}.</span><span>Default values reproduce the worked example: 0.25 × 0.9 × 3.0 = 0.675.</span></div>`; } });

LABS.drGridValues = {
  title: "Grid world: evaluate a policy or find the optimal one", cap: "Press Step to apply one sweep of Bellman backups to every state: either the expectation equation for the random policy, or the optimality equation (max over actions). Arrows show the greedy action. Try changing the living reward.",
  html: () => `<div class="slidergrid xh"><label for="gv-m">equation <select id="gv-m"><option value="opt">Bellman optimality (v*)</option><option value="rand">Bellman expectation (random policy)</option></select></label><label for="gv-l">living reward <b class="num" id="gv-lv"></b><input id="gv-l" type="range" min="-2" max="0.5" step="0.02" value="-0.04"></label><label for="gv-g">γ <b class="num" id="gv-gv"></b><input id="gv-g" type="range" min="0.5" max="1" step="0.01" value="1"></label></div><div class="row" style="margin-top:6px">${ctrlBtns("gv")}<span class="status-pill run" id="gv-k"></span></div><div class="grid2" style="margin-top:8px"><div id="gv-g2"></div><div class="readout" id="gv-r"></div></div>`,
  mount(root) {

LABS.drPolicyEvalGrid = {

LABS.drISWeight = XH.calc({ p: "isw", title: "Importance-sampling weight for one step", cap: "Off-policy: learn about a target policy π while acting with a behaviour policy b. Each step's weight is π(Aₜ|Sₜ)/b(Aₜ|Sₜ); an episode's weight is the product. A deterministic target gives π = 1 if the action matches it, 0 otherwise.",
  inputs: [["b", "b(Slow | Warm)", 0.05, 1, 0.05, 0.4], ["m", "action taken", [["slow", "Slow (matches target)"], ["fast", "Fast (target never does this)"]]], ["k", "number of matching steps in the tail", 1, 5, 1, 1]],
  out: v => { const w1 = v.m === "slow" ? 1 / v.b : 0, W = v.m === "slow" ? Math.pow(1 / v.b, v.k) : 0;
    return `<div class="formula">W = π(Slow|Warm)/b(Slow|Warm) = ${v.m === "slow" ? "1" : "0"}/${v.b} = <b>${XH.f(w1)}</b>${v.k > 1 && v.m === "slow" ? ` · product over ${v.k} such steps = <b>${XH.f(W)}</b>` : ""}</div><div class="readout"><span>${v.m === "slow" ? `Actions the behaviour policy takes rarely but the target always takes get up-weighted (×${XH.f(1 / v.b)}). Products over many steps can explode: that's the variance problem.` : "Weight 0: the target would never act like this, so this step and everything earlier in the episode contribute nothing (off-policy MC learns only from the tail where b and π agree)."}</span></div>`; } });

LABS.drUpdateZoo = XH.calc({ p: "uz", title: "Same transition, five different updates", cap: "Transition (C, Fast, +2, W). π(Fast|W) is used by Expected SARSA; Q₁(W, Fast) is the other table in Double Q. Choose the method; set the current Q-values at Warm and the next action. Each method builds a different target and moves Q(C, Fast) by α × (target − old).",
  inputs: [["m", "method", [["td0", "TD(0) on V"], ["sarsa", "SARSA"], ["esarsa", "Expected SARSA"], ["q", "Q-learning"], ["dq", "Double Q-learning"]]], ["qs", "Q(W, Slow)", -10, 20, 0.5, 0], ["qf", "Q(W, Fast)", -10, 20, 0.5, 0], ["nx", "next action actually taken", ["Slow", "Fast"]], ["pf", "π(Fast|W)", 0, 1, 0.05, 0.5], ["q1f", "Q₁(W, Fast)", -10, 20, 0.5, 5]],
  out: v => { const g = 0.9, a = 0.8, R = 2, old = 0; let target, expl;
    if (v.m === "td0") { const vw = (1 - v.pf) * v.qs + v.pf * v.qf; target = R + g * vw; expl = `TD(0) uses V(W) (here taken as the policy average ${XH.f(vw)}): V(C) ← 0 + α[2 + 0.9·V(W)]`; }
    else if (v.m === "sarsa") { const qn = v.nx === "Slow" ? v.qs : v.qf; target = R + g * qn; expl = `SARSA uses the action actually taken next (${v.nx}): Q(W, ${v.nx}) = ${XH.f(qn)}`; }
    else if (v.m === "esarsa") { const e = (1 - v.pf) * v.qs + v.pf * v.qf; target = R + g * e; expl = `Expected SARSA averages over next actions: ${XH.f(1 - v.pf)}·${v.qs} + ${XH.f(v.pf)}·${v.qf} = ${XH.f(e)}`; }
    else if (v.m === "q") { const m = Math.max(v.qs, v.qf); target = R + g * m; expl = `Q-learning uses the best next action, whatever was taken: max = ${XH.f(m)}`; }
    else { const sel = v.qf >= v.qs ? "Fast" : "Slow", ev = sel === "Fast" ? v.q1f : v.qs; target = R + g * ev; expl = `Double Q: this table selects argmax = ${sel}; the other table evaluates it: ${XH.f(ev)}${sel === "Slow" ? " (assuming both tables agree on Slow)" : ""}`; }
    const nw = old + a * (target - old);
    return `<div class="formula">target = 2 + 0.9 × (next value) = ${XH.f(target)} → Q(C, Fast) ← 0 + 0.8 × (${XH.f(target)} − 0) = <b>${XH.f(nw)}</b></div><div class="readout"><span>${expl}.</span><span>With all Q = 0 every method gives 1.6 (the worked examples). Differences appear once the next state's values differ: e.g. Q(W, Slow) = 0, Q(W, Fast) = 5 with Double Q gives 0.8 × (2 + 0.9 × 5) = 5.2.</span></div>`; } });

LABS.drRaceLearn = {
  title: "Learn the race car from experience", cap: "No model: the agent drives ε-greedy episodes from Cool (ε = 0.1, γ = 0.9, α = 0.1, episodes capped at 60 steps). Compare how each method's estimate of Q(Cool, Fast) evolves. Optimal q*(Cool, Fast) = 15.5; the ε-greedy policy itself is worth about 11.",
  html: () => `<div class="row">${ctrlBtns("rl")}<span class="status-pill run" id="rl-k"></span></div><div id="rl-c" style="margin-top:6px"></div><div id="rl-t"></div>`,
  mount(root) {
    const P = { "C,S": [[1, "C", 1]], "C,F": [[0.5, "C", 2], [0.5, "W", 2]], "W,S": [[0.5, "C", 1], [0.5, "W", 1]], "W,F": [[1, "O", -10]] };
    const M = ["MC", "SARSA", "Q-learning"], COL = ["var(--muted)", "var(--path)", "var(--dr)"]; let r, Qs, N, hist, ep;
    const fresh = () => ({ "C,S": 0, "C,F": 0, "W,S": 0, "W,F": 0, "O,S": 0, "O,F": 0 });
    const stp = (s, a) => { const u = r(); let acc = 0; for (const [p, s2, rw] of P[s + "," + a]) { acc += p; if (u <= acc) return [s2, rw]; } };
    const eg = (Q, s) => r() < 0.1 ? (r() < 0.5 ? "S" : "F") : (Q[s + ",F"] > Q[s + ",S"] ? "F" : Q[s + ",F"] < Q[s + ",S"] ? "S" : (r() < 0.5 ? "S" : "F"));
    const reset = () => { r = prng(21); Qs = M.map(fresh); N = fresh(); hist = M.map(() => [[0, 0]]); ep = 0; show(); };
    const episode = () => { ep++;
      { const Q = Qs[0]; let s = "C"; const tr = []; for (let t = 0; t < 60; t++) { const a = eg(Q, s), [s2, rw] = stp(s, a); tr.push([s, a, rw]); s = s2; if (s === "O") break; } let G = 0; const seen = {}; for (let t = tr.length - 1; t >= 0; t--) { G = tr[t][2] + 0.9 * G; seen[tr[t][0] + "," + tr[t][1]] = G; } for (const k in seen) { N[k]++; Q[k] += (seen[k] - Q[k]) / N[k]; } }
      [1, 2].forEach(m => { const Q = Qs[m]; let s = "C", a = eg(Q, s); for (let t = 0; t < 60; t++) { const [s2, rw] = stp(s, a), a2 = eg(Q, s2); const nx = m === 1 ? Q[s2 + "," + a2] : Math.max(Q[s2 + ",S"], Q[s2 + ",F"]); Q[s + "," + a] += 0.1 * (rw + 0.9 * nx - Q[s + "," + a]); if (s2 === "O") break; s = s2; a = a2; } });

LABS.drMaxBias = XH.calc({ p: "mb", title: "Maximisation bias and the double estimator", cap: "Ten actions all have true value 0. Each estimate is the average of n noisy samples. Taking the max of the estimates is biased upward; using one set of samples to pick the action and an independent set to evaluate it (the double estimator) removes the bias.",
  inputs: [["k", "number of actions", 2, 20, 1, 10], ["n", "samples per estimate", 1, 50, 1, 3], ["sd", "reward noise σ", 0.2, 3, 0.1, 1]],
  out: v => { const r = prng(77); let single = 0, dbl = 0; const T = 3000;
    for (let t = 0; t < T; t++) { const A = [], B = []; for (let i = 0; i < v.k; i++) { let a = 0, b = 0; for (let j = 0; j < v.n; j++) { a += gauss(r) * v.sd; b += gauss(r) * v.sd; } A.push(a / v.n); B.push(b / v.n); }
      const i1 = A.indexOf(Math.max(...A)); single += A[i1]; dbl += B[i1]; }
    return XH.bars([["max of estimates", single / T, "var(--bad)", XH.f(single / T)], ["double estimator", Math.abs(dbl / T), "var(--dr)", XH.f(dbl / T)], ["true max value", 0.0001, "var(--muted)", "0"]], Math.max(0.5, single / T)) + `<div class="readout"><span>Averaged over ${T} trials. The single estimator overestimates by ${XH.f(single / T)}; more actions or more noise make it worse, more samples make it smaller.</span><span>Q-learning's max over noisy Q-values has exactly this bias; Double Q-learning selects with one table and evaluates with the other.</span></div>`; } });

}

LABS.drBlackjack = {
  title: "Learn blackjack strategy with Monte Carlo control", cap: "On-policy first-visit MC control with an ε-soft policy (ε = 0.1): play hands, average the final reward (+1 win, 0 draw, −1 loss) for every state–action pair visited, act greedily on Q otherwise. The grid shows the learned policy for hands without a usable ace.",
  html: () => `<div class="row"><button class="btn primary sm" id="bj-t">Play 20,000 hands</button><button class="btn sm ghost" id="bj-z">Reset</button><span class="status-pill run" id="bj-k"></span></div><div class="grid2" style="margin-top:8px"><div id="bj-g"></div><div class="readout" id="bj-r"></div></div>`,
  mount(root) {
    let r, Q, C, hands, wins;
    const card = () => Math.min(1 + Math.floor(r() * 13), 10), tot = cs => { const s = cs.reduce((a, b) => a + b, 0), ace = cs.includes(1) && s + 10 <= 21; return [ace ? s + 10 : s, ace]; };
    const key = (s, a) => s.join(",") + "|" + a, q = (s, a) => Q[key(s, a)] || 0, greedy = s => q(s, 0) >= q(s, 1) ? 0 : 1;
    const reset = () => { r = prng(31); Q = {}; C = {}; hands = 0; wins = 0; show(); };
    const play = () => { const P = [card(), card()], D = [card(), card()]; while (tot(P)[0] < 12) P.push(card()); const tr = []; let G;
      for (;;) { const s = [tot(P)[0], D[0], tot(P)[1] ? 1 : 0], a = r() < 0.1 ? (r() < 0.5 ? 0 : 1) : greedy(s); tr.push([s, a]); if (a === 1) { P.push(card()); if (tot(P)[0] > 21) { G = -1; break; } } else break; }
      if (G === undefined) { while (tot(D)[0] < 17) D.push(card()); const p = tot(P)[0], d = tot(D)[0]; G = d > 21 || p > d ? 1 : p === d ? 0 : -1; }
      const seen = new Set(); tr.forEach(([s, a]) => { const k = key(s, a); if (seen.has(k)) return; seen.add(k); C[k] = (C[k] || 0) + 1; Q[k] = q(s, a) + (G - q(s, a)) / C[k]; }); hands++; if (G > 0) wins++; };
    const show = () => { el_(root, "#bj-g").innerHTML = `<div class="small muted">rows: player sum 21→12 · columns: dealer shows A,2…10</div>` + XH.grid(10, 10, (rr, c) => { const s = [21 - rr, c + 1, 0], st = greedy(s) === 0; return { txt: st ? "S" : "H", bg: st ? "var(--accent-soft)" : "var(--path-soft)" }; }, 26);
      el_(root, "#bj-k").textContent = hands.toLocaleString() + " hands";
      el_(root, "#bj-r").innerHTML = `<span>Win rate so far: ${hands ? (100 * wins / hands).toFixed(1) : 0}% (includes exploratory moves).</span><span>With enough hands the pattern approaches the known basic strategy: stick on 17+, stick on 13–16 against a weak dealer card (2–6), hit 12–16 against 7–A. Cells near the boundary flip with noise: Monte Carlo estimates converge slowly.</span><span>S = stick, H = hit. Each estimate is an average of actual final outcomes; no model of the card draws is used.</span>`; };
    el_(root, "#bj-t").onclick = () => { for (let i = 0; i < 20000; i++) play(); show(); }; el_(root, "#bj-z").onclick = reset; reset(); return show;
  }
};

LABS.drRhoCalc = XH.calc({ p: "rho", title: "Importance ratio for a three-step trajectory", cap: "ρ = Π π(Aₖ|Sₖ)/b(Aₖ|Sₖ). The environment's transition probabilities appear in both trajectory probabilities and cancel, so only the policies' action probabilities matter.",

LABS.drInfVar = {
  title: "The infinite-variance trap", cap: "One state; 'right' ends with reward 0; 'left' loops back (90%) or ends with +1 (10%). Target: always left, so v_π = 1. Behaviour: 50/50. Each run plots the ordinary-IS and weighted-IS estimates as episodes accumulate.",
  html: () => `<div class="row">${ctrlBtns("iv")}<span class="status-pill run" id="iv-k"></span><button class="btn sm ghost" id="iv-n">New seeds</button></div><div id="iv-c" style="margin-top:6px"></div><div class="readout" id="iv-r"></div>`,
  mount(root) {

    const show = () => { const C = ["var(--path)", "var(--bad)", "var(--dnn)"], X = Math.max(2000, n);
      el_(root, "#iv-c").innerHTML = XH.lines(runs.map((R, k) => ({ pts: R.h, color: C[k] })).concat(runs.map(R => ({ pts: R.hw, color: "var(--dr)", w: 2.5 }))).concat([{ pts: [[0, 1], [X, 1]], color: "var(--muted)", dash: "4 3", w: 1 }]), { xmin: 0, xmax: X, ymin: 0, ymax: 3 }, { x: "episodes (y: estimate of v_π(s) = 1)" }) + XH.legend([["var(--path)", "ordinary IS (3 runs)"], ["var(--dr)", "weighted IS"], ["var(--muted)", "true value 1", "4 3"]]);

      el_(root, "#iv-r").innerHTML = `<span>Ordinary IS is unbiased, yet its runs jump whenever a rare long 'left' streak arrives with weight 2^k; its variance is infinite because E[(ρG)²] = Σ 0.2·1.8ᵏ diverges. Weighted IS equals 1 from the first non-zero-weight episode.</span>`; };

};

LABS.drEss = XH.calc({ p: "ess", title: "Effective sample size of a set of weights", cap: "ESS = (Σwᵢ)² / Σwᵢ². Equal weights give ESS = n; one dominant weight gives ESS ≈ 1. Monitor it whenever you reweight data.",
  inputs: [["n", "number of episodes", 2, 50, 1, 10], ["s", "weight skew (log-normal σ)", 0, 3, 0.1, 1]],
  out: v => { const r = prng(5), W = Array.from({ length: v.n }, () => Math.exp(v.s * gauss(r))), sw = W.reduce((a, b) => a + b, 0), ess = sw * sw / W.reduce((a, b) => a + b * b, 0), mx = Math.max(...W);
    return XH.bars(W.slice(0, 12).map((w, i) => [`w${i + 1}`, w, w === mx ? "var(--bad)" : "var(--dr)", XH.f(w, 2)]), mx) + `<div class="readout"><span>ESS = <b>${XH.f(ess, 2)}</b> of ${v.n} (${(100 * ess / v.n).toFixed(0)}%). The largest weight is ${(100 * mx / sw).toFixed(0)}% of the total.</span><span>Low ESS means the estimate rests on a handful of episodes: report it, and consider clipping weights or weighted IS.</span></div>`; } });

LABS.drIncrWis = XH.stepLab({ p: "iws", title: "Incremental weighted importance sampling", cap: "No stored history: keep V and the cumulative weight C. For each new return G with weight W: C ← C + W, then V ← V + (W/C)(G − V).",
  steps: [
    { html: "Start: V = 0, C = 0." },
    { html: "Sample 1: W = 2, G = 5. C = 2; V = 0 + (2/2)(5 − 0) = <b>5</b>. The first sample sets V completely." },
    { html: "Sample 2: W = 1, G = 2. C = 3; V = 5 + (1/3)(2 − 5) = <b>4</b>." },
    { html: "Sample 3: W = 3, G = 4. C = 6; V = 4 + (3/6)(4 − 4) = <b>4</b>." },
    { html: "Check: (2·5 + 1·2 + 3·4)/(2 + 1 + 3) = 24/6 = 4. The effective step size W/C shrinks as evidence accumulates; a zero-weight sample changes nothing." }
  ] });

LABS.drOffControl = XH.stepLab({ p: "omc", title: "Off-policy MC control: the backward pass", cap: "Behaviour b is ε-soft; target π is greedy w.r.t. Q. Walk the episode backwards: G ← γG + R; C(S,A) += W; Q(S,A) += (W/C)(G − Q); π(S) ← argmax Q; if A ≠ π(S) stop; else W ← W / b(A|S).",
  boxes: ["t = 3", "t = 2", "t = 1", "t = 0"],
  steps: [
    { on: 0, html: "Last step (t = 3): W = 1. Update Q(S₃, A₃) toward G with step W/C. A₃ is greedy, so continue: W ← 1 / b(A₃|S₃) = 1/0.95 ≈ 1.05." },
    { on: 1, html: "t = 2: G grows by the reward; update Q(S₂, A₂) with W ≈ 1.05. A₂ is greedy → W ← 1.05/0.95 ≈ 1.11." },
    { on: 2, html: "t = 1: A₁ was an <b>exploratory</b> action (not argmax Q). Update Q(S₁, A₁) with the current W, then the target π would never have taken A₁: π(A₁|S₁) = 0, so all earlier weights are 0." },
    { on: 3, html: "<b>Break.</b> t = 0 is not updated. This is exact, not a heuristic: only the target-consistent tail of an episode says anything about the greedy policy." },
    { html: "Consequence: with frequent exploration early in long episodes, only the last few steps learn. Off-policy MC control can be very slow; TD-based Q-learning learns from every transition." }
  ] });

}

LABS.drTdError = XH.calc({ p: "tde", title: "One TD(0) update", cap: "TD error δₜ = Rₜ₊₁ + γV(Sₜ₊₁) − V(Sₜ). The update V(Sₜ) ← V(Sₜ) + αδₜ happens immediately after one step, using the current estimate of the next state (bootstrapping).",
  inputs: [["v", "V(Sₜ)", -2, 2, 0.05, 0.5], ["r", "reward Rₜ₊₁", -2, 2, 0.1, 1], ["v2", "V(Sₜ₊₁)", -2, 2, 0.05, 0.6], ["g", "γ", 0, 1, 0.05, 0.9], ["a", "α", 0.01, 1, 0.01, 0.1], ["t", "Sₜ₊₁ is terminal", "check"]],
  out: v => { const nxt = v.t ? 0 : v.v2, tgt = v.r + v.g * nxt, d = tgt - v.v, n = v.v + v.a * d;
    return `<div class="formula">δ = ${v.r} + ${v.g} × ${XH.f(nxt)} − ${v.v} = <b>${XH.f(d)}</b> &nbsp;→&nbsp; V(Sₜ) = ${v.v} + ${v.a} × ${XH.f(d)} = <b>${XH.f(n)}</b></div><div class="readout"><span>${v.t ? "Terminal next state: its value is 0 by definition, so the target is just the reward (as in Monte Carlo for the last step)." : "The target R + γV(S′) is itself an estimate: TD learns a guess from a guess."}</span><span>Defaults reproduce the worked example: 0.5 + 0.1 × (1 + 0.54 − 0.5) = 0.604.</span></div>`; } });

LABS.drMcTdSorter = sorterLab("Monte Carlo, TD, or both?", "Compare constant-α MC (target Gₜ) with TD(0) (target Rₜ₊₁ + γV(Sₜ₊₁)).", { mc: "Monte Carlo", td: "TD(0)", both: "Both" }, [
