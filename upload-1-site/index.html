<style>
/* Layout: left rail navigation + single reading column; lessons add a sticky section index.
   Visual world: optimisation contour maps — banded green "terrain", an orange descent path. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#14201B; --muted:#56665F; --line:#D3DDD8;
  --accent:#0A7558; --accent-soft:#D5EDE4; --accent-ink:#FFFFFF;
  --path:#C9561A; --path-soft:#F8E2D5;
  --dnn:#2D5C8C; --dnn-soft:#DCE7F2; --se:#7B4A9C; --se-soft:#EEE3F5; --dr:#866510; --dr-soft:#F3EACB; --nl:#A23B5E; --nl-soft:#F6DDE6;
  --good:#1B7F45; --warn:#9A6A10; --bad:#B23A16; --warn-soft:#F6EBD3; --bad-soft:#F7DED4;
  --code-bg:#F5F8F6; --shadow:0 1px 2px rgba(20,32,27,.06),0 4px 16px rgba(20,32,27,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#131C19; --surface-2:#1A2521; --ink:#E1EAE5; --muted:#91A39B; --line:#283631;
  --accent:#3DC498; --accent-soft:#163A2E; --accent-ink:#06120E;
  --path:#F08C4A; --path-soft:#3A2416;
  --dnn:#86AEDB; --dnn-soft:#1A2A3B; --se:#C7A3E3; --se-soft:#2A1F35; --dr:#E2C15F; --dr-soft:#2F2812; --nl:#EE93B2; --nl-soft:#3A1A26;
  --good:#55C985; --warn:#E0B04F; --bad:#F07B55; --warn-soft:#352A12; --bad-soft:#3A1E14;
  --code-bg:#0F1715; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#131C19; --surface-2:#1A2521; --ink:#E1EAE5; --muted:#91A39B; --line:#283631;
  --accent:#3DC498; --accent-soft:#163A2E; --accent-ink:#06120E;
  --path:#F08C4A; --path-soft:#3A2416;
  --dnn:#86AEDB; --dnn-soft:#1A2A3B; --se:#C7A3E3; --se-soft:#2A1F35; --dr:#E2C15F; --dr-soft:#2F2812; --nl:#EE93B2; --nl-soft:#3A1A26;
  --good:#55C985; --warn:#E0B04F; --bad:#F07B55; --warn-soft:#352A12; --bad-soft:#3A1E14;
  --code-bg:#0F1715; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.3rem);letter-spacing:-.01em}
h2{font-size:1.35rem} h3{font-size:1.1rem} h4{font-size:1rem;margin-top:1.2em}
p{margin:.6em 0}
code{font-family:var(--f-mono);font-size:.88em;overflow-wrap:anywhere;background:var(--surface-2);padding:.08em .35em;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font:500 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{display:block;font:750 1rem/1.15 var(--f-display)}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav .sub{padding-left:28px;font-size:.9rem}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav-label{margin:6px 10px 4px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sync{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.searchbtn{flex:1;min-width:0;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);cursor:pointer;text-align:left}
.searchbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.searchbtn kbd{margin-left:auto;font:500 .72rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.mobile-brand{display:none}
.content{padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:1180px}
.mnav{display:none}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .74rem/1 var(--f-mono);padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.src{background:var(--accent-soft);color:var(--ink)}
.chip.dnn{background:var(--dnn-soft);color:var(--ink)}
.chip.se{background:var(--se-soft);color:var(--ink)}
.chip.dr{background:var(--dr-soft);color:var(--ink)}
.chip.nl{background:var(--nl-soft);color:var(--ink)}
.slidergrid select{max-width:100%;min-width:0}.slidergrid input[type=text]{width:100%;max-width:100%;min-width:0;box-sizing:border-box;font:inherit;padding:4px 6px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.chip.wrapchip{white-space:normal;text-align:left;max-width:100%;height:auto;line-height:1.35}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--accent-soft);color:var(--good)}
.tag{display:inline-block;font:500 .7rem/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;border-radius:4px;vertical-align:middle}
.tag.extra{background:var(--path-soft);color:var(--path)}
.tag.slides{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.list{display:flex;flex-direction:column}
.list > *{padding:9px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.linkrow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:none;border:0;padding-left:0;padding-right:0;width:100%;text-align:left;cursor:pointer}
.linkrow:hover .t{color:var(--accent)}
.linkrow .t{font-weight:500}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:.9rem}
table.data td,table.data th,table.cmp td,table.cmp th,table.inv td,table.inv th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table th{font-weight:600;font-size:.8rem;color:var(--muted)}
table.vars td{padding:3px 12px 3px 0;vertical-align:top}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.88rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- dashboard ---------- */
.hello{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.hello p{margin:.3em 0 0;color:var(--muted)}
.tagline{font:500 .8rem var(--f-mono);letter-spacing:.06em;color:var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.continue{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px}
.continue canvas{width:100%;height:150px;border-radius:var(--r-sm)}
.continue h2{margin:6px 0 4px}
.statline{display:flex;flex-wrap:wrap;gap:6px 22px;margin:4px 0 22px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.statline div{display:flex;flex-direction:column}
.statline b{font:650 1.25rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.statline span{font-size:.78rem;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:16px}
.subj{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.subj:hover{border-color:var(--accent)}
.subj .swatch{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:750 .8rem var(--f-display)}
.subj.ml .swatch{background:var(--accent-soft);color:var(--accent)}
.subj.dnn .swatch{background:var(--dnn-soft);color:var(--dnn)}
.subj.dnn .bar i{background:var(--dnn)}
.subj.se .swatch{background:var(--se-soft);color:var(--se)}
.subj.se .bar i{background:var(--se)}
.subj.dr .swatch{background:var(--dr-soft);color:var(--dr)}
.subj.dr .bar i{background:var(--dr)}
.subj.nl .swatch{background:var(--nl-soft);color:var(--nl)}
.subj.nl .bar i{background:var(--nl)}
.subj .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}

/* ---------- subject page ---------- */
.sessions{display:flex;flex-direction:column;gap:8px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sess-head{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.sess-head .code{font:650 .9rem var(--f-mono);color:var(--muted)}
.sess-head .t{font-weight:600}
.sess-body{padding:0 14px 14px 78px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px;margin:4px 0 12px;padding:0;list-style:none;font-size:.9rem}
.topics li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.topics .pg{font:400 .78rem var(--f-mono);color:var(--muted);white-space:nowrap}

/* ---------- session ---------- */
.crumb{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.crumb button:hover{color:var(--accent)}
.s-head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.s-head .lede{max-width:70ch;color:var(--muted);margin:0}
.statusbar{display:flex;gap:6px;flex-wrap:wrap}
.stbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.stbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.stbtn.warnish[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn)}
.stbtn.badish[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;position:sticky;top:calc(57px + env(safe-area-inset-top,0px));background:var(--bg);z-index:10}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.learn{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.toc{position:sticky;top:calc(110px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:1px;font-size:.86rem;max-height:calc(100vh - 140px);overflow:auto}
.toc button{background:none;border:0;text-align:left;padding:5px 8px;border-radius:4px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.toc button:hover{background:var(--surface-2);color:var(--ink)}
.toc button.read::before{content:"✓";color:var(--accent);font-weight:700}
.toc button:not(.read)::before{content:"○";opacity:.5}
.article{min-width:0;max-width:760px}
.article section{scroll-margin-top:120px;padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.sec-head h2{flex:1;min-width:220px}
.plain{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 14px;margin:10px 0 14px;font-size:.95rem}
.plain b{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.article ul,.article ol{padding-left:1.3em}
.article li{margin:.25em 0}
ol.steps{counter-reset:s;list-style:none;padding-left:0}
ol.steps > li{counter-increment:s;padding-left:34px;position:relative;margin:.6em 0}
ol.steps > li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font:600 .75rem/22px var(--f-mono);text-align:center;color:var(--muted)}
.algo{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--path);padding:12px 16px;border-radius:var(--r-sm);margin:12px 0;font-size:.95rem}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0}
mjx-container:not([display="true"]){display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.terms div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:.88rem}
.terms b{display:block;font-weight:600}
details.deeper{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
details.deeper summary{cursor:pointer;padding:9px 14px;font-weight:500}
details.deeper > div{padding:0 14px 10px}
.introgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:28px;align-items:start}
.introgrid .panel ul{margin:0;padding-left:1.1em;font-size:.92rem}

/* ---------- interactive labs ---------- */
.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:18px 0;min-width:0}
.lab-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lab-title h4{margin:0;display:flex;gap:8px;align-items:center}
.lab-title h4::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--path);display:inline-block}
.lab canvas{display:block;width:100%;background:var(--bg);border-radius:var(--r-sm);touch-action:manipulation}
.lab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lab-grid3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:12px 0 4px;font-size:.88rem}
.ctrls label{display:flex;align-items:center;gap:8px}
.ctrls input[type=range]{width:150px;accent-color:var(--accent)}
.ctrls select,.ctrls input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.ctrls input[type=number]{width:84px}
.readout{display:flex;flex-wrap:wrap;gap:4px 18px;font:400 .82rem var(--f-mono);color:var(--muted);margin-top:8px}
.readout b{color:var(--ink);font-weight:500}
.status-pill{font:500 .75rem var(--f-mono);padding:3px 8px;border-radius:99px;background:var(--surface-2)}
.status-pill.ok{background:var(--accent-soft);color:var(--good)}
.status-pill.bad{background:var(--bad-soft);color:var(--bad)}
.status-pill.run{background:var(--path-soft);color:var(--path)}
.cap{font-size:.78rem;color:var(--muted);margin-top:4px}

    const xt=this.nice(this.o.xmin,this.o.xmax, this.w<360?4:6);
    let yt;
    if(this.o.logy){ yt=[]; const e0=Math.ceil(Math.log10(this.o.ymin)), e1=Math.floor(Math.log10(this.o.ymax)), st=Math.max(1,Math.ceil((e1-e0+1)/6)); for(let e=e0; e<=e1; e+=st) yt.push(Math.pow(10,e)); }
    else yt=this.nice(this.o.ymin,this.o.ymax,5);
    g.strokeStyle=c.line; g.fillStyle=c.muted; g.textAlign="center"; g.textBaseline="top";
    xt.forEach(v=>{ const x=this.sx(v); g.globalAlpha=.6; g.beginPath(); g.moveTo(x,this.T); g.lineTo(x,this.B); g.stroke(); g.globalAlpha=1; g.fillText(fmt(v,2), x, this.B+5); });
    g.textAlign="right"; g.textBaseline="middle";
    yt.forEach(v=>{ const y=this.sy(v); g.globalAlpha=.6; g.beginPath(); g.moveTo(this.L,y); g.lineTo(this.R,y); g.stroke(); g.globalAlpha=1; g.fillText(this.o.logy? ("1e"+Math.round(Math.log10(v))) : fmt(v,2), this.L-6, y); });
    g.strokeStyle=c.muted; g.beginPath(); g.moveTo(this.L,this.T); g.lineTo(this.L,this.B); g.lineTo(this.R,this.B); g.stroke();
    g.fillStyle=c.muted; g.textAlign="center"; g.textBaseline="bottom";
    if(xl) g.fillText(xl, (this.L+this.R)/2, this.h-2);
    if(yl){ g.save(); g.translate(11,(this.T+this.B)/2); g.rotate(-Math.PI/2); g.textBaseline="middle"; g.fillText(yl,0,0); g.restore(); }
  }
  clip(fn){ const g=this.g; g.save(); g.beginPath(); g.rect(this.L,this.T,this.R-this.L,this.B-this.T); g.clip(); fn(g); g.restore(); }
  line(pts, color, w=2, dash){ this.clip(g=>{ g.strokeStyle=color; g.lineWidth=w; g.setLineDash(dash||[]); g.beginPath(); let started=false; pts.forEach(([x,y])=>{ if(!isFinite(y)){started=false;return;} const X=this.sx(x),Y=this.sy(y); if(!started){g.moveTo(X,Y);started=true;} else g.lineTo(X,Y); }); g.stroke(); g.setLineDash([]); }); }
  fn(f, color, w=2, dash, n=200){ const pts=[]; for(let i=0;i<=n;i++){ const x=this.o.xmin+(this.o.xmax-this.o.xmin)*i/n; pts.push([x,f(x)]); } this.line(pts,color,w,dash); }
  dots(pts, color, r=3.5, stroke){ this.clip(g=>{ pts.forEach(([x,y])=>{ g.beginPath(); g.arc(this.sx(x),this.sy(y),r,0,7); g.fillStyle=color; g.fill(); if(stroke){g.strokeStyle=stroke;g.lineWidth=1.5;g.stroke();} }); }); }
  text(x,y,s,color,align="left"){ const g=this.g; g.fillStyle=color||this.col.ink; g.textAlign=align; g.textBaseline="middle"; g.fillText(s,this.sx(x),this.sy(y)); }
}
function hexToRgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function mix(a,b,t){ return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }

/* Small linear-algebra helpers */
function solve(A, b){ // Gaussian elimination with partial pivoting; returns null if singular
  const n=A.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    if(Math.abs(M[p][c])<1e-12) return null; [M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]/M[c][c]; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }
  return M.map((r,i)=>r[n]/r[i]);
}

    root.querySelector("#ne-add").onclick=()=>{ const last=rows[rows.length-1]||[0,0]; rows.push([last[0]+1,last[1]+1]); renderTable(); calc(); };
    root.querySelector("#ne-reset").onclick=()=>{ rows=def.map(r=>r.slice()); renderTable(); calc(); };

  }
};

LABS.gdLab = {
  title: "Gradient descent lab", cap: "Synthetic house data: size (1000 sq ft) vs price ($100k), 40 points. Click the contour map to choose a starting point.",
  html: () => `<div class="lab-grid"><canvas id="gd-c" style="height:300px;cursor:crosshair" aria-label="Cost contour map with descent path"></canvas><div class="stack" style="gap:8px;min-width:0"><canvas id="gd-d" style="height:146px" aria-label="Data and current fit"></canvas><canvas id="gd-l" style="height:146px" aria-label="Cost per iteration"></canvas></div></div>
  <div class="ctrls">
    <label for="gd-a">α <input id="gd-a" type="range" min="-3" max="0.4" step="0.01" value="-1"> <b class="num" id="gd-av">0.1</b></label>
    <label for="gd-v">Variant <select id="gd-v"><option value="batch">Batch</option><option value="mini">Mini-batch (m=8)</option><option value="sgd">Stochastic</option></select></label>
    <label><input id="gd-s" type="checkbox"> Scale feature (standardise)</label>
  </div>
  <div class="row"><button class="btn primary sm" id="gd-play">Run</button><button class="btn sm" id="gd-step">Step</button><button class="btn sm" id="gd-10">+10</button><button class="btn sm ghost" id="gd-reset">Reset</button><span class="status-pill" id="gd-st">ready</span></div>
  <div class="readout" id="gd-r"></div>`,
  mount(root){
    const r=prng(7), n=40, X=[], Y=[]; for(let i=0;i<n;i++){ const x=0.8+2.7*r(); X.push(x); Y.push(0.5+1.15*x+0.35*gauss(r)); }
    const mx=X.reduce((a,b)=>a+b)/n, sd=Math.sqrt(X.reduce((a,b)=>a+(b-mx)**2,0)/n);
    const el=id=>root.querySelector(id);
    let S={}, scaled=false, theta, start, path, losses, it, timer=null, order=[], ptr=0;
    const feats=()=> scaled? X.map(x=>(x-mx)/sd) : X;
    const stats=()=>{ const F=feats(); S={n, sx:F.reduce((a,b)=>a+b,0), sxx:F.reduce((a,b)=>a+b*b,0), sy:Y.reduce((a,b)=>a+b,0), sxy:F.reduce((a,b,i)=>a+b*Y[i],0), syy:Y.reduce((a,b)=>a+b*b,0)}; const det=n*S.sxx-S.sx*S.sx; S.opt=[(S.sxx*S.sy-S.sx*S.sxy)/det,(n*S.sxy-S.sx*S.sy)/det]; };
    const J=(a,b)=>(a*a*S.n+2*a*b*S.sx+b*b*S.sxx-2*a*S.sy-2*b*S.sxy+S.syy)/(2*S.n);
    const view=()=>({xmin:S.opt[0]-3.5,xmax:S.opt[0]+3.5,ymin:S.opt[1]-2.2,ymax:S.opt[1]+2.2});
    const alpha=()=>Math.pow(10,+el("#gd-a").value);
    const reset=(keepStart)=>{ stop(); stats(); if(!keepStart) start=[S.opt[0]-2.6,S.opt[1]+1.5]; theta=start.slice(); path=[theta.slice()]; losses=[J(...theta)]; it=0; ptr=0; order=[]; drawAll(); };
    const shuffle=()=>{ order=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; } ptr=0; };
    const stepOnce=()=>{ const F=feats(), v=el("#gd-v").value; let idx;
      if(v==="batch") idx=[...Array(n).keys()]; else { const m=v==="mini"?8:1; if(ptr+m>order.length) shuffle(); idx=order.slice(ptr,ptr+m); ptr+=m; }
      let g0=0,g1=0; idx.forEach(i=>{ const e=theta[0]+theta[1]*F[i]-Y[i]; g0+=e; g1+=e*F[i]; }); g0/=idx.length; g1/=idx.length;
      const a=alpha(); const prev=theta.slice(); theta=[theta[0]-a*g0, theta[1]-a*g1]; it++; path.push(theta.slice()); losses.push(J(...theta));
      return Math.hypot(theta[0]-prev[0],theta[1]-prev[1]); };
    const status=(d)=>{ const st=el("#gd-st"), Jc=losses[losses.length-1];
      if(!isFinite(Jc)||Jc>1e6||Math.abs(theta[0])>1e4){ st.className="status-pill bad"; st.textContent="diverging: lower α"; return "div"; }
      if(el("#gd-v").value==="batch" && d!==undefined && d<1e-5){ st.className="status-pill ok"; st.textContent="converged ‖Δθ‖ < 1e-5"; return "conv"; }
      if(losses.length>2 && losses[losses.length-1]>losses[losses.length-2]*1.0001 && el("#gd-v").value==="batch"){ st.className="status-pill bad"; st.textContent="J increased: α too large"; return "up"; }
      st.className="status-pill run"; st.textContent= timer? "running" : "paused"; return "ok"; };
    const run=k=>{ let d; for(let i=0;i<k;i++){ d=stepOnce(); const s=status(d); if(s==="div"||s==="conv"){ stop(); break; } } drawAll(); return d; };
    const stop=()=>{ if(timer){ clearInterval(timer); timer=null; } const b=el("#gd-play"); if(b) b.textContent="Run"; };
    el("#gd-play").onclick=()=>{ if(timer){ stop(); status(); return; } if(it>=400) reset(true); el("#gd-play").textContent="Pause"; timer=setInterval(()=>{ run(1); if(it>=400) stop(); },40); };
    el("#gd-step").onclick=()=>{ stop(); run(1); }; el("#gd-10").onclick=()=>{ stop(); run(10); };
    el("#gd-reset").onclick=()=>reset(true);
    el("#gd-a").oninput=()=>{ el("#gd-av").textContent=fmt(alpha(),3); };
    el("#gd-a").onchange=()=>reset(true);
    el("#gd-v").onchange=()=>reset(true);
    el("#gd-s").onchange=e=>{ scaled=e.target.checked; reset(false); };
    el("#gd-c").addEventListener("click",ev=>{ const rect=ev.target.getBoundingClientRect(); const p=new Plot(el("#gd-c"),view()); start=[p.ix(ev.clientX-rect.left),p.iy(ev.clientY-rect.top)]; reset(true); });
    let bandCache=null;
    const drawContour=()=>{ const v=view(); const p=new Plot(el("#gd-c"),Object.assign({},v)); const g=p.g;
      const W=Math.max(2,Math.round(p.R-p.L)), H=Math.max(2,Math.round(p.B-p.T)), res=2, gw=Math.ceil(W/res), gh=Math.ceil(H/res);
      const key=[scaled,W,H,p.col.accent,p.col.bg].join("|");
      if(!bandCache||bandCache.key!==key){
        const off=document.createElement("canvas"); off.width=gw; off.height=gh; const og=off.getContext("2d"), img=og.createImageData(gw,gh);
        const Jmin=J(...S.opt), bg=hexToRgb(p.col.bg), ac=hexToRgb(p.col.accent);
        for(let j=0;j<gh;j++) for(let i=0;i<gw;i++){ const a=v.xmin+(i+.5)/gw*(v.xmax-v.xmin), b=v.ymax-(j+.5)/gh*(v.ymax-v.ymin);
          const lv=Math.floor(Math.log2(1+(J(a,b)-Jmin)/0.02)); const t=Math.max(0,0.62-lv*0.055)*(lv%2?0.75:1);
          const c=mix(bg,ac,t), k=(j*gw+i)*4; img.data[k]=c[0]; img.data[k+1]=c[1]; img.data[k+2]=c[2]; img.data[k+3]=255; }
        og.putImageData(img,0,0); bandCache={key,off};
      }
      g.imageSmoothingEnabled=true; g.drawImage(bandCache.off,p.L,p.T,W,H);
      p.axes(scaled?"θ₀ (scaled x)":"θ₀","θ₁");
      p.line(path,p.col.path,2); p.dots(path.slice(-60),p.col.path,2.6); p.dots([start],p.col.ink,5,p.col.bg); p.dots([theta],p.col.path,5.5,p.col.bg);
      p.text(S.opt[0],S.opt[1],"＋",p.col.ink,"center");
    };
    const drawData=()=>{ const p=new Plot(el("#gd-d"),{xmin:0.6,xmax:3.7,ymin:0,ymax:6,pad:{l:36,r:8,t:8,b:26}}); p.axes("size (1000 sq ft)","");
      p.dots(X.map((x,i)=>[x,Y[i]]),p.col.muted,2.6); p.fn(x=> scaled? theta[0]+theta[1]*(x-mx)/sd : theta[0]+theta[1]*x, p.col.path,2.5); };
    const drawLoss=()=>{ const top=Math.max(...losses.filter(isFinite).slice(0,1), 1), mn=Math.min(...losses.filter(isFinite));
      const p=new Plot(el("#gd-l"),{xmin:0,xmax:Math.max(20,it),ymin:Math.max(1e-3,Math.min(mn,J(...S.opt))*0.8),ymax:Math.min(1e7,Math.max(top*2,...losses.filter(isFinite).map(x=>x*1.2))),logy:true,pad:{l:36,r:8,t:8,b:26}}); p.axes("iteration","");
      p.line([[0,J(...S.opt)],[p.o.xmax,J(...S.opt)]],p.col.accent,1,[4,3]); p.line(losses.map((l,i)=>[i,l]),p.col.path,2); };
    const drawAll=()=>{ drawContour(); drawData(); drawLoss();
      const Jc=losses[losses.length-1];
      el("#gd-r").innerHTML=`<span>iteration <b>${it}</b></span><span>θ = (<b>${fmt(theta[0])}</b>, <b>${fmt(theta[1])}</b>)</span><span>J = <b>${fmt(Jc,4)}</b></span><span>optimum J = <b>${fmt(J(...S.opt),4)}</b></span><span>stable if α &lt; <b>${fmt(stableAlpha(),3)}</b> (batch)</span>`; };
    const stableAlpha=()=>{ const a=1, b=S.sx/S.n, c=S.sxx/S.n; const lmax=((a+c)+Math.sqrt((a-c)**2+4*b*b))/2; return 2/lmax; };
    reset(false); el("#gd-av").textContent=fmt(alpha(),3); status();
    return ()=>{ bandCache=null; drawAll(); };
  }
};

const ctrlBtns = (p) => `<button class="btn primary sm" id="${p}-play">Play</button><button class="btn sm" id="${p}-step">Step</button><button class="btn sm ghost" id="${p}-reset">Reset</button>`;
function player(root, p, stepFn, resetFn, ms = 450, isDone = () => false){
  let t = null; const playBtn = el_(root, `#${p}-play`);
  const stop = () => { if (t) { clearInterval(t); t = null; } playBtn.textContent = "Play"; };
  playBtn.onclick = () => { if (t) { stop(); return; } if (isDone()) resetFn(); playBtn.textContent = "Pause"; t = setInterval(() => { stepFn(); if (isDone()) stop(); }, ms); };

}
function polyFit(xs, ys, M, l){
  const n = xs.length, raw = xs.map(x => { const u = 2*x-1; return Array.from({length:M}, (_, j) => Math.pow(u, j+1)); });
  const mu = Array.from({length:M}, (_, j) => raw.reduce((a, r) => a + r[j], 0) / n), sg = Array.from({length:M}, (_, j) => Math.sqrt(raw.reduce((a, r) => a + (r[j]-mu[j])**2, 0) / n) || 1);
  const Phi = raw.map(r => [1, ...r.map((v, j) => (v-mu[j]) / sg[j])]), d = M + 1;
  const A = Array.from({length:d}, (_, i) => Array.from({length:d}, (_, j) => Phi.reduce((a, r) => a + r[i]*r[j], 0) + (i===j && i>0 ? n*l + 1e-10 : 0)));
  const b = Array.from({length:d}, (_, i) => Phi.reduce((a, r, k) => a + r[i]*ys[k], 0));
  const w = solve(A, b) || Array(d).fill(0);
  return { w, pred: x => { const u = 2*x-1; let s = w[0]; for (let j = 0; j < M; j++) s += w[j+1] * (Math.pow(u, j+1) - mu[j]) / sg[j]; return s; } };
}
const sigm = z => 1 / (1 + Math.exp(-z));

LABS.hillBall = {

  <span class="row">${ctrlBtns("hb")}</span></div>

      al <= 1.05 ? ["Lands at the bottom in one jump", "On this bowl a learning rate of 1 is exactly the right step size."] :
      al < 1.95 ? ["Overshooting, but still settling", "Each jump lands on the other side of the valley, a bit closer each time. Training would look noisy but still converge."] :
      al <= 2.05 ? ["Bouncing forever", "At exactly 2 the ball jumps between the same two points and never settles."] :

      p.axes("knob setting w", "error J(w)"); p.fn(J, p.col.accent, 2.5);
      p.text(3, 1.2, "lowest error", p.col.muted, "center");

        p.clip(G => { G.strokeStyle = p.col.path; G.globalAlpha = .55; G.setLineDash([4, 3]); G.beginPath(); const mx = (x0 + x1) / 2, top = Math.max(J(x0), J(x1)) + 1.5;
          G.moveTo(p.sx(x0), p.sy(J(x0))); G.quadraticCurveTo(p.sx(mx), p.sy(top), p.sx(x1), p.sy(J(x1))); G.stroke(); G.setLineDash([]); G.globalAlpha = 1; }); }
      p.dots(hist.slice(0, -1).filter(x => Math.abs(x) < 50).map(x => [x, J(x)]), p.col.path, 3);
      const bx = shown, by = J(bx); const R = 9; const X = p.sx(bx), Y = p.sy(by) - R; if (X > p.L - 20 && X < p.R + 20 && Y > p.T - 20) { gfx.beginPath(); gfx.arc(X, Y, R, 0, 7); gfx.fillStyle = p.col.path; gfx.fill(); gfx.strokeStyle = p.col.bg; gfx.lineWidth = 2; gfx.stroke(); }

    };
    const start = { v: -2 };
    const reset = () => { if (anim) cancelAnimationFrame(anim); w = start.v; hist = [w]; shown = w; draw(); };
    const step = () => { if (Math.abs(w) > 60) return; const nw = w - a() * g(w); const from = w; w = nw; hist.push(w);

LABS.variantsRace = {

  html: () => `<canvas id="vr-c" style="height:300px" aria-label="Three descent paths"></canvas><div class="row" style="margin-top:8px">${ctrlBtns("vr")}<span class="legend"><i style="background:var(--accent)"></i>Batch (all 64)<i style="background:var(--dnn)"></i>Mini-batch (8)<i style="background:var(--path)"></i>Stochastic (1)</span></div><div class="readout" id="vr-r"></div>`,
  mount(root){

function net221(o){
  const f = { x: [o.x1, o.x2], y: o.y }; f.z1 = [0, 1].map(j => f.x[0]*o.W1[0][j] + f.x[1]*o.W1[1][j] + o.b1[j]); f.h1 = f.z1.map(sigm);

  f.d1 = [0, 1].map(j => f.d2*o.W2[j]*f.h1[j]*(1 - f.h1[j])); f.gW1 = [[f.x[0]*f.d1[0], f.x[0]*f.d1[1]], [f.x[1]*f.d1[0], f.x[1]*f.d1[1]]]; f.gb1 = f.d1.slice();
  return f;
}

  edges.forEach(([a, b, w, gk, idx]) => { const g = f && (idx.length === 2 ? f[gk][idx[0]][idx[1]] : f[gk][idx[0]]); const back = opts.phase === "back" || opts.phase === "update";
    G.strokeStyle = back ? p.col.path : (w >= 0 ? p.col.accent : p.col.dnn); G.lineWidth = back && g !== undefined ? 1 + Math.min(10, Math.abs(g) * 40) : 1 + Math.min(7, Math.abs(w) * 3); G.globalAlpha = .75;

LABS.thresholdClassifier = {
  title: "The simplest classifier: one threshold", cap: "Illustrative tumour sizes in the style of the worked example. Orange = malignant, blue = benign. Rule: size above T ⇒ malignant.",
  html: () => `<canvas id="tc-c" style="height:200px" aria-label="Threshold on tumour size"></canvas><div class="ctrls"><label for="tc-t">Threshold T <input id="tc-t" type="range" min="0" max="10" step="0.1" value="3"> <b class="num" id="tc-tv"></b></label><button class="btn sm" id="tc-best">Find the best T</button></div><div class="readout" id="tc-r"></div>`,
  mount(root){

      p.clip(G => { G.fillStyle = p.col.path; G.globalAlpha = .1; G.fillRect(p.sx(T), p.T, p.R - p.sx(T), p.B - p.T); G.globalAlpha = 1; });
      p.line([[T, -0.5], [T, 1.5]], p.col.ink, 2, [5, 4]); p.text(T + 0.1, 1.35, "malignant →", p.col.path);
      B.forEach(x => p.dots([[x, 0]], p.col.dnn, 6, x > T ? p.col.bad : p.col.bg)); M.forEach(x => p.dots([[x, 1]], p.col.path, 6, x <= T ? p.col.bad : p.col.bg));

      const e = errs(T); el_(root, "#tc-r").innerHTML = `<span>mistakes <b>${e}</b> of ${B.length + M.length}</span><span>accuracy <b>${Math.round(100 * (1 - e / (B.length + M.length)))}%</b></span><span>benign called malignant <b>${B.filter(x => x > T).length}</b></span><span>malignant missed <b>${M.filter(x => x <= T).length}</b></span>`; };

LABS.trainTest = {

  html: () => `<canvas id="tt-c" style="height:230px" aria-label="Train and test split"></canvas><div class="ctrls"><label for="tt-n">Training points <input id="tt-n" type="range" min="6" max="60" step="2" value="12"> <b class="num" id="tt-nv"></b></label><button class="btn sm" id="tt-s">New random split</button></div><div class="readout" id="tt-r"></div>`,
  mount(root){

/* Shared: shade a plot region cell by cell without seams. fn(x, y) returns a CSS colour token value or null. */
function shadeGrid(p, n, fn, alpha = 0.16){

  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const x = p.o.xmin + (p.o.xmax - p.o.xmin) * (i + .5) / n, y = p.o.ymax - (p.o.ymax - p.o.ymin) * (j + .5) / n, c = fn(x, y); if (c) { g.fillStyle = c; g.fillRect(i, j, 1, 1); } }

/* ===== ML M10 labs: clustering and mixtures ===== */
function blobs_(seed, specs){ const r = prng(seed), out = []; specs.forEach(([cx, cy, s, n], k) => { for (let i = 0; i < n; i++) out.push([cx + s * gauss(r), cy + s * gauss(r), k]); }); return out; }
function kmeansRun(P, K, seed, iters = 50){ const r = prng(seed); let mu = []; const idx = new Set(); while (mu.length < K) { const i = Math.floor(r() * P.length); if (!idx.has(i)) { idx.add(i); mu.push([P[i][0], P[i][1]]); } }
  let lab = []; for (let t = 0; t < iters; t++) { lab = P.map(p => { let b = 0, bd = Infinity; mu.forEach((m, k) => { const d = (p[0] - m[0]) ** 2 + (p[1] - m[1]) ** 2; if (d < bd) { bd = d; b = k; } }); return b; });
    const nm = mu.map((m, k) => { const S = P.filter((_, i) => lab[i] === k); return S.length ? [S.reduce((a, p) => a + p[0], 0) / S.length, S.reduce((a, p) => a + p[1], 0) / S.length] : m; }); if (nm.every((m, k) => m[0] === mu[k][0] && m[1] === mu[k][1])) break; mu = nm; }
  const sse = P.reduce((s, p, i) => s + (p[0] - mu[lab[i]][0]) ** 2 + (p[1] - mu[lab[i]][1]) ** 2, 0); return { mu, lab, sse }; }
const CLC = p => [p.col.path, p.col.dnn, p.col.accent, p.col.ink, p.col.bad, p.col.muted];
LABS.kmeansStepper = {
  title: "K-means, one step at a time", cap: "E-step: assign every point to its nearest centre. M-step: move each centre to the mean of its points. J (the sum of squared distances) can only go down. Click the plot to place a centre yourself.",
  html: () => `<canvas id="km-c" style="height:320px;cursor:crosshair" aria-label="K-means clustering"></canvas><div class="ctrls"><label for="km-k">K <input id="km-k" type="range" min="1" max="6" step="1" value="3"> <b class="num" id="km-kv"></b></label><label for="km-d">Data <select id="km-d"><option value="3">3 blobs</option><option value="4">4 blobs</option><option value="g">Weight vs glucose</option></select></label></div>
  <div class="row"><button class="btn sm" id="km-e">E-step (assign)</button><button class="btn sm" id="km-m">M-step (move centres)</button><button class="btn sm" id="km-run">Run to convergence</button><button class="btn sm ghost" id="km-r">Random restart</button></div><div class="readout" id="km-o"></div>`,
  mount(root){

    const init = () => { const K = +el_(root, "#km-k").value, r = prng(seed); if (el_(root, "#km-d").value === "g") { mu = [GL[0].slice(), GL[1].slice()].slice(0, K); while (mu.length < K) mu.push(GL[mu.length].slice()); } else { mu = []; for (let k = 0; k < K; k++) { const p = P[Math.floor(r() * P.length)]; mu.push([p[0], p[1]]); } } lab = null; step = 0; msg = el_(root, "#km-d").value === "g" ? "Worked example: candidates 1 and 2 are the initial centroids (set K = 2)." : "Random initial centres."; };
    const J = () => lab ? P.reduce((s, p, i) => s + (p[0] - mu[lab[i]][0]) ** 2 + (p[1] - mu[lab[i]][1]) ** 2, 0) : NaN;
    const E = () => { const old = lab ? lab.join() : ""; lab = P.map(p => { let b = 0, bd = Infinity; mu.forEach((m, k) => { const d = (p[0] - m[0]) ** 2 + (p[1] - m[1]) ** 2; if (d < bd) { bd = d; b = k; } }); return b; }); step++; return old !== lab.join(); };
    const M = () => { if (!lab) E(); let moved = false; mu = mu.map((m, k) => { const S = P.filter((_, i) => lab[i] === k); if (!S.length) return m; const n = [S.reduce((a, p) => a + p[0], 0) / S.length, S.reduce((a, p) => a + p[1], 0) / S.length]; if (Math.hypot(n[0] - m[0], n[1] - m[1]) > 1e-9) moved = true; return n; }); step++; return moved; };
    const draw = () => { el_(root, "#km-kv").textContent = el_(root, "#km-k").value; const p = new Plot(el_(root, "#km-c"), box()), C = CLC(p); p.axes(el_(root, "#km-d").value === "g" ? "weight" : "x₁", el_(root, "#km-d").value === "g" ? "glucose" : "x₂");

      mu.forEach((m, k) => { const G = p.g, x = p.sx(m[0]), y = p.sy(m[1]); G.strokeStyle = p.col.bg; G.lineWidth = 5; G.beginPath(); G.moveTo(x - 8, y - 8); G.lineTo(x + 8, y + 8); G.moveTo(x + 8, y - 8); G.lineTo(x - 8, y + 8); G.stroke(); G.strokeStyle = C[k % 6]; G.lineWidth = 3; G.stroke(); });
      el_(root, "#km-o").innerHTML = `<span>steps <b>${step}</b></span><span>J = Σ‖x − μ‖² = <b>${isNaN(J()) ? "—" : J().toFixed(2)}</b></span><span>centres: ${mu.map(m => `(${m[0].toFixed(2)}, ${m[1].toFixed(2)})`).join(" ")}</span><span>${msg}</span>`; };
    el_(root, "#km-e").onclick = () => { msg = E() ? "Points reassigned." : "No point changed cluster."; draw(); };
    el_(root, "#km-m").onclick = () => { msg = M() ? "Centres moved to the means." : "Centres did not move: converged."; draw(); };
    el_(root, "#km-run").onclick = () => { let n = 0; while (n < 100) { const a = E(), b = M(); n++; if (!a && !b) break; } msg = `Converged after ${n} E+M rounds.`; draw(); };

  }

LABS.softHard = {
  title: "Hard vs soft assignment", cap: "Pixel intensities from two overlapping groups (dark and bright). K-means gives each pixel 0 or 1; a Gaussian mixture gives a probability that changes smoothly across the border.",
  html: () => `<canvas id="sh-c" style="height:280px" aria-label="Hard and soft memberships"></canvas><div class="ctrls"><label for="sh-x">Intensity x <input id="sh-x" type="range" min="0" max="255" step="1" value="150"> <b class="num" id="sh-xv"></b></label><label for="sh-s">Overlap (σ) <input id="sh-s" type="range" min="10" max="60" step="1" value="30"> <b class="num" id="sh-sv"></b></label></div><div class="readout" id="sh-r"></div>`,
  mount(root){
    const m1 = 100, m2 = 190, N = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s)) / (s * Math.sqrt(2 * Math.PI));
    const draw = () => { const x = +el_(root, "#sh-x").value, s = +el_(root, "#sh-s").value; el_(root, "#sh-xv").textContent = x; el_(root, "#sh-sv").textContent = s;
      const p = new Plot(el_(root, "#sh-c"), { xmin: 0, xmax: 255, ymin: 0, ymax: 1.05 }); p.axes("intensity", "membership in 'bright'"); const g = t => { const a = 0.5 * N(t, m2, s), b = 0.5 * N(t, m1, s); return a / (a + b); };
      p.fn(t => 0.9 * N(t, m1, s) / N(m1, m1, s), p.col.line, 1, [3, 3]); p.fn(t => 0.9 * N(t, m2, s) / N(m2, m2, s), p.col.line, 1, [3, 3]);

LABS.gmmEM = {
  title: "EM for a Gaussian mixture", cap: "E-step: each point's colour mixes the components by responsibility γ. M-step: weights, means and covariances are re-estimated from those soft counts. The log-likelihood never decreases.",
  html: () => `<canvas id="gm-c" style="height:330px" aria-label="Gaussian mixture EM"></canvas><div class="ctrls"><label for="gm-k">Components K <input id="gm-k" type="range" min="1" max="4" step="1" value="3"> <b class="num" id="gm-kv"></b></label></div><div class="row"><button class="btn sm" id="gm-s">One EM iteration</button><button class="btn sm" id="gm-20">20 iterations</button><button class="btn sm ghost" id="gm-r">Re-initialise</button></div><div class="readout" id="gm-o"></div>`,
  mount(root){
    const P = blobs_(31, [[-2.5, -1.5, 0.8, 60], [2, -2, 0.6, 50], [0.5, 2.5, 1.1, 70]]).map(q => [q[0] + (q[2] === 2 ? 0.6 * q[1] - 1.5 : 0), q[1]]); let K, pi, mu, S, g, it, LL, seed = 3;

    const estep = () => { let ll = 0; g = P.map(x => { const w = mu.map((m, k) => pi[k] * mvn2(x, m, S[k])), s = w.reduce((a, b) => a + b) || 1e-300; ll += Math.log(s); return w.map(v => v / s); }); return ll; };

LABS.kmeansLimits = {

  html: () => `<canvas id="sp-c" style="height:280px" aria-label="Coefficient bars"></canvas><div class="ctrls"><label for="sp-l">λ <input id="sp-l" type="range" min="-3" max="0.7" step="0.05" value="-1"> <b class="num" id="sp-lv"></b></label><label for="sp-t">Penalty <select id="sp-t"><option value="l1">L1 (lasso)</option><option value="l2">L2 (ridge)</option></select></label></div><div class="readout" id="sp-r"></div>`,

LABS.outlierLab = {
  title: "Outlier fences: IQR vs 3-sigma", cap: "Quartiles use the lesson's (n+1)/4 position rule. Red points fall outside the fences.",
  html: () => `<div class="ctrls"><label for="ol-d" style="flex:1;min-width:220px">Data <input id="ol-d" type="text" value="10, 11, 11, 11, 12, 12, 13, 14, 14, 15, 17, 22" style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-family:var(--f-mono)"></label></div>
  <canvas id="ol-c" style="height:200px" aria-label="Dot plot with fences"></canvas>
  <div class="ctrls"><div class="seg" id="ol-m"><button data-m="iqr" aria-pressed="true">IQR fence</button><button data-m="sig" aria-pressed="false">3-sigma</button></div><label for="ol-k">Multiplier <input id="ol-k" type="range" min="0.5" max="4" step="0.1" value="1.5"> <b class="num" id="ol-kv"></b></label><button class="btn sm" id="ol-add">Add 500</button><button class="btn sm ghost" id="ol-raw">Use the raw list (with 2)</button></div><div class="readout" id="ol-r"></div>`,
  mount(root){
    let m = "iqr";
    const q = (s, pos) => { const n = s.length, lo = Math.floor(pos), f = pos - lo; if (lo < 1) return s[0]; if (lo >= n) return s[n - 1]; return s[lo - 1] + f * (s[lo] - s[lo - 1]); };
    const draw = () => { const x = el_(root, "#ol-d").value.split(/[,\s]+/).map(Number).filter(Number.isFinite); const k = +el_(root, "#ol-k").value; el_(root, "#ol-kv").textContent = k.toFixed(1);
      if (x.length < 4) { el_(root, "#ol-r").textContent = "Enter at least four numbers."; return; }
      const s = [...x].sort((a, b) => a - b), n = s.length, q1 = q(s, (n + 1) / 4), q3 = q(s, 3 * (n + 1) / 4), mu = x.reduce((a, b) => a + b) / n, sd = Math.sqrt(x.reduce((a, b) => a + (b - mu) ** 2, 0) / n);
      const [lo, hi] = m === "iqr" ? [q1 - k * (q3 - q1), q3 + k * (q3 - q1)] : [mu - k * sd, mu + k * sd];
      const xmin = Math.min(s[0], lo) - 2, xmax = Math.max(s[n - 1], hi) + 2; const p = new Plot(el_(root, "#ol-c"), { xmin, xmax, ymin: -1, ymax: 2 }); p.axes("value", "");
      p.clip(G => { G.fillStyle = p.col.soft; G.fillRect(p.sx(lo), p.T, p.sx(hi) - p.sx(lo), p.B - p.T); if (m === "iqr") { G.fillStyle = p.col.accent; G.globalAlpha = .25; G.fillRect(p.sx(q1), p.sy(0.9), p.sx(q3) - p.sx(q1), p.sy(0.1) - p.sy(0.9)); G.globalAlpha = 1; } });
      const cnt = {}; s.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; const out = v < lo || v > hi; p.dots([[v, 0.5 + (cnt[v] - 1) * 0.28]], out ? p.col.bad : p.col.ink, 5, p.col.bg); });
      p.line([[lo, -1], [lo, 2]], p.col.path, 2, [5, 4]); p.line([[hi, -1], [hi, 2]], p.col.path, 2, [5, 4]);
      const outs = s.filter(v => v < lo || v > hi);
      el_(root, "#ol-r").innerHTML = (m === "iqr" ? `<span>Q1 <b>${q1.toFixed(2)}</b></span><span>Q3 <b>${q3.toFixed(2)}</b></span><span>IQR <b>${(q3 - q1).toFixed(2)}</b></span>` : `<span>mean <b>${mu.toFixed(2)}</b></span><span>sd <b>${sd.toFixed(2)}</b></span>`) + `<span>fences <b>${lo.toFixed(2)}</b> to <b>${hi.toFixed(2)}</b></span><span>outliers <b>${outs.length ? outs.join(", ") : "none"}</b></span>`; };
    el_(root, "#ol-d").addEventListener("input", draw); el_(root, "#ol-k").addEventListener("input", draw);
    $$("#ol-m button", root).forEach(b => b.onclick = () => { m = b.dataset.m; $$("#ol-m button", root).forEach(x => x.setAttribute("aria-pressed", x === b)); el_(root, "#ol-k").value = m === "iqr" ? 1.5 : 3; draw(); });
    el_(root, "#ol-add").onclick = () => { el_(root, "#ol-d").value += ", 500"; draw(); }; el_(root, "#ol-raw").onclick = () => { el_(root, "#ol-d").value = "10, 2, 11, 15, 11, 14, 13, 17, 12, 22, 14, 11"; draw(); };
    draw(); return draw;
  }
};

LABS.lsVsLogit = {
  title: "Least-squares line vs logistic curve", cap: "Job offered (1) or not (0) against one score. Both models are fitted to the points shown; dashed verticals mark where each crosses 0.5.",
  html: () => `<canvas id="lv-c" style="height:260px" aria-label="Least squares vs logistic fit"></canvas><div class="row" style="margin-top:8px"><button class="btn sm" id="lv-add">Add a far-right 'yes' point</button><button class="btn sm ghost" id="lv-reset">Reset</button></div><div class="readout" id="lv-r"></div>`,
  mount(root){
    const base = [[1, 0], [1.5, 0], [2, 0], [2.5, 0], [3.5, 1], [4, 1], [4.5, 1], [5, 1]]; let D = base.slice();
    const fitLS = () => { const n = D.length, mx = D.reduce((a, d) => a + d[0], 0) / n, my = D.reduce((a, d) => a + d[1], 0) / n; const b = D.reduce((a, [x, y]) => a + (x - mx) * (y - my), 0) / D.reduce((a, [x]) => a + (x - mx) ** 2, 0); return [my - b * mx, b]; };
    const fitLR = () => { let w0 = 0, w1 = 0; for (let k = 0; k < 4000; k++) { let g0 = 0, g1 = 0; D.forEach(([x, y]) => { const h = sigm(w0 + w1 * x); g0 += h - y; g1 += (h - y) * x; }); w0 -= 0.3 * (g0 / D.length + 0.01 * 0); w1 -= 0.3 * (g1 / D.length + 0.02 * w1); } return [w0, w1]; };
    const draw = () => { const [a, b] = fitLS(), [w0, w1] = fitLR(); const p = new Plot(el_(root, "#lv-c"), { xmin: 0, xmax: 16, ymin: -0.4, ymax: 1.4 }); p.axes("score (e.g. CGPA)", "job offered");
      p.line([[0, 0.5], [16, 0.5]], p.col.line, 1, [3, 3]); p.fn(x => a + b * x, p.col.dnn, 2.5); p.fn(x => sigm(w0 + w1 * x), p.col.accent, 2.5);
      const tLS = (0.5 - a) / b, tLR = -w0 / w1; p.line([[tLS, -0.4], [tLS, 1.4]], p.col.dnn, 1.5, [5, 4]); p.line([[tLR, -0.4], [tLR, 1.4]], p.col.accent, 1.5, [5, 4]);
      D.forEach(([x, y]) => { const wrong = (a + b * x >= 0.5 ? 1 : 0) !== y; p.dots([[x, y]], y ? p.col.path : p.col.ink, 5, wrong ? p.col.bad : p.col.bg); });
      p.text(9, 1.3, "— logistic", p.col.accent); p.text(12, 1.3, "— least squares", p.col.dnn);
      const errLS = D.filter(([x, y]) => (a + b * x >= 0.5 ? 1 : 0) !== y).length, errLR = D.filter(([x, y]) => (sigm(w0 + w1 * x) >= 0.5 ? 1 : 0) !== y).length;
      el_(root, "#lv-r").innerHTML = `<span>least-squares threshold <b>${tLS.toFixed(2)}</b>, mistakes <b>${errLS}</b></span><span>logistic threshold <b>${tLR.toFixed(2)}</b>, mistakes <b>${errLR}</b></span>`; };
    el_(root, "#lv-add").onclick = () => { D.push([D.length > 8 ? 14 + Math.random() : 15, 1]); draw(); }; el_(root, "#lv-reset").onclick = () => { D = base.slice(); draw(); };
    draw(); return draw;
  }
};
LABS.sigmoidLab = {
  title: "Score → probability", cap: "Weights from the lesson's inference example: z = 0.4 + 0.3·CGPA − 0.45·IQ (scaled IQ).",
  html: () => `<canvas id="sg-c" style="height:240px" aria-label="Sigmoid curve"></canvas><div class="ctrls"><label for="sg-a">CGPA <input id="sg-a" type="range" min="4" max="10" step="0.1" value="5"> <b class="num" id="sg-av"></b></label><label for="sg-b">IQ (scaled) <input id="sg-b" type="range" min="4" max="9" step="0.1" value="6"> <b class="num" id="sg-bv"></b></label></div><div class="readout" id="sg-r"></div>`,
  mount(root){
    const draw = () => { const c = +el_(root, "#sg-a").value, q = +el_(root, "#sg-b").value; el_(root, "#sg-av").textContent = c.toFixed(1); el_(root, "#sg-bv").textContent = q.toFixed(1);
      const z = 0.4 + 0.3 * c - 0.45 * q, pr = sigm(z); const p = new Plot(el_(root, "#sg-c"), { xmin: -6, xmax: 6, ymin: 0, ymax: 1 }); p.axes("score z", "P(offer)");

  html: () => `<canvas id="ke-c" style="height:250px" aria-label="Error vs k"></canvas><div class="ctrls"><label for="ke-n">label noise <input id="ke-n" type="range" min="0" max="0.3" step="0.02" value="0.1"> <b class="num" id="ke-nv"></b></label></div><div class="readout" id="ke-r"></div>`,
  mount(root){
    const draw = () => { const noise = +el_(root, "#ke-n").value; el_(root, "#ke-nv").textContent = noise.toFixed(2); const r = prng(77), N = 200;
      const D = Array.from({ length: N }, () => { const x = [4 * r() - 2, 4 * r() - 2]; let c = x[0] * x[0] + x[1] * x[1] < 1.6 ? 1 : 0; if (r() < noise) c = 1 - c; return [x, c]; });
      const pred = (tr, x, k) => { const s = tr.map(([p, c]) => [(p[0] - x[0]) ** 2 + (p[1] - x[1]) ** 2, c]).sort((a, b) => a[0] - b[0]).slice(0, k); return s.reduce((a, b) => a + b[1], 0) * 2 > k ? 1 : 0; };
      const ks = [1, 2, 3, 5, 7, 9, 11, 14, 17, 21, 25, 30, 35, 40], cv = [], trn = [];
      ks.forEach(k => { let e = 0; for (let f = 0; f < 5; f++) { const te = D.filter((_, i) => i % 5 === f), tr = D.filter((_, i) => i % 5 !== f); e += te.filter(([x, c]) => pred(tr, x, k) !== c).length; } cv.push([k, e / N]); trn.push([k, D.filter(([x, c]) => pred(D, x, k) !== c).length / N]); });
      const p = new Plot(el_(root, "#ke-c"), { xmin: 0, xmax: 41, ymin: 0, ymax: 0.5 }); p.axes("k", "error"); p.line(trn, p.col.dnn, 2); p.line(cv, p.col.path, 2.5); p.dots(cv, p.col.path, 3);
      const sq = Math.round(Math.sqrt(N * 0.8)); p.line([[sq, 0], [sq, 0.5]], p.col.line, 1, [4, 3]); p.text(sq + 0.5, 0.47, "√N", p.col.muted); p.text(25, 0.47, "— train  — 5-fold CV", p.col.muted);
      const best = cv.reduce((a, b) => b[1] < a[1] ? b : a); el_(root, "#ke-r").innerHTML = `<span>best k by CV <b>${best[0]}</b> (error ${best[1].toFixed(3)})</span><span>k = 1 training error <b>${trn[0][1].toFixed(3)}</b> (memorises)</span><span>√N ≈ <b>${sq}</b></span>`; };
    el_(root, "#ke-n").addEventListener("input", draw); draw(); return draw;
  }
};

/* ===== ML M7 labs ===== */
function smoTrain(X, y, C, kern, iters = 40, tol = 1e-3){ // simplified SMO (Platt), small n
  const n = X.length, a = new Float64Array(n), K = X.map(p => X.map(q => kern(p, q))); let b = 0, passes = 0, it = 0; const r = prng(5);
  const f = i => { let s = b; for (let j = 0; j < n; j++) if (a[j]) s += a[j] * y[j] * K[j][i]; return s; };
  while (passes < 5 && it < iters * 20) { let changed = 0; it++;
    for (let i = 0; i < n; i++) { const Ei = f(i) - y[i]; if ((y[i] * Ei < -tol && a[i] < C) || (y[i] * Ei > tol && a[i] > 0)) { let j = Math.floor(r() * (n - 1)); if (j >= i) j++; const Ej = f(j) - y[j], ai = a[i], aj = a[j];
        let L, H; if (y[i] !== y[j]) { L = Math.max(0, aj - ai); H = Math.min(C, C + aj - ai); } else { L = Math.max(0, ai + aj - C); H = Math.min(C, ai + aj); } if (L === H) continue;
        const eta = 2 * K[i][j] - K[i][i] - K[j][j]; if (eta >= 0) continue; let ajn = aj - y[j] * (Ei - Ej) / eta; ajn = Math.min(H, Math.max(L, ajn)); if (Math.abs(ajn - aj) < 1e-5) continue;
        const ain = ai + y[i] * y[j] * (aj - ajn); const b1 = b - Ei - y[i] * (ain - ai) * K[i][i] - y[j] * (ajn - aj) * K[i][j], b2 = b - Ej - y[i] * (ain - ai) * K[i][j] - y[j] * (ajn - aj) * K[j][j];
        a[i] = ain; a[j] = ajn; b = (ain > 0 && ain < C) ? b1 : (ajn > 0 && ajn < C) ? b2 : (b1 + b2) / 2; changed++; } }
    passes = changed ? 0 : passes + 1; }
  return { a, b, dec: p => { let s = b; for (let j = 0; j < n; j++) if (a[j] > 1e-6) s += a[j] * y[j] * kern(X[j], p); return s; } };
}
const KERNELS = { linear: (p, q) => p[0] * q[0] + p[1] * q[1], poly: (p, q) => (1 + p[0] * q[0] + p[1] * q[1]) ** 2, rbf: g => (p, q) => Math.exp(-g * ((p[0] - q[0]) ** 2 + (p[1] - q[1]) ** 2)) };

  mount(root){

    const gen = kind => { const r = prng(kind === "lin" ? 2 : kind === "noisy" ? 6 : 9); const out = []; for (let i = 0; i < 40; i++) { const c = i % 2 ? 1 : -1; let x, yv;
      if (kind === "ring") { const rad = c > 0 ? 0.5 * r() : 1.2 + 0.5 * r(), t = 2 * Math.PI * r(); x = rad * Math.cos(t); yv = rad * Math.sin(t); }

    const draw = () => { const C = Math.pow(10, +el_(root, "#sv-C").value), g = Math.pow(10, +el_(root, "#sv-g").value), kn = el_(root, "#sv-k").value; el_(root, "#sv-Cv").textContent = C < 1 ? C.toFixed(2) : C.toFixed(0); el_(root, "#sv-gv").textContent = g.toFixed(2);

      for (let i = 0; i <= n; i++) { grid.push([]); for (let j = 0; j <= n; j++) grid[i].push(m.dec([-2.2 + 4.4 * i / n, -2.2 + 4.4 * j / n])); }

          if (cr.length >= 2) { const tx = c => p.sx(-2.2 + 4.4 * c[0] / n), ty = c => p.sy(-2.2 + 4.4 * c[1] / n); g2.moveTo(tx(cr[0]), ty(cr[0])); g2.lineTo(tx(cr[1]), ty(cr[1])); } } g2.stroke(); }); G.setLineDash([]); });
      D.forEach((d, i) => { p.dots([[d[0], d[1]]], d[2] > 0 ? p.col.path : p.col.dnn, 4.5, p.col.bg); if (m.a[i] > 1e-6) { G.beginPath(); G.arc(p.sx(d[0]), p.sy(d[1]), 9, 0, 7); G.strokeStyle = p.col.ink; G.lineWidth = 1.6; G.stroke(); } });
      const nsv = [...m.a].filter(v => v > 1e-6).length, err = D.filter((d, i) => Math.sign(m.dec([d[0], d[1]])) !== d[2]).length, viol = D.filter((d, i) => d[2] * m.dec([d[0], d[1]]) < 1 - 1e-3).length;
      let wtxt = ""; if (kn === "linear") { let w0 = 0, w1 = 0; D.forEach((d, i) => { w0 += m.a[i] * d[2] * d[0]; w1 += m.a[i] * d[2] * d[1]; }); const nw = Math.hypot(w0, w1); wtxt = `<span>w = (${w0.toFixed(2)}, ${w1.toFixed(2)}), b = ${m.b.toFixed(2)}</span><span>margin width 2/‖w‖ = <b>${(2 / nw).toFixed(3)}</b></span>`; }
      el_(root, "#sv-r").innerHTML = `<span>support vectors <b>${nsv}</b> of ${D.length}</span><span>training errors <b>${err}</b></span><span>inside margin or wrong side <b>${viol}</b></span>` + wtxt;
      el_(root, "#sv-s").textContent = kn === "linear" && el_(root, "#sv-d").value === "ring" ? "No straight line can separate a ring. Switch to a polynomial or Gaussian kernel." : C < 0.3 ? "Small C: a wide margin that tolerates mistakes." : C > 100 ? "Large C: the margin narrows to avoid every training mistake." : ""; };
    const reset = () => { D = gen(el_(root, "#sv-d").value); draw(); };
    el_(root, "#sv-c").addEventListener("click", ev => { const rc = ev.target.getBoundingClientRect(), p = new Plot(el_(root, "#sv-c"), { xmin: -2.2, xmax: 2.2, ymin: -2.2, ymax: 2.2 }); D.push([p.ix(ev.clientX - rc.left), p.iy(ev.clientY - rc.top), addK]); draw(); });

LABS.widestRoad = {

  html: () => `<canvas id="wr-c" style="height:280px" aria-label="Candidate separating lines and their margins"></canvas><div class="ctrls"><label for="wr-a">Line angle <input id="wr-a" type="range" min="-60" max="60" step="1" value="30"> <b class="num" id="wr-av"></b></label><button class="btn sm" id="wr-best">Show widest</button></div><div class="readout" id="wr-r"></div>`,
  mount(root){
    const P = [[1, 1, -1], [1.5, 2.2, -1], [2.2, 0.8, -1], [0.6, 2.8, -1], [2.8, 2, -1], [4.2, 3.6, 1], [4.8, 2.2, 1], [3.6, 4.8, 1], [5.4, 4, 1], [4.4, 5.6, 1]];
    const evalA = deg => { const t = deg * Math.PI / 180, n = [Math.cos(t), Math.sin(t)]; const s = P.map(p => p[0] * n[0] + p[1] * n[1]); const neg = Math.max(...s.filter((_, i) => P[i][2] < 0)), pos = Math.min(...s.filter((_, i) => P[i][2] > 0)); return { n, c: (neg + pos) / 2, w: pos - neg }; };
    const draw = () => { const deg = +el_(root, "#wr-a").value; el_(root, "#wr-av").textContent = deg + "°"; const e = evalA(deg);
      const p = new Plot(el_(root, "#wr-c"), { xmin: 0, xmax: 6.5, ymin: 0, ymax: 6.5 }); p.axes("x₁", "x₂"); const G = p.g;
      const lineAt = c => { const [a, b] = e.n; return Math.abs(b) > 1e-6 ? [[0, c / b], [6.5, (c - a * 6.5) / b]] : [[c / a, 0], [c / a, 6.5]]; };
      if (e.w > 0) { const L1 = lineAt(e.c - e.w / 2), L2 = lineAt(e.c + e.w / 2); p.clip(g2 => { g2.fillStyle = p.col.soft; g2.beginPath(); g2.moveTo(p.sx(L1[0][0]), p.sy(L1[0][1])); g2.lineTo(p.sx(L1[1][0]), p.sy(L1[1][1])); g2.lineTo(p.sx(L2[1][0]), p.sy(L2[1][1])); g2.lineTo(p.sx(L2[0][0]), p.sy(L2[0][1])); g2.fill(); }); p.line(L1, p.col.accent, 1.3, [5, 4]); p.line(L2, p.col.accent, 1.3, [5, 4]); }
      p.line(lineAt(e.c), p.col.ink, 2.5); P.forEach(q => p.dots([[q[0], q[1]]], q[2] > 0 ? p.col.path : p.col.dnn, 5.5, p.col.bg));

};

/* ===== ML M8 labs: Bayesian learning ===== */
function lgamma_(z){ const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5]; let x = z, y = z, t = x + 5.5; t -= (x + .5) * Math.log(t); let s = 1.000000000190015; for (const v of c) s += v / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
const betaPdf = (p, a, b) => p <= 0 || p >= 1 ? 0 : Math.exp((a - 1) * Math.log(p) + (b - 1) * Math.log(1 - p) + lgamma_(a + b) - lgamma_(a) - lgamma_(b));
LABS.bayesUpdate = {

    const draw = () => { const [a0, b0] = el_(root, "#bu-p").value.split(",").map(Number), a = a0 + H, b = b0 + T; el_(root, "#bu-tv").textContent = (+el_(root, "#bu-t").value).toFixed(2);

}

LABS.perceptronStepper = {

  html: () => `<div class="ctrls"><label for="ps-g">Task <select id="ps-g"><option value="NOT">NOT (example)</option><option>AND</option><option>OR</option><option>XOR</option></select></label><label for="ps-e">η <select id="ps-e"><option value="1">1</option><option value="0.5">0.5</option><option value="0.1">0.1</option></select></label></div><div class="row"><button class="btn sm" id="ps-s">Next example</button><button class="btn sm" id="ps-ep">Run one epoch</button><button class="btn sm" id="ps-run">Run to convergence</button><button class="btn sm ghost" id="ps-r">Reset</button></div><div class="tablewrap"><table class="data num" id="ps-t"></table></div><div class="readout" id="ps-o"></div>`,

    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const x = cell(r, c) || {}; s += `<div style="aspect-ratio:1;display:grid;place-items:center;border-radius:5px;font:600 .72rem var(--f-mono);background:${x.bg || "var(--surface-2)"};color:${x.fg || "var(--ink)"};${x.b ? "outline:2px solid " + x.b + ";" : ""}overflow:hidden;text-align:center;line-height:1.1">${x.txt === undefined ? "" : x.txt}</div>`; }
    return s + "</div>";
  },
  softmax: z => { const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); },
  heat: (v, lo, hi, col) => `color-mix(in srgb, ${col || "var(--accent)"} ${Math.round(8 + 55 * Math.max(0, Math.min(1, (v - lo) / ((hi - lo) || 1))))}%, var(--surface))`,
  f: (x, d = 3) => (Math.abs(x) >= 1e5 || (Math.abs(x) < 1e-3 && x !== 0)) ? x.toExponential(2) : (+(+x).toFixed(d)).toString()
};

{
/* ===== DNN M10 labs: optimisers ===== */
const L10 = w => w[0] * w[0] + 4 * w[1] * w[1], G10 = w => [2 * w[0], 8 * w[1]];
const OPT10 = {
  gd: { name: "Mini-batch GD", eta: 0.1, step(w, g, s) { return [w[0] - s.eta * g[0], w[1] - s.eta * g[1]]; } },
  mom: { name: "Momentum (β 0.9)", eta: 0.05, step(w, g, s) { s.v = (s.v || [0, 0]).map((v, i) => 0.9 * v + g[i]); return w.map((x, i) => x - s.eta * s.v[i]); } },
  nag: { name: "Nesterov", eta: 0.05, step(w, g, s) { const v = s.v || [0, 0], gl = G10(w.map((x, i) => x - s.eta * 0.9 * v[i])); s.v = v.map((x, i) => 0.9 * x + gl[i]); return w.map((x, i) => x - s.eta * s.v[i]); } },
  rms: { name: "RMSprop (γ 0.9)", eta: 0.05, step(w, g, s) { s.s = (s.s || [0, 0]).map((v, i) => 0.9 * v + 0.1 * g[i] * g[i]); return w.map((x, i) => x - s.eta * g[i] / Math.sqrt(s.s[i] + 1e-8)); } },
  adam: { name: "Adam", eta: 0.05, step(w, g, s) { s.t = (s.t || 0) + 1; s.m = (s.m || [0, 0]).map((v, i) => 0.9 * v + 0.1 * g[i]); s.u = (s.u || [0, 0]).map((v, i) => 0.999 * v + 0.001 * g[i] * g[i]); return w.map((x, i) => x - s.eta * (s.m[i] / (1 - 0.9 ** s.t)) / (Math.sqrt(s.u[i] / (1 - 0.999 ** s.t)) + 1e-8)); } }
};
function contours10(p){ const G = p.g; G.lineWidth = 1; G.strokeStyle = p.col.line; [0.5, 2, 5, 10, 18, 32, 50].forEach(c => { G.beginPath(); for (let a = 0; a <= 64; a++) { const th = a / 64 * 2 * Math.PI, x = Math.sqrt(c) * Math.cos(th), y = Math.sqrt(c) / 2 * Math.sin(th); a ? G.lineTo(p.sx(x), p.sy(y)) : G.moveTo(p.sx(x), p.sy(y)); } G.stroke(); }); }

{
/* ===== DNN M11 labs: regularisation ===== */
const INIT11 = { zero: "Zero", small: "N(0, 0.01²)", large: "N(0, 1)", xavier: "Xavier", he: "He" };
function initStds11(act, width, L, seed){
  const r = prng(seed), B = 96, out = {};
  for (const k of Object.keys(INIT11)) {
    let h = Array.from({ length: B }, () => Array.from({ length: width }, () => gauss(r))); const s = [];
    for (let l = 0; l < L; l++) {
      const sd = k === "zero" ? 0 : k === "small" ? 0.01 : k === "large" ? 1 : k === "xavier" ? Math.sqrt(2 / (2 * width)) : Math.sqrt(2 / width);
      const W = Array.from({ length: width }, () => Array.from({ length: width }, () => sd * gauss(r)));
      const nh = h.map(row => { const o = new Array(width).fill(0); for (let i = 0; i < width; i++) { const xi = row[i]; if (!xi) continue; const Wi = W[i]; for (let j = 0; j < width; j++) o[j] += xi * Wi[j]; } return o.map(z => act === "tanh" ? Math.tanh(z) : Math.max(0, z)); });
      h = nh; let m = 0, q = 0, n = 0; h.forEach(row => row.forEach(v => { m += v; q += v * v; n++; })); m /= n; s.push(Math.sqrt(Math.max(q / n - m * m, 0)));
    }
    out[k] = s;
  }
  return out;
}

  mount(root){

LABS.normAxes = {
  title: "Batch norm vs layer norm: which numbers get averaged?", cap: "Rows are samples in a mini-batch, columns are features. Batch norm normalises each column (one feature across the batch); layer norm normalises each row (all features of one sample). Row 1 is the lesson's layer-norm example [2, 8, 4, 10]; column 4 is the batch-norm example [10, 12, 8, 14]. Shrink the batch to 1 and see batch norm collapse. ε = 0.01, γ = 1, β = 0.",
  html: () => `<div class="slidergrid"><label for="na-m">method <select id="na-m"><option value="bn">Batch norm (per feature)</option><option value="ln">Layer norm (per sample)</option></select></label><label for="na-b">batch size <input id="na-b" type="range" min="1" max="4" step="1" value="4"></label></div><div class="tablewrap"><table class="cmp" id="na-t"></table></div><div class="readout" id="na-o"></div>`,
  mount(root){
    const M = [[2, 8, 4, 10], [5, 1, 3, 12], [1, 4, 6, 8], [3, 7, 2, 14]], eps = 0.01;
    const draw = () => { const bn = el_(root, "#na-m").value === "bn", B = +el_(root, "#na-b").value, X = M.slice(0, B);
      const stats = bn ? [0, 1, 2, 3].map(j => { const c = X.map(r => r[j]), m = c.reduce((a, b) => a + b, 0) / B; return [m, c.reduce((a, b) => a + (b - m) ** 2, 0) / B]; }) : X.map(r => { const m = r.reduce((a, b) => a + b, 0) / 4; return [m, r.reduce((a, b) => a + (b - m) ** 2, 0) / 4]; });
      const N = X.map((r, i) => r.map((v, j) => { const [m, s] = bn ? stats[j] : stats[i]; return (v - m) / Math.sqrt(s + eps); }));

      el_(root, "#na-t").innerHTML = `<tr><th></th>${[1, 2, 3, 4].map(j => `<th>feature ${j}</th>`).join("")}${bn ? "" : "<th>row μ, σ²</th>"}</tr>` + X.map((r, i) => `<tr><th>sample ${i + 1}</th>${r.map((v, j) => `<td${hl(i, j)}>${v} → <b>${N[i][j].toFixed(2)}</b></td>`).join("")}${bn ? "" : `<td>${stats[i][0].toFixed(2)}, ${stats[i][1].toFixed(2)}</td>`}</tr>`).join("") + (bn ? `<tr><th>column μ, σ²</th>${stats.map(s => `<td>${s[0].toFixed(2)}, ${s[1].toFixed(2)}</td>`).join("")}</tr>` : "");

LABS.mixupLab = {
  title: "Mixup and CutMix", cap: "Two training images, A (a 'cat': blue disc) and B (a 'dog': red square), 16 × 16 pixels. Mixup blends the whole images and labels with weight λ. CutMix pastes a patch of B into A and mixes the labels by the patch's share of the area. The model must output the mixed label, which discourages over-confident, memorised decisions.",
  html: () => `<div class="row" style="gap:14px;flex-wrap:wrap;align-items:flex-end"><div><canvas id="mx-a" width="96" height="96" style="width:96px;height:96px;image-rendering:pixelated" aria-label="Image A"></canvas><div class="small">A: cat</div></div><div><canvas id="mx-b" width="96" height="96" style="width:96px;height:96px;image-rendering:pixelated" aria-label="Image B"></canvas><div class="small">B: dog</div></div><div><canvas id="mx-m" width="96" height="96" style="width:96px;height:96px;image-rendering:pixelated" aria-label="Mixed image"></canvas><div class="small">mixed</div></div></div><div class="slidergrid"><label for="mx-t">method <select id="mx-t"><option value="mix">Mixup</option><option value="cut">CutMix</option></select></label><label for="mx-l">λ (weight of A) <input id="mx-l" type="range" min="0" max="1" step="0.05" value="0.7"></label></div><div class="readout" id="mx-o"></div>`,
  mount(root){
    const n = 16, A = [], Bm = []; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const d = Math.hypot(i - 7.5, j - 7.5) < 5.5; A.push(d ? [70, 110, 220] : [235, 238, 245]); const s = i > 3 && i < 12 && j > 3 && j < 12; Bm.push(s ? [220, 70, 70] : [245, 236, 230]); }
    const paint = (id, px) => { const c = el_(root, id), g = c.getContext("2d"), s = c.width / n; px.forEach((v, k) => { g.fillStyle = `rgb(${v.map(Math.round).join(",")})`; g.fillRect((k % n) * s, Math.floor(k / n) * s, s, s); }); };
    const draw = () => { const cut = el_(root, "#mx-t").value === "cut", lam = +el_(root, "#mx-l").value; let mixed, la;
      if (!cut) { mixed = A.map((v, k) => v.map((x, c) => lam * x + (1 - lam) * Bm[k][c])); la = lam; }
      else { const side = Math.round(n * Math.sqrt(1 - lam)), o = Math.floor((n - side) / 2); mixed = A.map((v, k) => { const i = Math.floor(k / n), j = k % n; return i >= o && i < o + side && j >= o && j < o + side ? Bm[k] : v; }); la = 1 - side * side / (n * n); }
      paint("#mx-a", A); paint("#mx-b", Bm); paint("#mx-m", mixed);
      el_(root, "#mx-o").innerHTML = `<span>label = <b>${la.toFixed(2)}</b> × cat + <b>${(1 - la).toFixed(2)}</b> × dog</span><span>${cut ? `patch of B covers ${((1 - la) * 100).toFixed(0)}% of the pixels (patch side rounded to whole pixels), so B's label weight is the area share` : "x̃ = λxᵢ + (1 − λ)xⱼ and ỹ = λyᵢ + (1 − λ)yⱼ; the lesson's example λ = 0.7 gives 0.7 × cat + 0.3 × dog"}</span><span>In practice λ is sampled from a Beta(α, α) distribution for each batch.</span>`; };
    $$("input,select", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.penaltyGeom = {
  title: "Why L1 gives exact zeros and L2 doesn't", cap: "Ellipses are contours of the unregularised loss, centred on its minimum w* (click to move it). Regularisation is equivalent to keeping the weights inside a budget region: a circle for L2 (w₁² + w₂² ≤ t), a diamond for L1 (|w₁| + |w₂| ≤ t). The solution is where the lowest contour first touches the region. The diamond's corners lie on the axes, so the L1 solution often has a coordinate exactly 0.",
  html: () => `<canvas id="pg-c" style="height:320px;cursor:crosshair" aria-label="L1 and L2 constraint geometry"></canvas><div class="slidergrid"><label for="pg-t">budget t <input id="pg-t" type="range" min="0.3" max="3" step="0.05" value="1"></label></div><div class="readout" id="pg-o"></div>`,
  mount(root){
    let ws = [2.2, 0.4]; const Q = (w) => (w[0] - ws[0]) ** 2 + 3 * (w[1] - ws[1]) ** 2;
    const best = (inside, boundary) => { if (inside(ws)) return ws.slice(); let b = null, bv = Infinity; for (let a = 0; a < 2000; a++) { const w = boundary(a / 2000 * 2 * Math.PI), v = Q(w); if (v < bv) { bv = v; b = w; } } return b; };
    const cv = el_(root, "#pg-c"), hy = Math.max(1.8, 3.5 * Math.max(cv.clientHeight - 40, 100) / Math.max(cv.clientWidth - 50, 100)), opts = { xmin: -3.5, xmax: 3.5, ymin: -hy, ymax: hy };
    const draw = () => { const t = +el_(root, "#pg-t").value, p = new Plot(el_(root, "#pg-c"), opts), G = p.g; p.axes("w₁", "w₂");
      const l2 = best(w => w[0] ** 2 + w[1] ** 2 <= t, th => [Math.sqrt(t) * Math.cos(th), Math.sqrt(t) * Math.sin(th)]);
      const l1 = best(w => Math.abs(w[0]) + Math.abs(w[1]) <= t, th => { const c = Math.cos(th), s = Math.sin(th), k = t / (Math.abs(c) + Math.abs(s)); return [k * c, k * s]; });
      [0.15, 0.5, 1, 2, 3.5, 5.5, 8].concat([Q(l1), Q(l2)]).forEach((c, ci) => { G.strokeStyle = ci >= 7 ? p.col.ink : p.col.line; G.lineWidth = ci >= 7 ? 1.2 : 1; G.setLineDash(ci >= 7 ? [3, 3] : []); G.beginPath(); for (let a = 0; a <= 120; a++) { const th = a / 120 * 2 * Math.PI, d = [Math.cos(th), Math.sin(th)], q = d[0] ** 2 + 3 * d[1] ** 2, r = Math.sqrt(c / q), x = ws[0] + r * d[0], y = ws[1] + r * d[1]; a ? G.lineTo(p.sx(x), p.sy(y)) : G.moveTo(p.sx(x), p.sy(y)); } G.stroke(); G.setLineDash([]); });
      const circ = []; for (let a = 0; a <= 90; a++) { const th = a / 90 * 2 * Math.PI; circ.push([Math.sqrt(t) * Math.cos(th), Math.sqrt(t) * Math.sin(th)]); } p.line(circ, p.col.dnn, 2.2);
      p.line([[t, 0], [0, t], [-t, 0], [0, -t], [t, 0]], p.col.bad, 2.2);
      p.dots([ws], p.col.muted, 5); p.text(ws[0] + 0.12, ws[1] + 0.2, "w*", p.col.muted); p.dots([l2], p.col.dnn, 6, p.col.bg); p.dots([l1], p.col.bad, 6, p.col.bg);
      const z = v => Math.abs(v) < 0.01 ? "<b>0</b>" : v.toFixed(2);
      el_(root, "#pg-o").innerHTML = `<span style="color:${p.col.dnn}">L2 (circle, w₁² + w₂² ≤ ${t.toFixed(2)}): w = (${z(l2[0])}, ${z(l2[1])})</span><span style="color:${p.col.bad}">L1 (diamond, |w₁| + |w₂| ≤ ${t.toFixed(2)}): w = (${z(l1[0])}, ${z(l1[1])})</span><span>${Math.abs(l1[0]) < 0.01 || Math.abs(l1[1]) < 0.01 ? "L1 landed on a corner: one weight is exactly zero (feature selection)." : "Here L1 touched an edge, not a corner; try a smaller budget or move w*."} L2 shrinks both weights but rarely to exactly zero.</span>`; };
    el_(root, "#pg-c").addEventListener("click", ev => { const r = ev.target.getBoundingClientRect(), p = new Plot(el_(root, "#pg-c"), opts); ws = [p.ix(ev.clientX - r.left), p.iy(ev.clientY - r.top)]; draw(); });
    el_(root, "#pg-t").addEventListener("input", draw); draw(); return draw;
  }
};

{

const D3X = [1, 2, 3], D3Y = [2, 4, 5];
const gdStep3 = (w, eta) => { const e = D3X.map((x, i) => w[0] + w[1] * x - D3Y[i]), g = [e.reduce((a, v) => a + v, 0) / 3, e.reduce((a, v, i) => a + v * D3X[i], 0) / 3]; return { e, g, w: [w[0] - eta * g[0], w[1] - eta * g[1]], J: e.reduce((a, v) => a + v * v, 0) / 6 }; };
const J3 = w => D3X.reduce((a, x, i) => a + (w[0] + w[1] * x - D3Y[i]) ** 2, 0) / 6;

LABS.gdWorked = {
  title: "The lesson's gradient-descent example, step by step", cap: "Tiny dataset (size, price) = (1, 2), (2, 4), (3, 5); model ŷ = w₀ + w₁x (one neuron, identity activation); J(w) = (1/2N)‖Xw − y‖²; update w ← w − (η/N)Xᵀ(Xw − y). Start at w = (0, 0) with η = 0.1 as in the worked example.",
  html: () => `<div class="lab-grid3"><canvas id="gw-c" style="height:280px" aria-label="Data and current line"></canvas><canvas id="gw-l" style="height:280px" aria-label="Loss per iteration"></canvas></div><div class="ctrls"><label for="gw-e">learning rate η <select id="gw-e"><option>0.01</option><option selected>0.1</option><option>0.3</option><option>0.4</option></select></label></div><div class="row">${ctrlBtns("gw")}</div><div class="stepbox" id="gw-s"></div><div class="readout" id="gw-r"></div>`,
  mount(root){
    let w, hist, last;
    const reset = () => { w = [0, 0]; hist = [J3(w)]; last = null; draw(); };
    const step = () => { const eta = +el_(root, "#gw-e").value, s = gdStep3(w, eta); last = { from: w, ...s }; w = s.w; hist.push(J3(w)); draw(); };
    const draw = () => { const p = new Plot(el_(root, "#gw-c"), { xmin: 0, xmax: 4, ymin: 0, ymax: 7 }); p.axes("size x₁", "price y");
      D3X.forEach((x, i) => p.line([[x, D3Y[i]], [x, w[0] + w[1] * x]], p.col.bad, 1, [3, 3])); p.fn(x => w[0] + w[1] * x, p.col.path, 2.5); p.fn(x => 2 / 3 + 1.5 * x, p.col.muted, 1, [2, 4]); p.dots(D3X.map((x, i) => [x, D3Y[i]]), p.col.dnn, 6, p.col.bg);
      const fin = hist.filter(isFinite), q = new Plot(el_(root, "#gw-l"), { xmin: 0, xmax: Math.max(10, hist.length - 1), ymin: 0.01, ymax: Math.max(10, ...fin.slice(-50)) * 1.5, logy: true }); q.axes("iteration t", "J(w) (log)"); q.line(hist.map((v, i) => [i, v]), q.col.accent, 2); q.dots(hist.map((v, i) => [i, v]).slice(-1), q.col.path, 4); q.line([[0, 1 / 36], [1e4, 1 / 36]], q.col.muted, 1, [2, 4]);
      const t = hist.length - 1, f = v => v.toFixed(3);
      el_(root, "#gw-s").innerHTML = last ? `<b>Iteration ${t}</b>: predictions ŷ = Xw = (${D3X.map(x => f(last.from[0] + last.from[1] * x)).join(", ")}); error e = ŷ − y = (${last.e.map(f).join(", ")})<br>gradient ∇J = (1/3)Xᵀe = (<b>${f(last.g[0])}, ${f(last.g[1])}</b>)<br>update w = (${f(last.from[0])}, ${f(last.from[1])}) − η·∇J = (<b>${f(w[0])}, ${f(w[1])}</b>)${t === 1 && Math.abs(+el_(root, "#gw-e").value - 0.1) < 1e-9 ? "<br>Matches the worked example: ∇J = (−3.67, −8.33), w⁽¹⁾ = (0.367, 0.833), J drops from 7.5 to 1.51 (80% lower)." : ""}` : `Press <b>Step</b>. At w = (0, 0) every prediction is 0, so J = ¹⁄₆(4 + 16 + 25) = 7.5.`;
      el_(root, "#gw-r").innerHTML = `<span>t = ${t}</span><span>w = (${f(w[0])}, ${f(w[1])})</span><span>J = <b>${isFinite(J3(w)) ? J3(w).toFixed(4) : "∞"}</b></span><span>best possible: w = (0.667, 1.5), J = 0.0278 (dashed)</span><span>${J3(w) > 1e3 ? "<b>Diverging</b>: η is above 2/λ_max ≈ 0.36 for this data." : ""}</span>`; };
    player(root, "gw", step, reset, 500, () => hist.length > 200 || !isFinite(J3(w)) || J3(w) > 1e6); el_(root, "#gw-e").addEventListener("change", reset); reset(); return draw;
  }

LABS.lrRace = {
  title: "Learning-rate race", cap: "Same tiny dataset, four learning rates started together from w = (0, 0). A common recommendation is to try η ∈ {0.001, 0.01, 0.1, 1.0} and plotting loss against iterations. For this data the largest stable η is 2/λ_max(XᵀX/N) ≈ 0.36.",
  html: () => `<canvas id="lr-c" style="height:300px" aria-label="Loss curves"></canvas><div class="ctrls"><label for="lr-x">your own η <input id="lr-x" type="range" min="-3" max="0" step="0.05" value="-0.6"></label></div><div class="row">${ctrlBtns("lr")}</div><div class="readout" id="lr-r"></div>`,

LABS.metricsLab = {
  title: "MSE, RMSE, MAE and R² on the same predictions", cap: "Ten targets and a model's predictions. Drag the 'outlier' slider to make one prediction badly wrong, or add a constant bias, and compare how each metric reacts. R² compares the model with always predicting the mean.",
  html: () => `<canvas id="ml-c" style="height:260px" aria-label="Predictions vs targets"></canvas><div class="slidergrid"><label for="ml-o">error on point 7 <input id="ml-o" type="range" min="-8" max="8" step="0.1" value="0"></label><label for="ml-b">constant bias <input id="ml-b" type="range" min="-3" max="3" step="0.1" value="0"></label><label for="ml-n">noise level <input id="ml-n" type="range" min="0" max="2" step="0.05" value="0.5"></label></div><div class="readout" id="ml-r"></div>`,
  mount(root){
    const Y = [3.1, 4.0, 5.2, 5.9, 7.1, 8.0, 8.8, 10.1, 11.0, 12.2], Z = [0.3, -0.8, 0.5, -0.2, 0.9, -0.6, 0.1, -0.9, 0.4, 0.3];
    const draw = () => { const o = +el_(root, "#ml-o").value, b = +el_(root, "#ml-b").value, nz = +el_(root, "#ml-n").value, P = Y.map((y, i) => y + nz * Z[i] + b + (i === 6 ? o : 0));
      const N = Y.length, ybar = Y.reduce((a, v) => a + v) / N, mse = Y.reduce((a, y, i) => a + (P[i] - y) ** 2, 0) / N, mae = Y.reduce((a, y, i) => a + Math.abs(P[i] - y), 0) / N, sst = Y.reduce((a, y) => a + (y - ybar) ** 2, 0), r2 = 1 - mse * N / sst;
