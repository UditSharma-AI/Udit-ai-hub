LABS.seVectorSearch = {
  title: "Similarity search in a vector store", cap: "Chunks of text become points (2-D here; real embeddings have hundreds of dimensions). Click to place a query; the k nearest chunks by cosine similarity are retrieved. An index such as HNSW finds (approximately) the same neighbours while comparing against far fewer points than a brute-force scan.",
  html: () => `<canvas id="vs-c" style="height:280px;cursor:crosshair" aria-label="Embedding space"></canvas><div class="slidergrid"><label for="vs-k">k <input id="vs-k" type="range" min="1" max="8" step="1" value="3"></label><label for="vs-n">chunks in the store <select id="vs-n"><option>200</option><option selected>2000</option><option>200000</option></select></label></div><div class="readout" id="vs-r"></div>`,
  mount(root) {
    const r = prng(9), T = ["HR", "IT", "Travel", "Finance"], C = [[1, 0.3], [-0.2, 1], [-1, -0.2], [0.3, -1]], P = [];
    T.forEach((t, i) => { for (let j = 0; j < 30; j++) { const a = Math.atan2(C[i][1], C[i][0]) + 0.35 * gauss(r); P.push([Math.cos(a) * (0.6 + 0.35 * r()), Math.sin(a) * (0.6 + 0.35 * r()), i]); } });
    let q = [0.8, 0.55];
    const draw = () => { const k = +el_(root, "#vs-k").value, N = +el_(root, "#vs-n").value;
      const cs = p => (p[0] * q[0] + p[1] * q[1]) / (Math.hypot(p[0], p[1]) * Math.hypot(q[0], q[1]));
      const top = [...P].sort((a, b) => cs(b) - cs(a)).slice(0, k);
      const p = new Plot(el_(root, "#vs-c"), { xmin: -1.3, xmax: 1.3, ymin: -1.2, ymax: 1.2 }); p.axes("dim 1", "dim 2"); const col = [p.col.accent, p.col.dnn, p.col.path, p.col.bad];
      P.forEach(x => p.dots([[x[0], x[1]]], col[x[2]], 3)); top.forEach(t => p.line([q, [t[0], t[1]]], p.col.ink, 1, [3, 3])); p.dots([q], p.col.ink, 6, p.col.bg);
      C.forEach((c, i) => p.text(c[0] * 1.12 - 0.1, c[1] * 1.08, T[i], col[i]));
      const hn = Math.round(Math.log2(N) * 12);
      el_(root, "#vs-r").innerHTML = `<span>retrieved topics: <b>${top.map(t => T[t[2]]).join(", ")}</b></span><span>brute force compares <b>${N.toLocaleString()}</b> vectors; an HNSW index ≈ <b>${hn}</b> (illustrative, grows like log N)</span>`; };
    el_(root, "#vs-c").addEventListener("click", ev => { const b = ev.target.getBoundingClientRect(), p = new Plot(el_(root, "#vs-c"), { xmin: -1.3, xmax: 1.3, ymin: -1.2, ymax: 1.2 }); q = [p.ix(ev.clientX - b.left), p.iy(ev.clientY - b.top)]; draw(); });
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.sePubSub = {
  title: "Publish-subscribe: synchronous vs brokered logging", cap: "The gateway gets a prediction from the model service and must also log it. Synchronously, the client waits for logging and fails when logging is down. With a broker, the gateway publishes a log event and returns immediately; the logging consumer catches up from the queue later.",
  html: () => `<div class="slidergrid"><label for="ps-m">mode <select id="ps-m"><option value="sync">synchronous call to logging</option><option value="async">publish to broker (async)</option></select></label><label for="ps-r">requests per second <input id="ps-r" type="range" min="10" max="200" step="10" value="60"></label><label for="ps-d"><input id="ps-d" type="checkbox"> logging service down</label></div><div class="flow" style="margin-top:8px"><div class="fbox on">client</div><div class="farrow">→</div><div class="fbox on">gateway :8000</div><div class="farrow">→</div><div class="fbox on">model :8001</div><div class="farrow">→</div><div class="fbox" id="ps-b">broker queue</div><div class="farrow">→</div><div class="fbox" id="ps-l">logging :8002</div></div><div id="ps-o" style="margin-top:8px"></div><div class="readout" id="ps-t"></div>`,
  mount(root) {
    const draw = () => { const m = el_(root, "#ps-m").value, r = +el_(root, "#ps-r").value, down = el_(root, "#ps-d").checked;
      const model = 4, log = 12, cap = 1000 / log; // logging consumer capacity per second
      el_(root, "#ps-b").classList.toggle("on", m === "async"); el_(root, "#ps-l").classList.toggle("on", !down);
      let lat, ok, q, note;
      if (m === "sync") { lat = model + log; ok = down ? 0 : 100; q = 0; note = down ? "Every request fails: the client is coupled to the logging service." : "Client waits for both services."; }
      else { lat = model + 0.5; ok = 100; q = down ? r * 60 : Math.max(0, (r - cap) * 60); note = down ? "Predictions still served; events wait durably in the queue until logging recovers." : (r > cap ? "Logging is slower than the arrival rate, so the backlog grows; add consumers." : "Consumer keeps up; queue stays near empty."); }
      el_(root, "#ps-o").innerHTML = SEH.meter("client latency", lat, 20, lat.toFixed(1) + " ms") + SEH.meter("requests served", ok, 100, ok + "%", ok < 100 ? "var(--bad)" : "") + SEH.meter("queue after 1 min", q, 12000, Math.round(q) + " events");
      el_(root, "#ps-t").innerHTML = `<span>${note}</span><span>Decoupling, horizontal scalability and reliable delivery are why event brokers (RabbitMQ, Kafka, SQS) are used.</span>`; };
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.seRegistry = {
  title: "A model registry: versions, aliases and rollback", cap: "Each training run registers a new version with its metrics and lineage. Serving loads whatever version the 'champion' alias points to, so promotion and rollback are a single alias change, recorded in the audit log.",
  html: () => `<div class="row"><button class="btn" id="rg-reg">register new version</button><button class="btn" id="rg-pro">promote selected to champion</button><button class="btn" id="rg-rb">roll back</button></div><div class="tablewrap" style="margin-top:8px"><table class="cmp" id="rg-t"></table></div><div class="readout" id="rg-a"></div>`,
  mount(root) {
    const r = SEH.rng(11); let V = [], champ = null, hist = [], sel = null, audit = [];
    const add = () => { const v = V.length + 1, auc = 0.84 + 0.06 * r(); V.push({ v, auc, run: "run-" + (100 + v), data: "data@" + (0x3a1f + 7 * v).toString(16) }); sel = v; audit.push(`register v${v}`); };
    add(); add(); champ = 1; hist = [1]; audit.push("alias champion → v1");
    const draw = () => { el_(root, "#rg-t").innerHTML = `<tr><th></th><th>version</th><th>AUC</th><th>lineage</th><th>alias</th></tr>` + V.map(x => `<tr><td><input type="radio" name="rgsel" value="${x.v}" ${x.v === sel ? "checked" : ""} aria-label="select v${x.v}"></td><td>v${x.v}</td><td class="num">${x.auc.toFixed(3)}</td><td class="small">${x.run} / ${x.data}</td><td>${x.v === champ ? SEH.pill("champion", "ok") : ""}</td></tr>`).join("");
      $$("input[name=rgsel]", root).forEach(i => i.addEventListener("change", () => { sel = +i.value; }));
      el_(root, "#rg-a").innerHTML = `<span>serving loads <code>models:/churn@champion</code> → <b>v${champ}</b></span><span class="small">audit: ${audit.slice(-5).join(" · ")}</span>`; };
    el_(root, "#rg-reg").onclick = () => { if (V.length < 7) add(); draw(); };
    el_(root, "#rg-pro").onclick = () => { if (sel && sel !== champ) { audit.push(`alias champion v${champ} → v${sel}`); hist.push(sel); champ = sel; } draw(); };
    el_(root, "#rg-rb").onclick = () => { if (hist.length > 1) { const from = hist.pop(); champ = hist[hist.length - 1]; audit.push(`rollback v${from} → v${champ}`); } draw(); };
    draw(); return draw;
  }
};

LABS.seBatchVsRealtime = {

  html: () => `<div class="slidergrid"><label for="bv-f">acceptable staleness <select id="bv-f"><option value="0.05">under 100 ms (decide during the request)</option><option value="1">about an hour</option><option value="24" selected>a day</option><option value="168">a week</option></select></label><label for="bv-n">entities to score (thousands) <input id="bv-n" type="range" min="1" max="1000" step="1" value="200"></label><label for="bv-q">share of entities actually looked up per day (%) <input id="bv-q" type="range" min="1" max="100" step="1" value="30"></label></div><div id="bv-o" style="margin-top:8px"></div><div class="readout" id="bv-r"></div>`,
  mount(root) {
    const draw = () => { const f = +el_(root, "#bv-f").value, n = +el_(root, "#bv-n").value * 1000, q = +el_(root, "#bv-q").value / 100;
      const batchRuns = 24 / Math.max(1, f), batchWork = n * batchRuns, onlineWork = n * q;
      const canBatch = f >= 1; const pick = !canBatch ? "online" : (batchWork <= onlineWork * 3 ? "batch" : "online");
      el_(root, "#bv-o").innerHTML = SEH.meter("batch scorings / day", batchWork, Math.max(batchWork, onlineWork) * 1.1, Math.round(batchWork).toLocaleString()) + SEH.meter("online scorings / day", onlineWork, Math.max(batchWork, onlineWork) * 1.1, Math.round(onlineWork).toLocaleString());
      el_(root, "#bv-r").innerHTML = `<span>suggested: <b>${pick === "batch" ? "batch (offline) prediction" : "online (real-time) prediction"}</b></span><span>${!canBatch ? "Decisions inside a request (fraud checks, dynamic pricing, spam filtering) need a persistent API with the model always in memory." : pick === "batch" ? "Scheduled job (e.g. cron every " + (f >= 24 ? f + " h" : "hour") + ") loads the model, scores everything and writes a prediction store; failures can be retried before anyone notices." : "Most precomputed scores would never be read; serve on demand instead, but plan for availability because failures hit users directly."}</span>`; };
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.seSaga = {
  title: "SAGA: compensating transactions", cap: "Each step of a distributed order commits locally and triggers the next. If a later step fails, the already committed steps cannot simply be rolled back; the SAGA runs their compensating transactions in reverse order.",
  html: () => `<div class="slidergrid"><label for="sg-f">failing step <select id="sg-f"><option value="-1">none (all succeed)</option><option value="1">T2 process payment</option><option value="2">T3 update inventory</option><option value="3" selected>T4 deliver order</option></select></label></div><div id="sg-b" class="flow" style="margin-top:8px"></div><div class="stepbox" id="sg-s" style="margin-top:8px" aria-live="polite"></div><div class="row" style="margin-top:8px">${ctrlBtns("sg")}<span class="status-pill run" id="sg-n"></span></div>`,
  mount(root) {
    const T = ["T1 create order", "T2 process payment", "T3 update inventory", "T4 deliver order"], C = ["C1 cancel order", "C2 refund payment", "C3 restore inventory", "—"];
    let steps = [], k = 0;
    const plan = () => { const f = +el_(root, "#sg-f").value; steps = [];
      for (let i = 0; i < T.length; i++) { if (i === f) { steps.push({ st: T.map((_, j) => j < i ? "ok" : j === i ? "bad" : ""), msg: `<b>${T[i]}</b> fails. Steps T1–T${i} are already committed in their own services' databases: no global rollback exists.` }); for (let j = i - 1; j >= 0; j--) steps.push({ st: T.map((_, m) => m < j ? "ok" : m === i ? "bad" : m < i ? (m >= j ? "comp" : "ok") : ""), msg: `Run compensating transaction <b>${C[j]}</b> to semantically undo ${T[j].slice(3)}.` }); steps.push({ st: T.map((_, m) => m === i ? "bad" : m < i ? "comp" : ""), msg: "All committed steps compensated in reverse order. The order ends <b>cancelled</b>, consistently across services." }); break; }
        steps.push({ st: T.map((_, j) => j <= i ? "ok" : ""), msg: `<b>${T[i]}</b> commits locally and publishes an event that triggers the next step.` }); }
      if (f < 0) steps.push({ st: T.map(() => "ok"), msg: "All four local transactions committed: the order is <b>completed</b>." });
      k = 0; show(); };
    const show = () => { const s = steps[k]; el_(root, "#sg-b").innerHTML = T.map((t, i) => `<div class="fbox ${s.st[i] ? "on" : ""}" style="${s.st[i] === "bad" ? "border-color:var(--bad);background:var(--bad-soft)" : s.st[i] === "comp" ? "border-color:var(--warn);background:var(--warn-soft)" : ""}">${t}${s.st[i] === "comp" ? "<br><span class='small'>↩ " + C[i] + "</span>" : ""}</div>`).join('<div class="farrow">→</div>'); el_(root, "#sg-s").innerHTML = s.msg; el_(root, "#sg-n").textContent = `step ${k + 1} of ${steps.length}`; };
    el_(root, "#sg-f").addEventListener("change", plan);
    player(root, "sg", () => { if (k < steps.length - 1) { k++; show(); } }, () => { k = 0; show(); }, 1400, () => k >= steps.length - 1);
    plan(); return show;
  }
};

LABS.seChoreo = {
  title: "Orchestration vs choreography", cap: "Both coordinate a SAGA. In orchestration a central orchestrator tells each participant what to do and handles failures. In choreography participants react to each other's events through a broker, with no central control. Toggle to compare how the same agent workflow runs.",
  html: () => `<div class="slidergrid"><label for="ch-m">coordination <select id="ch-m"><option value="orch">orchestration (supervisor agent)</option><option value="chor">choreography (event-driven agents)</option></select></label><label for="ch-f"><input id="ch-f" type="checkbox"> review agent fails</label></div><div class="panel" id="ch-o" style="margin-top:8px"></div><div class="readout" id="ch-r"></div>`,
  mount(root) {
    const draw = () => { const m = el_(root, "#ch-m").value, f = el_(root, "#ch-f").checked;
      const lines = m === "orch" ? [

        f ? "orchestrator → review agent: \"review\" → <b style='color:var(--bad)'>ERROR</b>" : "orchestrator → review agent: \"review\" → strengths, weaknesses, suggestions (state saved)",

        f ? "" : "orchestrator marks job COMPLETED"] : [
        "validation agent consumes PAPER_SUBMITTED → publishes <code>VALIDATED</code>",

LABS.seBlackboard = {
  title: "Blackboard: specialists around a shared board", cap: "Knowledge sources (specialist agents) never call each other. Each watches the shared blackboard and contributes only when its precondition holds. A controller picks which eligible source runs next, until the solution is complete.",
  html: () => `<div class="slidergrid"><label for="bb-p">paper <select id="bb-p"><option value="good">well-formed paper with results</option><option value="bad">too short, no method section</option></select></label></div><div class="grid2" style="margin-top:8px"><div class="panel"><h4 style="margin-top:0">blackboard.json</h4><pre class="small" id="bb-j" style="margin:0;white-space:pre-wrap;overflow-wrap:anywhere"></pre></div><div class="panel"><h4 style="margin-top:0">controller</h4><div id="bb-c" class="small"></div></div></div><div class="row" style="margin-top:8px">${ctrlBtns("bb")}<span class="status-pill run" id="bb-n"></span></div>`,
  mount(root) {
    let bb, log, k;
    const KS = [["validation", b => b.validation === null, b => { b.validation = b._good ? "VALID" : "INVALID"; if (!b._good) b.status = "REJECTED"; }],
      ["review", b => b.validation === "VALID" && b.review === null, b => { b.review = { strengths: ["quantitative results", "baseline comparison"], weaknesses: ["no ablation"] }; }],
      ["summary", b => b.review !== null && b.summary === null, b => { b.summary = "Lightweight CNN finds solar-panel defects: 94.1% recall, 3x faster."; b.status = "COMPLETED"; }]];
    const reset = () => { bb = { _good: el_(root, "#bb-p").value === "good", validation: null, review: null, summary: null, status: "IN_PROGRESS" }; log = ["waiting: status IN_PROGRESS"]; k = 0; show(); };
    const show = () => { const { _good, ...v } = bb; el_(root, "#bb-j").textContent = JSON.stringify(v, null, 1); el_(root, "#bb-c").innerHTML = log.map(l => `<div>${l}</div>`).join(""); el_(root, "#bb-n").textContent = bb.status; };
    const step = () => { if (bb.status !== "IN_PROGRESS") return; const ready = KS.filter(x => x[1](bb)); k++; if (!ready.length) { bb.status = "STUCK"; } else { const [n, , act] = ready[0]; act(bb); log.push(`cycle ${k}: eligible [${ready.map(r => r[0]).join(", ")}] → runs <b>${n}</b>`); } show(); };
    el_(root, "#bb-p").addEventListener("change", reset);
    player(root, "bb", step, reset, 1300, () => bb.status !== "IN_PROGRESS");
    reset(); return show;
  }
};

LABS.seBinarySearch = {
  title: "Binary search: halve, compare, repeat", cap: "To find a value in a sorted list, compare with the middle element and discard half the list each time. The number of steps is about log₂ n: 20 steps for a million items.",
  html: () => `<div class="slidergrid"><label for="bs-t">target value <input id="bs-t" type="range" min="0" max="63" step="1" value="45"></label></div><div id="bs-a" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(24px,1fr));gap:2px;margin-top:8px"></div><div class="stepbox" id="bs-s" style="margin-top:8px;min-height:0"></div><div class="row" style="margin-top:8px">${ctrlBtns("bs")}<span class="status-pill run" id="bs-n"></span></div>`,
  mount(root) {
    const A = Array.from({ length: 32 }, (_, i) => i * 2); let lo, hi, mid, k, done, msg;
    const reset = () => { lo = 0; hi = A.length - 1; mid = null; k = 0; done = false; msg = `Sorted list of ${A.length} even numbers. Searching for <b>${+el_(root, "#bs-t").value}</b>. Linear search could need up to ${A.length} comparisons; binary search needs at most ${Math.ceil(Math.log2(A.length + 1))}.`; show(); };
    const show = () => { const t = +el_(root, "#bs-t").value;
      el_(root, "#bs-a").innerHTML = A.map((v, i) => `<div class="small num" style="text-align:center;padding:4px 0;border-radius:4px;background:${i === mid ? (v === t ? "var(--good)" : "var(--warn-soft)") : i >= lo && i <= hi && !done ? "var(--se-soft)" : "transparent"};${i === mid && v === t ? "color:#fff" : ""};opacity:${i >= lo && i <= hi || i === mid ? 1 : .35}">${v}</div>`).join("");
      el_(root, "#bs-s").innerHTML = msg; el_(root, "#bs-n").textContent = `${k} comparison${k === 1 ? "" : "s"}`; };
    const step = () => { if (done) return; const t = +el_(root, "#bs-t").value; if (lo > hi) { done = true; msg = `Range empty: <b>${t}</b> is not in the list (odd numbers never are). ${k} comparisons.`; show(); return; }
      mid = (lo + hi) >> 1; k++; if (A[mid] === t) { done = true; msg = `A[${mid}] = ${A[mid]} = target. Found in <b>${k}</b> comparisons.`; } else if (A[mid] < t) { msg = `A[${mid}] = ${A[mid]} &lt; ${t}: discard the left half.`; lo = mid + 1; } else { msg = `A[${mid}] = ${A[mid]} &gt; ${t}: discard the right half.`; hi = mid - 1; } show(); };
    el_(root, "#bs-t").addEventListener("input", reset);
    player(root, "bs", step, reset, 1100, () => done); reset(); return show;
  }
};

      el_(root, "#vz-r").innerHTML = `<span>n = ${n.toLocaleString()} · NumPy is about <b>${(T[0][1] / T[2][1]).toFixed(0)}×</b> faster than the loop</span><span>Memory too: a million floats take ~31 MiB as a list of Python objects but ~8 MiB as a NumPy array.</span>`; };

  if(rating==="again") return sch[0]; if(rating==="hard") return Math.max(sch[0],Math.round(cur*0.6)||sch[0]); if(rating==="good") return c?up(cur):sch[0]; return c?up(up(cur)):(sch[1]||sch[0]*3); }

</div>`;

  else if(view==="split") splitView(body,s,C);
  else if(view==="interview") tabInterview(body,s,C);
  else if(view==="recall") tabRecall(body,s,C);
  else tabPractice(body,s,C);
  if(VIEW.sec) requestAnimationFrame(()=>setTimeout(()=>{ const t=document.getElementById(VIEW.sec.startsWith("h")||["what","why","demo"].includes(VIEW.sec)?"s-"+VIEW.sec:"d-"+VIEW.sec)||document.getElementById("s-"+VIEW.sec)||document.getElementById("d-"+VIEW.sec); if(t){ t.scrollIntoView({block:"start"}); t.classList.add("flash"); setTimeout(()=>t.classList.remove("flash"),1600); } },200));

function readBtn(sid,id){ const on=(ST.read[sid]||[]).includes(id); return `<button class="btn sm ${on?"":"primary"} readbtn" data-read="${id}">${on?"✓ Read":"Mark as read"}</button>`; }

function simpleHTML(s,C,ctx){ const S=C.simple, inSplit=ctx==="split";

  const part=(n,id,title,inner,links)=>`<section class="spart" id="s-${id}" data-link="${(links||[]).join(" ")}"><div class="sp-head"><span class="pnum">${n}</span><h2>${title}</h2></div>${inner}<div class="row sp-foot">${mathBtn(links)}${inSplit?"":readBtn(s.id,id)}</div></section>`;

   ${part(7,"takeaways","Five important takeaways",`<ol class="takeaways">${S.takeaways.map(t=>`<li>${t}</li>`).join("")}</ol>`,[])}

function deepHTML(s,C,ctx){ const D=C.deep, inSplit=ctx==="split", bl=backLinks(C), I=D.intro;

     <div class="row sp-foot">${simpleBtn(x.id)}${inSplit?"":readBtn(s.id,x.id)}</div></section>`).join("")}

   <section class="dsec" id="d-iq"><div class="sec-head"><h2>Advanced interview questions</h2></div><div class="list">${C.interview.filter(q=>q.level==="a").slice(0,6).map(q=>`<div><b class="small">${q.q}</b><div class="small muted">${q.short}</div></div>`).join("")}</div><div class="row" style="margin-top:10px"><button class="btn sm" data-go="session" data-id="${s.id}" data-view="interview">All ${C.interview.length} questions and simulation mode</button></div></section>

function eqRange(a){ const out=[]; let st=a[0],pr=a[0]; for(let i=1;i<=a.length;i++){ if(a[i]===pr+1){ pr=a[i]; continue; } out.push(st===pr?st:`${st}–${pr}`); st=pr=a[i]; } return out.join(", "); }
function alsoCovered(sid){ const o=CAT.overlaps.filter(x=>x.refs.some(r=>r[0]===sid)); if(!o.length) return ""; return `<section class="dsec" id="d-related"><div class="panel"><h3>Also covered in other sessions</h3><div class="list">${o.map(x=>`<div><b class="small">${x.concept}</b><div class="row" style="margin-top:4px">${x.refs.filter(r=>r[0]!==sid&&SESS[r[0]]).map(r=>`<button class="chip wrapchip ${subjChip(SESS[r[0]].subject)}" data-go="session" data-id="${r[0]}" style="border:0;cursor:pointer">${subjTag(r[0])} · ${esc(SESS[r[0]].title)}</button>`).join("")}</div></div>`).join("")}</div></div></section>`; }

function afterArticle(root,s,C){ mountLabs(root);
  $$("[data-read]",root).forEach(b=>b.onclick=()=>{ const id=b.dataset.read,on=!(ST.read[s.id]||[]).includes(id); markRead(s.id,id,on); b.textContent=on?"✓ Read":"Mark as read"; b.classList.toggle("primary",!on); if(on) toast(`${Math.round(sessionProgress(s.id)*100)}% of this session read`); });

/* ---------- Split view with topic sync ---------- */
let SPLIT={follow:true,full:null,tab:"simple",lock:0};
function splitView(body,s,C){
  const narrow=matchMedia("(max-width: 900px)").matches;
  body.innerHTML=`<div class="split ${narrow?"narrow":""} ${SPLIT.full?"full-"+SPLIT.full:""}" id="split" data-tab="${SPLIT.tab}">
    ${narrow?`<div class="seg splittabs" role="tablist"><button role="tab" data-t="simple" aria-selected="${SPLIT.tab==="simple"}">Simple Learning</button><button role="tab" data-t="deep" aria-selected="${SPLIT.tab==="deep"}">Deep Dive</button></div>`:""}
    <div class="pane left" id="paneL"><div class="panehead"><b>Simple Learning</b><span class="row" style="gap:6px"><label class="small"><input type="checkbox" id="follow" ${SPLIT.follow?"checked":""}> Follow along</label><button class="btn sm ghost" data-full="left">${SPLIT.full==="left"?"Exit full screen":"Expand"}</button></span></div><div class="panebody" id="pbL">${simpleHTML(s,C,"split")}</div></div>
    <div class="pane right" id="paneR"><div class="panehead"><b>Deep Dive</b><span class="row" style="gap:6px"><span class="small muted" id="synclbl"></span><button class="btn sm ghost" data-full="right">${SPLIT.full==="right"?"Exit full screen":"Expand"}</button></span></div><div class="panebody" id="pbR">${deepHTML(s,C,"split")}</div></div></div>`;
  afterArticle(body,s,C);
  $$("[data-full]",body).forEach(b=>b.onclick=()=>{ SPLIT.full=SPLIT.full===b.dataset.full?null:b.dataset.full; const el=$("#split"); el.classList.remove("full-left","full-right"); if(SPLIT.full) el.classList.add("full-"+SPLIT.full); $$("[data-full]",body).forEach(x=>x.textContent=SPLIT.full===x.dataset.full?"Exit full screen":"Expand"); setTimeout(redrawLabs,60); });
  $$(".splittabs button",body).forEach(b=>b.onclick=()=>{ SPLIT.tab=b.dataset.t; $("#split").dataset.tab=SPLIT.tab; $$(".splittabs button",body).forEach(x=>x.setAttribute("aria-selected",x.dataset.t===SPLIT.tab)); setTimeout(redrawLabs,60); });
  $("#follow",body).onchange=e=>{ SPLIT.follow=e.target.checked; };
  $$("#pbL .spart, #pbL .hstep",body).forEach(el=>el.addEventListener("click",e=>{ if(e.target.closest("button,input,select,label,canvas,a")) return; const l=(el.dataset.link||"").split(" ").filter(Boolean)[0]; if(l) syncTo(l,true,el); }));
  if(!narrow){ const obs=new IntersectionObserver(es=>{ if(!SPLIT.follow||Date.now()<SPLIT.lock) return; const vis=es.filter(e=>e.isIntersecting); if(!vis.length) return; const el=vis[0].target; const l=(el.dataset.link||"").split(" ").filter(Boolean)[0]; if(l) syncTo(l,false,el); },{root:$("#pbL"),rootMargin:"-25% 0px -65% 0px"});
    $$("#pbL .hstep, #pbL .spart[data-link]:not([data-link=''])",body).forEach(x=>obs.observe(x)); mounted.push({stop:()=>obs.disconnect()}); }
}
function relTop(el,pane){ return el.getBoundingClientRect().top-pane.getBoundingClientRect().top+pane.scrollTop; }
function syncTo(deepId,explicit,fromEl){ const pane=$("#pbR"), t=document.getElementById("d-"+deepId); if(!pane||!t) return; if(explicit) SPLIT.lock=Date.now()+1500;
  $$(".dsec.hl").forEach(x=>x.classList.remove("hl")); t.classList.add("hl"); $$("#pbL .active").forEach(x=>x.classList.remove("active")); if(fromEl) fromEl.classList.add("active");
  if(matchMedia("(max-width: 900px)").matches && explicit){ SPLIT.tab="deep"; $("#split").dataset.tab="deep"; $$(".splittabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t==="deep")); }
  pane.scrollTo({top:relTop(t,pane)-8,behavior:reduceMotion()?"auto":"smooth"}); const lbl=$("#synclbl"); if(lbl) lbl.textContent="Showing: "+t.querySelector("h2").textContent; }
function syncLeft(simpleId){ const pane=$("#pbL"), t=document.getElementById("s-"+simpleId); if(!pane||!t) return; if(matchMedia("(max-width: 900px)").matches){ SPLIT.tab="simple"; $("#split").dataset.tab="simple"; }

function tabRecall(el,s,C){ const R=C.meta.recall; el.innerHTML=`<div class="stack" style="max-width:860px;gap:26px"><div><div class="eyebrow">One-minute summary</div><div class="minute" style="margin-top:8px">${R.minute}</div></div>

const LV={b:"Beginner",i:"Intermediate",a:"Advanced"}, KIND={concept:"Concept",scenario:"Scenario",coding:"Coding",compare:"Comparison"};
function qBody(sid,q){ const key=sid+"|"+q.id, c=ST.conf[key]||0;
  return `<div><h5>30-second answer</h5><div class="short">${q.short}</div></div><div><h5>Detailed technical answer</h5><div>${q.detail}</div></div><div><h5>Practical application</h5><div>${q.example}</div></div>
  <div class="grid2"><div><h5>Likely follow-up questions</h5><ul>${q.follow.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><h5>Common interview traps</h5><ul>${q.mistakes.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
  <div class="conf" data-conf="${key}"><span class="muted">How confident are you?</span>${[[1,"Shaky"],[2,"Okay"],[3,"Solid"]].map(([n,l])=>`<button class="stbtn" data-c="${n}" aria-pressed="${c===n}"><i class="confdot c${n}"></i>${l}</button>`).join("")}</div>`; }
function bindConf(root){ $$("[data-conf]",root).forEach(box=>$$("button",box).forEach(b=>b.onclick=()=>{ const k=box.dataset.conf,n=+b.dataset.c; ST.conf[k]=ST.conf[k]===n?0:n; save(); $$("button",box).forEach(x=>x.setAttribute("aria-pressed",+x.dataset.c===ST.conf[k])); const dot=$(`[data-dot="${k}"]`); if(dot) dot.className="confdot c"+(ST.conf[k]||0); })); }
function questionList(el,items,opts={}){ const f=Object.assign({lvl:"all",kind:"all",q:""},el._f||{}); el._f=f;
  const draw=()=>{ const term=f.q.toLowerCase(); const list=items.filter(({q})=>(f.lvl==="all"||q.level===f.lvl)&&(f.kind==="all"||q.kind===f.kind)&&(!term||(q.q+q.short).toLowerCase().includes(term)));
    const seg=(name,vals)=>`<div class="seg" role="group">${vals.map(([k,l])=>`<button data-f="${name}" data-v="${k}" aria-pressed="${f[name]===k}">${l}</button>`).join("")}</div>`; const cnt=k=>items.filter(({q})=>q.level===k).length;
    el.innerHTML=`<div class="filters">${seg("lvl",[["all","All "+items.length],["b","Beginner "+cnt("b")],["i","Intermediate "+cnt("i")],["a","Advanced "+cnt("a")]])}${seg("kind",[["all","All types"],["concept","Concept"],["scenario","Scenario"],["coding","Coding"],["compare","Comparison"]])}<input id="qfilter" type="search" placeholder="Filter questions" value="${esc(f.q)}" aria-label="Filter questions"></div>
    <div>${list.map(({sid,q})=>`<div class="qcard"><button aria-expanded="false" data-q="${sid}|${q.id}"><span class="lvl ${q.level}">${LV[q.level]}</span><span class="qt">${q.q}${opts.showSession?`<span class="muted small"> · ${SESS[sid].subject.toUpperCase()} ${SESS[sid].code}</span>`:""}</span><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="chip">${KIND[q.kind]}</span><i class="confdot c${ST.conf[sid+"|"+q.id]||0}" data-dot="${sid}|${q.id}"></i></span></button><div class="qbody" hidden></div></div>`).join("")||`<div class="empty">No questions match these filters.</div>`}</div>`;
    $$("[data-f]",el).forEach(b=>b.onclick=()=>{ f[b.dataset.f]=b.dataset.v; draw(); });
    const inp=$("#qfilter",el); inp.oninput=()=>{ f.q=inp.value; clearTimeout(inp._t); inp._t=setTimeout(()=>{ draw(); const n=$("#qfilter",el); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); };
    $$(".qcard > button",el).forEach(b=>b.onclick=()=>{ const body=b.nextElementSibling; if(body.hidden){ const [sid,id]=b.dataset.q.split("|"); const q=items.find(x=>x.sid===sid&&x.q.id===id).q; body.innerHTML=qBody(sid,q); body.hidden=false; typeset(body); hl(body); bindConf(body); } else body.hidden=true; b.setAttribute("aria-expanded",!body.hidden); });
    typeset(el); }; draw(); }
function simulation(el,items){ let lvl="all", order=[], i=0, revealed=false, res=[];
  const setup=()=>{ el.innerHTML=`<div class="panel sim"><h3>Interview simulation</h3><p class="small muted" style="margin-top:0">One question at a time. Answer out loud or type, then reveal and rate yourself. Ratings feed your weak-topics list.</p>
    <div class="row"><div class="seg">${[["all","Mixed"],["b","Beginner"],["i","Intermediate"],["a","Advanced"]].map(([k,l])=>`<button data-l="${k}" aria-pressed="${lvl===k}">${l}</button>`).join("")}</div><label class="small">Questions <select id="simn"><option>5</option><option selected>10</option><option>20</option></select></label><button class="btn primary" id="simgo">Start</button></div></div>`;
    $$("[data-l]",el).forEach(b=>b.onclick=()=>{ lvl=b.dataset.l; $$("[data-l]",el).forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===lvl)); });
    $("#simgo",el).onclick=()=>{ const pool=items.filter(x=>lvl==="all"||x.q.level===lvl).slice(); for(let k=pool.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [pool[k],pool[j]]=[pool[j],pool[k]]; } order=pool.slice(0,+$("#simn",el).value); i=0; res=[]; revealed=false; ask(); }; };
  const ask=()=>{ if(i>=order.length) return summary(); const {sid,q}=order[i];
    el.innerHTML=`<div class="panel sim"><div class="row" style="justify-content:space-between"><span class="eyebrow">Question ${i+1} of ${order.length} · ${LV[q.level]} · ${KIND[q.kind]}</span><button class="btn sm ghost" id="simstop">End</button></div><div class="bar" style="margin:8px 0 14px"><i style="width:${100*i/order.length}%"></i></div>
      <h3 class="simq">${q.q}</h3><label class="small muted" for="simans">Your answer (stays on this page only)</label><textarea id="simans" rows="4" placeholder="Talk it through or type key points…"></textarea>
      ${revealed?`<div class="qbody" style="padding:0;margin-top:14px">${qBody(sid,q)}</div><div class="row" style="margin-top:12px"><span class="small">How did you do?</span><button class="btn" data-r="1">Missed it</button><button class="btn" data-r="2">Partly</button><button class="btn primary" data-r="3">Nailed it</button></div>`:`<div class="row" style="margin-top:10px"><button class="btn primary" id="simrev">Reveal answer</button><button class="btn ghost" id="simskip">Skip</button></div>`}</div>`;
    typeset(el); hl(el); if(revealed) bindConf(el); $("#simstop",el).onclick=summary;
    if(!revealed){ $("#simrev",el).onclick=()=>{ const t=$("#simans",el).value; revealed=true; ask(); $("#simans",el).value=t; }; $("#simskip",el).onclick=()=>{ res.push({sid,q,r:0}); i++; ask(); }; }
    else $$("[data-r]",el).forEach(b=>b.onclick=()=>{ const r=+b.dataset.r; ST.conf[sid+"|"+q.id]=r; save(); res.push({sid,q,r}); i++; revealed=false; ask(); }); };
  const summary=()=>{ const c=n=>res.filter(x=>x.r===n).length; el.innerHTML=`<div class="panel sim"><h3>Simulation finished</h3><div class="row" style="gap:18px;margin:8px 0"><span><b class="num">${c(3)}</b> nailed</span><span><b class="num">${c(2)}</b> partly</span><span><b class="num">${c(1)}</b> missed</span><span><b class="num">${c(0)}</b> skipped</span></div>
    ${res.filter(x=>x.r<=1).length?`<div class="eyebrow">Review these</div><div class="list">${res.filter(x=>x.r<=1).map(x=>`<div class="small">${x.q.q} <span class="muted">· ${SESS[x.sid].subject.toUpperCase()} ${SESS[x.sid].code}</span></div>`).join("")}</div>`:""}<div class="row" style="margin-top:12px"><button class="btn primary" id="simagain">New simulation</button></div></div>`; typeset(el); $("#simagain",el).onclick=setup; };
  setup(); }
function tabInterview(el,s,C){ const items=C.interview.map(q=>({sid:s.id,q})); el.innerHTML=`<div id="sim"></div><h2 style="margin:22px 0 10px">All questions</h2><div id="ql"></div>`; simulation($("#sim",el),items); questionList($("#ql",el),items); }

function tabPractice(el,s,C){ el.innerHTML=`<div class="grid2" style="align-items:start"><div><h2>Flashcards</h2><p class="muted small">${C.meta.flashcards.length} cards. Rate yourself; the next review date adapts to how well you recalled it.</p><div id="fc"></div></div><div><h2>Quiz</h2><p class="muted small">${C.quiz.length} questions: multiple choice, multi-select, true/false, numerical and code reading.</p><div id="qzwrap"></div></div></div>`;

function flashDeck(el,cards,onDone){ let idx=0,shown=false;
  const draw=()=>{ if(idx>=cards.length){ el.innerHTML=`<div class="fcard"><h3>Deck finished</h3><p class="muted">Next due dates are on the Revision page.</p><div class="row"><button class="btn" id="fcr">Go through again</button><button class="btn" data-go="revision">Open revision</button></div></div>`; $("#fcr",el).onclick=()=>{ idx=0; draw(); }; onDone&&onDone(); return; }
    const c=cards[idx], card=c.card, st=ST.cards[c.k]; const prev=r=>{ const d=nextInterval(st,r); return d===1?"1 day":d+" days"; };
    el.innerHTML=`<div class="flash"><div class="fcard"><div class="row" style="justify-content:space-between"><span class="eyebrow">Card ${idx+1} of ${cards.length}</span><span class="chip src">${subjTag(c.sid)}</span></div><div class="side"><b>${card[0]}</b></div>${shown?`<div class="side ans">${card[1]}</div>`:""}
      ${shown?`<div class="rate">${[["again","Again"],["hard","Hard"],["good","Good"],["easy","Easy"]].map(([k,l])=>`<button class="btn" data-r="${k}">${l}<small>${prev(k)}</small></button>`).join("")}</div>`:`<div class="row"><button class="btn primary" id="fcs">Show answer</button><span class="muted small">${st?`last interval ${st.ivl}d · seen ${st.reps}×`:"new card"}</span></div>`}</div></div>`;
    typeset(el); if(!shown) $("#fcs",el).onclick=()=>{ shown=true; draw(); }; else $$("[data-r]",el).forEach(b=>b.onclick=()=>{ rateCard(c.k,b.dataset.r); shown=false; idx++; draw(); $("#nav").innerHTML=navHtml(false); }); }; draw(); }
async function quizStart(el,sids){ const qs=[]; for(const sid of sids){ const C=await loadSession(sid); C.quiz.forEach((q,i)=>qs.push(Object.assign({sid,i},q))); }
  el.innerHTML=`<div class="quiz">${qs.map((q,n)=>`<div class="qz" data-n="${n}"><div class="eyebrow" style="margin-bottom:6px">Q${n+1} · ${{mcq:"Multiple choice",multi:"Select all that apply",tf:"True or false",num:"Numerical",code:"Code reading"}[q.type]}${sids.length>1?` · ${SESS[q.sid].subject.toUpperCase()} ${SESS[q.sid].code}`:""}</div><div class="qtext ${q.type==="code"?"code":""}">${q.type==="code"?esc(q.q):q.q}</div>
    ${q.type==="num"?`<input id="qn${n}" type="number" step="any" style="background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 8px;width:160px" aria-label="Answer for question ${n+1}">`:(q.type==="tf"?["True","False"]:q.opts).map((o,k)=>`<label class="opt"><input type="${q.type==="multi"?"checkbox":"radio"}" name="q${n}" value="${k}"><span>${q.type==="code"?`<code>${esc(o)}</code>`:o}</span></label>`).join("")}<div class="fbslot"></div></div>`).join("")}
    <div class="row"><button class="btn primary" id="qsub">Submit answers</button><span class="muted small">You can leave questions blank.</span></div><div id="qres"></div></div>`; typeset(el);
  $("#qsub",el).onclick=()=>{ let score=0; const misses=[]; qs.forEach((q,n)=>{ const box=$(`.qz[data-n="${n}"]`,el); let ok=false,picked=[];
      if(q.type==="num"){ const v=parseFloat($(`#qn${n}`,el).value); ok=isFinite(v)&&Math.abs(v-q.a)<=q.tol; } else { picked=$$(`input[name=q${n}]:checked`,box).map(i=>+i.value); const correct=q.type==="tf"?[q.a?0:1]:q.a; ok=picked.length===correct.length&&picked.every(p=>correct.includes(p)); $$(".opt",box).forEach((o,k)=>{ if(correct.includes(k)) o.classList.add("right"); else if(picked.includes(k)) o.classList.add("wrongpick"); }); }
      if(ok) score++; else misses.push(q.sid+"::"+q.topic);
      const wrongWhy=!ok&&q.wrong?picked.filter(p=>q.wrong[p]).map(p=>`<div><b>Why “${esc((q.opts||[])[p]||"")}” is wrong:</b> ${q.wrong[p]}</div>`).join(""):"";
      $(".fbslot",box).innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b> ${q.type==="num"?`Answer: ${q.a}. `:""}${q.why} ${wrongWhy}</div>`; $$("input",box).forEach(i=>i.disabled=true); });
    const pct=score/qs.length; sids.forEach(sid=>{ (ST.quiz[sid]=ST.quiz[sid]||[]).push({t:Date.now(),score,total:qs.length,misses:[...new Set(misses.filter(m=>m.startsWith(sid+"::")).map(m=>m.split("::")[1]))]}); sessionReviewAdjust(sid,pct); }); save();

    $("#qres",el).innerHTML=`<div class="score"><b class="num">${score} / ${qs.length}</b><div><div>${pct>=.85?"Strong. Your next review has been pushed out.":pct>=.6?"Good. Review the misses below.":"Worth another pass through the session; your review was moved to tomorrow."}</div>${recs.length?`<div class="small muted" style="margin-top:6px">Weak topics: ${[...new Set(recs.map(r=>r.t))].map(esc).join(", ")}</div><div class="row" style="margin-top:8px">${[...new Map(recs.map(r=>[r.sid+r.sec,r])).values()].map(r=>`<button class="btn sm" data-go="session" data-id="${r.sid}" data-view="deep" data-sec="${r.sec}">Revisit: ${esc(r.t)}</button>`).join("")}</div>`:""}<div class="row" style="margin-top:8px"><button class="btn sm ghost" id="qagain">Retake quiz</button></div></div></div>`;
    $("#qsub",el).disabled=true; $("#qagain",el).onclick=()=>quizStart(el,sids); typeset(el); $("#qres",el).scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"center"}); }; }

  <div class="tablewrap"><table class="inv cov" id="covt"><tr><th>Session</th><th>Topic</th><th>Simple page</th><th>Deep Dive</th><th>Visualisation</th><th>Status</th></tr>
  ${rows.map(r=>`<tr data-st="${r.st}"><td class="small nowrap">${subjTag(r.s.id)}</td><td>${esc(r.t[0])}</td><td>${r.cv?r.cv.simple.map(id=>link(r.s,"simple",id,({what:"What",why:"Why",demo:"Demo",example:"Example",misunderstand:"Misunderstandings",takeaways:"Takeaways",thirty:"30 seconds",check:"Check"})[id]||"Step "+String.fromCharCode(96+ +id.slice(1)))).join(" "):"–"}</td><td>${r.cv?r.cv.deep.map(id=>link(r.s,"deep",id,(CACHE[r.s.id].deep.sections.find(x=>x.id===id)||{title:id}).title.split(/[,:]/)[0])).join(" "):"–"}</td><td class="small">${r.cv&&r.cv.viz.length?r.cv.viz.map(z=>LABS[z]?LABS[z].title:z).join("; "):"–"}</td><td>${pill(r.st)}${r.cv&&r.cv.note?`<div class="small muted">${r.cv.note}</div>`:""}</td></tr>`).join("")}</table></div>
  ${built().map(s=>{ const E=CACHE[s.id].meta.coverage.elements; return `<details class="deeper"><summary>${subjTag(s.id)} · ${esc(s.title)}: ${E.length} equations, algorithms, examples and diagrams</summary><div class="tablewrap"><table class="inv"><tr><th>Element</th><th>Type</th><th>Deep Dive section</th></tr>${E.map(([t,k,d])=>`<tr><td class="small">${t}</td><td class="small muted">${k}</td><td>${link(s,"deep",d,(CACHE[s.id].deep.sections.find(x=>x.id===d)||{title:d}).title)}</td></tr>`).join("")}</table></div></details>`; }).join("")}`;
  $$("#covf button",v).forEach(b=>b.onclick=()=>{ $$("#covf button",v).forEach(x=>x.setAttribute("aria-pressed",x===b)); $$("#covt tr[data-st]",v).forEach(tr=>tr.hidden=!(b.dataset.c==="all"||tr.dataset.st===b.dataset.c)); }); }

/* ======================= Library & privacy ======================= */
async function viewLibrary(v){ const T=TOTAL();
  v.innerHTML=`<div class="crumb"><button data-go="home">Home</button><span>›</span><span>About & privacy</span></div><div class="s-head"><h1>About & privacy</h1><p class="lede">How this site is organised and how your data is handled.</p></div>
  <div class="grid2" style="align-items:start"><div class="panel"><h3>Privacy</h3><ul class="small" style="margin:0;padding-left:1.1em">${CAT.privacy.map(p=>`<li>${p}</li>`).join("")}</ul></div>
  <div class="panel"><h3>How the content is organised</h3><p class="small" style="margin-top:0">Each session is five separate files, loaded on demand:</p><pre class="pseudo small">content/
  catalog.json                 subjects, sessions, topics
  &lt;subject&gt;/&lt;session&gt;/
          simple.json          Simple Learning page
          deep-dive.json       Technical Deep Dive page
          interview.json       interview questions
          quiz.json            quiz
          meta.json            recall, flashcards, coverage</pre><p class="small">Every view has its own address: add <code>#ml-m3-simple</code>, <code>#ml-m3-deep</code>, <code>#ml-m3-split</code>, <code>#ml-m3-interview</code>, <code>#ml-m3-recall</code> or <code>#ml-m3-practice</code> to this page's link (same pattern for every session).</p></div></div>
  <h2 style="margin:24px 0 10px">Session inventory</h2><div class="tablewrap"><table class="inv"><tr><th>Subject</th><th>Session</th><th class="num">Topics</th><th>Learning pages</th></tr>${ALL_SESSIONS.map(s=>`<tr><td>${(SUBJECTS.find(x=>x.id===s.subject)||{}).short}</td><td><button class="linkrow" style="padding:0" data-go="session" data-id="${s.id}"><span class="t">${s.code} · ${esc(s.title)}</span></button></td><td class="num">${s.topics.length}</td><td>${s.built?`<span class="chip src">Simple + Deep Dive</span>`:`<span class="chip">outline</span>`}</td></tr>`).join("")}<tr><th colspan="2">Total</th><th class="num">${T.topics}</th><th>${built().length} of ${ALL_SESSIONS.length} built</th></tr></table></div>
  <div class="grid2" style="margin-top:22px;align-items:start"><div class="panel"><h3>Concepts across sessions</h3><div class="list">${CAT.overlaps.map(o=>`<div><b class="small">${o.concept}</b><div class="row" style="margin-top:4px">${o.refs.filter(r=>SESS[r[0]]).map(r=>`<button class="chip ${subjChip(SESS[r[0]].subject)}" style="border:0;cursor:pointer" data-go="session" data-id="${r[0]}">${subjTag(r[0])}</button>`).join("")}</div></div>`).join("")}</div></div>
  <div class="stack"><div class="panel"><h3>Roadmap</h3><div class="list">${CAT.roadmap.map(([t,st,d],i)=>`<div class="row" style="justify-content:space-between;flex-wrap:nowrap;align-items:flex-start"><span><span class="small"><b>${i+1}.</b> ${t}</span><br><span class="muted small">${d}</span></span><span class="chip ${st==="done"?"good":st==="in progress"?"warn":""}">${st}</span></div>`).join("")}</div></div></div></div>`; }

/* ======================= Search ======================= */
let INDEX=null;
function strip(h){ return String(h).replace(/<[^>]+>/g," ").replace(/\$\$?([^$]*)\$\$?/g,"$1").replace(/\\[a-zA-Z]+/g," ").replace(/[{}_^\\]/g," ").replace(/\s+/g," ").trim(); }
async function buildIndex(){ const I=[]; const add=(type,title,desc,go,args,body="")=>I.push({type,title:strip(title),desc:strip(desc),go,args,hay:(strip(title)+" "+strip(desc)+" "+strip(body)).toLowerCase()});
  SUBJECTS.forEach(S=>{ add("Subject",S.name,S.blurb,"subject",{id:S.id}); S.sessions.forEach(s=>{ add("Session",`${s.code} · ${s.title}`,`${S.name} · ${s.topics.length} topics`,"session",{id:s.id},s.topics.map(t=>t[0]).join(" ")); s.topics.forEach(t=>add("Topic",t[0],`${S.short} ${s.code} · ${s.title}`,"session",{id:s.id})); }); });
  for(const s of built()){ const C=await loadSession(s.id), tag=subjTag(s.id);
    C.simple.how.forEach(h=>add("Simple explanation",h.title,`${tag} · Simple Learning`,"session",{id:s.id,view:"simple",sec:h.id},h.html));
    C.deep.sections.forEach(x=>add("Deep Dive",x.title,`${tag} · Deep Dive${x.tag==="extra"?" · supplementary":""}${x.eqs?" · Eq. "+eqRange(x.eqs):""}`,"session",{id:s.id,view:"deep",sec:x.id},x.body));
    C.meta.recall.defs.forEach(([a,b])=>add("Definition",a,b,"session",{id:s.id,view:"recall"})); C.meta.recall.formulas.forEach(f=>add("Formula",f,tag,"session",{id:s.id,view:"recall"}));
    C.deep.code.forEach(c=>add("Code example",c.title,`${tag} · ${c.lib}`,"session",{id:s.id,view:"deep",sec:"code"},c.code)); C.interview.forEach(q=>add("Interview question",q.q,q.short,"session",{id:s.id,view:"interview"},q.detail)); }
  CAT.overlaps.forEach(o=>add("Across sessions",o.concept,"Covered in "+o.refs.filter(r=>SESS[r[0]]).map(r=>subjTag(r[0])).join(", "),"library",{})); return I; }
async function openSearch(){ const layer=$("#layer"); layer.innerHTML=`<div class="overlay" id="sov" role="dialog" aria-modal="true" aria-label="Search"><div class="sbox"><input id="sq" type="search" placeholder="Search subjects, concepts, formulas, questions, code…" aria-label="Search"><div class="sres" id="sr"><div class="grp empty">Loading index…</div></div></div></div>`;
  const inp=$("#sq"),res=$("#sr"); inp.focus(); $("#sov").onclick=e=>{ if(e.target.id==="sov") layer.innerHTML=""; }; INDEX=INDEX||await buildIndex(); let sel=0,hits=[];
  const order=["Session","Simple explanation","Deep Dive","Topic","Definition","Formula","Interview question","Code example","Across sessions","Subject"];
  const run=()=>{ const q=inp.value.toLowerCase().trim(), toks=q.split(/\s+/).filter(Boolean);
    if(!toks.length){ res.innerHTML=`<div class="grp eyebrow">Try</div>${["gradient descent","backpropagation","attention","regularisation","softmax","normal equation"].map(t=>`<button data-try="${t}"><span class="t">${t}</span></button>`).join("")}`; $$("[data-try]",res).forEach(b=>b.onclick=()=>{ inp.value=b.dataset.try; run(); }); hits=[]; return; }
    hits=INDEX.map(it=>{ let sc=0; for(const t of toks){ if(!it.hay.includes(t)) return null; if(it.title.toLowerCase().includes(t)) sc+=3; } if(it.title.toLowerCase().includes(q)) sc+=5; return {it,sc}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,60);
    const groups={}; hits.forEach(h=>(groups[h.it.type]=groups[h.it.type]||[]).push(h)); hits=[];
    res.innerHTML=order.filter(g=>groups[g]).map(g=>`<div class="grp eyebrow">${g}</div>`+groups[g].slice(0,5).map(h=>{ hits.push(h); return `<button data-h="${hits.length-1}"><div class="t">${esc(h.it.title.length>110?h.it.title.slice(0,108)+"…":h.it.title)}</div><div class="d">${esc(h.it.desc.slice(0,130))}</div></button>`; }).join("")).join("")||`<div class="grp empty">Nothing in your material matches “${esc(q)}”.</div>`;
    sel=0; mark(); $$("[data-h]",res).forEach(b=>b.onclick=()=>pick(+b.dataset.h)); };
  const mark=()=>$$("[data-h]",res).forEach(b=>b.classList.toggle("on",+b.dataset.h===sel)); const pick=i=>{ const h=hits[i]; if(!h) return; layer.innerHTML=""; go(h.it.go,Object.assign({},h.it.args)); };
  inp.oninput=run; inp.onkeydown=e=>{ if(e.key==="ArrowDown"){ sel=Math.min(sel+1,hits.length-1); mark(); e.preventDefault(); } else if(e.key==="ArrowUp"){ sel=Math.max(sel-1,0); mark(); e.preventDefault(); } else if(e.key==="Enter") pick(sel); else if(e.key==="Escape") layer.innerHTML=""; }; run(); }
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); } else if(e.key==="Escape"){ if($("#layer")&&$("#layer").innerHTML) $("#layer").innerHTML=""; else if(SPLIT.full&&$("#split")){ SPLIT.full=null; render(); } } });

/* ======================= Boot ======================= */
(async function boot(){ try{ const t=localStorage.getItem("udit-hub-theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
  loadLocal(); shell(); try{ await loadCatalog(); }catch(e){ $("#view").innerHTML=`<div class="panel"><h3>Content could not load</h3><p class="muted">${esc(e.message)}. Reload the page to try again.</p></div>`; return; }
  VIEW=parseHash(); render(); initSync(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redrawLabs);
  let rz,lastW=innerWidth; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ const crossed=(lastW>900)!==(innerWidth>900); lastW=innerWidth; if(crossed&&VIEW.view==="split") render(); else redrawLabs(); },200); }); })();

</script>
