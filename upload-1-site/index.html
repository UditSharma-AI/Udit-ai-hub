LABS.drRandomWalk = {
  title: "TD vs Monte Carlo on a random walk", cap: "Five states A–E between two exits; start at C, step left or right with equal probability; +1 only for exiting on the right (γ = 1). True values are 1/6 … 5/6. RMS error averaged over 50 runs; estimates start at 0.5.",
  html: () => `<div class="slidergrid xh"><label for="rw-a">TD α <b class="num" id="rw-av"></b><input id="rw-a" type="range" min="0.01" max="0.3" step="0.01" value="0.1"></label><label for="rw-b">MC α <b class="num" id="rw-bv"></b><input id="rw-b" type="range" min="0.01" max="0.3" step="0.01" value="0.02"></label></div><div id="rw-c" style="margin-top:6px"></div><div class="readout" id="rw-r"></div>`,
  mount(root) {
    const TRUE = [1, 2, 3, 4, 5].map(x => x / 6);
    const sim = (td, a) => { const r = prng(4), E = 100, err = new Float64Array(E);
      for (let run = 0; run < 50; run++) { const V = [0.5, 0.5, 0.5, 0.5, 0.5];
        for (let e = 0; e < E; e++) { let s = 2; const tr = []; while (s >= 0 && s <= 4) { const s2 = s + (r() < 0.5 ? 1 : -1); tr.push([s, s2 === 5 ? 1 : 0, s2]); s = s2; }
          if (td) tr.forEach(([s, rw, s2]) => { V[s] += a * (rw + (s2 >= 0 && s2 <= 4 ? V[s2] : 0) - V[s]); }); else { const G = tr[tr.length - 1][1]; tr.forEach(([s]) => { V[s] += a * (G - V[s]); }); }
          err[e] += Math.sqrt(V.reduce((t, v, i) => t + (v - TRUE[i]) ** 2, 0) / 5); } }
      return Array.from(err, (x, i) => [i + 1, x / 50]); };
    const draw = () => { const a = +el_(root, "#rw-a").value, b = +el_(root, "#rw-b").value; el_(root, "#rw-av").textContent = a; el_(root, "#rw-bv").textContent = b;
      const T = sim(true, a), M = sim(false, b);
      el_(root, "#rw-c").innerHTML = XH.lines([{ pts: T, color: "var(--dr)" }, { pts: M, color: "var(--path)" }], { xmin: 0, xmax: 100, ymin: 0, ymax: 0.25 }, { x: "episodes (y: RMS error)" }) + XH.legend([["var(--dr)", "TD(0), α = " + a], ["var(--path)", "constant-α MC, α = " + b]]);
      el_(root, "#rw-r").innerHTML = `<span>After 100 episodes: TD ${T[99][1].toFixed(3)}, MC ${M[99][1].toFixed(3)}.</span><span>On this Markov task TD usually learns faster for comparable step sizes; large α makes either method plateau at a noisy level.</span>`; };
    $$("input", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.drTdControlCalc = XH.calc({ p: "tdc", title: "SARSA, Q-learning and Expected SARSA on one step", cap: "Current Q(S, A) = 0.5, reward 1, γ = 0.9, α = 0.5. Next state S′ has two actions with values Q(S′, a₁) and Q(S′, a₂); the policy actually picks a₁ next.",
  inputs: [["q1", "Q(S′, a₁) (taken)", -1, 2, 0.05, 0.7], ["q2", "Q(S′, a₂)", -1, 2, 0.05, 0.8], ["p2", "π(a₂|S′) for Expected SARSA", 0, 1, 0.05, 0.5]],
  out: v => { const base = 0.5, upd = n => base + 0.5 * (1 + 0.9 * n - base), es = (1 - v.p2) * v.q1 + v.p2 * v.q2;
    return XH.table(["method", "next value used", "updated Q(S, A)"], [["SARSA", `Q(S′, a₁) = ${v.q1}`, `<b>${XH.f(upd(v.q1))}</b>`], ["Expected SARSA", `${XH.f(1 - v.p2)}·${v.q1} + ${XH.f(v.p2)}·${v.q2} = ${XH.f(es)}`, `<b>${XH.f(upd(es))}</b>`], ["Q-learning", `max = ${Math.max(v.q1, v.q2)}`, `<b>${XH.f(upd(Math.max(v.q1, v.q2)))}</b>`]]) + `<div class="readout"><span>Defaults: SARSA 0.5 + 0.5(1 + 0.63 − 0.5) = 1.065; Q-learning uses max 0.8 → 1.11.</span><span>SARSA follows what the policy actually does (on-policy); Q-learning assumes the best next action (off-policy); Expected SARSA averages, removing the randomness of the next action.</span></div>`; } });

LABS.drMaxBiasMdp = {
  title: "Maximisation bias in a tiny MDP", cap: "From A: 'right' ends with reward 0; 'left' moves to B (reward 0), where any of 10 actions ends with reward ~ N(−0.1, 1). Going left is worse on average, but noisy estimates at B make max Q(B, ·) look positive, so Q-learning is lured left. Curves: % of episodes choosing left (ε = 0.1, α = 0.1), averaged over runs.",
  html: () => `<div class="row"><button class="btn primary sm" id="mx-g">Run 200 × 300 episodes</button></div><div id="mx-c" style="margin-top:6px"></div><div class="readout" id="mx-r"></div>`,
  mount(root) {
    const run = () => { const r = prng(8), E = 300, R = 200, L = [new Float64Array(E), new Float64Array(E)];
      const am = arr => { let b = 0; for (let i = 1; i < arr.length; i++) if (arr[i] > arr[b] || (arr[i] === arr[b] && r() < 0.5)) b = i; return b; };
      for (let d = 0; d < 2; d++) for (let k = 0; k < R; k++) { const QA = [[0, 0], [0, 0]], QB = [Array(10).fill(0), Array(10).fill(0)];
        for (let e = 0; e < E; e++) { const qa = d ? [QA[0][0] + QA[1][0], QA[0][1] + QA[1][1]] : QA[0]; const a = r() < 0.1 ? (r() < 0.5 ? 0 : 1) : am(qa); if (a === 0) L[d][e]++;
          if (a === 1) { const i = d && r() < 0.5 ? 1 : 0; QA[i][1] += 0.1 * (0 - QA[i][1]); continue; }
          const qb = d ? QB[0].map((x, j) => x + QB[1][j]) : QB[0], b = r() < 0.1 ? Math.floor(r() * 10) : am(qb), rw = -0.1 + gauss(r);
          if (d) { const i = r() < 0.5 ? 0 : 1, j = 1 - i; QA[i][0] += 0.1 * (QB[j][am(QB[i])] - QA[i][0]); QB[i][b] += 0.1 * (rw - QB[i][b]); }
          else { QA[0][0] += 0.1 * (Math.max(...QB[0]) - QA[0][0]); QB[0][b] += 0.1 * (rw - QB[0][b]); } } }
      const pts = arr => Array.from(arr, (x, i) => [i + 1, 100 * x / R]).filter((_, i) => i % 3 === 0);
      el_(root, "#mx-c").innerHTML = XH.lines([{ pts: pts(L[0]), color: "var(--bad)" }, { pts: pts(L[1]), color: "var(--dr)" }, { pts: [[0, 5], [300, 5]], color: "var(--muted)", dash: "4 3", w: 1 }], { xmin: 0, xmax: 300, ymin: 0, ymax: 100 }, { x: "episodes (y: % choosing left)" }) + XH.legend([["var(--bad)", "Q-learning"], ["var(--dr)", "Double Q-learning"], ["var(--muted)", "optimal with ε = 0.1 (5%)", "4 3"]]);
      el_(root, "#mx-r").innerHTML = `<span>Q-learning keeps preferring the bad 'left' action for a long time; Double Q-learning (one table selects the best B action, the other evaluates it) is barely affected.</span>`; };
    el_(root, "#mx-g").onclick = run; run(); return null;
  }
};

LABS.drCliff = {
  title: "Cliff walking: SARSA vs Q-learning", cap: "4×12 grid; start bottom-left, goal bottom-right; the cells between are a cliff (−100 and back to start); every other step −1. Both learners act ε-greedily (ε = 0.1, α = 0.5). Train, then compare the greedy paths and the reward collected while exploring.",
  html: () => `<div class="row"><button class="btn primary sm" id="cw-t">Train 100 episodes</button><button class="btn sm ghost" id="cw-z">Reset</button><span class="status-pill run" id="cw-k"></span></div><div class="grid2" style="margin-top:8px"><div><b class="small">SARSA greedy path</b><div id="cw-s"></div></div><div><b class="small">Q-learning greedy path</b><div id="cw-q"></div></div></div><div id="cw-c" style="margin-top:6px"></div><div class="readout" id="cw-r"></div>`,
  mount(root) {
    const MV = [[-1, 0], [0, 1], [1, 0], [0, -1]]; let r, Q, hist, ep;
    const stp = (s, a) => { let rr = Math.min(3, Math.max(0, s[0] + MV[a][0])), cc = Math.min(11, Math.max(0, s[1] + MV[a][1])); if (rr === 3 && cc >= 1 && cc <= 10) return [[3, 0], -100]; return [[rr, cc], -1]; };
    const key = s => s[0] * 12 + s[1], am = q => { let b = 0; for (let i = 1; i < 4; i++) if (q[i] > q[b] || (q[i] === q[b] && r() < 0.5)) b = i; return b; }, eg = (Qm, s) => r() < 0.1 ? Math.floor(r() * 4) : am(Qm[key(s)]);
    const reset = () => { r = prng(17); Q = [0, 1].map(() => Array.from({ length: 48 }, () => [0, 0, 0, 0])); hist = [[], []]; ep = 0; show(); };
    const train = () => { for (let k = 0; k < 100; k++) { ep++; [0, 1].forEach(m => { const Qm = Q[m]; let s = [3, 0], a = eg(Qm, s), tot = 0, n = 0;
        while (!(s[0] === 3 && s[1] === 11) && n < 500) { n++; const [s2, rw] = stp(s, a); tot += rw; const a2 = eg(Qm, s2), goal = s2[0] === 3 && s2[1] === 11;
          const nx = goal ? 0 : (m === 0 ? Qm[key(s2)][a2] : Math.max(...Qm[key(s2)])); Qm[key(s)][a] += 0.5 * (rw + nx - Qm[key(s)][a]); s = s2; a = a2; }
        hist[m].push(tot); }); } show(); };
    const path = Qm => { const P = new Set(); let s = [3, 0]; for (let i = 0; i < 40; i++) { P.add(key(s)); if (s[0] === 3 && s[1] === 11) break; const q = Qm[key(s)]; let b = 0; for (let j = 1; j < 4; j++) if (q[j] > q[b]) b = j; s = stp(s, b)[0]; } return P; };
    const show = () => { [0, 1].forEach(m => { const P = path(Q[m]); el_(root, m ? "#cw-q" : "#cw-s").innerHTML = XH.grid(4, 12, (rr, cc) => { const k = rr * 12 + cc; if (rr === 3 && cc >= 1 && cc <= 10) return { txt: "", bg: "var(--bad-soft)" }; if (rr === 3 && cc === 0) return { txt: "S", bg: P.has(k) ? "var(--dr)" : "var(--surface-2)", fg: "var(--surface)" }; if (rr === 3 && cc === 11) return { txt: "G", bg: "var(--accent-soft)" }; return { txt: "", bg: ep && P.has(k) ? "var(--dr)" : "var(--surface-2)" }; }, 22); });
      const sm = h => { const o = []; for (let i = 0; i < h.length; i += 10) { const sl = h.slice(i, i + 10); o.push([i + 10, sl.reduce((a, b) => a + b, 0) / sl.length]); } return o; };
      el_(root, "#cw-c").innerHTML = ep ? XH.lines([{ pts: sm(hist[0]), color: "var(--dnn)" }, { pts: sm(hist[1]), color: "var(--path)" }], { xmin: 0, xmax: Math.max(100, ep), ymin: -150, ymax: 0 }, { x: "episodes (y: reward per episode while exploring)" }) + XH.legend([["var(--dnn)", "SARSA"], ["var(--path)", "Q-learning"]]) : "";
      const last = h => h.slice(-50).reduce((a, b) => a + b, 0) / Math.max(1, Math.min(50, h.length));
      el_(root, "#cw-k").textContent = ep + " episodes";
      el_(root, "#cw-r").innerHTML = ep ? `<span>Average reward over the last 50 episodes: SARSA ${last(hist[0]).toFixed(1)}, Q-learning ${last(hist[1]).toFixed(1)}.</span><span>Q-learning learns the optimal path right along the cliff edge (its values assume greedy play), but its ε-random steps sometimes fall off. SARSA learns the value of its actual ε-greedy behaviour, so it prefers a safer path further from the edge and earns more while exploring.</span>` : "<span>Press Train.</span>"; };
    el_(root, "#cw-t").onclick = train; el_(root, "#cw-z").onclick = reset; reset(); return show;
  }
};

  ["Raw camera images from a robot", "approx", "Continuous, high-dimensional."],

LABS.drLinearV = XH.calc({ p: "lv", title: "A linear value function", cap: "Each state is described by features x(s); the estimate is v̂(s, w) = wᵀx(s) = Σ wᵢxᵢ(s). Change a weight and every state that has that feature changes: generalisation.",
  inputs: [["w1", "w₁ (weight on 'distance to ghost')", -1, 1, 0.05, 0.4], ["w2", "w₂ (weight on 'pellets nearby')", -1, 1, 0.05, 0.2]],

    return XH.table(["state", "x₁", "x₂", "v̂ = w₁x₁ + w₂x₂"], S.map(([n, a, b]) => [n, a, b, `<b>${XH.f(v.w1 * a + v.w2 * b)}</b>`])) + `<div class="readout"><span>Two weights describe every state, including ones never visited. Whatever is learned about distance to a ghost (w₁) applies to every state at once; the price is that states can no longer be valued independently.</span></div>`; } });

LABS.drSgdStep = XH.calc({ p: "sg", title: "One semi-gradient TD(0) update", cap: "w ← w + α[R + γv̂(S′, w) − v̂(S, w)] x(S). For linear v̂ the gradient is just x(S). It's 'semi' because the target also depends on w but we don't differentiate through it.",
  inputs: [["a1", "x(S)₁", 0, 3, 1, 1], ["a2", "x(S)₂", 0, 3, 1, 2], ["b1", "x(S′)₁", 0, 3, 1, 0], ["b2", "x(S′)₂", 0, 3, 1, 1], ["r", "reward", -2, 2, 0.1, 1], ["al", "α", 0.01, 0.5, 0.01, 0.1]],
  out: v => { const w = [0.5, 0.1], g = 0.9, vs = w[0] * v.a1 + w[1] * v.a2, vs2 = w[0] * v.b1 + w[1] * v.b2, tg = v.r + g * vs2, d = tg - vs, nw = [w[0] + v.al * d * v.a1, w[1] + v.al * d * v.a2];
    return `<div class="formula">v̂(S) = 0.5·${v.a1} + 0.1·${v.a2} = ${XH.f(vs)}; v̂(S′) = ${XH.f(vs2)}; target = ${v.r} + 0.9·${XH.f(vs2)} = ${XH.f(tg)}; δ = <b>${XH.f(d)}</b></div><div class="formula">w = [0.5, 0.1] + ${v.al}·${XH.f(d)}·[${v.a1}, ${v.a2}] = <b>[${XH.f(nw[0])}, ${XH.f(nw[1])}]</b></div><div class="readout"><span>Defaults: target 1.09, δ = 0.39, w → [0.539, 0.178]. A feature that is 0 in S doesn't move; larger features move their weights more.</span></div>`; } });

LABS.drAggregation = {
  title: "1,000-state random walk with state aggregation", cap: "States 1–1000; each step jumps 1–100 states left or right; exiting left gives −1, right +1. Ten groups of 100 states share one weight each. Compare gradient Monte Carlo (target Gₜ) with semi-gradient TD(0) (target R + v̂(S′)). Grey: true values.",
  html: () => `<div class="row">${ctrlBtns("ag")}<span class="status-pill run" id="ag-k"></span></div><div id="ag-c" style="margin-top:6px"></div><div class="readout" id="ag-r"></div>`,
  mount(root) {

    let r, wm, wt, n;

    const step = () => { for (let k = 0; k < 100; k++) { n++; let s = 500; const tr = []; for (;;) { const s2 = s + (1 + Math.floor(r() * 100)) * (r() < 0.5 ? 1 : -1); if (s2 < 1) { tr.push([s, -1, 0]); break; } if (s2 > 1000) { tr.push([s, 1, 0]); break; } tr.push([s, 0, s2]); s = s2; }
        const G = tr[tr.length - 1][1], gp = x => Math.floor((x - 1) / 100); tr.forEach(([s]) => { wm[gp(s)] += 0.002 * (G - wm[gp(s)]); }); tr.forEach(([s, rw, s2]) => { wt[gp(s)] += 0.02 * (rw + (s2 ? wt[gp(s2)] : 0) - wt[gp(s)]); }); } show(); };
    const show = () => { const stair = w => { const p = []; for (let g = 0; g < 10; g++) { p.push([g * 100 + 1, w[g]], [g * 100 + 100, w[g]]); } return p; }, tv = []; for (let s = 1; s <= 1000; s += 10) tv.push([s, TRUE[s]]);

  }
};

LABS.drTileCoding = {
  title: "Tile coding: tilings, width and generalisation", cap: "Approximate a 1-D target function with tile coding: several offset grids (tilings); each input activates exactly one tile per tiling, and the estimate is the sum of their weights. Train on noisy samples with SGD.",
  html: () => `<div class="slidergrid xh"><label for="tc-n">tilings <b class="num" id="tc-nv"></b><input id="tc-n" type="range" min="1" max="16" step="1" value="8"></label><label for="tc-w">tiles per tiling <b class="num" id="tc-wv"></b><input id="tc-w" type="range" min="2" max="30" step="1" value="10"></label><label for="tc-s">training samples <select id="tc-s"><option>50</option><option selected>500</option><option>5000</option></select></label></div><div id="tc-c" style="margin-top:6px"></div><div class="readout" id="tc-r"></div>`,
  mount(root) {
    const f = x => Math.sin(2 * Math.PI * x) + 0.5 * x;
    const draw = () => { const T = +el_(root, "#tc-n").value, K = +el_(root, "#tc-w").value, M = +el_(root, "#tc-s").value; el_(root, "#tc-nv").textContent = T; el_(root, "#tc-wv").textContent = K;
      const W = new Float64Array(T * (K + 1)), idx = x => { const o = []; for (let t = 0; t < T; t++) o.push(t * (K + 1) + Math.floor((x + t / (T * K)) * K)); return o; }, r = prng(6), a = 0.2 / T;
      const pts = []; for (let i = 0; i < M; i++) { const x = r() * 0.999, y = f(x) + 0.15 * gauss(r), id = idx(x); let v = 0; id.forEach(j => v += W[j]); id.forEach(j => W[j] += a * (y - v)); if (i < 80) pts.push([x, y]); }
      const est = [], tru = []; let se = 0; for (let i = 0; i <= 200; i++) { const x = i / 201; let v = 0; idx(x).forEach(j => v += W[j]); est.push([x, v]); tru.push([x, f(x)]); se += (v - f(x)) ** 2; }
      el_(root, "#tc-c").innerHTML = XH.lines([{ pts: tru, color: "var(--muted)", dash: "4 3" }, { pts: est, color: "var(--dr)" }], { xmin: 0, xmax: 1, ymin: -1.5, ymax: 2 }, { x: "state x" }, (sx, sy) => pts.map(([x, y]) => `<circle cx="${sx(x)}" cy="${sy(y)}" r="1.5" fill="var(--path)" opacity=".6"/>`).join("")) + XH.legend([["var(--muted)", "true function", "4 3"], ["var(--dr)", "tile-coded estimate"]]);
      el_(root, "#tc-r").innerHTML = `<span>${T * (K + 1)} weights, ${T} active per input · RMS error ${Math.sqrt(se / 201).toFixed(3)}.</span><span>Wide tiles (few per tiling) generalise broadly but blur detail; narrow tiles need more data. More tilings give finer resolution while keeping the same breadth of generalisation. Step size α is divided by the number of tilings.</span>`; };
    $$("input,select", root).forEach(i => i.addEventListener("input", draw)); draw(); return draw;
  }
};

{
/* ===== NLP M1 labs: introduction to NLP ===== */
var NLH = {
  /* draw a bracketed tree string "(S (NP (N rice)) (VP ...))" as SVG */
  tree(str, w) {
    const toks = str.match(/\(|\)|[^\s()]+/g); let i = 0;
    const parse = () => { i++; const lab = toks[i++]; const kids = []; while (toks[i] !== ")") { if (toks[i] === "(") kids.push(parse()); else kids.push({ lab: toks[i++], leaf: true, kids: [] }); } i++; return { lab, kids }; };
    const root = parse(); let leafX = 0; const H = 34;
    const lay = (n, d) => { n.d = d; if (!n.kids.length) { n.x = leafX++; return; } n.kids.forEach(k => lay(k, d + 1)); n.x = n.kids.reduce((s, k) => s + k.x, 0) / n.kids.length; };
    lay(root, 0); const maxD = (n => { let m = 0; const f = x => { m = Math.max(m, x.d); x.kids.forEach(f); }; f(n); return m; })(root);
    const W = w || 360, sx = x => 36 + x * (W - 72) / Math.max(1, leafX - 1), sy = d => 16 + d * H; let s = "";
    const draw = n => { n.kids.forEach(k => { s += `<line x1="${sx(n.x)}" y1="${sy(n.d) + 6}" x2="${sx(k.x)}" y2="${sy(k.d) - 10}" stroke="var(--line)"/>`; draw(k); }); s += `<text x="${sx(n.x)}" y="${sy(n.d) + 4}" text-anchor="middle" font-size="11" font-family="var(--f-mono)" fill="${n.leaf ? "var(--nl)" : "var(--ink)"}" font-weight="${n.leaf ? 700 : 500}">${n.lab}</text>`; };
    draw(root); return `<svg viewBox="0 0 ${W} ${sy(maxD) + 14}" style="width:100%;height:auto;max-height:280px" role="img" aria-label="parse tree">${s}</svg>`;
  },
  stem(w) { for (const [suf, rep] of [["sses", "ss"], ["ies", "i"], ["ing", ""], ["ed", ""], ["ly", ""], ["s", ""]]) { if (w.endsWith(suf) && w.length - suf.length >= 3) { let r = w.slice(0, w.length - suf.length) + rep; if (suf === "ing" && r.length > 3 && r[r.length - 1] === r[r.length - 2]) r = r.slice(0, -1); return r; } } return w; },
  LEMMA: { ran: "run", running: "run", runs: "run", better: "good", best: "good", studies: "study", studying: "study", children: "child", were: "be", are: "be", is: "be", was: "be", toys: "toy", paid: "pay", mice: "mouse", geese: "goose", went: "go", feet: "foot", happier: "happy", dollars: "dollar" },
  STOP: new Set("the a an is are were was to for of in on and or but she he it they this that than with at by from as be".split(" "))
};

{
/* ===== NLP M10 labs: dependency parsing ===== */
var NL10 = {
  /* arc diagram: words[], arcs [[head, dep, label]] (indices into words; head -1 = ROOT drawn as arrow from above) */
  arcs(words, arcs, opt) { opt = opt || {}; const W = Math.max(360, words.length * 72), gap = W / words.length, x = i => gap / 2 + i * gap, base = 150;
    let s = `<svg viewBox="0 0 ${W} ${base + 26}" style="width:100%;height:auto;max-height:230px" role="img" aria-label="dependency arcs"><defs><marker id="nlar${opt.id || ""}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="var(--nl)"/></marker></defs>`;
    words.forEach((w, i) => { s += `<text x="${x(i)}" y="${base + 16}" text-anchor="middle" font-size="12" font-family="var(--f-mono)" fill="var(--ink)">${w}</text>`; });
    arcs.forEach(([h, d, l, bad]) => { const col = bad ? "var(--bad)" : "var(--nl)";
      if (h < 0) { s += `<line x1="${x(d)}" y1="10" x2="${x(d)}" y2="${base}" stroke="${col}" stroke-width="1.5" marker-end="url(#nlar${opt.id || ""})"/><text x="${x(d) + 4}" y="20" font-size="10" fill="var(--muted)">root</text>`; return; }
      const x1 = x(h), x2 = x(d), hgt = Math.min(base - 18, 22 + Math.abs(d - h) * 26), mx = (x1 + x2) / 2;
      s += `<path d="M${x1},${base} C${x1},${base - hgt} ${x2},${base - hgt} ${x2},${base}" fill="none" stroke="${col}" stroke-width="1.5" marker-end="url(#nlar${opt.id || ""})"/><text x="${mx}" y="${base - hgt * 0.75 - 3}" text-anchor="middle" font-size="10" fill="var(--muted)">${l || ""}</text>`; });
    return s + "</svg>"; },
  check(n, head) { /* head[i] in -1..n-1 */ const roots = head.filter(h => h === -1).length; let acyclic = true;
    for (let i = 0; i < n; i++) { let v = i, k = 0; while (v !== -1 && k <= n) { v = head[v]; k++; } if (k > n) acyclic = false; }
    let proj = true; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { if (head[i] < 0 || head[j] < 0) continue; const a = [Math.min(i, head[i]), Math.max(i, head[i])], b = [Math.min(j, head[j]), Math.max(j, head[j])]; if (a[0] < b[0] && b[0] < a[1] && a[1] < b[1]) proj = false; }
    return { single: true, oneRoot: roots === 1, acyclic, connected: acyclic && roots === 1, proj }; }
};

LABS.nlFreeOrder = XH.calc({ p: "fro", title: "Free word order: boxes break, arcs don't", cap: "Hindi marks roles with case markers (ne = agent, ko = recipient), so 'Ram gave Sita a book' can be ordered several ways. Phrase-structure rules would need a new rule per order; the head–dependent relations are identical.",
  inputs: [["ord", "word order", [["a", "Ram-ne Sita-ko kitaab di"], ["b", "Sita-ko Ram-ne kitaab di"], ["c", "kitaab Ram-ne Sita-ko di"]]]],
  out: v => { const W = { a: ["Ram-ne", "Sita-ko", "kitaab", "di"], b: ["Sita-ko", "Ram-ne", "kitaab", "di"], c: ["kitaab", "Ram-ne", "Sita-ko", "di"] }[v.ord], i = w => W.indexOf(w);
    return NL10.arcs(W, [[-1, i("di")], [i("di"), i("Ram-ne"), "nsubj"], [i("di"), i("Sita-ko"), "iobj"], [i("di"), i("kitaab"), "obj"]], { id: "fro" }) + `<div class="readout"><span>Whatever the order, 'di' (gave) heads Ram (nsubj), Sita (iobj) and kitaab (obj). Dependency grammar models relations, not positions, so it suits free-word-order languages (Hindi, Russian, Czech).</span></div>`; } });

LABS.nlHeadDep = XH.calc({ p: "hdp", title: "Heads, dependents and labels", cap: "Arrows go from head to dependent and carry a relation label. Moving one arc changes the meaning of 'I saw a girl with a telescope'.",
  inputs: [["a", "'with' attaches to", [["saw", "saw (I used the telescope)"], ["girl", "girl (she had the telescope)"]]]],
  out: v => { const W = ["I", "saw", "a", "girl", "with", "a", "telescope"];
    return NL10.arcs(W, [[-1, 1], [1, 0, "nsubj"], [1, 3, "dobj"], [3, 2, "det"], [v.a === "saw" ? 1 : 3, 4, "prep"], [4, 6, "pobj"], [6, 5, "det"]], { id: "hdp" }) + `<div class="readout"><span>The verb is the 'sun'; nouns orbit it; determiners orbit nouns. Every word except the root has exactly one head.</span><span>The ambiguity is one arc: saw → with vs girl → with.</span></div>`; } });

LABS.nlTreeCheck = XH.calc({ p: "trc", title: "Is it a well-formed dependency tree?", cap: "Choose a head for each word of 'John saw Mary yesterday'. A valid tree is connected, acyclic, has one root and a single head per word; it is projective if no arcs cross.",
  inputs: [["h0", "head of John", [["1", "saw"], ["2", "Mary"], ["3", "yesterday"], ["-1", "ROOT"]]], ["h1", "head of saw", [["-1", "ROOT"], ["0", "John"], ["2", "Mary"]]], ["h2", "head of Mary", [["1", "saw"], ["0", "John"], ["3", "yesterday"]]], ["h3", "head of yesterday", [["1", "saw"], ["2", "Mary"], ["0", "John"]]]],
  out: v => { const W = ["John", "saw", "Mary", "yesterday"], H = [+v.h0, +v.h1, +v.h2, +v.h3], c = NL10.check(4, H), pill = (ok, t) => SEH.pill(t, ok ? "ok" : "bad");
    return NL10.arcs(W, H.map((h, d) => [h, d, ""]), { id: "trc" }) + `<div class="row" style="gap:6px;flex-wrap:wrap">${pill(c.single, "single head")} ${pill(c.oneRoot, "exactly one root")} ${pill(c.acyclic, "acyclic")} ${pill(c.connected, "connected")} ${pill(c.proj, "projective")}</div><div class="readout"><span>Try making 'saw' depend on 'John' while John depends on saw: a cycle. Try John ← yesterday with Mary ← saw: crossing arcs (non-projective).</span><span>Non-projective trees are legitimate (common in free-word-order languages) but harder for some algorithms.</span></div>`; } });

LABS.nlUdSorter = sorterLab("Which Universal Dependencies relation?", "UD gives a uniform set of relations across languages: nsubj (nominal subject), obj (direct object), iobj (indirect object), amod (adjectival modifier), det (determiner), obl:tmod (temporal modifier), case (case marker / preposition).", { nsubj: "nsubj", obj: "obj", amod: "amod", det: "det", tmod: "obl:tmod" }, [

LABS.nlParserFamilies = sorterLab("Which family of dependency parser?", "Four families: dynamic programming (CKY-like, e.g. Eisner's O(n³) algorithm), constraint satisfaction (eliminate arcs violating hard constraints), deterministic transition-based parsing (greedy shift–reduce guided by a classifier), and graph-based parsing (maximum spanning tree over scored arcs).", { dp: "Dynamic programming", cs: "Constraint satisfaction", tb: "Transition-based", gb: "Graph-based (MST)" }, [

LABS.nlArcEager = (() => { const W = ["ROOT", "He", "sent", "her", "a", "letter", "."], T = [
  ["start", [0], [1, 2, 3, 4, 5, 6], []],
  ["SH", [0, 1], [2, 3, 4, 5, 6], []],
  ["LA (sent → He, SBJ)", [0], [2, 3, 4, 5, 6], [[2, 1, "SBJ"]]],

  ["RA (sent → her, IOBJ)", [0, 2, 3], [4, 5, 6], [[2, 3, "IOBJ"]]],
  ["RE (her is complete)", [0, 2], [4, 5, 6], []],
  ["SH", [0, 2, 4], [5, 6], []],
  ["LA (letter → a, DET)", [0, 2], [5, 6], [[5, 4, "DET"]]],
  ["RA (sent → letter, DOBJ)", [0, 2, 5], [6], [[2, 5, "DOBJ"]]],

LABS.nlPerceptronUpd = XH.calc({ p: "pcu", title: "Training the oracle with perceptron updates", cap: "Score each action t as w_t · f(c). If the predicted action t* differs from the oracle action t_o: w_{t_o} += f(c), w_{t*} −= f(c). Features of this configuration: stack top is a noun, buffer front is a verb.",
  inputs: [["it", "number of identical mistakes corrected", 0, 3, 1, 0]],
  out: v => { let sh = [5, 5, 5], la = [5.5, 5.5, 5.5]; const f = [0, 1, 0], dot = (w) => w.reduce((s, x, i) => s + x * f[i], 0), rows = [];

LABS.nlCle = (() => { const P = { root: [190, 22], John: [50, 150], saw: [190, 150], Mary: [330, 150] };

      { html: draw(mk({ "saw>John": "cyc", "John>saw": "cyc", "saw>Mary": "on" }), "<b>Contract</b> the cycle into one node C (internal score 30 + 20 = 50). Arcs into C = external score − the internal arc it breaks + 50: root→C via John 9 − 30 + 50 = 29; via saw 10 − 20 + 50 = <b>40</b>; Mary→C via John 11 − 30 + 50 = 31. Arcs out of C: best member's, C→Mary = 30.") },

LABS.nlSeq2seq = XH.calc({ p: "s2s", title: "Encoder–decoder and the bottleneck", cap: "Word-for-word translation fails because languages reorder and merge words. An encoder reads the whole source into a context vector; a decoder generates the target from it. Classic RNN encoders squeeze everything into one fixed-size vector.",
  inputs: [["L", "source length (words)", 3, 60, 1, 4], ["d", "context vector size", 64, 1024, 64, 256]],
  out: v => XH.table(["", "value"], [["word-for-word 'I love you'", "Je aime tu ✗"], ["correct French", "Je t'aime (object pronoun moves before the verb)"], ["numbers in the context vector", v.d], ["numbers per source word", `<b>${XH.f(v.d / v.L, 1)}</b>`]]) + `<div class="readout"><span>A short sentence fits; a 60-word paragraph must share the same ${v.d} numbers, so details get lost, like zipping a whole book into a postcard. Attention lets the decoder look back at every encoder state instead.</span></div>` });

LABS.nlRnnRun = XH.calc({ p: "rnr", title: "Run an RNN over 'I don't like NLP'", cap: "hₜ = tanh(W_h hₜ₋₁ + W_x xₜ + b) with W_h = λI, W_x = I, b = 0. Vectors: I [1, 0], don't [0, −1], like [1, 1], NLP [−1, 1]. Like mixing colours in water: each word tints the running state.",
  inputs: [["lam", "memory weight λ (W_h = λI)", 0, 1.5, 0.1, 0.5], ["rev", "reverse the word order", "check"]],
  out: v => { let W = [["I", [1, 0]], ["don't", [0, -1]], ["like", [1, 1]], ["NLP", [-1, 1]]]; if (v.rev) W = W.slice().reverse(); let h = [0, 0]; const rows = [];
    W.forEach(([w, x]) => { h = [Math.tanh(v.lam * h[0] + x[0]), Math.tanh(v.lam * h[1] + x[1])]; rows.push([w, `[${x.join(", ")}]`, `[${h.map(z => XH.f(z)).join(", ")}]`]); });
    return XH.table(["word", "xₜ", "hₜ"], rows) + `<div class="readout"><span>λ = 0.5: h₁ = tanh([1, 0]) = [0.762, 0]; h₂ = tanh([0.381, −1]) = [0.363, −0.762]; then [0.828, 0.551], [−0.527, 0.855].</span><span>Order matters (reverse it). λ = 0 forgets everything; large λ lets old words dominate. The same weights are reused at every step.</span></div>`; } });

LABS.nlVanish = XH.calc({ p: "van", title: "Vanishing gradients", cap: "The gradient reaching word 1 from step T is a product of T − 1 factors (weight × tanh slope). If each factor is below 1, it shrinks exponentially, like a message fading along a game of telephone.",
  inputs: [["f", "per-step factor", 0.1, 1.5, 0.05, 0.5], ["T", "sequence length T", 2, 60, 1, 20]],
  out: v => { const g = Math.pow(v.f, v.T - 1), pts = Array.from({ length: 60 }, (_, i) => [i + 1, Math.max(-20, Math.min(5, Math.log10(Math.pow(v.f, i))))]);
    return XH.lines([{ pts, color: "var(--nl)" }], { xmin: 1, xmax: 60, ymin: -20, ymax: 5 }, { x: "steps back (y: log₁₀ gradient factor)", aria: "gradient decay" }) + `<div class="formula">factor after ${v.T - 1} steps = ${v.f}^${v.T - 1} = <b>${g.toExponential(2)}</b></div><div class="readout"><span>${v.f < 1 ? "Vanishing: early words barely affect learning, so 'The cats that the dog chased … are' loses the plural subject." : v.f > 1 ? "Exploding: gradients blow up (fixed by clipping)." : "Exactly 1: the LSTM cell's additive path approximates this 'constant error carousel'."}</span><span>LSTMs add a cell state updated by addition (Cₜ = fₜ·Cₜ₋₁ + iₜ·C̃ₜ), a conveyor belt that gates can leave untouched.</span></div>`; } });

LABS.nlAttnAlign = XH.calc({ p: "aal", title: "Attention: a worked alignment", cap: "Decoder state s scores each encoder state by dot product, softmax turns scores into weights α, and the context vector is Σ αᵢhᵢ. Encoder states: h₁ 'bank' = [1, 1], h₂ 'river' = [0, 1].",
  inputs: [["s1", "decoder state s₁", -2, 2, 0.1, 1], ["s2", "decoder state s₂", -2, 2, 0.1, 0]],
  out: v => { const H = [[1, 1], [0, 1]], e = H.map(h => v.s1 * h[0] + v.s2 * h[1]), a = XH.softmax(e), c = [0, 1].map(k => a[0] * H[0][k] + a[1] * H[1][k]);
    return XH.table(["", "bank h₁", "river h₂"], [["score e = s·h", XH.f(e[0]), XH.f(e[1])], ["weight α", `<b>${XH.f(a[0])}</b>`, `<b>${XH.f(a[1])}</b>`]]) + `<div class="formula">context c = ${XH.f(a[0])}·[1, 1] + ${XH.f(a[1])}·[0, 1] = [${c.map(x => XH.f(x)).join(", ")}]</div><div class="readout"><span>Defaults s = [1, 0]: scores 1, 0 → e¹/(e¹ + e⁰) = 2.718/3.718 = 0.73 and 0.27 → c = [0.73, 1.00].</span><span>Soft alignment: every source word contributes a little, not a hard one-to-one link (useful when one word maps to several, e.g. French 'poste' = mail or job).</span></div>`; } });

LABS.nlItRefers = XH.calc({ p: "itr", title: "Self-attention: what does 'it' attend to?", cap: "softmax(QKᵀ/√d_k)V for every word at once. In 'The animal didn't cross the street because it was too ___', the last word decides whether 'it' should look at 'animal' or 'street'. Weights shown are illustrative of a trained head.",
  inputs: [["w", "last word", [["tired", "tired"], ["wide", "wide"]]]],
  out: v => { const words = ["The", "animal", "didn't", "cross", "the", "street", "because", "it"], sc = v.w === "tired" ? [0.1, 3.0, 0.2, 0.6, 0.1, 1.2, 0.2, 0.8] : [0.1, 1.1, 0.2, 0.7, 0.1, 3.0, 0.2, 0.8], a = XH.softmax(sc);
    return XH.bars(words.map((x, i) => [x, a[i], (v.w === "tired" ? i === 1 : i === 5) ? "var(--nl)" : "var(--muted)"]), 1) + `<div class="readout"><span>Every word builds a query, key and value (like a library search: what I'm looking for, what I'm about, what I contain). All pairs are scored in parallel, unlike an RNN's step-by-step chain.</span><span>Scaling by √d_k keeps dot products from saturating softmax as dimensions grow.</span></div>`; } });

LABS.nlMasksGrid = XH.calc({ p: "msk", title: "Multi-head blocks and masks", cap: "Rows = query positions, columns = key positions. A padding mask hides [PAD] keys; a look-ahead (causal) mask stops decoder positions seeing the future. Each Transformer block: multi-head attention → add & LayerNorm → feed-forward (512 → 2048 → 512) → add & LayerNorm.",
  inputs: [["m", "mask", [["none", "none (encoder)"], ["pad", "padding mask"], ["look", "look-ahead mask (decoder)"], ["both", "both"]]], ["np", "number of [PAD] tokens", 0, 3, 1, 2]],
  out: v => { const T = ["I", "love", "NLP", "[PAD]", "[PAD]", "[PAD]"].slice(0, 3 + v.np), n = T.length, ok = (r, c) => !((v.m === "pad" || v.m === "both") && T[c] === "[PAD]") && !((v.m === "look" || v.m === "both") && c > r);
    return `<div class="row" style="gap:10px;align-items:flex-start;flex-wrap:wrap"><div>${XH.grid(n, n, (r, c) => ok(r, c) ? { txt: "✓", bg: "color-mix(in srgb, var(--nl) 30%, var(--surface))" } : { txt: "", bg: "var(--surface-2)" }, 34)}</div><div class="small">${T.map((t, i) => `${i}: ${t}`).join("<br>")}</div></div><div class="readout"><span>Masked cells get −∞ before softmax, so their weight is 0.</span><span>Multi-head attention runs h heads with separate projections (one might track syntax, another coreference), concatenates them and multiplies by W^O, like a committee pooling views. Residual connections plus LayerNorm keep deep stacks trainable.</span></div>`; } });

LABS.nlPosEnc = XH.calc({ p: "pse", title: "Sinusoidal positional encodings", cap: "Attention ignores order, so a position vector is added to each word embedding: PE(pos, 2i) = sin(pos/10000^(2i/d)), PE(pos, 2i+1) = cos(…). Low dimensions spin fast, high ones slowly, like the hands of a clock.",
  inputs: [["pos", "position", 0, 50, 1, 1], ["d", "model dimension d", 8, 64, 8, 16]],
  out: v => { const pe = p => Array.from({ length: v.d }, (_, k) => { const i = Math.floor(k / 2), ang = p / Math.pow(10000, 2 * i / v.d); return k % 2 ? Math.cos(ang) : Math.sin(ang); }), P = pe(v.pos), dot = (a, b) => a.reduce((s, x, i) => s + x * b[i], 0);
    const sim = Array.from({ length: 51 }, (_, q) => [q, dot(P, pe(q)) / v.d * 2]);
    return `<div class="row" style="gap:2px;flex-wrap:wrap">${P.map(x => `<span style="display:inline-block;width:22px;height:22px;border-radius:4px;background:${x >= 0 ? XH.heat(x, 0, 1, "var(--nl)") : XH.heat(-x, 0, 1, "var(--dr)")}" title="${XH.f(x)}"></span>`).join("")}</div><div class="small muted">PE(${v.pos}) components (pink positive, gold negative)</div>` + XH.lines([{ pts: sim, color: "var(--nl)" }], { xmin: 0, xmax: 50, ymin: -1, ymax: 1.2 }, { x: "other position (y: scaled similarity to this position)", aria: "position similarity" }, (sx, sy) => `<line x1="${sx(v.pos)}" x2="${sx(v.pos)}" y1="8" y2="162" stroke="var(--ink)" stroke-dasharray="3 3"/>`) + `<div class="readout"><span>Nearby positions have more similar encodings, and PE(pos + k) is a fixed rotation of PE(pos), so relative offsets are easy to learn. Code ex2: PE(1)·PE(2) = 3.54 vs PE(1)·PE(10) = 1.71 (d = 8).</span></div>`; } });

LABS.nlBertTasks = XH.calc({ p: "btk", title: "BERT: contextual vectors and pre-training tasks", cap: "BERT is a stack of Transformer encoders pre-trained on two tasks, then fine-tuned. Outputs shown are illustrative.",
  inputs: [["t", "view", [["ctx", "static vs contextual 'bank'"], ["mlm", "masked language modelling"], ["nsp", "next sentence prediction"]]]],
  out: v => { if (v.t === "ctx") return XH.table(["sentence", "static vector (Word2Vec)", "contextual vector (BERT)"], [["I sat on the river bank", "bank → v_bank", "bank → near 'shore', 'slope'"], ["I deposited money in the bank", "bank → the same v_bank", "bank → near 'account', 'loan'"]]) + `<div class="readout"><span>Static embeddings give one vector per word type; BERT computes a new vector for each occurrence from both sides of the context.</span></div>`;

LABS.nlSeqVsPar = XH.calc({ p: "svp", title: "RNN vs Transformer: steps and cost", cap: "An RNN must process n positions one after another; a Transformer layer processes all positions together but compares every pair (n² attention scores). Path length between two distant words: n − 1 steps for an RNN, 1 for self-attention.",

  graph(T, P, hi) { hi = hi || []; let s = `<svg viewBox="0 0 390 200" style="width:100%;height:auto;max-height:240px" role="img" aria-label="knowledge graph"><defs><marker id="kgm" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--muted)"/></marker></defs>`;
    T.forEach(([a, p, b], k) => { const [x1, y1] = P[a], [x2, y2] = P[b], dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, on = hi.includes(k);
      s += `<line x1="${x1 + dx / L * 26}" y1="${y1 + dy / L * 12}" x2="${x2 - dx / L * 28}" y2="${y2 - dy / L * 12}" stroke="${on ? "var(--nl)" : "var(--line)"}" stroke-width="${on ? 2.4 : 1.2}" marker-end="url(#kgm)"/><text x="${(x1 + x2) / 2}" y="${(y1 + y2) / 2 - 4}" text-anchor="middle" font-size="9" fill="${on ? "var(--nl)" : "var(--muted)"}">${p}</text>`; });
    Object.entries(P).forEach(([n, [x, y]]) => { s += `<rect x="${x - 30}" y="${y - 10}" width="60" height="20" rx="10" fill="var(--surface)" stroke="var(--ink)" stroke-width=".8"/><text x="${x}" y="${y + 4}" text-anchor="middle" font-size="9.5" font-family="var(--f-mono)" fill="var(--ink)">${n}</text>`; });
    return s + "</svg>"; }
};

LABS.nlSemSearch = XH.calc({ p: "sms", title: "Syntactic vs semantic search", cap: "Keyword (syntactic) search matches strings; semantic search matches meaning using synonyms, types and relations. Documents: D1 'Affordable computer hardware fixes near you', D2 'Laptop bags: cheap deals', D3 'Repair cafe: we fix notebooks and PCs for less'.",
  inputs: [["q", "query", [["a", "cheap laptop repair"], ["b", "apple that cost me 80,000"]]]],
  out: v => { if (v.q === "b") return XH.table(["interpretation", "keyword search", "semantic search"], [["apple = fruit", "matches 'apple' pages about fruit", "ruled out: fruit doesn't cost 80,000"], ["apple = phone/brand", "also matches", `<b>kept</b>: price fits a phone`]]) + `<div class="readout"><span>Humans use world knowledge (typical prices of fruit and phones) instantly; machines need that knowledge in a structured, connected form.</span></div>`;
    return XH.table(["document", "shared keywords", "keyword rank", "meaning match", "semantic rank"], [["D1 Affordable computer hardware fixes", "none", "3", "affordable≈cheap, computer⊃laptop, fixes≈repair", "<b>1</b>"], ["D2 Laptop bags: cheap deals", "laptop, cheap", "<b>1</b>", "about bags, not repair", "3"], ["D3 Repair cafe: we fix notebooks", "repair", "2", "notebook≈laptop, fix≈repair, for less≈cheap", "<b>2</b>"]]) + `<div class="readout"><span>Keyword search ranks the irrelevant D2 first because it shares two words. The semantic web's goal: data described with shared, machine-readable meaning so systems can reason, not just match strings (and so AI answers can be grounded, reducing hallucination).</span></div>`; } });

LABS.nlTripleGraph = XH.calc({ p: "trg", title: "RDF triples form a graph you can walk", cap: "Each fact is a triple (subject, predicate, object), identified by URIs in real RDF. Triples sharing nodes join into one graph; questions become walks of one or more hops.",
  inputs: [["qq", "question", [["1", "What did Rahul order? (1 hop)"], ["2", "How much did Rahul's order cost? (2 hops)"], ["3", "Who ordered something veg? (2 hops, reverse)"]]]],
  out: v => { const H = { 1: [0], 2: [0, 1], 3: [0, 2] }[v.qq], A = { 1: "Margherita", 2: "250", 3: "Rahul" }[v.qq];
    return NL12.graph(NL12.T, NL12.pos, H) + XH.table(["triples used", "answer"], [[H.map(k => NL12.T[k].join(" → ")).join("<br>"), `<b>${A}</b>`]]) + `<div class="readout"><span>No full-text search or guessing: just follow edges. Plain RDF lacks standard meanings, though: 'ordered', 'bought' and 'placedOrderFor' would be three unrelated predicates unless mapped to one shared vocabulary.</span></div>`; } });

LABS.nlRdfsInfer = XH.calc({ p: "rdi", title: "RDFS: classes, types and subclass inference", cap: "RDFS adds a blueprint layer: rdfs:Class, rdf:type (instance of) and rdfs:subClassOf. Hierarchy: Pizza ⊑ Food ⊑ Product; Customer ⊑ Person. Types propagate up the hierarchy automatically.",
  inputs: [["e", "entity", ["Margherita", "Rahul", "Pepperoni"]]],
  out: v => { const ty = { Margherita: "Pizza", Pepperoni: "Pizza", Rahul: "Customer" }[v.e], up = { Pizza: "Food", Food: "Product", Customer: "Person" }, chain = [ty]; while (up[chain[chain.length - 1]]) chain.push(up[chain[chain.length - 1]]);
    return XH.table(["triple", "source"], [[`${v.e} rdf:type ${ty}`, "stated"], ...chain.slice(1).map((c, i) => [`${v.e} rdf:type ${c}`, `inferred via ${chain[i]} rdfs:subClassOf ${c}`])]) + `<div class="readout"><span>Like a building blueprint: the class layer says what kinds of things exist and how they nest; instances inherit every type above their class.</span></div>`; } });

LABS.nlOntoSorter = sorterLab("Class, instance or property?", "An ontology defines classes (kinds of things), instances (specific things), and properties (relations between things or attributes). Example: a sandwich ontology.", { cls: "Class", ins: "Instance", prop: "Property" }, [
  ["Sandwich", "cls", "A kind of thing."], ["VegSandwich (a subclass of Sandwich)", "cls", "Subclass."], ["madeOf (Sandwich → Ingredient)", "prop", "Relation between classes."], ["'big potato' (a particular potato in my kitchen)", "ins", "A specific thing."], ["usesBread", "prop", "Relation."], ["WheatBread", "cls", "A kind of bread."], ["hasTaste = sweet", "prop", "Attribute."], ["Today's turkey sandwich from the café", "ins", "Specific."]
]);

LABS.nlTboxAbox = sorterLab("TBox or ABox?", "Description logics split knowledge into the TBox (terminology: classes, hierarchies, property definitions; the schema) and the ABox (assertions about individuals; the data). Ontology (TBox) + data (ABox) = knowledge graph.", { t: "TBox (schema)", a: "ABox (data)" }, [
  ["Every Student is a Person", "t", "Class axiom."], ["Rahul is a Student", "a", "Assertion about an individual."], ["studiesAt links a Student to a College", "t", "Property definition (domain/range)."], ["Rahul studiesAt the college in Jaipur", "a", "Fact."], ["isInsideOf is transitive", "t", "Property characteristic."], ["The Margherita costs 250", "a", "Fact."]
]);

LABS.nlOwlProps = XH.calc({ p: "owl", title: "OWL property types and reasoning", cap: "OWL adds logic to ontologies; a reasoner derives new facts and detects contradictions.",
  inputs: [["k", "property characteristic", [["tr", "transitive: isInsideOf"], ["sy", "symmetric: pairsWith"], ["in", "inverse: contains / isIngredientOf"], ["dj", "disjoint: hasWife / hasHusband"]]]],
  out: v => { const D = { tr: [["egg isInsideOf sandwich", "sandwich isInsideOf lunchbox"], ["egg isInsideOf lunchbox"], "If A→B and B→C then A→C."], sy: [["cheese pairsWith tomato"], ["tomato pairsWith cheese"], "If A→B then B→A."], in: [["sandwich contains cheese"], ["cheese isIngredientOf sandwich"], "Each property is the other read backwards."], dj: [["Ravi hasWife Meera", "Ravi hasHusband Meera"], ["⚠ inconsistency detected"], "The two properties can never hold for the same pair; each triple looked fine alone."] }[v.k];
    return XH.table(["stated facts", "reasoner output"], [[D[0].join("<br>"), `<b>${D[1].join("<br>")}</b>`]]) + `<div class="readout"><span>${D[2]}</span><span>OWL individuals, classes and property assertions plus these characteristics let a reasoner check consistency and answer questions whose answers were never written down explicitly.</span></div>`; } });

LABS.nlSwStack = XH.stepLab({ p: "sws", title: "The semantic-web layer stack", cap: "Each layer solves the problem the previous one left open: structure → standardisation → hierarchy → rules → data at scale.",
  steps: [
    { html: "<b>URIs</b>: give every thing a global identifier, so 'Margherita' in two datasets can be the same resource." },
    { html: "<b>RDF</b>: state facts as subject–predicate–object triples that join into graphs (structure)." },
    { html: "<b>RDFS + vocabularies/ontologies</b>: shared classes, types and subclass hierarchies (standardisation and hierarchy)." },
    { html: "<b>OWL</b>: logical characteristics (transitive, symmetric, inverse, disjoint) and constraints that a reasoner can use (rules)." },
    { html: "<b>Knowledge graph</b>: ontology + large amounts of instance data, queried, traversed and used by applications (search panels, recommendation, Graph RAG)." }
  ] });

LABS.nlKgExtract = XH.calc({ p: "kgx", title: "Building a knowledge graph from text", cap: "At scale, triples are extracted automatically (NER, relation extraction or an LLM prompted to output triples), mapped to an ontology, de-duplicated and merged. Outputs shown are illustrative.",
  inputs: [["s", "sentence", [["a", "The Glass Palace, written by Amitav Ghosh, was published by HarperCollins in 2000 in London."], ["b", "Rahul studies AI at a college in Jaipur, Rajasthan."]]]],
  out: v => { const T = v.s === "a" ? [["The Glass Palace", "author", "Amitav Ghosh"], ["The Glass Palace", "publisher", "HarperCollins"], ["The Glass Palace", "datePublished", "2000"], ["The Glass Palace", "locationPublished", "London"], ["The Glass Palace", "rdf:type", "Book (inferred: things with author + publisher are books)"]] : [["Rahul", "rdf:type", "Student"], ["Rahul", "studies", "AI"], ["AI", "belongsTo", "Computer Science"], ["Rahul", "studiesAt", "College"], ["College", "locatedIn", "Jaipur"], ["Jaipur", "locatedIn", "Rajasthan"]];
    return XH.table(["subject", "predicate", "object"], T) + `<div class="readout"><span>Checks needed: entity resolution (is 'HarperCollins' the same node as 'Harper Collins'?), predicate mapping to one vocabulary, provenance, and validation against the ontology, because LLM extraction can hallucinate relations.</span><span>Public KGs built this way include DBpedia and Wikidata (Linked Open Data).</span></div>`; } });

LABS.nlCypher = XH.calc({ p: "cyp", title: "Querying a graph database", cap: "Graph databases (e.g. Neo4j with the Cypher language) store nodes and edges natively, so multi-hop questions are short pattern queries.",
  inputs: [["q", "query", [["a", "pizzas and prices ordered by Rahul"], ["b", "customers who ordered veg"], ["c", "customers whose pizza costs over 300"]]]],
  out: v => { const Q = { a: ["MATCH (c {name:'Rahul'})-[:ORDERED]->(p)-[:HAS_PRICE]->(x) RETURN p.name, x", "Margherita, 250"], b: ["MATCH (c)-[:ORDERED]->(p)-[:IS_OF_TYPE]->(:Type {name:'Veg'}) RETURN c.name", "Rahul"], c: ["MATCH (c)-[:ORDERED]->(p)-[:HAS_PRICE]->(x) WHERE x > 300 RETURN c.name, p.name", "Priya, Pepperoni"] }[v.q];
    return `<pre class="panel small" style="white-space:pre-wrap;margin:0">${Q[0]}</pre><div class="formula">result: <b>${Q[1]}</b></div><div class="readout"><span>Applications: knowledge panels in web search, recommendations, fraud rings, Graph RAG (retrieval that walks the graph). Community detection (e.g. Louvain) reveals clusters and hidden links; code ex2 splits a small graph into people–study, food and location communities.</span></div>`; } });

LABS.nlOpenWorld = XH.calc({ p: "opw", title: "Ask the graph: closed vs open world", cap: "Graph facts: Rahul ordered Margherita; Margherita isOfType Veg; Priya ordered Pepperoni; Pepperoni isOfType NonVeg; Pizza ⊑ Food. A database usually treats missing facts as false (closed world); RDF/OWL treat them as unknown (open world).",
  inputs: [["qx", "question", [["a", "Is the Margherita a Food?"], ["b", "Did Priya order a Margherita?"], ["c", "Is Rahul vegetarian?"]]]],
  out: v => { const R = { a: ["no (not stored), unless a rule applies the hierarchy", "yes, inferred via Pizza ⊑ Food", "Inference adds facts never stated."], b: ["no", "unknown (not stated)", "Absence of evidence is not evidence of absence."], c: ["no", "unknown", "Ordering one veg pizza doesn't make Rahul vegetarian; no rule says so."] }[v.qx];
    return XH.table(["closed-world database", "open-world knowledge graph"], [[R[0], `<b>${R[1]}</b>`]]) + `<div class="readout"><span>${R[2]}</span><span>The open-world view suits the web, where knowledge is always incomplete; applications needing yes/no answers add explicit rules or closed-world checks.</span></div>`; } });

}

{
/* ===== NLP M13 labs: word senses, WordNet, WSD ===== */
var NL13 = {
  H: { "bat (animal)": "mammal", "dog": "mammal", "mammal": "animal", "bird": "animal", "animal": "entity", "bat (cricket bat)": "sports equipment", "sports equipment": "artifact", "car": "vehicle", "SUV": "car", "vehicle": "artifact", "artifact": "entity" },
  chain(x) { const c = [x]; while (NL13.H[c[c.length - 1]]) c.push(NL13.H[c[c.length - 1]]); return c; }
};

LABS.nlLemmaSense = XH.calc({ p: "lms", title: "Lexeme, lemma and sense", cap: "A lexeme is the dictionary entry (a family of word forms); its lemma is the citation form those forms map back to; a sense is one particular meaning.",
  inputs: [["w", "word form", ["running", "ran", "banks", "carpets", "bats"]]],
  out: v => { const D = { running: ["run", ["move fast on foot", "manage (run a company)", "operate (the engine is running)"]], ran: ["run", ["move fast on foot", "manage", "operate"]], banks: ["bank", ["financial institution", "sloping land beside a river"]], carpets: ["carpet", ["floor covering"]], bats: ["bat", ["flying mammal", "cricket/baseball bat", "to hit (verb)"]] }[v.w];
    return XH.table(["", "value"], [["surface form", v.w], ["lemma (citation form)", `<b>${D[0]}</b>`], ["senses of the lexeme", D[1].map((s, i) => `${i + 1}. ${s}`).join("<br>")]]) + `<div class="readout"><span>Lemmatisation (M1) walks from form to lemma; it doesn't choose a sense. Word sense disambiguation does that, using context: word + context = meaning.</span></div>`; } });

LABS.nlHomPoly = sorterLab("Homonymy or polysemy?", "Homonymy: same spelling, unrelated meanings (two strangers with the same name). Polysemy: related meanings sharing one core idea (one person wearing different hats).", { hom: "Homonymy", pol: "Polysemy" }, [
  ["bat: cricket bat vs flying mammal", "hom", "Unrelated."], ["paper: newspaper, question paper, gift-wrap paper", "pol", "All still paper."], ["mouth: of a person, of a river, of a cave", "pol", "An opening."], ["match: a cricket match vs a good match for him", "hom", "Unrelated senses."], ["bank: financial institution vs river bank", "hom", "Unrelated in modern use."], ["head: of a person, of a department, of a queue", "pol", "Top / leading part."]
]);

LABS.nlRelSorter = sorterLab("Which lexical relation?", "Synonyms (nearly same meaning), antonyms (opposites), hypernym (more general parent), hyponym (more specific child), meronym (part of a whole).", { syn: "Synonym", ant: "Antonym", hyper: "Hypernym", hypo: "Hyponym", mero: "Meronym" }, [
  ["big ↔ large", "syn", "Though not always substitutable: 'big brother', not 'large brother'."], ["rich ↔ poor", "ant", "Opposites."], ["vehicle is a ___ of car", "hyper", "More general."], ["SUV is a ___ of car", "hypo", "More specific."], ["wheel is a ___ of car", "mero", "Part of."], ["finger is a ___ of hand", "mero", "Part of."], ["golden retriever is a ___ of dog", "hypo", "Specific kind."], ["angry ↔ furious", "syn", "Near-synonyms."]
]);

LABS.nlPosRelations = XH.calc({ p: "prl", title: "Synsets and relations by part of speech", cap: "WordNet's nodes are synsets (sets of synonyms expressing one concept). Relation types differ by part of speech.",
  inputs: [["pos", "part of speech", [["n", "nouns"], ["v", "verbs"], ["a", "adjectives"]]]],
  out: v => { const D = { n: [["synset", "{car, automobile, auto}"], ["hypernym / hyponym", "vehicle → car → SUV"], ["meronym / holonym", "wheel is part of car / car has wheel"]], v: [["synset", "{walk, go on foot}"], ["hypernym (troponym direction)", "move → walk; sleep → snore (snoring is a way of sleeping)"], ["entailment", "snore entails sleep; buy entails pay"]], a: [["synset", "{intelligent, clever, bright, brilliant, smart}"], ["antonym", "hot ↔ cold, rich ↔ poor"], ["similar-to", "hot ~ scorching, warm"]] }[v.pos];
    return XH.table(["relation", "example"], D) + `<div class="readout"><span>Words are labels on synsets; one spelling (bat) can label several synsets in different parts of the graph.</span></div>`; } });

LABS.nlWordNetPath = XH.calc({ p: "wnp", title: "WordNet as a graph: chains and similarity", cap: "A forest of hypernym hierarchies. Properties are inherited down the chain, and path similarity = 1/(1 + shortest path length through the lowest common ancestor).",
  inputs: [["a", "synset A", ["bat (animal)", "dog", "car", "bat (cricket bat)", "SUV"]], ["b", "synset B", ["dog", "bat (cricket bat)", "SUV", "bird", "vehicle"]]],
  out: v => { const ca = NL13.chain(v.a), cb = NL13.chain(v.b), lcs = ca.find(x => cb.includes(x)), d = ca.indexOf(lcs) + cb.indexOf(lcs);
    return NLH.tree("(entity (animal (mammal bat₁ dog) bird) (artifact (equipment bat₂) (vehicle (car SUV))))", 420) + XH.table(["", "value"], [["chain A", ca.join(" → ")], ["chain B", cb.join(" → ")], ["lowest common ancestor", lcs], ["path length", d], ["path similarity", `<b>${XH.f(1 / (1 + d))}</b>`]]) + `<div class="readout"><span>bat₁ vs dog: 0.333 (siblings under mammal); bat₁ vs bat₂: 0.143 (only 'entity' in common) even though the spelling is identical.</span><span>Inheritance for free: bat₁ is a mammal, hence an animal, without anyone stating it.</span></div>`; } });

LABS.nlMfsBaseline = XH.calc({ p: "mfs", title: "The most-frequent-sense baseline", cap: "Without context, always guess the sense that is most common in a sense-tagged corpus. Every cleverer method must beat this.",
  inputs: [["p", "share of 'bat' = cricket bat in training", 50, 95, 1, 80], ["q", "share of cricket bats in your test text", 0, 100, 5, 80]],
  out: v => { const guess = v.p >= 50 ? "cricket bat" : "animal", acc = guess === "cricket bat" ? v.q : 100 - v.q;
    return XH.bars([["accuracy of always guessing '" + guess + "'", acc / 100, "var(--nl)"]], 1) + `<div class="readout"><span>80/20 corpus, similar test text: 80% correct for free. But on a nature documentary transcript (test share 10%), accuracy collapses to 10%; and it is always wrong for 'the bat flew out of the cave'.</span></div>`; } });

LABS.nlNbWsd = XH.calc({ p: "nbw", title: "Naive Bayes WSD with add-1 smoothing", cap: "Priors P(finance) = 0.8, P(river) = 0.2. Counts over V = 6 context words — finance: loan 4, approved 2, money 3, water 0, fishing 0, river 1 (total 10); river: 0, 0, 0, 2, 1, 2 (total 5). P(w | s) = (count + 1)/(total + 6).",
  inputs: [["c1", "loan", "check", true], ["c2", "approved", "check", true], ["c3", "money", "check"], ["c4", "water", "check"], ["c5", "fishing", "check"]],
  out: v => { const V = ["loan", "approved", "money", "water", "fishing", "river"], C = { finance: [4, 2, 3, 0, 0, 1], river: [0, 0, 0, 2, 1, 2] }, pr = { finance: 0.8, river: 0.2 }, on = [v.c1, v.c2, v.c3, v.c4, v.c5];
    const sc = {}; Object.keys(C).forEach(s => { const tot = C[s].reduce((a, b) => a + b, 0); sc[s] = on.reduce((p, o, i) => o ? p * (C[s][i] + 1) / (tot + 6) : p, pr[s]); });
    const win = sc.finance >= sc.river ? "finance" : "river";
    return XH.table(["sense", "prior × Π P(w | sense)"], Object.keys(sc).map(s => [s, `${s === win ? "<b>" : ""}${XH.f(sc[s], 4)}${s === win ? "</b>" : ""}`])) + `<div class="readout"><span>Winner: <b>${win}</b> (ratio ${XH.f(Math.max(sc.finance, sc.river) / Math.min(sc.finance, sc.river), 1)}×). Defaults (loan, approved): 0.8 × 0.3125 × 0.1875 = 0.0469 vs 0.2 × 0.0909 × 0.0909 = 0.0017, about 28×.</span><span>Smoothing keeps the river sense from a hard zero. The 'naive' independence assumption suits words in a context reasonably well; check correlated features before trusting it elsewhere.</span></div>`; } });

LABS.nlEmbedWsd = XH.calc({ p: "ebw", title: "Embedding-similarity WSD", cap: "Embed the sentence and each sense's gloss; pick the gloss with the highest cosine. Toy 2-d vectors: finance gloss [1.4, 0.7], river gloss [0.3, 1.1].",
  inputs: [["s", "sentence", [["f", "The bank approved my loan"], ["r", "I sat on the bank watching ducks"], ["m", "I went to the bank"]]]],
  out: v => { const S = { f: [1.2, 0.3], r: [0.4, 1.3], m: [0.8, 0.8] }[v.s], G = [["financial institution that lends money", [1.4, 0.7]], ["sloping land beside a river", [0.3, 1.1]]], cs = (a, b) => (a[0] * b[0] + a[1] * b[1]) / Math.hypot(...a) / Math.hypot(...b);
    const r = G.map(([g, x]) => [g, cs(S, x)]);
    return XH.bars(r.map(([g, c]) => [g, c, c === Math.max(...r.map(z => z[1])) ? "var(--nl)" : "var(--muted)"]), 1) + `<div class="readout"><span>Sentence vector [${S.join(", ")}] (illustrative). 'The bank approved my loan' → finance (0.98 vs 0.49). 'I went to the bank' sits between: little context, little certainty.</span><span>No labelled training data needed; contextual embeddings (BERT) sharpen it further because 'bank' itself already shifts with its neighbours.</span></div>`; } });

LABS.nlLesk = {
  title: "The Lesk algorithm", cap: "Count overlapping words between the sentence (like a job description) and each sense's dictionary gloss (like a résumé); the sense with most overlap wins. Stop words are ignored.",
  html: () => `<div class="slidergrid xh"><label for="lk-w">target word <select id="lk-w"><option value="bank">bank</option><option value="bass">bass</option></select></label><label for="lk-m">matching <select id="lk-m"><option value="x">exact words</option><option value="p">prefix (fisherman ~ fish, loan ~ loans)</option></select></label><label for="lk-s" style="flex-direction:column;align-items:stretch">sentence<input id="lk-s" type="text" value="The bank approved my loan"></label></div><div id="lk-o" style="margin-top:8px"></div>`,
  mount(root) {
    const G = { bank: { finance: "a financial institution that accepts deposits and provides loans and mortgages", river: "sloping land beside a body of water the shore of a river" }, bass: { fish: "an edible fish of sea and fresh water", music: "the lowest part in music played on a guitar or in a band" } }, STOP = new Set("the a an my of and that in on or to i we is was".split(" "));
    const draw = (chg) => { const w = el_(root, "#lk-w").value; if (chg === "w") el_(root, "#lk-s").value = w === "bank" ? "The bank approved my loan" : "The fisherman caught a bass";
      const pre = el_(root, "#lk-m").value === "p", ctx = el_(root, "#lk-s").value.toLowerCase().match(/[a-z]+/g) || [], C = ctx.filter(x => !STOP.has(x) && x !== w), m = (a, b) => a === b || (pre && Math.min(a.length, b.length) >= 4 && (a.startsWith(b) || b.startsWith(a)));
      const rows = Object.entries(G[w]).map(([s, g]) => { const gw = [...new Set(g.split(" "))].filter(x => !STOP.has(x)), hit = gw.filter(x => C.some(c => m(c, x))); return [s, gw.map(x => hit.includes(x) ? `<b style="color:var(--nl)">${x}</b>` : x).join(" "), hit.length]; });
      const best = Math.max(...rows.map(r => r[2])), winners = rows.filter(r => r[2] === best);
      el_(root, "#lk-o").innerHTML = XH.table(["sense", "gloss (overlaps highlighted)", "overlap"], rows) + `<div class="readout"><span>${best === 0 ? "No overlap: Lesk can't decide (tie at 0)." : winners.length > 1 ? "Tie." : "Chosen sense: <b>" + winners[0][0] + "</b>."} Exact matching misses 'loan' vs 'loans' and 'fisherman' vs 'fish'.</span><span>Fixes: lemmatise/stem, extended Lesk (also use glosses of related synsets), richer glosses (e.g. encyclopedia pages), or embedding similarity.</span></div>`; };
    el_(root, "#lk-w").addEventListener("input", () => draw("w")); el_(root, "#lk-m").addEventListener("input", () => draw()); el_(root, "#lk-s").addEventListener("input", () => draw()); draw(); return draw;
  }
};

LABS.nlWsdMethods = sorterLab("Which WSD method?", "Four families: most-frequent-sense baseline (counts), supervised (e.g. Naive Bayes over context words), embedding similarity (sentence vs gloss vectors), and knowledge-based matching (Lesk gloss overlap, WordNet neighbourhoods).", { mfs: "Most frequent sense", nb: "Supervised (Naive Bayes)", emb: "Embedding similarity", lesk: "Lesk / knowledge-based" }, [

LABS.nlRagFlow = XH.stepLab({ p: "rgf", title: "The RAG flow: an open-book exam", cap: "Knowledge base: attendance, exam, hostel and fee policies, split into chunks and embedded in a vector database. Question: 'Can I sit the final exam if my attendance is 70%?'",

LABS.nlTopKThresh = XH.calc({ p: "tkt", title: "Top-K vs thresholding", cap: "Each chunk has a similarity score. Top-K keeps a fixed number; thresholding keeps everything above a bar. Pick a score profile and compare.",

LABS.nlTokenBudget = XH.calc({ p: "tbg", title: "The token budget", cap: "Available = max context − (system prompt + user query). Chunks that fit = ⌊available / chunk size⌋ (floor: you can't exceed the window). Each conversation turn also consumes the window.",
  inputs: [["mx", "max context (tokens)", 2048, 32768, 64, 8192], ["sp", "system prompt", 0, 2000, 10, 300], ["uq", "user query", 0, 1000, 10, 220], ["cs", "chunk size", 128, 2048, 64, 512], ["tu", "tokens used by earlier turns", 0, 20000, 100, 0]],
  out: v => { const av = v.mx - (v.sp + v.uq + v.tu), n = Math.max(0, Math.floor(av / v.cs)), used = (v.sp + v.uq + v.tu) / v.mx;

LABS.nlChunker = XH.calc({ p: "chk2", title: "Chunking: size, overlap and stride", cap: "Stride = chunk size − overlap. Number of chunks = ⌈document tokens / stride⌉ (ceiling: the last partial window still becomes a chunk). Overlap keeps ideas that straddle a boundary whole in at least one chunk.",

{
/* ===== NLP M15 labs: text summarisation ===== */
var NL15 = {
  DOC: ["The rover landed safely on Mars after a seven-month journey.", "Engineers cheered as the first images from the Mars surface arrived.", "The rover will search the crater for signs of ancient microbial life.", "Mars once had rivers and lakes, making the crater a promising site.", "The mission also tests technology for future human trips to Mars.", "Meanwhile, a local bakery announced a new bread recipe."],
  STOP: new Set("the a an on after as from will for of and to also once had making new meanwhile".split(" ")),
  toks(s) { return (s.toLowerCase().match(/[a-z]+(?:-[a-z]+)?/g) || []).filter(w => !NL15.STOP.has(w)); },
  ngr(t, n) { const w = t.toLowerCase().replace(/[.,]/g, "").split(/\s+/).filter(Boolean), c = {}; for (let i = 0; i + n <= w.length; i++) { const k = w.slice(i, i + n).join(" "); c[k] = (c[k] || 0) + 1; } return c; }
};

LABS.nlSummUses = sorterLab("Where is summarisation used?", "Summarisation produces a shorter version of a text that keeps the key information: the TL;DR for an executive with 150 unread emails, a 60-page report and three missed meetings.", { srch: "Search snippets", work: "Workplace tools", news: "News digests", acc: "Accessibility" }, [
  ["A ~26-word answer box above web results", "srch", "Query-focused snippet."], ["Action items generated from a long chat thread", "work", "Meeting/email summaries."], ["A five-minute digest of today's headlines", "news", "Multi-document."], ["A plain-language version of a legal notice", "acc", "Simplification."], ["Minutes of yesterday's meeting from its transcript", "work", "Transcript summarisation."]
]);

LABS.nlSummTypes = sorterLab("Which kind of summary?", "Three independent dimensions. Output: extractive (highlighter: copy sentences) vs abstractive (pen: rewrite in new words). Input: single vs multi-document. Focus: generic vs query-focused.", { ext: "Extractive", abs: "Abstractive", multi: "Multi-document", query: "Query-focused" }, [
  ["The summary is three sentences copied verbatim from the article", "ext", "Highlighter."], ["The summary uses words that never appear in the source", "abs", "Pen."], ["One overview written from five reports on the same earthquake", "multi", "Must handle overlap and contradictions."], ["'Was cast-metal movable type invented in Korea?' answered from a long page", "query", "Ignores text that doesn't answer."], ["A headline generated for a news story in fresh wording", "abs", "Abstractive, single document."], ["Taking just the first sentence of a news story", "ext", "The lead baseline: surprisingly strong for news."]
]);

LABS.nlExtractPipe = XH.stepLab({ p: "exp2", title: "The three acts of extractive summarisation", cap: "Extractive summarisation copies source sentences, so it can't invent facts. It runs as content selection → information ordering → sentence realisation.",
  steps: [
    { html: "<b>Act 1, content selection</b>: split into sentences and score each (word frequency/TF-IDF, graph centrality, supervised features); keep the best, avoiding redundancy (MMR)." },
    { html: "<b>Act 2, information ordering</b>: arrange the chosen sentences into a coherent story: chronologically (news), by coherence (neighbours share entities), or by a template for the question type (biography: dates → nationality → education → fame)." },
    { html: "<b>Act 3, sentence realisation</b>: prune unneeded clauses ('…, international observers said Tuesday') and fix references ('He has immunity…' → 'Gen. Augusto Pinochet has immunity…')." },
    { html: "Result: a short, faithful summary. The trade-off: extractive summaries can be choppy and redundant; abstractive ones read better but can hallucinate." }
  ] });

LABS.nlTfidfSent = XH.calc({ p: "tfs", title: "Frequency and TF-IDF content selection", cap: "Luhn's 1958 idea: important words are frequent in this document. TF-IDF also discounts words common everywhere: weight(w) = TF(w, doc) × IDF(w). A sentence's score = average weight of its content words.",
  inputs: [["idf", "use IDF (discount words common across the collection)", "check", true], ["k", "sentences to extract", 1, 4, 1, 2]],
  out: v => { const tf = {}; NL15.DOC.forEach(s => NL15.toks(s).forEach(w => { tf[w] = (tf[w] || 0) + 1; })); const common = new Set(["engineers", "local", "first", "future", "safely", "signs", "site", "journey"]), idf = w => v.idf ? (common.has(w) ? 1.0 : 2.3) : 1, wt = w => tf[w] * idf(w);
    const sc = NL15.DOC.map(s => { const t = [...new Set(NL15.toks(s))]; return t.reduce((a, w) => a + wt(w), 0) / t.length; }), order = sc.map((x, i) => i).sort((a, b) => sc[b] - sc[a]), pick = new Set(order.slice(0, v.k));
    const top = Object.keys(tf).sort((a, b) => wt(b) - wt(a)).slice(0, 4).map(w => `${w} ${XH.f(wt(w), 1)}`).join(", ");
    return XH.table(["sentence", "score", "picked"], NL15.DOC.map((s, i) => [s, XH.f(sc[i], 2), pick.has(i) ? "✓" : ""])) + `<div class="readout"><span>Top word weights: ${top}. Sentences about Mars, the rover and the crater win; the off-topic bakery line scores lowest. (IDF values here are illustrative.)</span><span>Extracted sentences are then shown in document order.</span></div>`; } });

LABS.nlLexRank = XH.calc({ p: "lxr", title: "LexRank: the cocktail party of sentences", cap: "Sentences are nodes; edges join similar sentences (cosine above a cut-off). PageRank-style power iteration finds the most central sentence: the one most others 'agree with'. Edge weights are illustrative.",
  inputs: [["d", "damping d", 0.5, 0.95, 0.05, 0.85], ["cut", "drop edges below", 0, 0.6, 0.05, 0]],
  out: v => { const N = ["S1", "S2", "S3", "S4", "S5"], E = [[0, 1, .5], [0, 2, .4], [1, 3, .6], [1, 4, .5], [2, 4, .3], [3, 4, .2], [1, 2, .4]].filter(e => e[2] >= v.cut), W = N.map(() => N.map(() => 0)); E.forEach(([a, b, w]) => { W[a][b] = w; W[b][a] = w; });
    let r = N.map(() => 1 / 5); for (let it = 0; it < 60; it++) { const nr = N.map(() => (1 - v.d) / 5); N.forEach((_, i) => { const s = W[i].reduce((a, b) => a + b, 0); if (s) N.forEach((_, j) => { nr[j] += v.d * r[i] * W[i][j] / s; }); else N.forEach((_, j) => { nr[j] += v.d * r[i] / 5; }); }); r = nr; }
    const P = [[60, 40], [200, 40], [40, 150], [330, 110], [190, 175]]; let s = `<svg viewBox="0 0 380 200" style="width:100%;height:auto;max-height:220px" role="img" aria-label="sentence graph">`;
    E.forEach(([a, b, w]) => { s += `<line x1="${P[a][0]}" y1="${P[a][1]}" x2="${P[b][0]}" y2="${P[b][1]}" stroke="var(--line)" stroke-width="${1 + 5 * w}"/><text x="${(P[a][0] + P[b][0]) / 2}" y="${(P[a][1] + P[b][1]) / 2 - 4}" font-size="9" fill="var(--muted)" text-anchor="middle">${w}</text>`; });
    const mx = Math.max(...r); N.forEach((n, i) => { s += `<circle cx="${P[i][0]}" cy="${P[i][1]}" r="${10 + 40 * r[i]}" fill="${r[i] === mx ? "color-mix(in srgb, var(--nl) 40%, var(--surface))" : "var(--surface)"}" stroke="var(--ink)"/><text x="${P[i][0]}" y="${P[i][1] + 4}" text-anchor="middle" font-size="10" fill="var(--ink)">${n}</text>`; });
    return s + "</svg>" + XH.bars(N.map((n, i) => [n, r[i], r[i] === mx ? "var(--nl)" : "var(--muted)"])) + `<div class="readout"><span>S2 links strongly to most others, so it is the most central and gets extracted first. Raising the edge cut-off removes weak links and can change who is central.</span></div>`; } });

LABS.nlMmr = XH.calc({ p: "mmr", title: "MMR: relevance minus redundancy", cap: "MMR picks argmax over unchosen s of λ·Sim(s, Q) − (1 − λ)·max Sim(s, chosen). Relevance: S1 0.90, S2 0.88, S3 0.70, S4 0.60. S1 and S2 say almost the same thing (similarity 0.85).",
  inputs: [["lam", "λ (1 = relevance only)", 0, 1, 0.05, 0.5], ["k", "summary length K", 1, 4, 1, 2]],
  out: v => { const S = { S1: "Author J.K. Rowling won her legal battle to ban an unofficial encyclopedia.", S2: "A US judge ruled in favour of Rowling against the encyclopedia's publication.", S3: "The judge said the book copied large portions of her novels without commentary.", S4: "The publisher said it was disappointed and considering an appeal." }, R = { S1: .9, S2: .88, S3: .7, S4: .6 }, P = { "S1S2": .85, "S1S3": .35, "S1S4": .3, "S2S3": .4, "S2S4": .35, "S3S4": .2 }, sim = (a, b) => P[[a, b].sort().join("")];
    const ch = [], rows = []; while (ch.length < v.k) { let best = null, bs = -9; Object.keys(R).filter(s => !ch.includes(s)).forEach(s => { const sc = v.lam * R[s] - (1 - v.lam) * Math.max(0, ...ch.map(t => sim(s, t))); if (sc > bs) { bs = sc; best = s; } }); ch.push(best); rows.push([ch.length, best, XH.f(bs), S[best]]); }
    return XH.table(["step", "pick", "MMR score", "sentence"], rows) + `<div class="readout"><span>${ch.includes("S1") && ch.includes("S2") ? "Both near-duplicates were chosen: redundant summary." : "The second slot goes to new information instead of a near-duplicate."} With λ = 0.5: S1 (0.45), then S3 (0.35 − 0.175 = 0.175) rather than S2 (0.44 − 0.425 = 0.015).</span><span>A greedy approximation to choosing the best set; stop at the length limit.</span></div>`; } });

LABS.nlOrdering = XH.calc({ p: "ord", title: "Information ordering", cap: "Selected sentences must be arranged into a coherent story.",
  inputs: [["st", "strategy", [["chr", "chronological (news)"], ["tpl", "template: biography"], ["rnd", "random (what not to do)"]]]],
  out: v => { const S = { chr: [["Mon", "An earthquake struck the coastal region."], ["Tue", "Rescue teams reached the worst-hit villages."], ["Wed", "Aid agencies appealed for funds."]], tpl: [["dates", "Marie Curie (1867–1934)"], ["nationality", "was a Polish-born French physicist and chemist"], ["education", "who studied at the University of Paris"], ["fame", "and won Nobel Prizes in both physics and chemistry."]], rnd: [["?", "Aid agencies appealed for funds."], ["?", "An earthquake struck the coastal region."], ["?", "Rescue teams reached the worst-hit villages."]] }[v.st];
    return XH.table(["slot", "sentence"], S) + `<div class="readout"><span>Templates by question type: biography = dates → nationality → education → fame; definition = genus → species → synonym → subtype; medical = population → problem → intervention → outcome. Coherence ordering puts sentences sharing entities next to each other.</span></div>`; } });

LABS.nlRealise = XH.calc({ p: "rlz", title: "Sentence realisation", cap: "Extracted sentences are cleaned: prune unneeded clauses (appositives, attributions, initial adverbials) and fix references that make no sense out of context.",

LABS.nlAbsTrain = XH.calc({ p: "abt", title: "Abstractive summarisation with sequence-to-sequence models", cap: "An encoder reads the article; a decoder writes the summary token by token, attending back to relevant input words. In decoder-only training, the sequence is ARTICLE &lt;EOS&gt; SUMMARY &lt;EOS&gt; &lt;pad&gt;, with the loss computed only on summary tokens.",

LABS.nlRouge = {
  title: "ROUGE: n-gram overlap with human summaries", cap: "ROUGE-N = Σ over references of matched n-grams (clipped counts) ÷ Σ of reference n-grams: recall-oriented. Question: 'What is water spinach?' Three human references; edit the system summary.",
  html: () => `<div class="slidergrid xh"><label for="rg-n">n <select id="rg-n"><option value="1">1 (unigrams)</option><option value="2" selected>2 (bigrams)</option></select></label><label for="rg-s" style="flex-direction:column;align-items:stretch">system summary<input id="rg-s" type="text" value="Water spinach is a leaf vegetable commonly eaten in tropical areas of Asia."></label></div><div id="rg-o" style="margin-top:8px"></div>`,
  mount(root) {
    const R = ["Water spinach is a green leafy vegetable grown in the tropics.", "Water spinach is a semi-aquatic tropical plant grown as a vegetable.", "Water spinach is a commonly eaten leaf vegetable of Asia."];
    const draw = () => { const n = +el_(root, "#rg-n").value, X = NL15.ngr(el_(root, "#rg-s").value, n); let M = 0, T = 0; const rows = R.map((r, i) => { const G = NL15.ngr(r, n), tot = Object.values(G).reduce((a, b) => a + b, 0), m = Object.entries(G).reduce((a, [g, c]) => a + Math.min(c, X[g] || 0), 0); M += m; T += tot; return [`Human ${i + 1}`, r, tot, m]; });
      el_(root, "#rg-o").innerHTML = XH.table(["", "reference", `${n}-grams`, "matched"], rows) + `<div class="formula">ROUGE-${n} = ${M}/${T} = <b>${XH.f(M / T, 2)}</b></div><div class="readout"><span>Default: bigram matches 3 + 3 + 6 = 12; reference bigrams 10 + 10 + 9 = 29 → ROUGE-2 ≈ 0.41 (counting 'semi-aquatic' as one token).</span><span>ROUGE rewards shared wording, not meaning: a correct paraphrase with different words scores low, a key weakness for abstractive summaries.</span></div>`; };

LABS.nlTermDoc = XH.calc({ p: "tdm", title: "Term-document matrix", cap: "Rows are words, columns are documents (plays). A word's vector is its row; a document's vector is its column. Compare documents or words by cosine similarity.",
  inputs: [["a", "compare document A", ["As You Like It", "Twelfth Night", "Julius Caesar", "Henry V"]], ["b", "with document B", ["Henry V", "As You Like It", "Twelfth Night", "Julius Caesar"]]],
  out: v => { const P = ["As You Like It", "Twelfth Night", "Julius Caesar", "Henry V"], M = { battle: [1, 0, 7, 13], good: [114, 80, 62, 89], fool: [36, 58, 1, 4] }, ia = P.indexOf(v.a), ib = P.indexOf(v.b);

LABS.nlTfidf = XH.calc({ p: "tfi", title: "TF-IDF weighting", cap: "tf = log₁₀(count + 1) dampens very frequent words; idf = log₁₀(N / df) rewards words found in few documents. tf-idf = tf × idf.",

LABS.nlWordMap = {
  title: "From counts to dense vectors", cap: "A tiny corpus about pets and about stock markets. Co-occurrence counts (window ±2) are weighted by positive PMI and compressed by SVD into 2 dimensions: words with similar contexts land close together. Click a word to see its nearest neighbours.",
  html: () => `<div class="grid2"><div id="wm-p"></div><div id="wm-t"></div></div>`,
  mount(root) {
    const C = ["the cat sat on the mat", "the dog sat on the log", "a cat chased a dog", "stock prices rose sharply", "the market and stock prices fell", "investors sold stock"].map(s => s.split(" "));
    const V = [...new Set(C.flat())].sort(), I = Object.fromEntries(V.map((w, i) => [w, i])), n = V.length, M = Array.from({ length: n }, () => Array(n).fill(0));
    C.forEach(d => d.forEach((a, i) => d.forEach((b, j) => { if (i !== j && Math.abs(i - j) <= 2) M[I[a]][I[b]]++; })));
    const tot = M.flat().reduce((s, x) => s + x, 0), rw = M.map(r => r.reduce((s, x) => s + x, 0) / tot), cl = V.map((_, j) => M.reduce((s, r) => s + r[j], 0) / tot);
    const P = M.map((r, i) => r.map((x, j) => x ? Math.max(0, Math.log2((x / tot) / (rw[i] * cl[j]))) : 0));
    /* power iteration for top-2 singular vectors of symmetric P */
    const mul = (A, v) => A.map(r => r.reduce((s, x, j) => s + x * v[j], 0)), norm = v => { const z = Math.hypot(...v); return v.map(x => x / z); };
    let u1 = norm(V.map((_, i) => 1 + (i % 3))); for (let k = 0; k < 200; k++) u1 = norm(mul(P, u1)); const l1 = mul(P, u1).reduce((s, x, i) => s + x * u1[i], 0);
    const P2 = P.map((r, i) => r.map((x, j) => x - l1 * u1[i] * u1[j])); let u2 = norm(V.map((_, i) => ((i * 7) % 5) - 2)); for (let k = 0; k < 200; k++) u2 = norm(mul(P2, u2)); const l2 = mul(P2, u2).reduce((s, x, i) => s + x * u2[i], 0);
    const E = V.map((_, i) => [u1[i] * Math.sqrt(Math.abs(l1)), u2[i] * Math.sqrt(Math.abs(l2))]); let sel = "cat";
    const cos = (a, b) => (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(...a) * Math.hypot(...b) + 1e-12);
    const draw = () => { const xs = E.map(e => e[0]), ys = E.map(e => e[1]), pad = 0.2, b = { xmin: Math.min(...xs) - pad, xmax: Math.max(...xs) + pad, ymin: Math.min(...ys) - pad, ymax: Math.max(...ys) + pad };
      el_(root, "#wm-p").innerHTML = XH.lines([], b, { x: "dimension 1 (y: dimension 2)" }, (sx, sy) => V.map((w, i) => `<g data-w="${w}" style="cursor:pointer"><circle cx="${sx(E[i][0])}" cy="${sy(E[i][1])}" r="${w === sel ? 5 : 3.5}" fill="${w === sel ? "var(--path)" : "var(--nl)"}"/><text x="${sx(E[i][0]) + 5}" y="${sy(E[i][1]) - 4 + ((i % 3) - 1) * 7}" font-size="9" fill="var(--ink)">${w}</text></g>`).join(""));
      $$("[data-w]", el_(root, "#wm-p")).forEach(g => g.onclick = () => { sel = g.dataset.w; draw(); });
      const cosN = (a, b) => { let d = 0, na = 0, nb2 = 0; for (let k = 0; k < n; k++) { d += a[k] * b[k]; na += a[k] * a[k]; nb2 += b[k] * b[k]; } return d / (Math.sqrt(na * nb2) + 1e-12); }; const nb = V.filter(w => w !== sel).map(w => [w, cosN(P[I[sel]], P[I[w]])]).sort((a, b) => b[1] - a[1]).slice(0, 5);
      el_(root, "#wm-t").innerHTML = `<b class="small">Nearest to '${sel}' (cosine of full PPMI vectors)</b>` + XH.table(["word", "cosine"], nb.map(([w, c]) => [w, XH.f(c, 2)])) + `<p class="small muted">The 2-D map (SVD) separates pet words from market words: meaning from context alone, 2 numbers per word instead of ${n}. Neighbours are computed on the full PPMI rows.</p>`; };
    draw(); return draw;
  }
};
