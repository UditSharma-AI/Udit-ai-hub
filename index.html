<style>
/* Layout: left rail navigation + single reading column; lessons add a sticky section index.
   Visual world: optimisation contour maps — banded green "terrain", an orange descent path. */
:root{
  --bg:#F2F5F3; --surface:#FFFFFF; --surface-2:#E8EEEB; --ink:#14201B; --muted:#56665F; --line:#D3DDD8;
  --accent:#0A7558; --accent-soft:#D5EDE4; --accent-ink:#FFFFFF;
  --path:#C9561A; --path-soft:#F8E2D5;
  --dnn:#2D5C8C; --dnn-soft:#DCE7F2;
  --good:#1B7F45; --warn:#9A6A10; --bad:#B23A16; --warn-soft:#F6EBD3; --bad-soft:#F7DED4;
  --code-bg:#F5F8F6; --shadow:0 1px 2px rgba(20,32,27,.06),0 4px 16px rgba(20,32,27,.05);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
  --r:10px; --r-sm:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1311; --surface:#131C19; --surface-2:#1A2521; --ink:#E1EAE5; --muted:#91A39B; --line:#283631;
  --accent:#3DC498; --accent-soft:#163A2E; --accent-ink:#06120E;
  --path:#F08C4A; --path-soft:#3A2416;
  --dnn:#86AEDB; --dnn-soft:#1A2A3B;
  --good:#55C985; --warn:#E0B04F; --bad:#F07B55; --warn-soft:#352A12; --bad-soft:#3A1E14;
  --code-bg:#0F1715; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1311; --surface:#131C19; --surface-2:#1A2521; --ink:#E1EAE5; --muted:#91A39B; --line:#283631;
  --accent:#3DC498; --accent-soft:#163A2E; --accent-ink:#06120E;
  --path:#F08C4A; --path-soft:#3A2416;
  --dnn:#86AEDB; --dnn-soft:#1A2A3B;
  --good:#55C985; --warn:#E0B04F; --bad:#F07B55; --warn-soft:#352A12; --bad-soft:#3A1E14;
  --code-bg:#0F1715; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 18px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:650;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,1.2rem + 1.6vw,2.3rem);letter-spacing:-.01em}
h2{font-size:1.35rem} h3{font-size:1.1rem} h4{font-size:1rem;margin-top:1.2em}
p{margin:.6em 0}
code{font-family:var(--f-mono);font-size:.88em;overflow-wrap:anywhere;background:var(--surface-2);padding:.08em .35em;border-radius:4px}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font:500 .72rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;padding-block:20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand b{display:block;font:750 1rem/1.15 var(--f-display)}
.brand span{display:block;font-size:.74rem;color:var(--muted);line-height:1.3}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="true"]{background:var(--accent-soft);color:var(--ink)}
.nav .sub{padding-left:28px;font-size:.9rem}
.nav .dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav-label{margin:6px 10px 4px}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.sync{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--good)}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;padding-block:10px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.searchbtn{flex:1;min-width:0;max-width:520px;display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--muted);cursor:pointer;text-align:left}
.searchbtn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.searchbtn kbd{margin-left:auto;font:500 .72rem var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--accent)}
.mobile-brand{display:none}
.content{padding-block:28px 64px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));width:100%;max-width:1180px}
.mnav{display:none}

/* ---------- generic ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:7px 13px;cursor:pointer;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.sm{padding:4px 10px;font-size:.85rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h3{margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 .74rem/1 var(--f-mono);padding:5px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.src{background:var(--accent-soft);color:var(--ink)}
.chip.dnn{background:var(--dnn-soft);color:var(--ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.good{background:var(--accent-soft);color:var(--good)}
.tag{display:inline-block;font:500 .7rem/1 var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:4px 6px;border-radius:4px;vertical-align:middle}
.tag.extra{background:var(--path-soft);color:var(--path)}
.tag.slides{background:var(--accent-soft);color:var(--accent)}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.empty{color:var(--muted);font-size:.9rem;padding:6px 0}
.list{display:flex;flex-direction:column}
.list > *{padding:9px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.linkrow{display:flex;justify-content:space-between;gap:10px;align-items:center;background:none;border:0;padding-left:0;padding-right:0;width:100%;text-align:left;cursor:pointer}
.linkrow:hover .t{color:var(--accent)}
.linkrow .t{font-weight:500}
.tablewrap{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;font-size:.9rem}
table.data td,table.data th,table.cmp td,table.cmp th,table.inv td,table.inv th{border-bottom:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
table th{font-weight:600;font-size:.8rem;color:var(--muted)}
table.vars td{padding:3px 12px 3px 0;vertical-align:top}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:.88rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ---------- dashboard ---------- */
.hello{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.hello p{margin:.3em 0 0;color:var(--muted)}
.tagline{font:500 .8rem var(--f-mono);letter-spacing:.06em;color:var(--accent)}
.hero{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-bottom:16px}
.continue{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px}
.continue canvas{width:100%;height:150px;border-radius:var(--r-sm)}
.continue h2{margin:6px 0 4px}
.statline{display:flex;flex-wrap:wrap;gap:6px 22px;margin:4px 0 22px;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.statline div{display:flex;flex-direction:column}
.statline b{font:650 1.25rem/1.2 var(--f-display);font-variant-numeric:tabular-nums}
.statline span{font-size:.78rem;color:var(--muted)}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.subj{display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;font:inherit;color:inherit}
.subj:hover{border-color:var(--accent)}
.subj .swatch{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font:750 .8rem var(--f-display)}
.subj.ml .swatch{background:var(--accent-soft);color:var(--accent)}
.subj.dnn .swatch{background:var(--dnn-soft);color:var(--dnn)}
.subj.dnn .bar i{background:var(--dnn)}
.subj .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}

/* ---------- subject page ---------- */
.sessions{display:flex;flex-direction:column;gap:8px}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.sess-head{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.sess-head .code{font:650 .9rem var(--f-mono);color:var(--muted)}
.sess-head .t{font-weight:600}
.sess-body{padding:0 14px 14px 78px}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 20px;margin:4px 0 12px;padding:0;list-style:none;font-size:.9rem}
.topics li{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.topics .pg{font:400 .78rem var(--f-mono);color:var(--muted);white-space:nowrap}

/* ---------- session ---------- */
.crumb{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted);margin-bottom:10px;flex-wrap:wrap}
.crumb button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer}
.crumb button:hover{color:var(--accent)}
.s-head{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.s-head .lede{max-width:70ch;color:var(--muted);margin:0}
.statusbar{display:flex;gap:6px;flex-wrap:wrap}
.stbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:.84rem;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--muted)}
.stbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.stbtn.warnish[aria-pressed="true"]{background:var(--warn-soft);border-color:var(--warn)}
.stbtn.badish[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;position:sticky;top:calc(57px + env(safe-area-inset-top,0px));background:var(--bg);z-index:10}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.learn{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px}
.toc{position:sticky;top:calc(110px + env(safe-area-inset-top,0px));align-self:start;display:flex;flex-direction:column;gap:1px;font-size:.86rem;max-height:calc(100vh - 140px);overflow:auto}
.toc button{background:none;border:0;text-align:left;padding:5px 8px;border-radius:4px;color:var(--muted);cursor:pointer;display:flex;gap:8px;align-items:baseline}
.toc button:hover{background:var(--surface-2);color:var(--ink)}
.toc button.read::before{content:"✓";color:var(--accent);font-weight:700}
.toc button:not(.read)::before{content:"○";opacity:.5}
.article{min-width:0;max-width:760px}
.article section{scroll-margin-top:120px;padding-bottom:28px;margin-bottom:28px;border-bottom:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;margin-bottom:8px}
.sec-head h2{flex:1;min-width:220px}
.plain{background:var(--accent-soft);border-radius:var(--r-sm);padding:10px 14px;margin:10px 0 14px;font-size:.95rem}
.plain b{font:500 .7rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:2px}
.article ul,.article ol{padding-left:1.3em}
.article li{margin:.25em 0}
ol.steps{counter-reset:s;list-style:none;padding-left:0}
ol.steps > li{counter-increment:s;padding-left:34px;position:relative;margin:.6em 0}
ol.steps > li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);font:600 .75rem/22px var(--f-mono);text-align:center;color:var(--muted)}
.algo{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--path);padding:12px 16px;border-radius:var(--r-sm);margin:12px 0;font-size:.95rem}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0}
mjx-container:not([display="true"]){display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.terms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:14px}
.terms div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 12px;font-size:.88rem}
.terms b{display:block;font-weight:600}
details.deeper{margin-top:14px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
details.deeper summary{cursor:pointer;padding:9px 14px;font-weight:500}
details.deeper > div{padding:0 14px 10px}
.introgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:28px;align-items:start}
.introgrid .panel ul{margin:0;padding-left:1.1em;font-size:.92rem}

/* ---------- interactive labs ---------- */
.lab{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:18px 0;min-width:0}
.lab-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.lab-title h4{margin:0;display:flex;gap:8px;align-items:center}
.lab-title h4::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--path);display:inline-block}
.lab canvas{display:block;width:100%;background:var(--bg);border-radius:var(--r-sm);touch-action:manipulation}
.lab-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lab-grid3{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:12px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:12px 0 4px;font-size:.88rem}
.ctrls label{display:flex;align-items:center;gap:8px}
.ctrls input[type=range]{width:150px;accent-color:var(--accent)}
.ctrls select,.ctrls input[type=number]{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:3px 6px}
.ctrls input[type=number]{width:84px}
.readout{display:flex;flex-wrap:wrap;gap:4px 18px;font:400 .82rem var(--f-mono);color:var(--muted);margin-top:8px}
.readout b{color:var(--ink);font-weight:500}
.status-pill{font:500 .75rem var(--f-mono);padding:3px 8px;border-radius:99px;background:var(--surface-2)}
.status-pill.ok{background:var(--accent-soft);color:var(--good)}
.status-pill.bad{background:var(--bad-soft);color:var(--bad)}
.status-pill.run{background:var(--path-soft);color:var(--path)}
.cap{font-size:.78rem;color:var(--muted);margin-top:4px}
.edit-table input{width:72px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-family:var(--f-mono);font-size:.85rem}
.calc-out{font-size:.92rem}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:8px 12px;border-radius:4px;font-size:.88rem;margin-top:10px}

/* ---------- code ---------- */
.codeblock{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:14px 0;background:var(--code-bg)}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 6px 14px;border-bottom:1px solid var(--line);background:var(--surface);gap:8px}
.codebar span{font:500 .75rem var(--f-mono);color:var(--muted)}
.codeblock pre{margin:0;padding:12px 14px;overflow-x:auto;font:400 .82rem/1.55 var(--f-mono)}
.codeblock pre code{background:none;padding:0;font-size:inherit}
.outblock{border-top:1px dashed var(--line);background:var(--surface)}
.outblock pre{color:var(--muted)}
.hljs-keyword,.hljs-built_in{color:var(--accent);font-weight:500}
.hljs-string{color:var(--path)}
.hljs-comment{color:var(--muted);font-style:italic}
.hljs-number,.hljs-literal{color:var(--dnn)}
.hljs-title,.hljs-title.function_{color:var(--ink);font-weight:600}
.codecard{margin-bottom:26px}
.codecard ul{font-size:.9rem}

/* ---------- recall ---------- */
.defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.defs > div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 14px}

  line(pts, color, w=2, dash){ this.clip(g=>{ g.strokeStyle=color; g.lineWidth=w; g.setLineDash(dash||[]); g.beginPath(); let started=false; pts.forEach(([x,y])=>{ if(!isFinite(y)){started=false;return;} const X=this.sx(x),Y=this.sy(y); if(!started){g.moveTo(X,Y);started=true;} else g.lineTo(X,Y); }); g.stroke(); g.setLineDash([]); }); }
  fn(f, color, w=2, dash, n=200){ const pts=[]; for(let i=0;i<=n;i++){ const x=this.o.xmin+(this.o.xmax-this.o.xmin)*i/n; pts.push([x,f(x)]); } this.line(pts,color,w,dash); }
  dots(pts, color, r=3.5, stroke){ this.clip(g=>{ pts.forEach(([x,y])=>{ g.beginPath(); g.arc(this.sx(x),this.sy(y),r,0,7); g.fillStyle=color; g.fill(); if(stroke){g.strokeStyle=stroke;g.lineWidth=1.5;g.stroke();} }); }); }
  text(x,y,s,color,align="left"){ const g=this.g; g.fillStyle=color||this.col.ink; g.textAlign=align; g.textBaseline="middle"; g.fillText(s,this.sx(x),this.sy(y)); }
}
function hexToRgb(h){ h=h.replace("#",""); if(h.length===3) h=h.split("").map(c=>c+c).join(""); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function mix(a,b,t){ return a.map((v,i)=>Math.round(v+(b[i]-v)*t)); }

/* Small linear-algebra helpers */
function solve(A, b){ // Gaussian elimination with partial pivoting; returns null if singular
  const n=A.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let c=0;c<n;c++){ let p=c; for(let r=c+1;r<n;r++) if(Math.abs(M[r][c])>Math.abs(M[p][c])) p=r;
    if(Math.abs(M[p][c])<1e-12) return null; [M[c],M[p]]=[M[p],M[c]];
    for(let r=0;r<n;r++){ if(r===c) continue; const f=M[r][c]/M[c][c]; for(let k=c;k<=n;k++) M[r][k]-=f*M[c][k]; } }
  return M.map((r,i)=>r[n]/r[i]);
}

      const inv=[[sxx/det,-sx/det],[-sx/det,n/det]], t0=inv[0][0]*sy+inv[0][1]*sxy, t1=inv[1][0]*sy+inv[1][1]*sxy;
      const pred=rows.map(r=>t0+t1*r[0]), ybar=sy/n;

      <div class="readout"><span>ŷ = <b>${f(t0)} + ${f(t1)}·x</b></span><span>MAE <b>${f(mae)}</b></span><span>MSE <b>${f(mse)}</b></span><span>RMSE <b>${f(Math.sqrt(mse))}</b></span><span>R² <b>${sst>0?f(1-ssr/sst):"n/a"}</b></span></div>`;

      const p=new Plot(root.querySelector("#ne-c"),{xmin:x0-px,xmax:x1+px,ymin:y0-py,ymax:y1+py}); p.axes("x","y");

    root.querySelector("#ne-add").onclick=()=>{ const last=rows[rows.length-1]||[0,0]; rows.push([last[0]+1,last[1]+1]); renderTable(); calc(); };
    root.querySelector("#ne-reset").onclick=()=>{ rows=def.map(r=>r.slice()); renderTable(); calc(); };
    renderTable(); calc(); return ()=>calc();
  }
};

LABS.gdLab = {
  title: "Gradient descent lab", cap: "Synthetic house data: size (1000 sq ft) vs price ($100k), 40 points. Click the contour map to choose a starting point.",
  html: () => `<div class="lab-grid"><canvas id="gd-c" style="height:300px;cursor:crosshair" aria-label="Cost contour map with descent path"></canvas><div class="stack" style="gap:8px;min-width:0"><canvas id="gd-d" style="height:146px" aria-label="Data and current fit"></canvas><canvas id="gd-l" style="height:146px" aria-label="Cost per iteration"></canvas></div></div>
  <div class="ctrls">
    <label for="gd-a">α <input id="gd-a" type="range" min="-3" max="0.4" step="0.01" value="-1"> <b class="num" id="gd-av">0.1</b></label>
    <label for="gd-v">Variant <select id="gd-v"><option value="batch">Batch</option><option value="mini">Mini-batch (m=8)</option><option value="sgd">Stochastic</option></select></label>
    <label><input id="gd-s" type="checkbox"> Scale feature (standardise)</label>
  </div>
  <div class="row"><button class="btn primary sm" id="gd-play">Run</button><button class="btn sm" id="gd-step">Step</button><button class="btn sm" id="gd-10">+10</button><button class="btn sm ghost" id="gd-reset">Reset</button><span class="status-pill" id="gd-st">ready</span></div>
  <div class="readout" id="gd-r"></div>`,
  mount(root){
    const r=prng(7), n=40, X=[], Y=[]; for(let i=0;i<n;i++){ const x=0.8+2.7*r(); X.push(x); Y.push(0.5+1.15*x+0.35*gauss(r)); }
    const mx=X.reduce((a,b)=>a+b)/n, sd=Math.sqrt(X.reduce((a,b)=>a+(b-mx)**2,0)/n);
    const el=id=>root.querySelector(id);
    let S={}, scaled=false, theta, start, path, losses, it, timer=null, order=[], ptr=0;
    const feats=()=> scaled? X.map(x=>(x-mx)/sd) : X;
    const stats=()=>{ const F=feats(); S={n, sx:F.reduce((a,b)=>a+b,0), sxx:F.reduce((a,b)=>a+b*b,0), sy:Y.reduce((a,b)=>a+b,0), sxy:F.reduce((a,b,i)=>a+b*Y[i],0), syy:Y.reduce((a,b)=>a+b*b,0)}; const det=n*S.sxx-S.sx*S.sx; S.opt=[(S.sxx*S.sy-S.sx*S.sxy)/det,(n*S.sxy-S.sx*S.sy)/det]; };
    const J=(a,b)=>(a*a*S.n+2*a*b*S.sx+b*b*S.sxx-2*a*S.sy-2*b*S.sxy+S.syy)/(2*S.n);
    const view=()=>({xmin:S.opt[0]-3.5,xmax:S.opt[0]+3.5,ymin:S.opt[1]-2.2,ymax:S.opt[1]+2.2});
    const alpha=()=>Math.pow(10,+el("#gd-a").value);
    const reset=(keepStart)=>{ stop(); stats(); if(!keepStart) start=[S.opt[0]-2.6,S.opt[1]+1.5]; theta=start.slice(); path=[theta.slice()]; losses=[J(...theta)]; it=0; ptr=0; order=[]; drawAll(); };
    const shuffle=()=>{ order=[...Array(n).keys()]; for(let i=n-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [order[i],order[j]]=[order[j],order[i]]; } ptr=0; };
    const stepOnce=()=>{ const F=feats(), v=el("#gd-v").value; let idx;
      if(v==="batch") idx=[...Array(n).keys()]; else { const m=v==="mini"?8:1; if(ptr+m>order.length) shuffle(); idx=order.slice(ptr,ptr+m); ptr+=m; }
      let g0=0,g1=0; idx.forEach(i=>{ const e=theta[0]+theta[1]*F[i]-Y[i]; g0+=e; g1+=e*F[i]; }); g0/=idx.length; g1/=idx.length;
      const a=alpha(); const prev=theta.slice(); theta=[theta[0]-a*g0, theta[1]-a*g1]; it++; path.push(theta.slice()); losses.push(J(...theta));
      return Math.hypot(theta[0]-prev[0],theta[1]-prev[1]); };
    const status=(d)=>{ const st=el("#gd-st"), Jc=losses[losses.length-1];
      if(!isFinite(Jc)||Jc>1e6||Math.abs(theta[0])>1e4){ st.className="status-pill bad"; st.textContent="diverging: lower α"; return "div"; }
      if(el("#gd-v").value==="batch" && d!==undefined && d<1e-5){ st.className="status-pill ok"; st.textContent="converged ‖Δθ‖ < 1e-5"; return "conv"; }
      if(losses.length>2 && losses[losses.length-1]>losses[losses.length-2]*1.0001 && el("#gd-v").value==="batch"){ st.className="status-pill bad"; st.textContent="J increased: α too large"; return "up"; }
      st.className="status-pill run"; st.textContent= timer? "running" : "paused"; return "ok"; };
    const run=k=>{ let d; for(let i=0;i<k;i++){ d=stepOnce(); const s=status(d); if(s==="div"||s==="conv"){ stop(); break; } } drawAll(); return d; };
    const stop=()=>{ if(timer){ clearInterval(timer); timer=null; } const b=el("#gd-play"); if(b) b.textContent="Run"; };
    el("#gd-play").onclick=()=>{ if(timer){ stop(); status(); return; } if(it>=400) reset(true); el("#gd-play").textContent="Pause"; timer=setInterval(()=>{ run(1); if(it>=400) stop(); },40); };
    el("#gd-step").onclick=()=>{ stop(); run(1); }; el("#gd-10").onclick=()=>{ stop(); run(10); };
    el("#gd-reset").onclick=()=>reset(true);
    el("#gd-a").oninput=()=>{ el("#gd-av").textContent=fmt(alpha(),3); };
    el("#gd-a").onchange=()=>reset(true);
    el("#gd-v").onchange=()=>reset(true);
    el("#gd-s").onchange=e=>{ scaled=e.target.checked; reset(false); };
    el("#gd-c").addEventListener("click",ev=>{ const rect=ev.target.getBoundingClientRect(); const p=new Plot(el("#gd-c"),view()); start=[p.ix(ev.clientX-rect.left),p.iy(ev.clientY-rect.top)]; reset(true); });
    let bandCache=null;
    const drawContour=()=>{ const v=view(); const p=new Plot(el("#gd-c"),Object.assign({},v)); const g=p.g;
      const W=Math.max(2,Math.round(p.R-p.L)), H=Math.max(2,Math.round(p.B-p.T)), res=2, gw=Math.ceil(W/res), gh=Math.ceil(H/res);
      const key=[scaled,W,H,p.col.accent,p.col.bg].join("|");
      if(!bandCache||bandCache.key!==key){
        const off=document.createElement("canvas"); off.width=gw; off.height=gh; const og=off.getContext("2d"), img=og.createImageData(gw,gh);
        const Jmin=J(...S.opt), bg=hexToRgb(p.col.bg), ac=hexToRgb(p.col.accent);
        for(let j=0;j<gh;j++) for(let i=0;i<gw;i++){ const a=v.xmin+(i+.5)/gw*(v.xmax-v.xmin), b=v.ymax-(j+.5)/gh*(v.ymax-v.ymin);
          const lv=Math.floor(Math.log2(1+(J(a,b)-Jmin)/0.02)); const t=Math.max(0,0.62-lv*0.055)*(lv%2?0.75:1);
          const c=mix(bg,ac,t), k=(j*gw+i)*4; img.data[k]=c[0]; img.data[k+1]=c[1]; img.data[k+2]=c[2]; img.data[k+3]=255; }
        og.putImageData(img,0,0); bandCache={key,off};
      }
      g.imageSmoothingEnabled=true; g.drawImage(bandCache.off,p.L,p.T,W,H);
      p.axes(scaled?"θ₀ (scaled x)":"θ₀","θ₁");
      p.line(path,p.col.path,2); p.dots(path.slice(-60),p.col.path,2.6); p.dots([start],p.col.ink,5,p.col.bg); p.dots([theta],p.col.path,5.5,p.col.bg);
      p.text(S.opt[0],S.opt[1],"＋",p.col.ink,"center");
    };
    const drawData=()=>{ const p=new Plot(el("#gd-d"),{xmin:0.6,xmax:3.7,ymin:0,ymax:6,pad:{l:36,r:8,t:8,b:26}}); p.axes("size (1000 sq ft)","");
      p.dots(X.map((x,i)=>[x,Y[i]]),p.col.muted,2.6); p.fn(x=> scaled? theta[0]+theta[1]*(x-mx)/sd : theta[0]+theta[1]*x, p.col.path,2.5); };
    const drawLoss=()=>{ const top=Math.max(...losses.filter(isFinite).slice(0,1), 1), mn=Math.min(...losses.filter(isFinite));
      const p=new Plot(el("#gd-l"),{xmin:0,xmax:Math.max(20,it),ymin:Math.max(1e-3,Math.min(mn,J(...S.opt))*0.8),ymax:Math.min(1e7,Math.max(top*2,...losses.filter(isFinite).map(x=>x*1.2))),logy:true,pad:{l:36,r:8,t:8,b:26}}); p.axes("iteration","");
      p.line([[0,J(...S.opt)],[p.o.xmax,J(...S.opt)]],p.col.accent,1,[4,3]); p.line(losses.map((l,i)=>[i,l]),p.col.path,2); };
    const drawAll=()=>{ drawContour(); drawData(); drawLoss();
      const Jc=losses[losses.length-1];
      el("#gd-r").innerHTML=`<span>iteration <b>${it}</b></span><span>θ = (<b>${fmt(theta[0])}</b>, <b>${fmt(theta[1])}</b>)</span><span>J = <b>${fmt(Jc,4)}</b></span><span>optimum J = <b>${fmt(J(...S.opt),4)}</b></span><span>stable if α &lt; <b>${fmt(stableAlpha(),3)}</b> (batch)</span>`; };
    const stableAlpha=()=>{ const a=1, b=S.sx/S.n, c=S.sxx/S.n; const lmax=((a+c)+Math.sqrt((a-c)**2+4*b*b))/2; return 2/lmax; };
    reset(false); el("#gd-av").textContent=fmt(alpha(),3); status();
    return ()=>{ bandCache=null; drawAll(); };
  }
};

LABS.chdStepper = {
  title: "Step through the CHD problem", cap: "Same data and starting point as p.52–54. Change α or the initial weights and recompute.",
  html: () => `<div class="ctrls"><label for="ch-a">α <input id="ch-a" type="number" step="0.001" value="0.02"></label><label for="ch-w0">w₀ <input id="ch-w0" type="number" step="0.01" value="5"></label><label for="ch-w1">w₁ <input id="ch-w1" type="number" step="0.01" value="-0.03"></label><label for="ch-w2">w₂ <input id="ch-w2" type="number" step="0.01" value="-0.03"></label></div>
  <div class="row"><button class="btn primary sm" id="ch-go">Run one iteration</button><button class="btn sm ghost" id="ch-reset">Reset</button><span class="small num muted" id="ch-it"></span></div>
  <div class="tablewrap"><table class="data num" id="ch-t"></table></div><div id="ch-msg"></div>`,
  mount(root){
    const D=[[35,80,1.81],[25,80,1.22],[30,100,1.71]], el=id=>root.querySelector(id); let w, k;
    const J=w=>D.reduce((a,[x1,x2,y])=>a+(w[0]+w[1]*x1+w[2]*x2-y)**2,0)/(2*D.length);
    const init=()=>{ w=[+el("#ch-w0").value,+el("#ch-w1").value,+el("#ch-w2").value]; k=0; el("#ch-t").innerHTML=""; el("#ch-msg").innerHTML=""; el("#ch-it").innerHTML=`J(w) = <b>${fmt(J(w),4)}</b>`; };
    const go=()=>{ const a=+el("#ch-a").value, n=D.length; const rows=D.map(([x1,x2,y])=>{ const p=w[0]+w[1]*x1+w[2]*x2, e=p-y; return {x1,x2,y,p,e,ex1:e*x1,ex2:e*x2}; });
      const s=rows.reduce((A,r)=>({e:A.e+r.e,ex1:A.ex1+r.ex1,ex2:A.ex2+r.ex2}),{e:0,ex1:0,ex2:0});
      const Jb=J(w), nw=[w[0]-a/n*s.e, w[1]-a/n*s.ex1, w[2]-a/n*s.ex2]; const Ja=J(nw);
      el("#ch-t").innerHTML=`<tr><th>Patient</th><th>BMI</th><th>DBP</th><th>y</th><th>ŷ</th><th>e = ŷ−y</th><th>e·BMI</th><th>e·DBP</th></tr>`+
        rows.map((r,i)=>`<tr><td>${i+1}</td><td>${r.x1}</td><td>${r.x2}</td><td>${r.y}</td><td>${fmt(r.p,4)}</td><td>${fmt(r.e,4)}</td><td>${fmt(r.ex1,4)}</td><td>${fmt(r.ex2,4)}</td></tr>`).join("")+
        `<tr><th colspan="5">Σ</th><th>${fmt(s.e,4)}</th><th>${fmt(s.ex1,4)}</th><th>${fmt(s.ex2,4)}</th></tr>`;
      k++; el("#ch-it").innerHTML=`iteration <b>${k}</b> · w = (<b>${fmt(nw[0],4)}</b>, <b>${fmt(nw[1],4)}</b>, <b>${fmt(nw[2],4)}</b>) · J: ${fmt(Jb,4)} → <b>${fmt(Ja,4)}</b>`;

const el_ = (root, s) => root.querySelector(s);
const ctrlBtns = (p) => `<button class="btn primary sm" id="${p}-play">Play</button><button class="btn sm" id="${p}-step">Step</button><button class="btn sm ghost" id="${p}-reset">Reset</button>`;
function player(root, p, stepFn, resetFn, ms = 450, isDone = () => false){
  let t = null; const playBtn = el_(root, `#${p}-play`);
  const stop = () => { if (t) { clearInterval(t); t = null; } playBtn.textContent = "Play"; };
  playBtn.onclick = () => { if (t) { stop(); return; } if (isDone()) resetFn(); playBtn.textContent = "Pause"; t = setInterval(() => { stepFn(); if (isDone()) stop(); }, ms); };

}
function polyFit(xs, ys, M, l){
  const n = xs.length, raw = xs.map(x => { const u = 2*x-1; return Array.from({length:M}, (_, j) => Math.pow(u, j+1)); });
  const mu = Array.from({length:M}, (_, j) => raw.reduce((a, r) => a + r[j], 0) / n), sg = Array.from({length:M}, (_, j) => Math.sqrt(raw.reduce((a, r) => a + (r[j]-mu[j])**2, 0) / n) || 1);
  const Phi = raw.map(r => [1, ...r.map((v, j) => (v-mu[j]) / sg[j])]), d = M + 1;
  const A = Array.from({length:d}, (_, i) => Array.from({length:d}, (_, j) => Phi.reduce((a, r) => a + r[i]*r[j], 0) + (i===j && i>0 ? n*l + 1e-10 : 0)));
  const b = Array.from({length:d}, (_, i) => Phi.reduce((a, r, k) => a + r[i]*ys[k], 0));
  const w = solve(A, b) || Array(d).fill(0);
  return { w, pred: x => { const u = 2*x-1; let s = w[0]; for (let j = 0; j < M; j++) s += w[j+1] * (Math.pow(u, j+1) - mu[j]) / sg[j]; return s; } };
}
const sigm = z => 1 / (1 + Math.exp(-z));

/* ---------- Ball rolling down a hill (learning rate) ---------- */
LABS.hillBall = {

        p.clip(G => { G.strokeStyle = p.col.path; G.globalAlpha = .55; G.setLineDash([4, 3]); G.beginPath(); const mx = (x0 + x1) / 2, top = Math.max(J(x0), J(x1)) + 1.5;
          G.moveTo(p.sx(x0), p.sy(J(x0))); G.quadraticCurveTo(p.sx(mx), p.sy(top), p.sx(x1), p.sy(J(x1))); G.stroke(); G.setLineDash([]); G.globalAlpha = 1; }); }
      p.dots(hist.slice(0, -1).filter(x => Math.abs(x) < 50).map(x => [x, J(x)]), p.col.path, 3);
      const bx = shown, by = J(bx); const R = 9; const X = p.sx(bx), Y = p.sy(by) - R; if (X > p.L - 20 && X < p.R + 20 && Y > p.T - 20) { gfx.beginPath(); gfx.arc(X, Y, R, 0, 7); gfx.fillStyle = p.col.path; gfx.fill(); gfx.strokeStyle = p.col.bg; gfx.lineWidth = 2; gfx.stroke(); }

      el_(root, "#hb-r").innerHTML = `<span>step <b>${k}</b></span><span>w = <b>${fmt(cur, 3)}</b></span><span>error = <b>${fmt(J(cur), 4)}</b></span><span>slope here = <b>${fmt(g(cur), 3)}</b></span><span>next move = −${fmt(a(), 2)} × ${fmt(g(cur), 3)} = <b>${fmt(-a()*g(cur), 3)}</b></span>`;
    };
    const start = { v: -2 };
    const reset = () => { if (anim) cancelAnimationFrame(anim); w = start.v; hist = [w]; shown = w; draw(); };
    const step = () => { if (Math.abs(w) > 60) return; const nw = w - a() * g(w); const from = w; w = nw; hist.push(w);

LABS.blameFlow = {

  html: () => `<canvas id="bf-c" style="height:260px" aria-label="Network with forward and backward signals"></canvas><div class="row" style="margin-top:8px">${ctrlBtns("bf")}<span class="status-pill run" id="bf-ph"></span></div><div class="story" id="bf-msg"></div><div class="readout" id="bf-r"></div>`,
  mount(root){
    let o, phase, round, hist, anim; const eta = 2;
    const text = { forward: "Forward pass: the input flows left to right. Each neuron weighs, adds and bends.", error: "Compare the prediction with the right answer. The gap is the error.", back: "Backward pass: blame flows right to left. Thicker orange lines carry more blame, so those weights will change most.", update: "Update: every weight moves a little against its blame. Then we go again." };
    const phases = ["forward", "error", "back", "update"];
    const draw = (u) => { const f = net221(o); const pulse = phase === "forward" && u !== undefined ? { list: [[u, "x1", "h1"], [u, "x1", "h2"], [u, "x2", "h1"], [u, "x2", "h2"], [Math.max(0, u*2 - 1), "h1", "y"], [Math.max(0, u*2 - 1), "h2", "y"]].filter(e => e[0] > 0 && e[0] < 1), edge: ["x1", "h1"], color: cssVar("--accent") } :
        phase === "back" && u !== undefined ? { list: [[1 - Math.min(1, u*2), "h1", "y"], [1 - Math.min(1, u*2), "h2", "y"], [1 - Math.max(0, u*2 - 1), "x1", "h1"], [1 - Math.max(0, u*2 - 1), "x1", "h2"], [1 - Math.max(0, u*2 - 1), "x2", "h1"], [1 - Math.max(0, u*2 - 1), "x2", "h2"]].filter(e => e[0] > 0 && e[0] < 1), edge: ["x1", "h1"], color: cssVar("--path") } : null;
      drawNet(el_(root, "#bf-c"), o, f, { phase, values: phase !== "back", deltas: phase === "back", pulse, hi: phase === "error" ? ["y"] : [] });
      el_(root, "#bf-ph").textContent = `round ${round} · ${phase}`; el_(root, "#bf-msg").textContent = text[phase];
      el_(root, "#bf-r").innerHTML = `<span>prediction <b>${f.yh.toFixed(3)}</b></span><span>answer <b>${o.y}</b></span><span>error (loss) <b>${f.loss.toFixed(4)}</b></span><span>loss history <b>${hist.map(v => v.toFixed(3)).join(" → ")}</b></span>`; };
    const animate = () => { if (anim) cancelAnimationFrame(anim); if (matchMedia("(prefers-reduced-motion: reduce)").matches) { draw(); return; } const t0 = performance.now(); const tick = t => { const u = Math.min(1, (t - t0) / 700); draw(u < 1 ? u : undefined); if (u < 1) anim = requestAnimationFrame(tick); }; anim = requestAnimationFrame(tick); };
    const reset = () => { o = NET0(); phase = "forward"; round = 1; hist = [net221(o).loss]; animate(); };
    const step = () => { const i = phases.indexOf(phase); if (phase === "update") { const f = net221(o); o.W1 = o.W1.map((r, a) => r.map((w, b) => w - eta*f.gW1[a][b])); o.b1 = o.b1.map((b, j) => b - eta*f.gb1[j]); o.W2 = o.W2.map((w, j) => w - eta*f.gW2[j]); o.b2 -= eta*f.gb2; round++; hist.push(net221(o).loss); if (hist.length > 6) hist.shift(); }
      phase = phases[(i + 1) % 4]; animate(); };
    player(root, "bf", step, reset, 1100, () => round > 8); reset(); return () => draw();
  }
};

/* ---------- Backprop step-through with gradient check (deep) ---------- */
LABS.backpropStepper = {
  title: "Backpropagation, step by step", cap: "2‑2‑1 network, sigmoid hidden and output units, binary cross-entropy, one example (B = 1, so the 1/B factor is 1). Edit any value and the steps recompute.",
  html: () => `<div class="lab-grid3"><canvas id="bp-c" style="height:250px" aria-label="Network diagram"></canvas><div style="min-width:0"><div class="slidergrid nums" id="bp-in"></div></div></div>
  <div class="row" style="margin:10px 0"><button class="btn sm" id="bp-prev">← Previous</button><button class="btn primary sm" id="bp-next">Next step →</button><button class="btn sm ghost" id="bp-reset">Reset values</button><span class="status-pill run" id="bp-n"></span></div>
  <div class="stepbox" id="bp-eq"></div>`,
  mount(root){
    let o = NET0(), k = 0, eta = 0.5; const F = v => v.toFixed(4), M = (a) => `\\begin{bmatrix}${a.map(r => r.map(F).join("&")).join("\\\\")}\\end{bmatrix}`, V = a => `\\begin{bmatrix}${a.map(F).join("&")}\\end{bmatrix}`;
    const fields = [["x1", "x₁"], ["x2", "x₂"], ["y", "y"], ["W1.0.0", "W¹₁₁"], ["W1.0.1", "W¹₁₂"], ["W1.1.0", "W¹₂₁"], ["W1.1.1", "W¹₂₂"], ["b1.0", "b¹₁"], ["b1.1", "b¹₂"], ["W2.0", "W²₁"], ["W2.1", "W²₂"], ["b2", "b²"], ["eta", "η"]];
    const get = p => p === "eta" ? eta : p.split(".").reduce((a, s) => a[isNaN(s) ? s : +s], o);
    const set = (p, v) => { if (p === "eta") { eta = v; return; } const ks = p.split("."); let t = o; for (let i = 0; i < ks.length - 1; i++) t = t[isNaN(ks[i]) ? ks[i] : +ks[i]]; t[isNaN(ks.at(-1)) ? ks.at(-1) : +ks.at(-1)] = v; };
    const inputs = () => { el_(root, "#bp-in").innerHTML = fields.map(([p, l]) => `<label for="bp-${p.replace(/\./g, "_")}">${l}<input id="bp-${p.replace(/\./g, "_")}" type="number" step="0.1" value="${get(p)}" data-p="${p}"></label>`).join(""); $$("input", el_(root, "#bp-in")).forEach(i => i.onchange = () => { const v = parseFloat(i.value); if (Number.isFinite(v)) { set(i.dataset.p, v); render(); } }); };
    const numGrad = () => { const L = () => net221(o).loss, e = 1e-6, out = {}; fields.slice(3, 12).forEach(([p]) => { const v = get(p); set(p, v + e); const up = L(); set(p, v - e); const dn = L(); set(p, v); out[p] = (up - dn) / (2*e); }); return out; };
    const steps = () => { const f = net221(o); return [
      ["Setup", "fwd", ["x1", "x2"], `Input $\\mathbf x=${V(f.x)}$, target $y=${o.y}$. Row-vector convention: $\\mathbf z=\\mathbf h\\mathbf W+\\mathbf b$ (Eq. 13).`],
      ["Hidden pre-activation", "fwd", ["h1", "h2"], `$$\\mathbf z^{(1)}=\\mathbf x\\mathbf W^{(1)}+\\mathbf b^{(1)}=${V(f.x)}${M(o.W1)}+${V(o.b1)}=${V(f.z1)}$$`],
      ["Hidden activation", "fwd", ["h1", "h2"], `$$\\mathbf h^{(1)}=\\sigma(\\mathbf z^{(1)})=${V(f.h1)}\\qquad(\\text{Eq. 14})$$`],
      ["Output pre-activation", "fwd", ["y"], `$$z^{(2)}=\\mathbf h^{(1)}\\mathbf W^{(2)}+b^{(2)}=${F(f.h1[0])}(${F(o.W2[0])})+${F(f.h1[1])}(${F(o.W2[1])})+${F(o.b2)}=${F(f.z2)}$$`],
      ["Prediction and loss", "fwd", ["y"], `$$\\hat y=\\sigma(${F(f.z2)})=${F(f.yh)},\\qquad \\ell=-[y\\log\\hat y+(1-y)\\log(1-\\hat y)]=${F(f.loss)}\\quad(\\text{Eq. 23})$$`],
      ["Output error signal", "back", ["y"], `For BCE + sigmoid (Eq. 38, per example): $$\\delta^{(2)}=\\hat y-y=${F(f.yh)}-${o.y}=${F(f.d2)}$$`],
      ["Output-layer gradients", "back", ["y", "h1", "h2"], `$$\\frac{\\partial\\ell}{\\partial\\mathbf W^{(2)}}=\\mathbf h^{(1)\\top}\\delta^{(2)}=${V(f.gW2)}^{\\!\\top},\\qquad \\frac{\\partial\\ell}{\\partial b^{(2)}}=\\delta^{(2)}=${F(f.gb2)}\\quad(\\text{Eq. 44–45})$$`],
      ["Hidden error signal", "back", ["h1", "h2"], `$$\\boldsymbol\\delta^{(1)}=(\\delta^{(2)}\\mathbf W^{(2)\\top})\\odot\\sigma'(\\mathbf z^{(1)})=${V([f.d2*o.W2[0], f.d2*o.W2[1]])}\\odot${V(f.h1.map(h => h*(1 - h)))}=${V(f.d1)}\\quad(\\text{Eq. 43})$$`],
      ["Hidden-layer gradients", "back", ["x1", "x2", "h1", "h2"], `$$\\frac{\\partial\\ell}{\\partial\\mathbf W^{(1)}}=\\mathbf x^\\top\\boldsymbol\\delta^{(1)}=${M(f.gW1)},\\qquad \\frac{\\partial\\ell}{\\partial\\mathbf b^{(1)}}=\\boldsymbol\\delta^{(1)}=${V(f.gb1)}$$`],
      ["Gradient check", "back", [], (() => { const ng = numGrad(); const an = { "W1.0.0": f.gW1[0][0], "W1.0.1": f.gW1[0][1], "W1.1.0": f.gW1[1][0], "W1.1.1": f.gW1[1][1], "b1.0": f.gb1[0], "b1.1": f.gb1[1], "W2.0": f.gW2[0], "W2.1": f.gW2[1], "b2": f.gb2 };
        const rows = Object.keys(an).map(p => { const d = Math.abs(an[p] - ng[p]); return `<tr><td>${fields.find(x => x[0] === p)[1]}</td><td>${an[p].toFixed(8)}</td><td>${ng[p].toFixed(8)}</td><td>${d < 1e-6 ? "✓" : "✗"} ${d.toExponential(1)}</td></tr>`; }).join("");
        return `Central finite differences $\\frac{\\ell(w+\\epsilon)-\\ell(w-\\epsilon)}{2\\epsilon}$ with $\\epsilon=10^{-6}$ versus backprop:<div class="tablewrap"><table class="data num"><tr><th>param</th><th>backprop</th><th>numerical</th><th>difference</th></tr>${rows}</table></div>`; })()],
      ["Update", "update", [], (() => { const o2 = JSON.parse(JSON.stringify(o)); o2.W1 = o.W1.map((r, a) => r.map((w, b) => w - eta*f.gW1[a][b])); o2.b1 = o.b1.map((b, j) => b - eta*f.gb1[j]); o2.W2 = o.W2.map((w, j) => w - eta*f.gW2[j]); o2.b2 = o.b2 - eta*f.gb2; const f2 = net221(o2);
        return `$$\\mathbf W\\leftarrow\\mathbf W-\\eta\\frac{\\partial\\ell}{\\partial\\mathbf W}\\ (\\eta=${eta}):\\quad \\mathbf W^{(1)}=${M(o2.W1)},\\ \\mathbf W^{(2)}=${V(o2.W2)}$$ New prediction $\\hat y=${F(f2.yh)}$, loss ${F(f.loss)} → <b>${F(f2.loss)}</b>. <button class="btn sm" id="bp-apply">Apply update and restart steps</button>`; })()]
    ]; };
    const render = () => { const S = steps(), [title, ph, hi, html] = S[k], f = net221(o);
      drawNet(el_(root, "#bp-c"), o, f, { phase: ph === "fwd" ? "fwd" : "back", values: true, deltas: ph !== "fwd", labels: true, hi });
      el_(root, "#bp-n").textContent = `step ${k + 1} of ${S.length} · ${title}`; const box = el_(root, "#bp-eq"); box.innerHTML = `<b>${title}.</b> ${html}`; typeset(box);
      const ap = el_(root, "#bp-apply"); if (ap) ap.onclick = () => { o.W1 = o.W1.map((r, a) => r.map((w, b) => w - eta*f.gW1[a][b])); o.b1 = o.b1.map((b, j) => b - eta*f.gb1[j]); o.W2 = o.W2.map((w, j) => w - eta*f.gW2[j]); o.b2 -= eta*f.gb2; k = 0; inputs(); render(); };
      el_(root, "#bp-prev").disabled = k === 0; el_(root, "#bp-next").disabled = k === S.length - 1; };
    el_(root, "#bp-next").onclick = () => { k = Math.min(k + 1, 10); render(); }; el_(root, "#bp-prev").onclick = () => { k = Math.max(0, k - 1); render(); };
    el_(root, "#bp-reset").onclick = () => { o = NET0(); eta = 0.5; k = 0; inputs(); render(); };
    inputs(); render(); return () => render();
  }
};

LABS.trainPlay = {
  title: "Train a neural network", cap: "160 points, full-batch gradient descent with backpropagation, sigmoid output + cross-entropy. Background = predicted probability of the orange class.",
  html: () => `<div class="lab-grid3"><canvas id="tp-c" style="height:320px" aria-label="Decision regions"></canvas><div class="stack" style="gap:8px;min-width:0"><canvas id="tp-l" style="height:150px" aria-label="Loss curve"></canvas><div class="readout" id="tp-r"></div><div class="story small" id="tp-msg"></div></div></div>
  <div class="ctrls"><label for="tp-d">Data <select id="tp-d"><option value="rings">Rings</option><option value="xor">XOR clusters</option><option value="moons">Moons</option><option value="line">Straight split</option></select></label>
  <label for="tp-h">Hidden neurons <input id="tp-h" type="range" min="1" max="8" step="1" value="4"> <b class="num" id="tp-hv"></b></label><label><input type="checkbox" id="tp-2"> 2 hidden layers</label>
  <label for="tp-a">Activation <select id="tp-a"><option value="tanh">Tanh</option><option value="relu">ReLU</option><option value="sigmoid">Sigmoid</option><option value="linear">Linear (no bend)</option></select></label>
  <label for="tp-lr">Learning rate <input id="tp-lr" type="range" min="-2" max="1" step="0.05" value="-0.3"> <b class="num" id="tp-lrv"></b></label></div>
  <div class="row">${ctrlBtns("tp")}</div>`,
  mount(root){
    let net, data, epoch, losses, timer; const actF = { tanh: [Math.tanh, (z, h) => 1 - h*h], relu: [z => Math.max(0, z), z => z > 0 ? 1 : 0], sigmoid: [sigm, (z, h) => h*(1 - h)], linear: [z => z, () => 1] };
    const gen = kind => { const r = prng(42), pts = []; for (let i = 0; i < 160; i++) { let x, y, c;
      if (kind === "rings") { c = i % 2; const rad = c ? 0.25 + 0.15*r() : 0.62 + 0.22*r(), th = 2*Math.PI*r(); x = rad*Math.cos(th); y = rad*Math.sin(th); }
      else if (kind === "xor") { const qx = r() < .5 ? -1 : 1, qy = r() < .5 ? -1 : 1; c = qx*qy > 0 ? 0 : 1; x = qx*0.5 + 0.2*gauss(r); y = qy*0.5 + 0.2*gauss(r); }
      else if (kind === "moons") { c = i % 2; const t = Math.PI*r(); x = c ? 1 - Math.cos(t) : Math.cos(t); y = c ? 0.5 - Math.sin(t) : Math.sin(t); x = (x - 0.5)*0.55 + 0.08*gauss(r); y = (y - 0.25)*0.55 + 0.08*gauss(r); }
      else { x = 2*r() - 1; y = 2*r() - 1; c = x + 0.6*y > 0.1 ? 1 : 0; }
      pts.push([x, y, c]); } return pts; };
    const build = () => { const H = +el_(root, "#tp-h").value, two = el_(root, "#tp-2").checked, sizes = two ? [2, H, H, 1] : [2, H, 1], r = prng(3);
      net = { sizes, W: [], b: [] }; for (let l = 1; l < sizes.length; l++) { const s = Math.sqrt(2 / (sizes[l-1] + sizes[l])) * 1.4; net.W.push(Array.from({length:sizes[l-1]}, () => Array.from({length:sizes[l]}, () => s*gauss(r)))); net.b.push(Array(sizes[l]).fill(0)); } };
    const fwd = (x, act) => { const hs = [x], zs = []; let h = x; for (let l = 0; l < net.W.length; l++) { const W = net.W[l], b = net.b[l], z = b.map((bj, j) => h.reduce((a, hi, i) => a + hi*W[i][j], bj)); zs.push(z); h = l === net.W.length - 1 ? z.map(sigm) : z.map(actF[act][0]); hs.push(h); } return { hs, zs }; };
    const trainEpoch = () => { const act = el_(root, "#tp-a").value, lr = Math.pow(10, +el_(root, "#tp-lr").value), L = net.W.length, n = data.length;
      const gW = net.W.map(W => W.map(r => r.map(() => 0))), gb = net.b.map(b => b.map(() => 0)); let loss = 0;
      data.forEach(([x, y, c]) => { const { hs, zs } = fwd([x, y], act); const p = Math.min(1 - 1e-9, Math.max(1e-9, hs[L][0])); loss += -(c*Math.log(p) + (1 - c)*Math.log(1 - p));
        let d = [hs[L][0] - c]; for (let l = L - 1; l >= 0; l--) { const hp = hs[l]; for (let i = 0; i < hp.length; i++) for (let j = 0; j < d.length; j++) gW[l][i][j] += hp[i]*d[j]; for (let j = 0; j < d.length; j++) gb[l][j] += d[j];
          if (l > 0) { const W = net.W[l]; d = hp.map((h, i) => d.reduce((a, dj, j) => a + dj*W[i][j], 0) * actF[act][1](zs[l-1][i], h)); } } });
      net.W.forEach((W, l) => W.forEach((r, i) => r.forEach((w, j) => { W[i][j] -= lr*gW[l][i][j]/n; }))); net.b.forEach((b, l) => b.forEach((v, j) => { b[j] -= lr*gb[l][j]/n; }));
      epoch++; losses.push(loss/n); };
    const acc = () => { const act = el_(root, "#tp-a").value; return data.filter(([x, y, c]) => (fwd([x, y], act).hs.at(-1)[0] > 0.5 ? 1 : 0) === c).length / data.length; };
    const draw = () => { const act = el_(root, "#tp-a").value; const p = new Plot(el_(root, "#tp-c"), { xmin: -1.2, xmax: 1.2, ymin: -1.2, ymax: 1.2, pad: { l: 8, r: 8, t: 8, b: 8 } }); const G = p.g, R = 48;
      const a = hexToRgb(p.col.path), b = hexToRgb(p.col.dnn), bg = hexToRgb(p.col.bg), off = document.createElement("canvas"); off.width = R; off.height = R; const og = off.getContext("2d"), img = og.createImageData(R, R);
      for (let j = 0; j < R; j++) for (let i = 0; i < R; i++) { const x = -1.2 + 2.4*(i + .5)/R, y = 1.2 - 2.4*(j + .5)/R, q = fwd([x, y], act).hs.at(-1)[0]; const c = mix(bg, q > .5 ? a : b, Math.abs(q - .5)*0.9), k = (j*R + i)*4; img.data[k] = c[0]; img.data[k+1] = c[1]; img.data[k+2] = c[2]; img.data[k+3] = 255; }
      og.putImageData(img, 0, 0); G.imageSmoothingEnabled = true; G.drawImage(off, p.L, p.T, p.R - p.L, p.B - p.T);
      data.forEach(([x, y, c]) => p.dots([[x, y]], c ? p.col.path : p.col.dnn, 3.6, p.col.bg));
      const lp = new Plot(el_(root, "#tp-l"), { xmin: 0, xmax: Math.max(50, epoch), ymin: 0, ymax: Math.max(0.8, ...losses.slice(0, 3)), pad: { l: 34, r: 8, t: 8, b: 24 } }); lp.axes("epoch", ""); lp.line(losses.map((v, i) => [i + 1, v]), lp.col.path, 2);
      const A = acc(); el_(root, "#tp-r").innerHTML = `<span>epoch <b>${epoch}</b></span><span>loss <b>${losses.length ? losses.at(-1).toFixed(4) : "–"}</b></span><span>accuracy <b>${Math.round(A*100)}%</b></span><span>parameters <b>${net.sizes.slice(1).reduce((s, n, i) => s + n*(net.sizes[i] + 1), 0)}</b></span>`;
      el_(root, "#tp-msg").textContent = act === "linear" ? "With no bend, the boundary can only ever be a straight line." : (A > 0.95 ? "The network has found a boundary that separates the classes." : epoch > 300 && A < 0.8 ? "Stuck? Try more hidden neurons, a different activation or a different learning rate." : ""); };
    const reset = () => { if (timer) timer(); data = gen(el_(root, "#tp-d").value); build(); epoch = 0; losses = []; draw(); el_(root, "#tp-hv").textContent = el_(root, "#tp-h").value; el_(root, "#tp-lrv").textContent = Math.pow(10, +el_(root, "#tp-lr").value).toFixed(2); };
    const step = () => { for (let i = 0; i < 10; i++) trainEpoch(); draw(); };
    timer = player(root, "tp", step, reset, 60, () => epoch >= 1500);
    ["#tp-d", "#tp-h", "#tp-2", "#tp-a"].forEach(s => el_(root, s).addEventListener("change", reset)); el_(root, "#tp-h").addEventListener("input", () => { el_(root, "#tp-hv").textContent = el_(root, "#tp-h").value; });
    el_(root, "#tp-lr").addEventListener("input", () => { el_(root, "#tp-lrv").textContent = Math.pow(10, +el_(root, "#tp-lr").value).toFixed(2); });
    reset(); return draw;
  }
};

LABS.mlTypesSorter = {

LABS.thresholdClassifier = {

LABS.kmeansStepper = {

LABS.gmmEM = {

    const init = () => { K = +el_(root, "#gm-k").value; const r = prng(seed++); pi = Array(K).fill(1 / K); mu = []; for (let k = 0; k < K; k++) { const q = P[Math.floor(r() * P.length)]; mu.push([q[0], q[1]]); } S = mu.map(() => [[1.5, 0], [0, 1.5]]); g = null; it = 0; LL = estep(); };
    const estep = () => { let ll = 0; g = P.map(x => { const w = mu.map((m, k) => pi[k] * mvn2(x, m, S[k])), s = w.reduce((a, b) => a + b) || 1e-300; ll += Math.log(s); return w.map(v => v / s); }); return ll; };
    const mstep = () => { for (let k = 0; k < K; k++) { const Nk = g.reduce((a, r) => a + r[k], 0) + 1e-9, m = [0, 1].map(j => g.reduce((a, r, i) => a + r[k] * P[i][j], 0) / Nk); let a = 0, b = 0, d = 0; P.forEach((x, i) => { const dx = x[0] - m[0], dy = x[1] - m[1]; a += g[i][k] * dx * dx; b += g[i][k] * dx * dy; d += g[i][k] * dy * dy; }); mu[k] = m; S[k] = [[a / Nk + 1e-3, b / Nk], [b / Nk, d / Nk + 1e-3]]; pi[k] = Nk / P.length; } };
    const draw = () => { el_(root, "#gm-kv").textContent = K; const p = new Plot(el_(root, "#gm-c"), { xmin: -5.5, xmax: 5, ymin: -4.5, ymax: 6 }), C = CLC(p); p.axes("x₁", "x₂");
      const rgb = C.slice(0, K).map(c => hexToRgb(c)); P.forEach((x, i) => { const c = [0, 1, 2].map(j => Math.round(g[i].reduce((a, v, k) => a + v * rgb[k][j], 0))); p.dots([x], `rgb(${c.join(",")})`, 3.6, p.col.bg); });

  }

LABS.kmeansLimits = {

  html: () => `<canvas id="kl2-c" style="height:300px" aria-label="K-means failure cases"></canvas><div class="ctrls"><label for="kl2-d">Case <select id="kl2-d"><option value="size">Differing sizes</option><option value="dens">Differing densities</option><option value="moon">Non-globular shapes</option><option value="out">Outlier</option></select></label></div><div class="readout" id="kl2-r"></div>`,

LABS.proxyLeak = {
  title: "Fairness through unawareness: the proxy problem", cap: "Synthetic hiring data where past decisions were biased against group B, and a feature ('often goes to market X') is correlated with group. Choose what the model may see and compare selection rates.",
  html: () => `<div class="ctrls"><label><input type="checkbox" id="pl-g" checked> use protected attribute (group)</label><label><input type="checkbox" id="pl-p" checked> use proxy feature</label><label for="pl-c">proxy–group link <input id="pl-c" type="range" min="0" max="0.45" step="0.05" value="0.35"> <b class="num" id="pl-cv"></b></label></div><canvas id="pl-cn" style="height:220px" aria-label="Selection rates by group"></canvas><div class="readout" id="pl-r"></div>`,
  mount(root){
    const draw = () => { const ug = el_(root, "#pl-g").checked, up = el_(root, "#pl-p").checked, c = +el_(root, "#pl-c").value; el_(root, "#pl-cv").textContent = c.toFixed(2);
      const r = prng(5), n = 3000, D = []; for (let i = 0; i < n; i++) { const g = r() < 0.5 ? 1 : 0, s = gauss(r), px = r() < (g ? 0.5 + c : 0.5 - c) ? 1 : 0, y = s - 1.0 * g + 0.7 * gauss(r) > -0.3 ? 1 : 0; D.push([s, g, px, y]); }
      // logistic regression by gradient descent on chosen features
      const F = x => [1, x[0]].concat(ug ? [x[1]] : []).concat(up ? [x[2]] : []); let w = F(D[0]).map(() => 0);
      for (let it = 0; it < 300; it++) { const gr = w.map(() => 0); D.forEach(x => { const f = F(x), z = f.reduce((a, v, j) => a + v * w[j], 0), p = 1 / (1 + Math.exp(-z)); f.forEach((v, j) => gr[j] += (p - x[3]) * v); }); w = w.map((v, j) => v - 1.0 * gr[j] / n); }

  }

LABS.sparsityLab = {
  title: "L1 makes models sparse, L2 only shrinks", cap: "20 features, only 3 of which (x₁, x₄, x₈) really matter. Increase λ: lasso (L1) sets irrelevant weights exactly to zero, giving a short readable model; ridge (L2) shrinks all weights but keeps every one.",
  html: () => `<canvas id="sp-c" style="height:280px" aria-label="Coefficient bars"></canvas><div class="ctrls"><label for="sp-l">λ <input id="sp-l" type="range" min="-3" max="0.7" step="0.05" value="-1"> <b class="num" id="sp-lv"></b></label><label for="sp-t">Penalty <select id="sp-t"><option value="l1">L1 (lasso)</option><option value="l2">L2 (ridge)</option></select></label></div><div class="readout" id="sp-r"></div>`,
  mount(root){

    const fit = (lam, t) => { let w = Array(d).fill(0); const cs = Array.from({ length: d }, (_, j) => X.reduce((a, x) => a + x[j] * x[j], 0) / n); // coordinate descent on (1/2n)||y-Xw||² + penalty
      for (let it = 0; it < 120; it++) for (let j = 0; j < d; j++) { let rho = 0; for (let i = 0; i < n; i++) { let pr = 0; for (let k = 0; k < d; k++) if (k !== j) pr += X[i][k] * w[k]; rho += X[i][j] * (y[i] - pr); } rho /= n;

  }

LABS.outlierLab = {
  title: "Outlier fences: IQR vs 3-sigma", cap: "Quartiles use the slides' (n+1)/4 position rule. Red points fall outside the fences.",
  html: () => `<div class="ctrls"><label for="ol-d" style="flex:1;min-width:220px">Data <input id="ol-d" type="text" value="10, 11, 11, 11, 12, 12, 13, 14, 14, 15, 17, 22" style="flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:3px 6px;font-family:var(--f-mono)"></label></div>
  <canvas id="ol-c" style="height:200px" aria-label="Dot plot with fences"></canvas>
  <div class="ctrls"><div class="seg" id="ol-m"><button data-m="iqr" aria-pressed="true">IQR fence</button><button data-m="sig" aria-pressed="false">3-sigma</button></div><label for="ol-k">Multiplier <input id="ol-k" type="range" min="0.5" max="4" step="0.1" value="1.5"> <b class="num" id="ol-kv"></b></label><button class="btn sm" id="ol-add">Add 500</button><button class="btn sm ghost" id="ol-raw">Use the raw list (with 2)</button></div><div class="readout" id="ol-r"></div>`,
  mount(root){
    let m = "iqr";
    const q = (s, pos) => { const n = s.length, lo = Math.floor(pos), f = pos - lo; if (lo < 1) return s[0]; if (lo >= n) return s[n - 1]; return s[lo - 1] + f * (s[lo] - s[lo - 1]); };
    const draw = () => { const x = el_(root, "#ol-d").value.split(/[,\s]+/).map(Number).filter(Number.isFinite); const k = +el_(root, "#ol-k").value; el_(root, "#ol-kv").textContent = k.toFixed(1);
      if (x.length < 4) { el_(root, "#ol-r").textContent = "Enter at least four numbers."; return; }
      const s = [...x].sort((a, b) => a - b), n = s.length, q1 = q(s, (n + 1) / 4), q3 = q(s, 3 * (n + 1) / 4), mu = x.reduce((a, b) => a + b) / n, sd = Math.sqrt(x.reduce((a, b) => a + (b - mu) ** 2, 0) / n);
      const [lo, hi] = m === "iqr" ? [q1 - k * (q3 - q1), q3 + k * (q3 - q1)] : [mu - k * sd, mu + k * sd];
      const xmin = Math.min(s[0], lo) - 2, xmax = Math.max(s[n - 1], hi) + 2; const p = new Plot(el_(root, "#ol-c"), { xmin, xmax, ymin: -1, ymax: 2 }); p.axes("value", "");
      p.clip(G => { G.fillStyle = p.col.soft; G.fillRect(p.sx(lo), p.T, p.sx(hi) - p.sx(lo), p.B - p.T); if (m === "iqr") { G.fillStyle = p.col.accent; G.globalAlpha = .25; G.fillRect(p.sx(q1), p.sy(0.9), p.sx(q3) - p.sx(q1), p.sy(0.1) - p.sy(0.9)); G.globalAlpha = 1; } });
      const cnt = {}; s.forEach(v => { cnt[v] = (cnt[v] || 0) + 1; const out = v < lo || v > hi; p.dots([[v, 0.5 + (cnt[v] - 1) * 0.28]], out ? p.col.bad : p.col.ink, 5, p.col.bg); });
      p.line([[lo, -1], [lo, 2]], p.col.path, 2, [5, 4]); p.line([[hi, -1], [hi, 2]], p.col.path, 2, [5, 4]);
      const outs = s.filter(v => v < lo || v > hi);
      el_(root, "#ol-r").innerHTML = (m === "iqr" ? `<span>Q1 <b>${q1.toFixed(2)}</b></span><span>Q3 <b>${q3.toFixed(2)}</b></span><span>IQR <b>${(q3 - q1).toFixed(2)}</b></span>` : `<span>mean <b>${mu.toFixed(2)}</b></span><span>sd <b>${sd.toFixed(2)}</b></span>`) + `<span>fences <b>${lo.toFixed(2)}</b> to <b>${hi.toFixed(2)}</b></span><span>outliers <b>${outs.length ? outs.join(", ") : "none"}</b></span>`; };
    el_(root, "#ol-d").addEventListener("input", draw); el_(root, "#ol-k").addEventListener("input", draw);
    $$("#ol-m button", root).forEach(b => b.onclick = () => { m = b.dataset.m; $$("#ol-m button", root).forEach(x => x.setAttribute("aria-pressed", x === b)); el_(root, "#ol-k").value = m === "iqr" ? 1.5 : 3; draw(); });
    el_(root, "#ol-add").onclick = () => { el_(root, "#ol-d").value += ", 500"; draw(); }; el_(root, "#ol-raw").onclick = () => { el_(root, "#ol-d").value = "10, 2, 11, 15, 11, 14, 13, 17, 12, 22, 14, 11"; draw(); };
    draw(); return draw;
  }
};

LABS.lsVsLogit = {
  title: "Least-squares line vs logistic curve", cap: "Job offered (1) or not (0) against one score. Both models are fitted to the points shown; dashed verticals mark where each crosses 0.5.",
  html: () => `<canvas id="lv-c" style="height:260px" aria-label="Least squares vs logistic fit"></canvas><div class="row" style="margin-top:8px"><button class="btn sm" id="lv-add">Add a far-right 'yes' point</button><button class="btn sm ghost" id="lv-reset">Reset</button></div><div class="readout" id="lv-r"></div>`,
  mount(root){
    const base = [[1, 0], [1.5, 0], [2, 0], [2.5, 0], [3.5, 1], [4, 1], [4.5, 1], [5, 1]]; let D = base.slice();
    const fitLS = () => { const n = D.length, mx = D.reduce((a, d) => a + d[0], 0) / n, my = D.reduce((a, d) => a + d[1], 0) / n; const b = D.reduce((a, [x, y]) => a + (x - mx) * (y - my), 0) / D.reduce((a, [x]) => a + (x - mx) ** 2, 0); return [my - b * mx, b]; };
    const fitLR = () => { let w0 = 0, w1 = 0; for (let k = 0; k < 4000; k++) { let g0 = 0, g1 = 0; D.forEach(([x, y]) => { const h = sigm(w0 + w1 * x); g0 += h - y; g1 += (h - y) * x; }); w0 -= 0.3 * (g0 / D.length + 0.01 * 0); w1 -= 0.3 * (g1 / D.length + 0.02 * w1); } return [w0, w1]; };
    const draw = () => { const [a, b] = fitLS(), [w0, w1] = fitLR(); const p = new Plot(el_(root, "#lv-c"), { xmin: 0, xmax: 16, ymin: -0.4, ymax: 1.4 }); p.axes("score (e.g. CGPA)", "job offered");
      p.line([[0, 0.5], [16, 0.5]], p.col.line, 1, [3, 3]); p.fn(x => a + b * x, p.col.dnn, 2.5); p.fn(x => sigm(w0 + w1 * x), p.col.accent, 2.5);
      const tLS = (0.5 - a) / b, tLR = -w0 / w1; p.line([[tLS, -0.4], [tLS, 1.4]], p.col.dnn, 1.5, [5, 4]); p.line([[tLR, -0.4], [tLR, 1.4]], p.col.accent, 1.5, [5, 4]);
      D.forEach(([x, y]) => { const wrong = (a + b * x >= 0.5 ? 1 : 0) !== y; p.dots([[x, y]], y ? p.col.path : p.col.ink, 5, wrong ? p.col.bad : p.col.bg); });
      p.text(9, 1.3, "— logistic", p.col.accent); p.text(12, 1.3, "— least squares", p.col.dnn);
      const errLS = D.filter(([x, y]) => (a + b * x >= 0.5 ? 1 : 0) !== y).length, errLR = D.filter(([x, y]) => (sigm(w0 + w1 * x) >= 0.5 ? 1 : 0) !== y).length;
      el_(root, "#lv-r").innerHTML = `<span>least-squares threshold <b>${tLS.toFixed(2)}</b>, mistakes <b>${errLS}</b></span><span>logistic threshold <b>${tLR.toFixed(2)}</b>, mistakes <b>${errLR}</b></span>`; };
    el_(root, "#lv-add").onclick = () => { D.push([D.length > 8 ? 14 + Math.random() : 15, 1]); draw(); }; el_(root, "#lv-reset").onclick = () => { D = base.slice(); draw(); };
    draw(); return draw;
  }
};

LABS.rocThreshold = {

  html: () => `<div class="lab-grid"><canvas id="rt-a" style="height:230px" aria-label="Class score distributions"></canvas><canvas id="rt-b" style="height:230px" aria-label="ROC curve"></canvas></div><div class="ctrls"><label for="rt-t">Threshold <input id="rt-t" type="range" min="-12" max="18" step="0.1" value="2"></label><label for="rt-s">Class separation <input id="rt-s" type="range" min="0" max="15" step="0.5" value="7"></label></div><div class="readout" id="rt-r"></div>`,
  mount(root){
    const N = (x, m, s) => Math.exp(-((x - m) ** 2) / (2 * s * s)) / (s * Math.sqrt(2 * Math.PI)); const cdf = (x, m, s) => { const t = (x - m) / (s * Math.SQRT2), a = Math.abs(t), k = 1 / (1 + 0.3275911 * a); const e = 1 - (((((1.061405429 * k - 1.453152027) * k) + 1.421413741) * k - 0.284496736) * k + 0.254829592) * k * Math.exp(-a * a); return 0.5 * (1 + (t >= 0 ? e : -e)); };
    const draw = () => { const t = +el_(root, "#rt-t").value, sep = +el_(root, "#rt-s").value, mN = -sep / 2, mP = sep / 2, s = 4;
      const p = new Plot(el_(root, "#rt-a"), { xmin: -14, xmax: 18, ymin: 0, ymax: 0.11 }); p.axes("score", "");
      p.clip(G => { G.fillStyle = p.col.path; G.globalAlpha = .18; G.beginPath(); G.moveTo(p.sx(t), p.sy(0)); for (let x = t; x <= 18; x += 0.2) G.lineTo(p.sx(x), p.sy(N(x, mP, s))); G.lineTo(p.sx(18), p.sy(0)); G.fill(); G.fillStyle = p.col.dnn; G.beginPath(); G.moveTo(p.sx(t), p.sy(0)); for (let x = t; x <= 18; x += 0.2) G.lineTo(p.sx(x), p.sy(N(x, mN, s))); G.lineTo(p.sx(18), p.sy(0)); G.fill(); G.globalAlpha = 1; });
      p.fn(x => N(x, mN, s), p.col.dnn, 2, [5, 3]); p.fn(x => N(x, mP, s), p.col.path, 2); p.line([[t, 0], [t, 0.11]], p.col.ink, 2); p.text(-13.5, 0.102, "negative (dashed)  positive (solid)", p.col.muted);
      const tpr = 1 - cdf(t, mP, s), fpr = 1 - cdf(t, mN, s); const q = new Plot(el_(root, "#rt-b"), { xmin: 0, xmax: 1, ymin: 0, ymax: 1 }); q.axes("false positive rate", "true positive rate");
      q.line([[0, 0], [1, 1]], q.col.line, 1, [4, 3]); const pts = []; for (let x = 18; x >= -14; x -= 0.25) pts.push([1 - cdf(x, mN, s), 1 - cdf(x, mP, s)]); q.line(pts, q.col.accent, 2.5); q.dots([[fpr, tpr]], q.col.path, 7, q.col.bg);
      let auc = 0; for (let i = 1; i < pts.length; i++) auc += (pts[i][0] - pts[i - 1][0]) * (pts[i][1] + pts[i - 1][1]) / 2;
      el_(root, "#rt-r").innerHTML = `<span>TPR <b>${tpr.toFixed(2)}</b></span><span>FNR <b>${(1 - tpr).toFixed(2)}</b></span><span>FPR <b>${fpr.toFixed(2)}</b></span><span>TNR <b>${(1 - fpr).toFixed(2)}</b></span><span>AUC <b>${auc.toFixed(3)}</b></span>`; };
    ["#rt-t", "#rt-s"].forEach(s => el_(root, s).addEventListener("input", draw)); draw(); return draw;
  }
};
LABS.rocBuilder = {
  title: "Construct the ROC curve step by step", cap: "The 10 scored instances from slide p.51. Each step lowers the threshold to the next unique score; tied scores (0.85 ×3) are processed together.",
  html: () => `<div class="lab-grid"><div class="tablewrap"><table class="data num" id="rb-t"></table></div><canvas id="rb-c" style="height:280px" aria-label="ROC curve under construction"></canvas></div><div class="row" style="margin-top:8px">${ctrlBtns("rb")}</div><div class="readout" id="rb-r"></div>`,
  mount(root){
    const S = [0.95, 0.93, 0.87, 0.85, 0.85, 0.85, 0.76, 0.53, 0.43, 0.25], L = [1, 1, 0, 0, 0, 1, 0, 1, 0, 1], th = [Infinity, ...new Set(S)]; let k;
    const draw = () => { const t = th[k], pred = S.map(s => s >= t ? 1 : 0); const TP = pred.filter((p, i) => p && L[i]).length, FP = pred.filter((p, i) => p && !L[i]).length, P = 5, Nn = 5;
      el_(root, "#rb-t").innerHTML = `<tr><th>#</th><th>score</th><th>class</th><th>predicted</th></tr>` + S.map((s, i) => `<tr style="${pred[i] ? "background:var(--accent-soft)" : ""}"><td>${i + 1}</td><td>${s}</td><td>${L[i] ? "+" : "−"}</td><td>${pred[i] ? "+" : "−"}</td></tr>`).join("");
      const pts = th.slice(0, k + 1).map(tt => { const pr = S.map(s => s >= tt ? 1 : 0); return [pr.filter((p, i) => p && !L[i]).length / Nn, pr.filter((p, i) => p && L[i]).length / P]; });
      const p = new Plot(el_(root, "#rb-c"), { xmin: 0, xmax: 1, ymin: 0, ymax: 1 }); p.axes("FPR", "TPR"); p.line([[0, 0], [1, 1]], p.col.line, 1, [4, 3]); p.line(pts, p.col.accent, 2.5); p.dots(pts, p.col.path, 4.5, p.col.bg);
      let auc = 0; for (let i = 1; i < pts.length; i++) auc += (pts[i][0] - pts[i - 1][0]) * (pts[i][1] + pts[i - 1][1]) / 2;
      el_(root, "#rb-r").innerHTML = `<span>threshold ≥ <b>${t === Infinity ? "∞" : t}</b></span><span>TP <b>${TP}</b> FP <b>${FP}</b> TN <b>${Nn - FP}</b> FN <b>${P - TP}</b></span><span>TPR <b>${(TP / P).toFixed(1)}</b> FPR <b>${(FP / Nn).toFixed(1)}</b></span><span>area so far <b>${auc.toFixed(2)}</b>${k === th.length - 1 ? " (final AUC)" : ""}</span>`; };
    const reset = () => { k = 0; draw(); }; const step = () => { if (k < th.length - 1) k++; draw(); };
    player(root, "rb", step, reset, 900, () => k >= th.length - 1); reset(); return draw;

const H2 = counts => { const n = counts.reduce((a, b) => a + b, 0); return n ? -counts.reduce((s, c) => s + (c ? c / n * Math.log2(c / n) : 0), 0) : 0; };
const TENNIS = ["Sunny Hot High Weak No", "Sunny Hot High Strong No", "Overcast Hot High Weak Yes", "Rain Mild High Weak Yes", "Rain Cool Normal Weak Yes", "Rain Cool Normal Strong No", "Overcast Cool Normal Strong Yes", "Sunny Mild High Weak No", "Sunny Cool Normal Weak Yes", "Rain Mild Normal Weak Yes", "Sunny Mild Normal Strong Yes", "Overcast Mild High Strong Yes", "Overcast Hot Normal Weak Yes", "Rain Mild High Strong No"].map((r, i) => { const [Outlook, Temp, Humidity, Wind, Play] = r.split(" "); return { D: "D" + (i + 1), Outlook, Temp, Humidity, Wind, Play }; });
const T_ATTRS = ["Outlook", "Temp", "Humidity", "Wind"];
const cnt = rows => [rows.filter(r => r.Play === "Yes").length, rows.filter(r => r.Play === "No").length];
const gainOf = (rows, a) => { const vals = [...new Set(rows.map(r => r[a]))]; return H2(cnt(rows)) - vals.reduce((s, v) => { const sub = rows.filter(r => r[a] === v); return s + sub.length / rows.length * H2(cnt(sub)); }, 0); };

LABS.treeBuilder = {

  html: () => `<div class="lab-grid3"><canvas id="tb-c" style="height:330px" aria-label="Decision tree"></canvas><div class="stack" style="gap:8px;min-width:0"><div id="tb-q" class="stepbox"></div><div class="row"><button class="btn sm" id="tb-auto">Finish with ID3</button><button class="btn sm ghost" id="tb-reset">Reset</button></div><div class="readout" id="tb-r"></div></div></div>`,

      const leaves = n => n.attr ? n.kids.reduce((s, k) => s + leaves(k), 0) : 1; let col = 0; const total = leaves(tree);

function fitTree(D, depth, minLeaf = 1){ // CART on 2-D points [x,y,c], Gini, axis-aligned
  const g = c => { const n = c[0] + c[1]; return n ? 1 - (c[0] / n) ** 2 - (c[1] / n) ** 2 : 0; };
  const build = (pts, d) => { const c = [pts.filter(p => !p[2]).length, pts.filter(p => p[2]).length]; const node = { pred: c[1] >= c[0] ? 1 : 0 };
    if (d >= depth || !c[0] || !c[1] || pts.length < 2 * minLeaf) return node; let best = null;
    for (const f of [0, 1]) { const s = [...pts].sort((a, b) => a[f] - b[f]); const L = [0, 0], R = [...c];
      for (let i = 0; i < s.length - 1; i++) { L[s[i][2]]++; R[s[i][2]]--; if (s[i][f] === s[i + 1][f] || i + 1 < minLeaf || s.length - i - 1 < minLeaf) continue; const w = ((i + 1) * g(L) + (s.length - i - 1) * g(R)) / s.length; if (!best || w < best.w) best = { w, f, t: (s[i][f] + s[i + 1][f]) / 2 }; } }
    if (!best) return node; node.f = best.f; node.t = best.t; node.l = build(pts.filter(p => p[best.f] <= best.t), d + 1); node.r = build(pts.filter(p => p[best.f] > best.t), d + 1); return node; };
  const root = build(D, 0); const pred = (n, p) => n.f === undefined ? n.pred : pred(p[n.f] <= n.t ? n.l : n.r, p); const leaves = n => n.f === undefined ? 1 : leaves(n.l) + leaves(n.r);
  return { root, pred: p => pred(root, p), leaves: leaves(root) };
}

  html: () => `<div class="lab-grid3"><canvas id="td-c" style="height:300px" aria-label="Tree decision regions"></canvas><canvas id="td-e" style="height:300px" aria-label="Error vs depth"></canvas></div><div class="ctrls"><label for="td-d">Max depth <input id="td-d" type="range" min="1" max="14" step="1" value="2"> <b class="num" id="td-dv"></b></label><button class="btn sm" id="td-n">New sample</button></div><div class="readout" id="td-r"></div>`,
  mount(root){
    let seed = 3, tr, te, curve;
    const gen = (n, r) => Array.from({ length: n }, () => { if (r() < 0.5) { const noise = r() < 0.06; return noise ? [20 * r(), 20 * r(), 1] : [10 + 2.2 * gauss(r), 10 + 2.2 * gauss(r), 1]; } return [20 * r(), 20 * r(), 0]; });
    const data = () => { const r = prng(seed); tr = gen(150, r); te = gen(1500, prng(999)); curve = []; for (let d = 1; d <= 14; d++) { const T = fitTree(tr, d); curve.push([d, tr.filter(p => T.pred(p) !== p[2]).length / tr.length, te.filter(p => T.pred(p) !== p[2]).length / te.length, T.leaves]); } };
    const draw = () => { const d = +el_(root, "#td-d").value; el_(root, "#td-dv").textContent = d; const T = fitTree(tr, d);
      const p = new Plot(el_(root, "#td-c"), { xmin: 0, xmax: 20, ymin: 0, ymax: 20 }); const G = p.g, n = 80;
      shadeGrid(p, n, (x, y) => T.pred([x, y]) ? p.col.path : null, 0.18);
      p.axes("x₁", "x₂"); tr.forEach(q => p.dots([[q[0], q[1]]], q[2] ? p.col.path : p.col.dnn, 3));
      const e = new Plot(el_(root, "#td-e"), { xmin: 1, xmax: 14, ymin: 0, ymax: 0.5 }); e.axes("max depth", "error"); e.line(curve.map(c => [c[0], c[1]]), e.col.dnn, 2); e.line(curve.map(c => [c[0], c[2]]), e.col.path, 2); e.dots([[d, curve[d - 1][1]]], e.col.dnn, 5, e.col.bg); e.dots([[d, curve[d - 1][2]]], e.col.path, 5, e.col.bg); e.text(8, 0.46, "— train  — test", e.col.muted);
      const best = curve.reduce((a, b) => b[2] < a[2] ? b : a);
      el_(root, "#td-r").innerHTML = `<span>leaves <b>${T.leaves}</b></span><span>train error <b>${curve[d - 1][1].toFixed(3)}</b></span><span>test error <b>${curve[d - 1][2].toFixed(3)}</b></span><span>lowest test error at depth <b>${best[0]}</b></span>`; };

  }
};
LABS.giniThreshold = {

  html: () => `<canvas id="gt-c" style="height:250px" aria-label="Weighted Gini by threshold"></canvas><div class="ctrls"><label for="gt-t">Threshold (K) <input id="gt-t" type="range" min="0" max="10" step="1" value="6"> <b class="num" id="gt-tv"></b></label></div><div class="tablewrap"><table class="data num" id="gt-tb"></table></div>`,
  mount(root){

    const gi = c => { const n = c[0] + c[1]; return n ? 1 - (c[0] / n) ** 2 - (c[1] / n) ** 2 : 0; };

LABS.lwrLab = {
  title: "Locally weighted regression", cap: "Synthetic curved data. For the chosen query point, a straight line is fitted with Gaussian kernel weights K = exp(−d²/2τ²); the orange curve repeats this at every x.",
  html: () => `<canvas id="lw-c" style="height:280px" aria-label="Locally weighted regression"></canvas><div class="ctrls"><label for="lw-q">Query x <input id="lw-q" type="range" min="0" max="4" step="0.02" value="1.6"></label><label for="lw-t">Kernel width τ <input id="lw-t" type="range" min="0.05" max="2" step="0.05" value="0.3"> <b class="num" id="lw-tv"></b></label></div><div class="readout" id="lw-r"></div>`,
  mount(root){
    const r = prng(12), X = Array.from({ length: 90 }, () => 4 * r()).sort((a, b) => a - b), Y = X.map(x => 1.6 * Math.sin(1.4 * x) + 0.6 * x + 0.35 * gauss(r));
    const fit = (xq, tau) => { let s = 0, sx = 0, sy = 0, sxx = 0, sxy = 0; X.forEach((x, i) => { const w = Math.exp(-((x - xq) ** 2) / (2 * tau * tau)); s += w; sx += w * x; sy += w * Y[i]; sxx += w * x * x; sxy += w * x * Y[i]; }); const det = s * sxx - sx * sx; const b = Math.abs(det) < 1e-12 ? 0 : (s * sxy - sx * sy) / det; return [(sy - b * sx) / s, b]; };
    const draw = () => { const xq = +el_(root, "#lw-q").value, tau = +el_(root, "#lw-t").value; el_(root, "#lw-tv").textContent = tau.toFixed(2); const [a, b] = fit(xq, tau);
      const p = new Plot(el_(root, "#lw-c"), { xmin: 0, xmax: 4, ymin: -2.5, ymax: 5 }); p.axes("x", "y"); const G = p.g;
      X.forEach((x, i) => { const w = Math.exp(-((x - xq) ** 2) / (2 * tau * tau)); G.globalAlpha = 0.2 + 0.8 * w; p.dots([[x, Y[i]]], p.col.dnn, 3); G.globalAlpha = 1; });
      p.fn(x => { const [a2, b2] = fit(x, tau); return a2 + b2 * x; }, p.col.path, 2, null, 120); p.line([[xq - 0.6, a + b * (xq - 0.6)], [xq + 0.6, a + b * (xq + 0.6)]], p.col.ink, 2.5); p.dots([[xq, a + b * xq]], p.col.ink, 6, p.col.bg);
      p.fn(x => -2.5 + 1.2 * Math.exp(-((x - xq) ** 2) / (2 * tau * tau)), p.col.accent, 1.5);
      el_(root, "#lw-r").innerHTML = `<span>local line ŷ = <b>${a.toFixed(2)} + ${b.toFixed(2)}x</b></span><span>prediction at ${xq.toFixed(2)}: <b>${(a + b * xq).toFixed(3)}</b></span><span>green bump at the bottom = kernel weights</span><span>${tau > 1.2 ? "very wide kernel ≈ one global line" : tau < 0.12 ? "very narrow kernel: chases noise" : ""}</span>`; };
    ["#lw-q", "#lw-t"].forEach(s => el_(root, s).addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.kElbow = {
  title: "Choosing k: validation error vs k", cap: "Synthetic two-class data with label noise; 5-fold cross-validated error and training error for k = 1…40. The marker is √N.",
  html: () => `<canvas id="ke-c" style="height:250px" aria-label="Error vs k"></canvas><div class="ctrls"><label for="ke-n">label noise <input id="ke-n" type="range" min="0" max="0.3" step="0.02" value="0.1"> <b class="num" id="ke-nv"></b></label></div><div class="readout" id="ke-r"></div>`,
  mount(root){
    const draw = () => { const noise = +el_(root, "#ke-n").value; el_(root, "#ke-nv").textContent = noise.toFixed(2); const r = prng(77), N = 200;
      const D = Array.from({ length: N }, () => { const x = [4 * r() - 2, 4 * r() - 2]; let c = x[0] * x[0] + x[1] * x[1] < 1.6 ? 1 : 0; if (r() < noise) c = 1 - c; return [x, c]; });
      const pred = (tr, x, k) => { const s = tr.map(([p, c]) => [(p[0] - x[0]) ** 2 + (p[1] - x[1]) ** 2, c]).sort((a, b) => a[0] - b[0]).slice(0, k); return s.reduce((a, b) => a + b[1], 0) * 2 > k ? 1 : 0; };
      const ks = [1, 2, 3, 5, 7, 9, 11, 14, 17, 21, 25, 30, 35, 40], cv = [], trn = [];
      ks.forEach(k => { let e = 0; for (let f = 0; f < 5; f++) { const te = D.filter((_, i) => i % 5 === f), tr = D.filter((_, i) => i % 5 !== f); e += te.filter(([x, c]) => pred(tr, x, k) !== c).length; } cv.push([k, e / N]); trn.push([k, D.filter(([x, c]) => pred(D, x, k) !== c).length / N]); });
      const p = new Plot(el_(root, "#ke-c"), { xmin: 0, xmax: 41, ymin: 0, ymax: 0.5 }); p.axes("k", "error"); p.line(trn, p.col.dnn, 2); p.line(cv, p.col.path, 2.5); p.dots(cv, p.col.path, 3);
      const sq = Math.round(Math.sqrt(N * 0.8)); p.line([[sq, 0], [sq, 0.5]], p.col.line, 1, [4, 3]); p.text(sq + 0.5, 0.47, "√N", p.col.muted); p.text(25, 0.47, "— train  — 5-fold CV", p.col.muted);

  }

/* ===== ML M7 labs ===== */
function smoTrain(X, y, C, kern, iters = 40, tol = 1e-3){ // simplified SMO (Platt), small n
  const n = X.length, a = new Float64Array(n), K = X.map(p => X.map(q => kern(p, q))); let b = 0, passes = 0, it = 0; const r = prng(5);
  const f = i => { let s = b; for (let j = 0; j < n; j++) if (a[j]) s += a[j] * y[j] * K[j][i]; return s; };
  while (passes < 5 && it < iters * 20) { let changed = 0; it++;
    for (let i = 0; i < n; i++) { const Ei = f(i) - y[i]; if ((y[i] * Ei < -tol && a[i] < C) || (y[i] * Ei > tol && a[i] > 0)) { let j = Math.floor(r() * (n - 1)); if (j >= i) j++; const Ej = f(j) - y[j], ai = a[i], aj = a[j];
        let L, H; if (y[i] !== y[j]) { L = Math.max(0, aj - ai); H = Math.min(C, C + aj - ai); } else { L = Math.max(0, ai + aj - C); H = Math.min(C, ai + aj); } if (L === H) continue;
        const eta = 2 * K[i][j] - K[i][i] - K[j][j]; if (eta >= 0) continue; let ajn = aj - y[j] * (Ei - Ej) / eta; ajn = Math.min(H, Math.max(L, ajn)); if (Math.abs(ajn - aj) < 1e-5) continue;

function lgamma_(z){ const c = [76.18009172947146, -86.50532032941677, 24.01409824083091, -1.231739572450155, 0.1208650973866179e-2, -0.5395239384953e-5]; let x = z, y = z, t = x + 5.5; t -= (x + .5) * Math.log(t); let s = 1.000000000190015; for (const v of c) s += v / ++y; return -t + Math.log(2.5066282746310005 * s / x); }
const betaPdf = (p, a, b) => p <= 0 || p >= 1 ? 0 : Math.exp((a - 1) * Math.log(p) + (b - 1) * Math.log(1 - p) + lgamma_(a + b) - lgamma_(a) - lgamma_(b));

      const p = new Plot(el_(root, "#bu-c"), { xmin: 0, xmax: 1, ymin: 0, ymax: Math.max(4, betaPdf(Math.min(.999, Math.max(.001, (a - 1) / (a + b - 2 || 1))), a, b) * 1.1) }); p.axes("θ = P(heads)", "density");

  html: () => `<canvas id="ee-c" style="height:280px" aria-label="Ensemble error vs base error"></canvas><div class="ctrls"><label for="ee-n">Members n <input id="ee-n" type="range" min="1" max="101" step="2" value="25"> <b class="num" id="ee-nv"></b></label><label for="ee-e">Base error ε <input id="ee-e" type="range" min="0.01" max="0.99" step="0.01" value="0.35"> <b class="num" id="ee-ev"></b></label></div><div class="readout" id="ee-r"></div>`,

LABS.gbRegression = {
  title: "Gradient boosting: fit the residuals, again and again", cap: "Start from the mean; each round fits a depth-1 regression tree (stump) to the current residuals and adds η × that tree. Bottom panel: residuals left to explain.",
  html: () => `<canvas id="gb-c" style="height:240px" aria-label="Boosted fit"></canvas><canvas id="gb-r" style="height:140px" aria-label="Residuals"></canvas><div class="ctrls"><label for="gb-l">Learning rate η <input id="gb-l" type="range" min="0.05" max="1" step="0.05" value="0.3"> <b class="num" id="gb-lv"></b></label></div><div class="row"><button class="btn sm" id="gb-s">Add 1 tree</button><button class="btn sm" id="gb-10">Add 10 trees</button><button class="btn sm ghost" id="gb-reset">Reset</button></div><div class="readout" id="gb-o"></div>`,
  mount(root){

      for (let j = 1; j < X.length; j++) { const k = (X[j - 1] + X[j]) / 2, L = R.filter((_, i) => X[i] <= k), Rt = R.filter((_, i) => X[i] > k), a = L.reduce((s, v) => s + v, 0) / L.length, b = Rt.reduce((s, v) => s + v, 0) / Rt.length, sse = L.reduce((s, v) => s + (v - a) ** 2, 0) + Rt.reduce((s, v) => s + (v - b) ** 2, 0); if (!best || sse < best.sse) best = { k, a, b, sse }; }

  const feats = mtry >= 2 ? [0, 1] : [rnd() < 0.5 ? 0 : 1]; let best = null; const gini = (a, b) => { const t = a + b; return t ? 1 - (a / t) ** 2 - (b / t) ** 2 : 0; };
