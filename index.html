  return { f: best.f, t: best.t, L: cartFit(L, depth - 1, mtry, rnd, minLeaf), R: cartFit(R, depth - 1, mtry, rnd, minLeaf) };
}
const cartPred = (T, x) => T.v !== undefined ? T.v : cartPred(x[T.f] <= T.t ? T.L : T.R, x);

LABS.perceptronStepper = {

/* ---- labs_x_dnn10.js ---- */
{
/* ===== DNN M10 labs: optimisers ===== */
const L10 = w => w[0] * w[0] + 4 * w[1] * w[1], G10 = w => [2 * w[0], 8 * w[1]];
const OPT10 = {
  gd: { name: "Mini-batch GD", eta: 0.1, step(w, g, s) { return [w[0] - s.eta * g[0], w[1] - s.eta * g[1]]; } },
  mom: { name: "Momentum (β 0.9)", eta: 0.05, step(w, g, s) { s.v = (s.v || [0, 0]).map((v, i) => 0.9 * v + g[i]); return w.map((x, i) => x - s.eta * s.v[i]); } },
  nag: { name: "Nesterov", eta: 0.05, step(w, g, s) { const v = s.v || [0, 0], gl = G10(w.map((x, i) => x - s.eta * 0.9 * v[i])); s.v = v.map((x, i) => 0.9 * x + gl[i]); return w.map((x, i) => x - s.eta * s.v[i]); } },
  rms: { name: "RMSprop (γ 0.9)", eta: 0.05, step(w, g, s) { s.s = (s.s || [0, 0]).map((v, i) => 0.9 * v + 0.1 * g[i] * g[i]); return w.map((x, i) => x - s.eta * g[i] / Math.sqrt(s.s[i] + 1e-8)); } },
  adam: { name: "Adam", eta: 0.05, step(w, g, s) { s.t = (s.t || 0) + 1; s.m = (s.m || [0, 0]).map((v, i) => 0.9 * v + 0.1 * g[i]); s.u = (s.u || [0, 0]).map((v, i) => 0.999 * v + 0.001 * g[i] * g[i]); return w.map((x, i) => x - s.eta * (s.m[i] / (1 - 0.9 ** s.t)) / (Math.sqrt(s.u[i] / (1 - 0.999 ** s.t)) + 1e-8)); } }
};
function contours10(p){ const G = p.g; G.lineWidth = 1; G.strokeStyle = p.col.line; [0.5, 2, 5, 10, 18, 32, 50].forEach(c => { G.beginPath(); for (let a = 0; a <= 64; a++) { const th = a / 64 * 2 * Math.PI, x = Math.sqrt(c) * Math.cos(th), y = Math.sqrt(c) / 2 * Math.sin(th); a ? G.lineTo(p.sx(x), p.sy(y)) : G.moveTo(p.sx(x), p.sy(y)); } G.stroke(); }); }

LABS.optRace = {

LABS.scheduleLab = {
  title: "Learning-rate schedules", cap: "Step decay η₀·γ^⌊t/step⌋, exponential η₀e^{−λt}, cosine η_min + ½(η_max − η_min)(1 + cos(πt/T)), and linear warmup followed by cosine. Defaults are the slides' examples (η₀ = 0.1, γ = 0.1 every 30 epochs; λ = 0.05; η_min = 0.001, T = 100; warmup 5 epochs).",

LABS.earlyStop = {
  title: "Early stopping with patience", cap: "Synthetic training and validation curves (illustrative). Training loss keeps falling; validation loss bottoms out and then rises as the model overfits. Early stopping tracks the best validation loss and stops after 'patience' epochs without improvement, then restores the best checkpoint.",
  html: () => `<canvas id="es-c" style="height:280px" aria-label="Training and validation loss"></canvas><div class="slidergrid"><label for="es-p">patience (epochs) <input id="es-p" type="range" min="1" max="40" step="1" value="25"></label><label for="es-n">validation noise <input id="es-n" type="range" min="0" max="0.06" step="0.005" value="0.015"></label><label for="es-o">overfitting strength <input id="es-o" type="range" min="0" max="0.02" step="0.001" value="0.006"></label></div><div class="readout" id="es-o2"></div>`,
  mount(root){

/* ---- labs_x_dnn11.js ---- */
{
/* ===== DNN M11 labs: regularisation ===== */
const INIT11 = { zero: "Zero", small: "N(0, 0.01²)", large: "N(0, 1)", xavier: "Xavier", he: "He" };
function initStds11(act, width, L, seed){
  const r = prng(seed), B = 96, out = {};
  for (const k of Object.keys(INIT11)) {
    let h = Array.from({ length: B }, () => Array.from({ length: width }, () => gauss(r))); const s = [];
    for (let l = 0; l < L; l++) {
      const sd = k === "zero" ? 0 : k === "small" ? 0.01 : k === "large" ? 1 : k === "xavier" ? Math.sqrt(2 / (2 * width)) : Math.sqrt(2 / width);
      const W = Array.from({ length: width }, () => Array.from({ length: width }, () => sd * gauss(r)));
      const nh = h.map(row => { const o = new Array(width).fill(0); for (let i = 0; i < width; i++) { const xi = row[i]; if (!xi) continue; const Wi = W[i]; for (let j = 0; j < width; j++) o[j] += xi * Wi[j]; } return o.map(z => act === "tanh" ? Math.tanh(z) : Math.max(0, z)); });
      h = nh; let m = 0, q = 0, n = 0; h.forEach(row => row.forEach(v => { m += v; q += v * v; n++; })); m /= n; s.push(Math.sqrt(Math.max(q / n - m * m, 0)));
    }
    out[k] = s;
  }
  return out;
}
LABS.initLab = {

LABS.dropoutLab = {
  title: "Dropout: a different thinned network every step", cap: "Each training step samples a fresh mask: every hidden unit is dropped with probability p (crossed out). With inverted dropout the kept units are multiplied by 1/(1 − p), so the expected activation is unchanged and nothing is rescaled at test time. Step repeatedly and watch the running average of one unit's output approach its no-dropout value (1.0).",
  html: () => `<canvas id="do-c" style="height:260px" aria-label="Network with dropout"></canvas><div class="slidergrid"><label for="do-p">drop probability p <input id="do-p" type="range" min="0" max="0.8" step="0.05" value="0.5"></label><label for="do-m">mode <select id="do-m"><option value="train">training</option><option value="test">inference</option></select></label></div><div class="row">${ctrlBtns("do")}</div><div class="readout" id="do-o"></div>`,
  mount(root){
    const layers = [4, 6, 6, 2]; let r = prng(5), mask = [], steps = 0, sum = 0;
    const sample = () => { const p = +el_(root, "#do-p").value, test = el_(root, "#do-m").value === "test"; mask = layers.map((n, l) => Array.from({ length: n }, () => test || l === 0 || l === layers.length - 1 ? true : r() >= p)); };
    const draw = () => { const p = +el_(root, "#do-p").value, test = el_(root, "#do-m").value === "test";
      const P = new Plot(el_(root, "#do-c"), { xmin: 0, xmax: 4, ymin: 0, ymax: 7 }), G = P.g; const pos = (l, i) => [0.5 + l, 3.5 + (i - (layers[l] - 1) / 2)];
      for (let l = 0; l < layers.length - 1; l++) for (let i = 0; i < layers[l]; i++) for (let j = 0; j < layers[l + 1]; j++) { if (!mask[l][i] || !mask[l + 1][j]) continue; P.line([pos(l, i), pos(l + 1, j)], P.col.line, 1); }
      layers.forEach((n, l) => { for (let i = 0; i < n; i++) { const [x, y] = pos(l, i), on = mask[l][i]; P.dots([[x, y]], on ? (l === 0 ? P.col.dnn : l === 3 ? P.col.accent : P.col.path) : P.col.surface2, 9, P.col.muted); if (!on) { P.line([[x - 0.12, y - 0.35], [x + 0.12, y + 0.35]], P.col.bad, 2); P.line([[x - 0.12, y + 0.35], [x + 0.12, y - 0.35]], P.col.bad, 2); } } });
      const kept = mask[1].concat(mask[2]).filter(Boolean).length;
      el_(root, "#do-o").innerHTML = `<span>step ${steps}: kept <b>${kept}</b> of 12 hidden units (expected ${(12 * (test ? 1 : 1 - p)).toFixed(1)})</span><span>${test ? "Inference: every unit active, no scaling (inverted dropout)." : `kept units scaled by 1/(1 − p) = <b>${p < 1 ? (1 / (1 - p)).toFixed(2) : "∞"}</b>`}</span><span>running mean of one unit with input 1.0: <b>${steps ? (sum / steps).toFixed(3) : "–"}</b> over ${steps} steps (target 1.000)</span>`; };
    const step = () => { const p = +el_(root, "#do-p").value, test = el_(root, "#do-m").value === "test"; sample(); steps++; sum += test ? 1 : (mask[1][0] ? 1 / (1 - p) : 0); draw(); };
    const reset = () => { r = prng(5); steps = 0; sum = 0; sample(); draw(); };
    player(root, "do", step, reset, 350); $$("input,select", root).forEach(x => x.addEventListener("input", reset)); reset(); return draw;
  }
};

LABS.normAxes = {
  title: "Batch norm vs layer norm: which numbers get averaged?", cap: "Rows are samples in a mini-batch, columns are features. Batch norm normalises each column (one feature across the batch); layer norm normalises each row (all features of one sample). Row 1 is the slides' layer-norm example [2, 8, 4, 10]; column 4 is the batch-norm example [10, 12, 8, 14]. Shrink the batch to 1 and see batch norm collapse. ε = 0.01, γ = 1, β = 0.",
  html: () => `<div class="slidergrid"><label for="na-m">method <select id="na-m"><option value="bn">Batch norm (per feature)</option><option value="ln">Layer norm (per sample)</option></select></label><label for="na-b">batch size <input id="na-b" type="range" min="1" max="4" step="1" value="4"></label></div><div class="tablewrap"><table class="cmp" id="na-t"></table></div><div class="readout" id="na-o"></div>`,
  mount(root){
    const M = [[2, 8, 4, 10], [5, 1, 3, 12], [1, 4, 6, 8], [3, 7, 2, 14]], eps = 0.01;
    const draw = () => { const bn = el_(root, "#na-m").value === "bn", B = +el_(root, "#na-b").value, X = M.slice(0, B);
      const stats = bn ? [0, 1, 2, 3].map(j => { const c = X.map(r => r[j]), m = c.reduce((a, b) => a + b, 0) / B; return [m, c.reduce((a, b) => a + (b - m) ** 2, 0) / B]; }) : X.map(r => { const m = r.reduce((a, b) => a + b, 0) / 4; return [m, r.reduce((a, b) => a + (b - m) ** 2, 0) / 4]; });

    $$("input,select", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;

LABS.mixupLab = {
  title: "Mixup and CutMix", cap: "Two training images, A (a 'cat': blue disc) and B (a 'dog': red square), 16 × 16 pixels. Mixup blends the whole images and labels with weight λ. CutMix pastes a patch of B into A and mixes the labels by the patch's share of the area. The model must output the mixed label, which discourages over-confident, memorised decisions.",
  html: () => `<div class="row" style="gap:14px;flex-wrap:wrap;align-items:flex-end"><div><canvas id="mx-a" width="96" height="96" style="width:96px;height:96px;image-rendering:pixelated" aria-label="Image A"></canvas><div class="small">A: cat</div></div><div><canvas id="mx-b" width="96" height="96" style="width:96px;height:96px;image-rendering:pixelated" aria-label="Image B"></canvas><div class="small">B: dog</div></div><div><canvas id="mx-m" width="96" height="96" style="width:96px;height:96px;image-rendering:pixelated" aria-label="Mixed image"></canvas><div class="small">mixed</div></div></div><div class="slidergrid"><label for="mx-t">method <select id="mx-t"><option value="mix">Mixup</option><option value="cut">CutMix</option></select></label><label for="mx-l">λ (weight of A) <input id="mx-l" type="range" min="0" max="1" step="0.05" value="0.7"></label></div><div class="readout" id="mx-o"></div>`,
  mount(root){
    const n = 16, A = [], Bm = []; for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const d = Math.hypot(i - 7.5, j - 7.5) < 5.5; A.push(d ? [70, 110, 220] : [235, 238, 245]); const s = i > 3 && i < 12 && j > 3 && j < 12; Bm.push(s ? [220, 70, 70] : [245, 236, 230]); }
    const paint = (id, px) => { const c = el_(root, id), g = c.getContext("2d"), s = c.width / n; px.forEach((v, k) => { g.fillStyle = `rgb(${v.map(Math.round).join(",")})`; g.fillRect((k % n) * s, Math.floor(k / n) * s, s, s); }); };
    const draw = () => { const cut = el_(root, "#mx-t").value === "cut", lam = +el_(root, "#mx-l").value; let mixed, la;
      if (!cut) { mixed = A.map((v, k) => v.map((x, c) => lam * x + (1 - lam) * Bm[k][c])); la = lam; }
      else { const side = Math.round(n * Math.sqrt(1 - lam)), o = Math.floor((n - side) / 2); mixed = A.map((v, k) => { const i = Math.floor(k / n), j = k % n; return i >= o && i < o + side && j >= o && j < o + side ? Bm[k] : v; }); la = 1 - side * side / (n * n); }

      el_(root, "#mx-o").innerHTML = `<span>label = <b>${la.toFixed(2)}</b> × cat + <b>${(1 - la).toFixed(2)}</b> × dog</span><span>${cut ? `patch of B covers ${((1 - la) * 100).toFixed(0)}% of the pixels (patch side rounded to whole pixels), so B's label weight is the area share` : "x̃ = λxᵢ + (1 − λ)xⱼ and ỹ = λyᵢ + (1 − λ)yⱼ; the slides' example λ = 0.7 gives 0.7 × cat + 0.3 × dog"}</span><span>In practice λ is sampled from a Beta(α, α) distribution for each batch.</span>`; };
    $$("input,select", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.penaltyGeom = {
  title: "Why L1 gives exact zeros and L2 doesn't", cap: "Ellipses are contours of the unregularised loss, centred on its minimum w* (click to move it). Regularisation is equivalent to keeping the weights inside a budget region: a circle for L2 (w₁² + w₂² ≤ t), a diamond for L1 (|w₁| + |w₂| ≤ t). The solution is where the lowest contour first touches the region. The diamond's corners lie on the axes, so the L1 solution often has a coordinate exactly 0.",
  html: () => `<canvas id="pg-c" style="height:320px;cursor:crosshair" aria-label="L1 and L2 constraint geometry"></canvas><div class="slidergrid"><label for="pg-t">budget t <input id="pg-t" type="range" min="0.3" max="3" step="0.05" value="1"></label></div><div class="readout" id="pg-o"></div>`,
  mount(root){
    let ws = [2.2, 0.4]; const Q = (w) => (w[0] - ws[0]) ** 2 + 3 * (w[1] - ws[1]) ** 2;
    const best = (inside, boundary) => { if (inside(ws)) return ws.slice(); let b = null, bv = Infinity; for (let a = 0; a < 2000; a++) { const w = boundary(a / 2000 * 2 * Math.PI), v = Q(w); if (v < bv) { bv = v; b = w; } } return b; };
    const cv = el_(root, "#pg-c"), hy = Math.max(1.8, 3.5 * Math.max(cv.clientHeight - 40, 100) / Math.max(cv.clientWidth - 50, 100)), opts = { xmin: -3.5, xmax: 3.5, ymin: -hy, ymax: hy };
    const draw = () => { const t = +el_(root, "#pg-t").value, p = new Plot(el_(root, "#pg-c"), opts), G = p.g; p.axes("w₁", "w₂");
      const l2 = best(w => w[0] ** 2 + w[1] ** 2 <= t, th => [Math.sqrt(t) * Math.cos(th), Math.sqrt(t) * Math.sin(th)]);
      const l1 = best(w => Math.abs(w[0]) + Math.abs(w[1]) <= t, th => { const c = Math.cos(th), s = Math.sin(th), k = t / (Math.abs(c) + Math.abs(s)); return [k * c, k * s]; });
      [0.15, 0.5, 1, 2, 3.5, 5.5, 8].concat([Q(l1), Q(l2)]).forEach((c, ci) => { G.strokeStyle = ci >= 7 ? p.col.ink : p.col.line; G.lineWidth = ci >= 7 ? 1.2 : 1; G.setLineDash(ci >= 7 ? [3, 3] : []); G.beginPath(); for (let a = 0; a <= 120; a++) { const th = a / 120 * 2 * Math.PI, d = [Math.cos(th), Math.sin(th)], q = d[0] ** 2 + 3 * d[1] ** 2, r = Math.sqrt(c / q), x = ws[0] + r * d[0], y = ws[1] + r * d[1]; a ? G.lineTo(p.sx(x), p.sy(y)) : G.moveTo(p.sx(x), p.sy(y)); } G.stroke(); G.setLineDash([]); });
      const circ = []; for (let a = 0; a <= 90; a++) { const th = a / 90 * 2 * Math.PI; circ.push([Math.sqrt(t) * Math.cos(th), Math.sqrt(t) * Math.sin(th)]); } p.line(circ, p.col.dnn, 2.2);
      p.line([[t, 0], [0, t], [-t, 0], [0, -t], [t, 0]], p.col.bad, 2.2);
      p.dots([ws], p.col.muted, 5); p.text(ws[0] + 0.12, ws[1] + 0.2, "w*", p.col.muted); p.dots([l2], p.col.dnn, 6, p.col.bg); p.dots([l1], p.col.bad, 6, p.col.bg);

      el_(root, "#pg-o").innerHTML = `<span style="color:${p.col.dnn}">L2 (circle, w₁² + w₂² ≤ ${t.toFixed(2)}): w = (${z(l2[0])}, ${z(l2[1])})</span><span style="color:${p.col.bad}">L1 (diamond, |w₁| + |w₂| ≤ ${t.toFixed(2)}): w = (${z(l1[0])}, ${z(l1[1])})</span><span>${Math.abs(l1[0]) < 0.01 || Math.abs(l1[1]) < 0.01 ? "L1 landed on a corner: one weight is exactly zero (feature selection)." : "Here L1 touched an edge, not a corner; try a smaller budget or move w*."} L2 shrinks both weights but rarely to exactly zero.</span>`; };
    el_(root, "#pg-c").addEventListener("click", ev => { const r = ev.target.getBoundingClientRect(), p = new Plot(el_(root, "#pg-c"), opts); ws = [p.ix(ev.clientX - r.left), p.iy(ev.clientY - r.top)]; draw(); });

{
/* ===== DNN M3 labs: linear neural networks for regression ===== */
const D3X = [1, 2, 3], D3Y = [2, 4, 5];
const gdStep3 = (w, eta) => { const e = D3X.map((x, i) => w[0] + w[1] * x - D3Y[i]), g = [e.reduce((a, v) => a + v, 0) / 3, e.reduce((a, v, i) => a + v * D3X[i], 0) / 3]; return { e, g, w: [w[0] - eta * g[0], w[1] - eta * g[1]], J: e.reduce((a, v) => a + v * v, 0) / 6 }; };
const J3 = w => D3X.reduce((a, x, i) => a + (w[0] + w[1] * x - D3Y[i]) ** 2, 0) / 6;

LABS.gdWorked = {
  title: "The slides' gradient-descent example, step by step", cap: "Tiny dataset (size, price) = (1, 2), (2, 4), (3, 5); model ŷ = w₀ + w₁x (one neuron, identity activation); J(w) = (1/2N)‖Xw − y‖²; update w ← w − (η/N)Xᵀ(Xw − y). Start at w = (0, 0) with η = 0.1 as on p.22–25.",
  html: () => `<div class="lab-grid3"><canvas id="gw-c" style="height:280px" aria-label="Data and current line"></canvas><canvas id="gw-l" style="height:280px" aria-label="Loss per iteration"></canvas></div><div class="ctrls"><label for="gw-e">learning rate η <select id="gw-e"><option>0.01</option><option selected>0.1</option><option>0.3</option><option>0.4</option></select></label></div><div class="row">${ctrlBtns("gw")}</div><div class="stepbox" id="gw-s"></div><div class="readout" id="gw-r"></div>`,
  mount(root){
    let w, hist, last;
    const reset = () => { w = [0, 0]; hist = [J3(w)]; last = null; draw(); };
    const step = () => { const eta = +el_(root, "#gw-e").value, s = gdStep3(w, eta); last = { from: w, ...s }; w = s.w; hist.push(J3(w)); draw(); };
    const draw = () => { const p = new Plot(el_(root, "#gw-c"), { xmin: 0, xmax: 4, ymin: 0, ymax: 7 }); p.axes("size x₁", "price y");
      D3X.forEach((x, i) => p.line([[x, D3Y[i]], [x, w[0] + w[1] * x]], p.col.bad, 1, [3, 3])); p.fn(x => w[0] + w[1] * x, p.col.path, 2.5); p.fn(x => 2 / 3 + 1.5 * x, p.col.muted, 1, [2, 4]); p.dots(D3X.map((x, i) => [x, D3Y[i]]), p.col.dnn, 6, p.col.bg);
      const fin = hist.filter(isFinite), q = new Plot(el_(root, "#gw-l"), { xmin: 0, xmax: Math.max(10, hist.length - 1), ymin: 0.01, ymax: Math.max(10, ...fin.slice(-50)) * 1.5, logy: true }); q.axes("iteration t", "J(w) (log)"); q.line(hist.map((v, i) => [i, v]), q.col.accent, 2); q.dots(hist.map((v, i) => [i, v]).slice(-1), q.col.path, 4); q.line([[0, 1 / 36], [1e4, 1 / 36]], q.col.muted, 1, [2, 4]);
      const t = hist.length - 1, f = v => v.toFixed(3);
      el_(root, "#gw-s").innerHTML = last ? `<b>Iteration ${t}</b>: predictions ŷ = Xw = (${D3X.map(x => f(last.from[0] + last.from[1] * x)).join(", ")}); error e = ŷ − y = (${last.e.map(f).join(", ")})<br>gradient ∇J = (1/3)Xᵀe = (<b>${f(last.g[0])}, ${f(last.g[1])}</b>)<br>update w = (${f(last.from[0])}, ${f(last.from[1])}) − η·∇J = (<b>${f(w[0])}, ${f(w[1])}</b>)${t === 1 && Math.abs(+el_(root, "#gw-e").value - 0.1) < 1e-9 ? "<br>Matches the slides: ∇J = (−3.67, −8.33), w⁽¹⁾ = (0.367, 0.833), J drops from 7.5 to 1.51 (80% lower)." : ""}` : `Press <b>Step</b>. At w = (0, 0) every prediction is 0, so J = ¹⁄₆(4 + 16 + 25) = 7.5.`;
      el_(root, "#gw-r").innerHTML = `<span>t = ${t}</span><span>w = (${f(w[0])}, ${f(w[1])})</span><span>J = <b>${isFinite(J3(w)) ? J3(w).toFixed(4) : "∞"}</b></span><span>best possible: w = (0.667, 1.5), J = 0.0278 (dashed)</span><span>${J3(w) > 1e3 ? "<b>Diverging</b>: η is above 2/λ_max ≈ 0.36 for this data." : ""}</span>`; };
    player(root, "gw", step, reset, 500, () => hist.length > 200 || !isFinite(J3(w)) || J3(w) > 1e6); el_(root, "#gw-e").addEventListener("change", reset); reset(); return draw;
  }
};

LABS.lrRace = {
  title: "Learning-rate race", cap: "Same tiny dataset, four learning rates started together from w = (0, 0). The slides suggest trying η ∈ {0.001, 0.01, 0.1, 1.0} and plotting loss against iterations. For this data the largest stable η is 2/λ_max(XᵀX/N) ≈ 0.36.",
  html: () => `<canvas id="lr-c" style="height:300px" aria-label="Loss curves"></canvas><div class="ctrls"><label for="lr-x">your own η <input id="lr-x" type="range" min="-3" max="0" step="0.05" value="-0.6"></label></div><div class="row">${ctrlBtns("lr")}</div><div class="readout" id="lr-r"></div>`,
  mount(root){
    let W, H, t;
    const etas = () => [0.001, 0.01, 0.1, 1.0, Math.pow(10, +el_(root, "#lr-x").value)];
    const reset = () => { W = etas().map(() => [0, 0]); H = etas().map(() => [7.5]); t = 0; draw(); };
    const step = () => { const E = etas(); for (let k = 0; k < 5; k++) { W = W.map((w, i) => isFinite(H[i][H[i].length - 1]) && H[i][H[i].length - 1] < 1e8 ? gdStep3(w, E[i]).w : w); W.forEach((w, i) => H[i].push(J3(w))); t++; } draw(); };
    const draw = () => { const E = etas(), p = new Plot(el_(root, "#lr-c"), { xmin: 0, xmax: Math.max(50, t), ymin: 0.01, ymax: 1e4, logy: true }); p.axes("iteration", "J(w) (log)"); const cols = [p.col.muted, p.col.dnn, p.col.accent, p.col.bad, p.col.path];
      H.forEach((h, i) => p.line(h.map((v, j) => [j, Math.min(v, 1e5)]), cols[i], i === 4 ? 3 : 2, i === 4 ? [6, 3] : undefined)); p.line([[0, 1 / 36], [1e5, 1 / 36]], p.col.ink, 1, [2, 4]);
      el_(root, "#lr-r").innerHTML = E.map((e, i) => { const v = H[i][H[i].length - 1]; return `<span style="color:${cols[i]}">η = ${e < 0.01 ? e.toFixed(4) : e.toFixed(3)}: J = <b>${!isFinite(v) || v > 1e6 ? "diverged" : v.toFixed(4)}</b></span>`; }).join("") + `<span>after ${t} iterations</span>`; };
    player(root, "lr", step, reset, 120, () => t >= 400); el_(root, "#lr-x").addEventListener("input", reset); reset(); return draw;

LABS.metricsLab = {
  title: "MSE, RMSE, MAE and R² on the same predictions", cap: "Ten targets and a model's predictions. Drag the 'outlier' slider to make one prediction badly wrong, or add a constant bias, and compare how each metric reacts. R² compares the model with always predicting the mean.",
  html: () => `<canvas id="ml-c" style="height:260px" aria-label="Predictions vs targets"></canvas><div class="slidergrid"><label for="ml-o">error on point 7 <input id="ml-o" type="range" min="-8" max="8" step="0.1" value="0"></label><label for="ml-b">constant bias <input id="ml-b" type="range" min="-3" max="3" step="0.1" value="0"></label><label for="ml-n">noise level <input id="ml-n" type="range" min="0" max="2" step="0.05" value="0.5"></label></div><div class="readout" id="ml-r"></div>`,

      const N = Y.length, ybar = Y.reduce((a, v) => a + v) / N, mse = Y.reduce((a, y, i) => a + (P[i] - y) ** 2, 0) / N, mae = Y.reduce((a, y, i) => a + Math.abs(P[i] - y), 0) / N, sst = Y.reduce((a, y) => a + (y - ybar) ** 2, 0), r2 = 1 - mse * N / sst;
      const p = new Plot(el_(root, "#ml-c"), { xmin: 0.5, xmax: 10.5, ymin: 0, ymax: 20 }); p.axes("example i", "value"); p.line([[0, ybar], [11, ybar]], p.col.muted, 1, [3, 3]); p.text(0.7, ybar + 0.7, "mean ȳ", p.col.muted);

LABS.scalingRace = {
  title: "Why feature scaling speeds up gradient descent", cap: "Two features on very different scales (size in sq ft ~1000s, rooms ~1–5). Left: contours of J in (w₁, w₂) for raw features, right: after standardisation x′ = (x − μ)/σ. Each uses η = 1/λ_max, a safe step for its own surface. Raw features force a tiny η and a long zig-zag.",
  html: () => `<div class="lab-grid"><canvas id="sr-a" style="height:260px" aria-label="Raw features"></canvas><canvas id="sr-b" style="height:260px" aria-label="Standardised features"></canvas></div><div class="row">${ctrlBtns("sr")}</div><div class="readout" id="sr-r"></div>`,
  mount(root){
    const r = prng(11), N = 40, S = [], R = [], T = []; for (let i = 0; i < N; i++) { const s = 800 + 1600 * r(), k = Math.max(1, Math.min(5, Math.round(s / 500 + gauss(r) * 0.7))); S.push(s); R.push(k); T.push(0.15 * s + 20 * k + 40 + 25 * gauss(r)); }
    const ms = S.reduce((a, b) => a + b) / N, mr = R.reduce((a, b) => a + b) / N, mt = T.reduce((a, b) => a + b) / N, ss = Math.sqrt(S.reduce((a, b) => a + (b - ms) ** 2, 0) / N), sr = Math.sqrt(R.reduce((a, b) => a + (b - mr) ** 2, 0) / N);
    const mk = (std) => { const X = S.map((s, i) => std ? [(s - ms) / ss, (R[i] - mr) / sr] : [(s - ms) / 10, R[i] - mr]); // centred so the bias decouples; raw keeps sq ft in units of 10
      const A = [[0, 0], [0, 0]]; X.forEach(x => { A[0][0] += x[0] * x[0] / N; A[0][1] += x[0] * x[1] / N; A[1][1] += x[1] * x[1] / N; }); A[1][0] = A[0][1];
      const tr = A[0][0] + A[1][1], dt = A[0][0] * A[1][1] - A[0][1] ** 2, lmax = tr / 2 + Math.sqrt(tr * tr / 4 - dt), lmin = tr / 2 - Math.sqrt(tr * tr / 4 - dt);
      const b = [0, 0]; X.forEach((x, i) => { b[0] += x[0] * (T[i] - mt) / N; b[1] += x[1] * (T[i] - mt) / N; }); const wst = solve(A, b);
      const J = w => X.reduce((a, x, i) => a + (w[0] * x[0] + w[1] * x[1] - (T[i] - mt)) ** 2, 0) / (2 * N);
      return { X, A, b, wst, J, eta: 1 / lmax, kappa: lmax / lmin }; };
    const P = [mk(false), mk(true)]; let paths, t;
    const reset = () => { paths = P.map(() => [[0, 0]]); t = 0; draw(); };
    const step = () => { paths = paths.map((pth, k) => { const m = P[k], w = pth[pth.length - 1], g = [m.A[0][0] * w[0] + m.A[0][1] * w[1] - m.b[0], m.A[1][0] * w[0] + m.A[1][1] * w[1] - m.b[1]]; return pth.concat([[w[0] - m.eta * g[0], w[1] - m.eta * g[1]]]); }); t++; draw(); };
    const draw = () => { ["#sr-a", "#sr-b"].forEach((id, k) => { const m = P[k], w0 = m.wst, span = Math.max(Math.abs(w0[0]), Math.abs(w0[1])) * 1.4 + 1;
        const p = new Plot(el_(root, id), { xmin: -span * 0.3, xmax: span, ymin: -span * 0.3, ymax: span }); const Jm = m.J(w0), G = p.g;
        for (let lv = 1; lv <= 8; lv++) { const target = Jm + (m.J([0, 0]) - Jm) * Math.pow(lv / 8, 2); G.strokeStyle = p.col.line; G.lineWidth = 1; G.beginPath(); for (let a = 0; a <= 64; a++) { const th = a / 64 * 2 * Math.PI; let lo = 0, hi = span * 4; for (let it = 0; it < 40; it++) { const mid = (lo + hi) / 2; m.J([w0[0] + mid * Math.cos(th), w0[1] + mid * Math.sin(th)]) < target ? lo = mid : hi = mid; } const X = p.sx(w0[0] + lo * Math.cos(th)), Y = p.sy(w0[1] + lo * Math.sin(th)); a ? G.lineTo(X, Y) : G.moveTo(X, Y); } G.stroke(); }
        p.axes(k ? "w (size, standardised)" : "w (size per 10 sq ft)", k ? "w (rooms, standardised)" : "w (rooms)"); p.line(paths[k], p.col.path, 2); p.dots([paths[k][paths[k].length - 1]], p.col.path, 4); p.dots([w0], p.col.ink, 4); });
      const gap = k => { const w = paths[k][paths[k].length - 1], s = P[k].wst; return Math.hypot(w[0] - s[0], w[1] - s[1]) / Math.hypot(s[0], s[1]); };
      el_(root, "#sr-r").innerHTML = `<span>iteration ${t}</span><span>raw: condition number ${P[0].kappa.toFixed(0)}, distance to best weights <b>${(100 * gap(0)).toFixed(1)}%</b></span><span>standardised: condition number ${P[1].kappa.toFixed(1)}, distance <b>${(100 * gap(1)).toFixed(1)}%</b></span><span>${t > 20 && gap(0) > 0.3 ? "Raw features: the steep direction (size) is solved at once, but the rooms weight barely moves because η had to be tiny." : ""}</span>`; };
    player(root, "sr", step, reset, 150, () => t >= 200); reset(); return draw;
  }
};

{
/* ===== DNN M4 labs: linear networks for classification ===== */
const sg4 = z => 1 / (1 + Math.exp(-z));
const smx4 = z => { const m = Math.max(...z), e = z.map(v => Math.exp(v - m)), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); };

LABS.logitSGD = {
  title: "SGD on the study-hours example", cap: "Hours studied 1, 2, 3, 4 → pass 0, 0, 1, 1 (p.31). One sigmoid neuron ŷ = σ(w₀ + w₁x), binary cross-entropy, η = 0.5, w starts at (0, 0). Step 1 and 2 use the slides' examples (1, then 3); after that each step picks a random example.",
  html: () => `<div class="lab-grid3"><canvas id="ls-c" style="height:280px" aria-label="Sigmoid fit"></canvas><canvas id="ls-l" style="height:280px" aria-label="Loss"></canvas></div><div class="row">${ctrlBtns("ls")}<button class="btn sm" id="ls-ep">Run 1 epoch</button></div><div class="stepbox" id="ls-s"></div><div class="readout" id="ls-r"></div>`,
  mount(root){
    const X = [1, 2, 3, 4], Y = [0, 0, 1, 1], eta = 0.5; let w, t, hist, last, rnd;
    const L = w => -X.reduce((a, x, i) => { const p = Math.min(1 - 1e-12, Math.max(1e-12, sg4(w[0] + w[1] * x))); return a + Y[i] * Math.log(p) + (1 - Y[i]) * Math.log(1 - p); }, 0) / 4;
    const reset = () => { w = [0, 0]; t = 0; hist = [L(w)]; last = null; rnd = prng(7); draw(); };
    const one = i => { const z = w[0] + w[1] * X[i], p = sg4(z), e = p - Y[i], g = [e, e * X[i]]; last = { i, z, p, e, g, from: w.slice() }; w = [w[0] - eta * g[0], w[1] - eta * g[1]]; t++; hist.push(L(w)); };
    const step = () => { one(t === 0 ? 0 : t === 1 ? 2 : Math.floor(rnd() * 4)); draw(); };
    const draw = () => { const p = new Plot(el_(root, "#ls-c"), { xmin: 0, xmax: 5, ymin: -0.1, ymax: 1.1 }); p.axes("hours studied", "P(pass)"); p.line([[0, 0.5], [5, 0.5]], p.col.line, 1, [3, 3]);
      p.fn(x => sg4(w[0] + w[1] * x), p.col.path, 2.5); X.forEach((x, i) => p.dots([[x, Y[i]]], Y[i] ? p.col.accent : p.col.dnn, 6, last && last.i === i ? p.col.ink : p.col.bg)); X.forEach(x => p.dots([[x, sg4(w[0] + w[1] * x)]], p.col.path, 3.5));
      if (Math.abs(w[1]) > 1e-9) { const b = -w[0] / w[1]; if (b > 0 && b < 5) { p.line([[b, -0.1], [b, 1.1]], p.col.ink, 1, [4, 3]); } }
      const q = new Plot(el_(root, "#ls-l"), { xmin: 0, xmax: Math.max(10, hist.length - 1), ymin: 0, ymax: Math.max(1.2, ...hist) }); q.axes("SGD step", "mean BCE"); q.line(hist.map((v, i) => [i, v]), q.col.accent, 2);
      const f = v => v.toFixed(3);
      el_(root, "#ls-s").innerHTML = last ? `Step ${t}: example ${last.i + 1} (x = ${X[last.i]}, y = ${Y[last.i]}). z = ${f(last.z)}, ŷ = σ(z) = ${f(last.p)}, error ŷ − y = ${f(last.e)}<br>∇ℓ = (ŷ − y)·[1, x] = (${f(last.g[0])}, ${f(last.g[1])}); w = (${f(last.from[0])}, ${f(last.from[1])}) − 0.5·∇ℓ = <b>(${f(w[0])}, ${f(w[1])})</b>${t === 2 ? "<br>Same as the slides: w⁽²⁾ = (0.116, 0.847). Note that examples 1 and 2 (label 0) now score 0.724 and 0.859, further from 0 than the starting 0.5; more epochs fix this." : ""}` : "Press Step for the slides' first SGD iteration (example 1).";

LABS.multiConfusion = {
  title: "Multi-class confusion matrix and averaging", cap: "Rows are actual classes, columns predicted (p.85 values pre-loaded: accuracy 84.7%). Edit any count: per-class precision = diagonal ÷ column sum, recall = diagonal ÷ row sum; macro averages treat classes equally, weighted averages use class frequencies.",
  html: () => `<div class="tablewrap"><table class="data num edit-table" id="mc-t"></table></div><div class="row"><button class="btn sm" id="mc-slide">Slides' matrix</button><button class="btn sm" id="mc-imb">Imbalanced example</button></div><div class="tablewrap"><table class="data num" id="mc-m"></table></div><div class="readout" id="mc-r"></div>`,
  mount(root){
    const SL = [[45, 3, 2], [5, 38, 7], [2, 4, 44]], IMB = [[900, 30, 20], [10, 15, 5], [8, 2, 10]]; let C = SL.map(r => r.slice());
    const table = () => { el_(root, "#mc-t").innerHTML = `<tr><th>actual \\ predicted</th>${[1, 2, 3].map(j => `<th>class ${j}</th>`).join("")}</tr>` + C.map((r, i) => `<tr><th>class ${i + 1}</th>${r.map((v, j) => `<td><input type="number" min="0" value="${v}" data-i="${i}" data-j="${j}" aria-label="actual ${i + 1} predicted ${j + 1}" style="${i === j ? "font-weight:600" : ""}"></td>`).join("")}</tr>`).join(""); };
    const draw = () => { const K = 3, row = C.map(r => r.reduce((a, b) => a + b, 0)), col = [0, 1, 2].map(j => C.reduce((a, r) => a + r[j], 0)), N = row.reduce((a, b) => a + b, 0) || 1;
      const P = C.map((r, k) => col[k] ? r[k] / col[k] : 0), R = C.map((r, k) => row[k] ? r[k] / row[k] : 0), F = P.map((p, k) => p + R[k] ? 2 * p * R[k] / (p + R[k]) : 0), w = row.map(v => v / N);
      const acc = C.reduce((a, r, k) => a + r[k], 0) / N, avg = (a, ws) => a.reduce((s, v, k) => s + v * (ws ? ws[k] : 1 / K), 0);
      el_(root, "#mc-m").innerHTML = `<tr><th></th><th>precision</th><th>recall</th><th>F1</th><th>support</th></tr>` + [0, 1, 2].map(k => `<tr><td>class ${k + 1}</td><td>${P[k].toFixed(3)}</td><td>${R[k].toFixed(3)}</td><td>${F[k].toFixed(3)}</td><td>${row[k]}</td></tr>`).join("") + `<tr><th>macro avg</th><td>${avg(P).toFixed(3)}</td><td>${avg(R).toFixed(3)}</td><td>${avg(F).toFixed(3)}</td><td>${N}</td></tr><tr><th>weighted avg</th><td>${avg(P, w).toFixed(3)}</td><td>${avg(R, w).toFixed(3)}</td><td>${avg(F, w).toFixed(3)}</td><td>${N}</td></tr>`;
      el_(root, "#mc-r").innerHTML = `<span>accuracy = trace ÷ N = <b>${(100 * acc).toFixed(1)}%</b></span><span>${Math.abs(avg(F) - avg(F, w)) > 0.1 ? "Macro and weighted averages disagree: a big class is hiding poor performance on small ones. Accuracy looks good, macro-F1 does not." : ""}</span>`; };
    el_(root, "#mc-t").addEventListener("input", e => { const v = parseInt(e.target.value); if (v >= 0) { C[+e.target.dataset.i][+e.target.dataset.j] = v; draw(); } });
    el_(root, "#mc-slide").onclick = () => { C = SL.map(r => r.slice()); table(); draw(); }; el_(root, "#mc-imb").onclick = () => { C = IMB.map(r => r.slice()); table(); draw(); };
    table(); draw(); return draw;
  }

LABS.softmaxTrain = {
  title: "Train a softmax classifier with mini-batches", cap: "Three classes of 2-D points; K = 3 output neurons with softmax, categorical cross-entropy, mini-batch SGD. Shading shows the predicted class; the boundaries between classes are straight lines because the model is linear.",
  html: () => `<div class="lab-grid3"><canvas id="st-c" style="height:300px" aria-label="Decision regions"></canvas><canvas id="st-l" style="height:300px" aria-label="Loss"></canvas></div><div class="ctrls"><label for="st-b">batch size B <select id="st-b"><option>1</option><option selected>8</option><option>32</option><option value="90">90 (full batch)</option></select></label><label for="st-e">η <select id="st-e"><option>0.01</option><option selected>0.1</option><option>1</option><option>5</option></select></label></div><div class="row">${ctrlBtns("st")}</div><div class="readout" id="st-r"></div>`,
  mount(root){
    const r0 = prng(21), D = []; [[-1.2, -0.8], [1.3, -0.6], [0, 1.4]].forEach((c, k) => { for (let i = 0; i < 30; i++) D.push([c[0] + 0.65 * gauss(r0), c[1] + 0.65 * gauss(r0), k]); });
    let W, ep, it, hist, rnd;
    const prob = (x, y) => smx4([0, 1, 2].map(k => W[0][k] + W[1][k] * x + W[2][k] * y));
    const loss = () => -D.reduce((a, d) => a + Math.log(Math.max(1e-12, prob(d[0], d[1])[d[2]])), 0) / D.length;
    const reset = () => { const r = prng(3); W = [0, 1, 2].map(() => [0, 1, 2].map(() => 0.1 * gauss(r))); ep = 0; it = 0; hist = [loss()]; rnd = prng(5); draw(); };
    const epoch = () => { const B = +el_(root, "#st-b").value, eta = +el_(root, "#st-e").value, idx = D.map((_, i) => i); for (let i = idx.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [idx[i], idx[j]] = [idx[j], idx[i]]; }
      for (let s = 0; s < idx.length; s += B) { const b = idx.slice(s, s + B), G = [0, 1, 2].map(() => [0, 0, 0]); b.forEach(i => { const d = D[i], p = prob(d[0], d[1]), x = [1, d[0], d[1]]; p.forEach((v, k) => { const e = v - (k === d[2] ? 1 : 0); x.forEach((xv, a) => G[a][k] += xv * e / b.length); }); }); W = W.map((r, a) => r.map((v, k) => v - eta * G[a][k])); it++; }
      ep++; hist.push(loss()); draw(); };
    const draw = () => { const p = new Plot(el_(root, "#st-c"), { xmin: -3.5, xmax: 3.5, ymin: -3, ymax: 3.5 }), cols = [p.col.dnn, p.col.path, p.col.accent]; shadeGrid(p, 50, (x, y) => { const q = prob(x, y); return cols[q.indexOf(Math.max(...q))]; }, 0.18); p.axes("x₁", "x₂"); D.forEach(d => p.dots([[d[0], d[1]]], cols[d[2]], 3.5, p.col.bg));
      const fin = hist.filter(isFinite), q = new Plot(el_(root, "#st-l"), { xmin: 0, xmax: Math.max(20, hist.length - 1), ymin: 0, ymax: Math.max(1.3, ...fin.map(v => Math.min(v, 10))) }); q.axes("epoch", "cross-entropy"); q.line(hist.map((v, i) => [i, Math.min(v, 10)]), q.col.accent, 2);
      const acc = D.filter(d => { const v = prob(d[0], d[1]); return v.indexOf(Math.max(...v)) === d[2]; }).length / D.length, B = +el_(root, "#st-b").value;
      el_(root, "#st-r").innerHTML = `<span>epoch ${ep}</span><span>weight updates ${it} (${Math.ceil(D.length / B)} per epoch = ⌈N/B⌉)</span><span>loss <b>${hist[hist.length - 1].toFixed(3)}</b></span><span>accuracy <b>${(100 * acc).toFixed(1)}%</b></span><span>parameters (d + 1) × K = 9</span>`; };
    player(root, "st", epoch, reset, 120, () => ep >= 150); ["#st-b", "#st-e"].forEach(s => el_(root, s).addEventListener("change", reset)); reset(); return draw;
  }
};

LABS.convStepper = {
  title: "Slide a filter over an image", cap: "The session's 6×6 image and filters. Each output value is the sum of (image patch × filter), element by element (deep-learning 'convolution' is cross-correlation). Change stride and padding and watch the output size follow (n + 2p − k)/s + 1.",
  html: () => `<div class="ctrls"><label for="cs-k">Filter <select id="cs-k"><option value="diag">Filter 1: diagonal (slides)</option><option value="vline">Filter 2: vertical line (slides)</option><option value="vedge">vertical edge</option><option value="hedge">horizontal edge</option><option value="blur">3×3 average (blur)</option></select></label><label for="cs-s">stride <select id="cs-s"><option>1</option><option>2</option><option>3</option></select></label><label for="cs-p">padding <select id="cs-p"><option>0</option><option>1</option></select></label><label for="cs-r"><input type="checkbox" id="cs-r"> apply ReLU</label></div><div class="lab-grid"><div><div class="eyebrow">input (with padding)</div><div class="tablewrap" id="cs-in"></div><div class="eyebrow">filter</div><div class="tablewrap" id="cs-f"></div></div><div><div class="eyebrow">output feature map</div><div class="tablewrap" id="cs-out"></div><div class="stepbox" id="cs-x"></div></div></div><div class="row">${ctrlBtns("cs")}</div><div class="readout" id="cs-o"></div>`,
  mount(root){
    let pos = -1;
    const cfg = () => { const K = KERN6[el_(root, "#cs-k").value], s = +el_(root, "#cs-s").value, p = +el_(root, "#cs-p").value, n = 6 + 2 * p, I = Array.from({ length: n }, (_, i) => Array.from({ length: n }, (_, j) => (i < p || j < p || i >= 6 + p || j >= 6 + p) ? 0 : IMG6[i - p][j - p])), o = Math.floor((n - 3) / s) + 1; return { K, s, p, n, I, o }; };
    const val = (c, i, j) => { let t = 0; for (let m = 0; m < 3; m++) for (let q = 0; q < 3; q++) t += c.I[i * c.s + m][j * c.s + q] * c.K[m][q]; return el_(root, "#cs-r").checked ? Math.max(0, t) : t; };
    const draw = () => { const c = cfg(), tot = c.o * c.o, cur = pos >= 0 ? [Math.floor(pos / c.o), pos % c.o] : null;
      el_(root, "#cs-in").innerHTML = gridHTML6(c.I, (i, j) => cur && i >= cur[0] * c.s && i < cur[0] * c.s + 3 && j >= cur[1] * c.s && j < cur[1] * c.s + 3);
      el_(root, "#cs-f").innerHTML = gridHTML6(c.K);
      const O = Array.from({ length: c.o }, (_, i) => Array.from({ length: c.o }, (_, j) => (i * c.o + j <= pos ? val(c, i, j) : "·")));
      el_(root, "#cs-out").innerHTML = `<table class="data num">${O.map((r, i) => `<tr>${r.map((v, j) => `<td style="padding:3px 8px;text-align:center;${cur && cur[0] === i && cur[1] === j ? "background:var(--path-soft);font-weight:700" : ""}">${typeof v === "number" ? (Number.isInteger(v) ? v : v.toFixed(2)) : v}</td>`).join("")}</tr>`).join("")}</table>`;
      if (cur) { const terms = []; for (let m = 0; m < 3; m++) for (let q = 0; q < 3; q++) { const a = c.I[cur[0] * c.s + m][cur[1] * c.s + q], b = c.K[m][q]; if (a) terms.push(`${a}×${Number.isInteger(b) ? b : b.toFixed(2)}`); } el_(root, "#cs-x").innerHTML = `position (${cur[0]}, ${cur[1]}): non-zero terms ${terms.join(" + ") || "none"} = <b>${(() => { const v = val(c, cur[0], cur[1]); return Number.isInteger(v) ? v : v.toFixed(2); })()}</b>`; } else el_(root, "#cs-x").textContent = "Press Step to place the filter at the top-left.";
      el_(root, "#cs-o").innerHTML = `<span>output size = (${6} + 2·${c.p} − 3)/${c.s} + 1 = <b>${c.o}×${c.o}</b></span><span>${pos + 1 >= tot ? "done: the 3 in the top-left marks where the diagonal pattern appears" : `${Math.max(0, pos + 1)} of ${tot} positions`}</span><span>the same 9 weights are reused at every position (parameter sharing)</span>`; };
    const reset = () => { pos = -1; draw(); };
    player(root, "cs", () => { const c = cfg(); if (pos + 1 < c.o * c.o) pos++; draw(); }, reset, 450, () => pos + 1 >= cfg().o * cfg().o);
    $$("select,input", root).forEach(e => e.addEventListener("change", () => { const c = cfg(); pos = Math.min(pos, c.o * c.o - 1); if (pos >= 0) pos = c.o * c.o - 1; draw(); })); reset(); return draw;
  }
};

LABS.cnnBuilder = {
  title: "Build a CNN and count shapes and parameters", cap: "Start from an image and add layers. Each convolution has (k·k·C_in + 1)·C_out parameters; pooling has none; flattening turns H×W×C into one vector for the dense layers. Pre-loaded: the LeNet-style network from the slides (32×32×3 → 10 classes).",
  html: () => `<div class="ctrls"><label for="cb-in">input <select id="cb-in"><option value="32,3">32×32×3</option><option value="28,1">28×28×1 (MNIST)</option><option value="224,3">224×224×3</option></select></label><label for="cb-k">conv kernel <select id="cb-k"><option>1</option><option selected>3</option><option>5</option><option>7</option></select></label><label for="cb-c">filters <select id="cb-c"><option>6</option><option>16</option><option selected>32</option><option>64</option><option>128</option><option>256</option></select></label><label for="cb-p">padding <select id="cb-p"><option value="valid">valid (0)</option><option value="same">same</option></select></label><label for="cb-s">stride <select id="cb-s"><option>1</option><option>2</option></select></label></div><div class="row"><button class="btn sm" id="cb-conv">+ Conv + ReLU</button><button class="btn sm" id="cb-pool">+ MaxPool 2×2</button><button class="btn sm" id="cb-gap">+ Global avg pool</button><button class="btn sm" id="cb-fc">+ Flatten/Dense (units = filters)</button><button class="btn sm" id="cb-undo">Undo</button><button class="btn sm ghost" id="cb-le">LeNet-style preset</button><button class="btn sm ghost" id="cb-clr">Clear</button></div><div class="tablewrap"><table class="data num" id="cb-t"></table></div><div class="readout" id="cb-r"></div>`,
  mount(root){
    let L = [];
    const LENET = [["conv", 5, 6, "valid", 1], ["pool"], ["conv", 5, 16, "valid", 1], ["pool"], ["fc", 120], ["fc", 10]];
    const run = () => { const [n, c] = el_(root, "#cb-in").value.split(",").map(Number); let H = n, C = c, flat = false, rows = [[`input`, `${H}×${H}×${C}`, 0, ""]], err = "";
      L.forEach(l => { if (err) return; if (l[0] === "conv") { if (flat) { err = "Can't convolve after flattening."; return; } const [_, k, co, pad, s] = l, p = pad === "same" ? (k - 1) / 2 : 0, o = Math.floor((H + 2 * p - k) / s) + 1; if (o < 1) { err = `Kernel ${k} too big for ${H}×${H}.`; return; } const P = (k * k * C + 1) * co; rows.push([`conv ${k}×${k}, ${co} filters, ${pad}, s${s}`, `${o}×${o}×${co}`, P, `(${k}·${k}·${C} + 1)·${co}`]); H = o; C = co; }
        else if (l[0] === "pool") { if (flat) { err = "Can't pool after flattening."; return; } H = Math.floor(H / 2); rows.push(["max-pool 2×2, s2", `${H}×${H}×${C}`, 0, "no weights"]); }
        else if (l[0] === "gap") { if (flat) { err = "Already a vector."; return; } rows.push(["global average pool", `1×1×${C}`, 0, "no weights"]); H = 1; }
        else { const inN = flat ? C : H * H * C; if (!flat && H > 1) rows.push(["flatten", `${inN}`, 0, `${H}·${H}·${C}`]); const P = inN * l[1] + l[1]; rows.push([`dense ${l[1]}`, `${l[1]}`, P, `${inN}·${l[1]} + ${l[1]}`]); flat = true; C = l[1]; H = 1; } });
      const tot = rows.reduce((a, r) => a + r[2], 0), big = rows.reduce((m, r) => r[2] > m[2] ? r : m, rows[0]);
      el_(root, "#cb-t").innerHTML = `<tr><th>layer</th><th>output shape</th><th>parameters</th><th>how</th></tr>` + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].toLocaleString()}</td><td class="small muted">${r[3]}</td></tr>`).join("") + `<tr><th>total</th><th></th><th>${tot.toLocaleString()}</th><th></th></tr>`;
      el_(root, "#cb-r").innerHTML = err ? `<span><b>${err}</b></span>` : `<span>largest layer: ${big[0]} (${tot ? (100 * big[2] / tot).toFixed(0) : 0}% of parameters)</span><span>${rows.some(r => r[0] === "flatten") ? "Dense layers after flattening usually hold most of the weights; global average pooling avoids this." : ""}</span>`; };
    const add = l => { L.push(l); run(); };
    el_(root, "#cb-conv").onclick = () => add(["conv", +el_(root, "#cb-k").value, +el_(root, "#cb-c").value, el_(root, "#cb-p").value, +el_(root, "#cb-s").value]);
    el_(root, "#cb-pool").onclick = () => add(["pool"]); el_(root, "#cb-gap").onclick = () => add(["gap"]); el_(root, "#cb-fc").onclick = () => add(["fc", +el_(root, "#cb-c").value]);
    el_(root, "#cb-undo").onclick = () => { L.pop(); run(); }; el_(root, "#cb-clr").onclick = () => { L = []; run(); }; el_(root, "#cb-le").onclick = () => { el_(root, "#cb-in").value = "32,3"; L = LENET.map(x => x.slice()); run(); };
    el_(root, "#cb-in").addEventListener("change", run); L = LENET.map(x => x.slice()); run(); return run;
  }
};

LABS.rfGrow = {
  title: "How far does one neuron see?", cap: "Receptive field of a neuron after L layers: RF_l = RF_{l−1} + (k_eff − 1) × (product of earlier strides), with k_eff = k + (k − 1)(d − 1) for dilation d. The picture shows the input region one output neuron depends on.",
  html: () => `<canvas id="rf-c" style="height:280px" aria-label="Receptive field"></canvas><div class="slidergrid"><label for="rf-L">layers <input id="rf-L" type="range" min="1" max="8" step="1" value="3"></label><label for="rf-k">kernel size k <input id="rf-k" type="range" min="1" max="7" step="2" value="3"></label><label for="rf-s">stride per layer <input id="rf-s" type="range" min="1" max="2" step="1" value="1"></label><label for="rf-d">dilation d <input id="rf-d" type="range" min="1" max="4" step="1" value="1"></label></div><div class="readout" id="rf-r"></div>`,
  mount(root){
    const draw = () => { const L = +el_(root, "#rf-L").value, k = +el_(root, "#rf-k").value, s = +el_(root, "#rf-s").value, d = +el_(root, "#rf-d").value, ke = k + (k - 1) * (d - 1);
      let rf = 1, j = 1; const hist = []; for (let l = 1; l <= L; l++) { rf += (ke - 1) * j; j *= s; hist.push(rf); }
      const N = Math.max(rf + 4, 15), p = new Plot(el_(root, "#rf-c"), { xmin: 0, xmax: N, ymin: 0, ymax: N, pad: { l: 8, r: 8, t: 8, b: 8 } }), G = p.g, c0 = Math.floor((N - rf) / 2);
      G.strokeStyle = p.col.line; G.lineWidth = 1; for (let i = 0; i <= N; i++) { G.beginPath(); G.moveTo(p.sx(i), p.sy(0)); G.lineTo(p.sx(i), p.sy(N)); G.stroke(); G.beginPath(); G.moveTo(p.sx(0), p.sy(i)); G.lineTo(p.sx(N), p.sy(i)); G.stroke(); }
      G.fillStyle = p.col.accent; G.globalAlpha = 0.25; G.fillRect(p.sx(c0), p.sy(c0 + rf), p.sx(rf) - p.sx(0), p.sy(0) - p.sy(rf)); G.globalAlpha = 1;
      if (d > 1 && L === 1) { G.fillStyle = p.col.path; for (let a = 0; a < k; a++) for (let b = 0; b < k; b++) G.fillRect(p.sx(c0 + a * d) + 2, p.sy(c0 + b * d + 1) + 2, p.sx(1) - p.sx(0) - 4, p.sy(0) - p.sy(1) - 4); }
      const mid = c0 + Math.floor(rf / 2); G.fillStyle = p.col.ink; G.fillRect(p.sx(mid) + 3, p.sy(mid + 1) + 3, p.sx(1) - p.sx(0) - 6, p.sy(0) - p.sy(1) - 6);
      el_(root, "#rf-r").innerHTML = `<span>effective kernel ${ke}×${ke}</span><span>RF per layer: ${hist.join(" → ")}</span><span>final receptive field <b>${rf}×${rf}</b> input pixels</span><span>parameters per 1-channel layer: ${k * k} (unchanged by dilation)</span><span>${k === 3 && s === 1 && d === 1 ? "Slides: stacked 3×3 stride 1 → 3, 5, 7, 9; two 3×3 layers see as much as one 5×5 with fewer weights (18 vs 25)." : ""}</span>`; };
    $$("input", root).forEach(e => e.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.residualGrad = {
  title: "Why skip connections let networks go deep", cap: "Each block multiplies the backward gradient by its local derivative a (|a| < 1 means it shrinks). Plain stack: gradient × aᴸ. Residual stack, y = F(x) + x: each block multiplies by (1 + a), so there is always an identity path. Log scale; illustrative, with the same a for every block.",
  html: () => `<canvas id="rg-c" style="height:280px" aria-label="Gradient vs depth"></canvas><div class="slidergrid"><label for="rg-a">block derivative a <input id="rg-a" type="range" min="-0.9" max="0.9" step="0.05" value="0.3"></label><label for="rg-L">depth L <input id="rg-L" type="range" min="2" max="152" step="1" value="50"></label></div><div class="readout" id="rg-r"></div>`,
  mount(root){
    const draw = () => { const a = +el_(root, "#rg-a").value, L = +el_(root, "#rg-L").value, p = new Plot(el_(root, "#rg-c"), { xmin: 0, xmax: 152, ymin: 1e-12, ymax: 1e12, logy: true }); p.axes("depth (blocks)", "gradient reaching layer 1");
      p.fn(x => Math.pow(Math.abs(a), x), p.col.bad, 2.4); p.fn(x => Math.pow(Math.abs(1 + a), x), p.col.accent, 2.4); p.line([[L, 1e-12], [L, 1e12]], p.col.line, 1, [3, 3]); p.line([[0, 1], [152, 1]], p.col.muted, 1, [2, 4]);
      p.text(100, Math.max(2e-11, Math.pow(Math.abs(a), 100)) * 5, "plain", p.col.bad); p.text(100, Math.min(1e11, Math.pow(Math.abs(1 + a), 100)) / 5, "residual", p.col.accent);
      el_(root, "#rg-r").innerHTML = `<span>plain: |a|ᴸ = <b>${Math.pow(Math.abs(a), L).toExponential(1)}</b></span><span>residual: |1 + a|ᴸ = <b>${Math.pow(Math.abs(1 + a), L).toExponential(1)}</b></span><span>${Math.abs(a) < 0.3 ? "With small block derivatives the residual product stays near 1: gradients reach the first layer." : a > 0.3 ? "Large positive a: even residual products grow. In practice batch norm and careful initialisation keep each F small." : ""}</span><span>∂L/∂x = ∂L/∂y · (1 + ∂F/∂x): the '1' is the gradient highway.</span>`; };
    $$("input", root).forEach(e => e.addEventListener("input", draw)); draw(); return draw;
  }
};

/* ---- labs_x_dnn7.js ---- */
{
/* ===== DNN M7 labs: recurrent networks ===== */
const sg7 = z => 1 / (1 + Math.exp(-z));
const mv7 = (M, v) => M.map(r => r.reduce((a, w, j) => a + w * v[j], 0));
const vadd7 = (...vs) => vs[0].map((_, i) => vs.reduce((a, v) => a + v[i], 0));
const f37 = v => "(" + v.map(x => x.toFixed(3)).join(", ") + ")";

LABS.tempForecast = {
  title: "Forecast tomorrow: one value vs a memory of the trend", cap: "Temperatures 20, 22, 25, 24, 21 °C from the slides. Left: the first-order autoregressive model T̂ = αT + β (slides: α = 0.8, β = 4). Right idea: a hidden state h that summarises the recent trend, hₜ = a·hₜ₋₁ + (1 − a)(Tₜ − Tₜ₋₁), forecast Tₜ + hₜ. This trend state is a hand-made illustration; a trained RNN learns its own update.",
  html: () => `<canvas id="tf-c" style="height:280px" aria-label="Temperature series and forecasts"></canvas><div class="slidergrid"><label for="tf-a">α (AR weight) <input id="tf-a" type="range" min="0" max="1" step="0.05" value="0.8"></label><label for="tf-b">β (AR offset) <input id="tf-b" type="range" min="0" max="10" step="0.5" value="4"></label><label for="tf-m">a (how long the state remembers) <input id="tf-m" type="range" min="0" max="0.95" step="0.05" value="0.5"></label><label for="tf-k">days ahead <input id="tf-k" type="range" min="1" max="5" step="1" value="2"></label></div><div class="readout" id="tf-r"></div>`,
  mount(root){
    const T = [20, 22, 25, 24, 21];
    const draw = () => { const a = +el_(root, "#tf-a").value, b = +el_(root, "#tf-b").value, m = +el_(root, "#tf-m").value, k = +el_(root, "#tf-k").value;
      const ar = [T[4]]; for (let i = 0; i < k; i++) ar.push(a * ar[ar.length - 1] + b);
      const H = [0]; for (let t = 1; t < 5; t++) H.push(m * H[t - 1] + (1 - m) * (T[t] - T[t - 1]));
      let h = H[4]; const st = [T[4]]; for (let i = 0; i < k; i++) { const nx = st[st.length - 1] + h; h = m * h + (1 - m) * (nx - st[st.length - 1]); st.push(nx); }
      const p = new Plot(el_(root, "#tf-c"), { xmin: 0.5, xmax: 5 + k + 0.5, ymin: Math.min(14, ...ar, ...st) - 1, ymax: Math.max(27, ...ar, ...st) + 1 }); p.axes("day", "°C");
      p.line(T.map((v, i) => [i + 1, v]), p.col.ink, 2); p.dots(T.map((v, i) => [i + 1, v]), p.col.ink, 4);
      p.line(ar.map((v, i) => [5 + i, v]), p.col.dnn, 2, [5, 4]); p.dots(ar.slice(1).map((v, i) => [6 + i, v]), p.col.dnn, 4);
      p.line(st.map((v, i) => [5 + i, v]), p.col.path, 2, [2, 3]); p.dots(st.slice(1).map((v, i) => [6 + i, v]), p.col.path, 4);
      p.text(5.3, ar[1] + 0.8, "AR(1)", p.col.dnn); p.text(5.3, st[1] - 0.8, "trend state", p.col.path);
      el_(root, "#tf-r").innerHTML = `<span>AR(1): T̂₆ = ${a}×21 + ${b} = <b>${ar[1].toFixed(2)} °C</b>${k > 1 ? `, T̂₇ = ${ar[2].toFixed(2)}` : ""} (slides: 20.8, 20.64)</span><span>trend state h₂…h₅ = ${H.slice(1).map(v => v.toFixed(2)).join(", ")} → T̂₆ = 21 + (${H[4].toFixed(2)}) = <b>${st[1].toFixed(2)} °C</b></span><span>${a < 1 ? `AR(1) forecasts drift to its fixed point β/(1 − α) = ${(b / (1 - a)).toFixed(1)} °C, whatever the recent trend.` : "α = 1: forecasts grow by β every day."}</span>`; };
    $$("input", root).forEach(e => e.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.rnnUnroll = {
  title: "Unroll an RNN: the same weights at every step", cap: "The slides' example (p.25–27): d = 2 inputs, h = 3 hidden units, V = 2 outputs, tanh, h₀ = 0. Each step computes zₜ = W_hh hₜ₋₁ + W_hx xₜ + b_h, hₜ = tanh(zₜ), oₜ = W_ho hₜ + b_o. Change the inputs, or add steps: the boxes reuse exactly the same W_hx, W_hh, W_ho.",
  html: () => `<canvas id="ru-c" style="height:300px" aria-label="Unrolled RNN"></canvas><div class="slidergrid"><label for="ru-a">xₜ first value <input id="ru-a" type="range" min="-1.5" max="1.5" step="0.1" value="1"></label><label for="ru-b">xₜ second value <input id="ru-b" type="range" min="-1.5" max="1.5" step="0.1" value="0.5"></label></div><div class="row">${ctrlBtns("ru")}<button class="btn sm" id="ru-slide">Load the slide inputs</button></div><div class="readout" id="ru-r"></div>`,
  mount(root){
    const Whx = [[0.5, 0.3], [0.2, 0.4], [0.1, 0.2]], Whh = [[0.3, 0.2, 0.1], [0.1, 0.4, 0.2], [0.2, 0.1, 0.3]], Who = [[0.4, 0.3, 0.5], [0.2, 0.6, 0.1]];
    let S = [];
    const reset = () => { S = []; el_(root, "#ru-a").value = 1; el_(root, "#ru-b").value = 0.5; draw(); };
    const step = () => { if (S.length >= 5) return; const x = [+el_(root, "#ru-a").value, +el_(root, "#ru-b").value], hp = S.length ? S[S.length - 1].h : [0, 0, 0];
      const z = vadd7(mv7(Whh, hp), mv7(Whx, x), [0.1, 0.1, 0.1]), h = z.map(Math.tanh), o = vadd7(mv7(Who, h), [0.1, 0.1]); S.push({ x, z, h, o });
      if (S.length === 1) { el_(root, "#ru-a").value = 0.8; el_(root, "#ru-b").value = 1.2; } draw(); };
    const draw = () => { const cv = el_(root, "#ru-c"), p = new Plot(cv, { xmin: 0, xmax: 5.3, ymin: 0, ymax: 3, pad: { l: 8, r: 8, t: 8, b: 8 } }), G = p.g;
      const box = (x, y, w, h, txt, col, sub) => { G.strokeStyle = col; G.lineWidth = 2; G.strokeRect(p.sx(x - w / 2), p.sy(y + h / 2), p.sx(w) - p.sx(0), p.sy(0) - p.sy(h)); G.fillStyle = p.col.ink; G.textAlign = "center"; G.textBaseline = "middle"; G.fillText(txt, p.sx(x), p.sy(y + (sub ? 0.08 : 0))); if (sub) { G.fillStyle = p.col.muted; G.fillText(sub, p.sx(x), p.sy(y - 0.13)); } };
      const arrow = (x1, y1, x2, y2, col, lab) => { G.strokeStyle = col; G.fillStyle = col; G.lineWidth = 1.5; G.beginPath(); G.moveTo(p.sx(x1), p.sy(y1)); G.lineTo(p.sx(x2), p.sy(y2)); G.stroke(); const a = Math.atan2(p.sy(y2) - p.sy(y1), p.sx(x2) - p.sx(x1)); G.beginPath(); G.moveTo(p.sx(x2), p.sy(y2)); G.lineTo(p.sx(x2) - 7 * Math.cos(a - 0.4), p.sy(y2) - 7 * Math.sin(a - 0.4)); G.lineTo(p.sx(x2) - 7 * Math.cos(a + 0.4), p.sy(y2) - 7 * Math.sin(a + 0.4)); G.fill(); if (lab) { G.fillStyle = p.col.muted; G.textAlign = "left"; G.fillText(lab, p.sx((x1 + x2) / 2) + 4, p.sy((y1 + y2) / 2)); } };
      box(0.28, 1.5, 0.4, 0.4, "h₀", p.col.line, "0,0,0");
      for (let t = 0; t < 5; t++) { const cx = 1 + t * 0.95, s = S[t], on = !!s, col = on ? p.col.accent : p.col.line;
        box(cx, 0.4, 0.7, 0.45, `x${t + 1}`, on ? p.col.dnn : p.col.line, on ? s.x.map(v => v.toFixed(1)).join(", ") : "");
        box(cx, 1.5, 0.82, 0.55, `h${t + 1}`, col, on ? s.h.map(v => v.toFixed(2)).join(",") : "");
        box(cx, 2.6, 0.7, 0.45, `o${t + 1}`, on ? p.col.path : p.col.line, on ? s.o.map(v => v.toFixed(2)).join(", ") : "");
        arrow(cx, 0.63, cx, 1.22, on ? p.col.dnn : p.col.line, t === 0 ? "W_hx" : ""); arrow(cx, 1.78, cx, 2.37, on ? p.col.path : p.col.line, t === 0 ? "W_ho" : "");
        arrow(t ? cx - 0.95 + 0.41 : 0.48, 1.5, cx - 0.41, 1.5, on ? p.col.accent : p.col.line, ""); }
      G.fillStyle = p.col.muted; G.textAlign = "left"; G.fillText("W_hh on every horizontal arrow", p.sx(0.1), p.sy(2.92));
      const s = S[S.length - 1];
      el_(root, "#ru-r").innerHTML = s ? `<span>t = ${S.length}: z = ${f37(s.z)}</span><span>h = tanh(z) = <b>${f37(s.h)}</b></span><span>o = ${f37(s.o)}</span><span>${S.length === 1 && Math.abs(s.x[0] - 1) < 1e-9 && Math.abs(s.x[1] - 0.5) < 1e-9 ? "Matches the slide: h₁ = (0.635, 0.462, 0.291). The slide prints o₁ = (0.538, 0.532): its first entry leaves out b_o." : S.length === 2 ? "With x₂ = (0.8, 1.2) this is the slide's h₂ = (0.825, 0.780, 0.592): it depends on x₁ through h₁." : "Parameters used so far: still the same 3×2 + 3×3 + 3 + 2×3 + 2 = 26 numbers."}</span>` : `<span>Press Step to compute t = 1 with the slide's x₁ = (1.0, 0.5).</span>`; };
    player(root, "ru", step, reset, 900, () => S.length >= 5);
    el_(root, "#ru-slide").onclick = reset; draw(); return draw;
  }
};

LABS.rnnParams = {
  title: "Count the parameters of any recurrent network", cap: "Per recurrent block: g × (h·input + h·h + h), with g = 1 (vanilla), 3 (GRU) or 4 (LSTM). Layer 1's input is d; later layers take h (2h if bidirectional). Bidirectional doubles every layer. The output layer adds V·(h or 2h) + V. Slides: vanilla 2,661,392 (d = 100, h = 256, V = 10,000); bidirectional 2,628,624 (h = 128 each way).",
  html: () => `<div class="ctrls"><label for="rp-c">Cell <select id="rp-c"><option value="1">vanilla RNN</option><option value="3">GRU</option><option value="4">LSTM</option></select></label><label for="rp-bi">Direction <select id="rp-bi"><option value="1">one-directional</option><option value="2">bidirectional</option></select></label></div><div class="slidergrid"><label for="rp-d">input size d <input id="rp-d" type="range" min="1" max="512" step="1" value="100"></label><label for="rp-h">hidden size h (per direction) <input id="rp-h" type="range" min="8" max="1024" step="8" value="256"></label><label for="rp-L">layers <input id="rp-L" type="range" min="1" max="4" step="1" value="1"></label><label for="rp-V">output size V <input id="rp-V" type="range" min="1" max="20000" step="1" value="10000"></label></div><div class="tablewrap"><table class="data num" id="rp-t"></table></div><div class="readout" id="rp-r"></div>`,
  mount(root){
    const draw = () => { const g = +el_(root, "#rp-c").value, bi = +el_(root, "#rp-bi").value, d = +el_(root, "#rp-d").value, h = +el_(root, "#rp-h").value, L = +el_(root, "#rp-L").value, V = +el_(root, "#rp-V").value;
      const rows = []; let tot = 0; for (let l = 1; l <= L; l++) { const inp = l === 1 ? d : bi * h, n = bi * g * (h * inp + h * h + h); rows.push([`layer ${l}`, `${bi > 1 ? "2 × " : ""}${g} × (${h}·${inp} + ${h}² + ${h})`, n]); tot += n; }
      const outN = V * bi * h + V; rows.push(["output", `${V}·${bi * h} + ${V}`, outN]); tot += outN;
      el_(root, "#rp-t").innerHTML = `<tr><th>block</th><th>formula</th><th>parameters</th></tr>` + rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2].toLocaleString()}</td></tr>`).join("") + `<tr><th>total</th><th></th><th>${tot.toLocaleString()}</th></tr>`;
      el_(root, "#rp-r").innerHTML = `<span>output layer share: <b>${(100 * outN / tot).toFixed(1)}%</b></span><span>${g === 4 ? "LSTM: 4 blocks (forget, input, output, candidate)." : g === 3 ? "GRU: 3 blocks (reset, update, candidate), ~25% fewer than LSTM." : "Vanilla: 1 block."}</span><span>The count does not depend on sequence length: weights are shared across time.</span>`; };
    $$("input,select", root).forEach(e => e.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.vanishLab = {
  title: "How much gradient survives k steps back?", cap: "Vanilla RNN: each step back multiplies the gradient by roughly |φ′| × λ_max(W_hh) (slides: 0.5 × 0.8 = 0.4). LSTM cell path: each step multiplies by the forget gate f (gates held fixed). Log scale.",
  html: () => `<canvas id="vl-c" style="height:280px" aria-label="Gradient vs steps back"></canvas><div class="slidergrid"><label for="vl-l">λ_max(W_hh) <input id="vl-l" type="range" min="0.2" max="3" step="0.05" value="0.8"></label><label for="vl-p">average |φ′(z)| <input id="vl-p" type="range" min="0.1" max="1" step="0.05" value="0.5"></label><label for="vl-f">LSTM forget gate f <input id="vl-f" type="range" min="0.5" max="1" step="0.01" value="0.95"></label><label for="vl-k">steps back k <input id="vl-k" type="range" min="1" max="100" step="1" value="20"></label></div><div class="readout" id="vl-r"></div>`,
  mount(root){
    const draw = () => { const l = +el_(root, "#vl-l").value, ph = +el_(root, "#vl-p").value, f = +el_(root, "#vl-f").value, k = +el_(root, "#vl-k").value, r = l * ph;
      const p = new Plot(el_(root, "#vl-c"), { xmin: 0, xmax: 100, ymin: 1e-12, ymax: 1e6, logy: true }); p.axes("steps back k", "gradient ratio");
      p.fn(x => Math.pow(r, x), r > 1 ? p.col.bad : p.col.dnn, 2.4); p.fn(x => Math.pow(f, x), p.col.path, 2.4); p.line([[k, 1e-12], [k, 1e6]], p.col.line, 1, [3, 3]); p.line([[0, 1], [100, 1]], p.col.muted, 1, [2, 4]);
      p.text(62, Math.max(1e-11, Math.min(1e5, Math.pow(r, 60))) * 3, "vanilla RNN", r > 1 ? p.col.bad : p.col.dnn); p.text(62, Math.pow(f, 60) * 3, "LSTM cell (f)", p.col.path);
      const v = Math.pow(r, k), s = Math.pow(f, k);
      el_(root, "#vl-r").innerHTML = `<span>factor per step = ${l} × ${ph} = <b>${r.toFixed(2)}</b></span><span>after k = ${k}: vanilla × <b>${v.toExponential(2)}</b>, LSTM × <b>${s.toExponential(2)}</b></span><span>${r > 1.02 ? "Factor above 1: gradients <b>explode</b>. Gradient clipping caps their norm." : r < 0.98 ? "Factor below 1: gradients <b>vanish</b>; early steps get almost no learning signal." : "Factor ≈ 1: the gradient neither vanishes nor explodes (hard to keep there in a vanilla RNN)."}</span>`; };
    $$("input", root).forEach(e => e.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.gruStep = {
  title: "One GRU step, gate by gate", cap: "The slides' GRU example (p.68–71) with weights W_r, U_r, W_z, U_z, W_h, U_h and zero biases. Move the input xₜ and the previous state hₜ₋₁, or nudge the update gate, and watch how much of the old state survives. Convention (eq. 34): hₜ = z ⊙ hₜ₋₁ + (1 − z) ⊙ h̃_t.",
  html: () => `<canvas id="gs-c" style="height:250px" aria-label="GRU quantities"></canvas><div class="slidergrid"><label for="gs-x1">x₁ <input id="gs-x1" type="range" min="-2" max="2" step="0.1" value="1"></label><label for="gs-x2">x₂ <input id="gs-x2" type="range" min="-2" max="2" step="0.1" value="0.5"></label><label for="gs-h1">hₜ₋₁ first unit <input id="gs-h1" type="range" min="-1" max="1" step="0.05" value="0.6"></label><label for="gs-h2">hₜ₋₁ second unit <input id="gs-h2" type="range" min="-1" max="1" step="0.05" value="0.4"></label><label for="gs-bz">update-gate bias b_z <input id="gs-bz" type="range" min="-4" max="4" step="0.1" value="0"></label><label for="gs-br">reset-gate bias b_r <input id="gs-br" type="range" min="-4" max="4" step="0.1" value="0"></label></div><div class="readout" id="gs-r"></div>`,
  mount(root){
    const Wr = [[0.3, 0.2], [0.1, 0.4]], Ur = [[0.5, 0.1], [0.2, 0.3]], Wz = [[0.4, 0.3], [0.2, 0.5]], Uz = [[0.3, 0.2], [0.1, 0.4]], Wh = [[0.5, 0.3], [0.2, 0.4]], Uh = [[0.4, 0.2], [0.1, 0.3]];
    const draw = () => { const x = [+el_(root, "#gs-x1").value, +el_(root, "#gs-x2").value], hp = [+el_(root, "#gs-h1").value, +el_(root, "#gs-h2").value], bz = +el_(root, "#gs-bz").value, br = +el_(root, "#gs-br").value;
      const r = vadd7(mv7(Wr, x), mv7(Ur, hp)).map(v => sg7(v + br)), z = vadd7(mv7(Wz, x), mv7(Uz, hp)).map(v => sg7(v + bz)), rh = r.map((v, i) => v * hp[i]), hc = vadd7(mv7(Wh, x), mv7(Uh, rh)).map(Math.tanh), h = z.map((v, i) => v * hp[i] + (1 - v) * hc[i]);
      const p = new Plot(el_(root, "#gs-c"), { xmin: 0, xmax: 6, ymin: -1.05, ymax: 1.05 }), G = p.g; p.axes("", "value"); p.line([[0, 0], [6, 0]], p.col.muted, 1);
      const items = [["hₜ₋₁", hp, p.col.muted], ["r (reset)", r, p.col.dnn], ["z (update)", z, p.col.accent], ["h̃ (candidate)", hc, p.col.path], ["hₜ", h, p.col.ink]];
      items.forEach(([n, v, c], k) => { v.forEach((val, j) => { const x0 = k + 0.6 + j * 0.42; G.fillStyle = c; G.globalAlpha = j ? 0.6 : 1; G.fillRect(p.sx(x0), p.sy(Math.max(val, 0)), p.sx(x0 + 0.36) - p.sx(x0), Math.abs(p.sy(val) - p.sy(0))); G.globalAlpha = 1; }); p.text(k + 1, -0.93, n, p.col.ink, "center"); });
      const slide = Math.abs(x[0] - 1) < 1e-9 && Math.abs(x[1] - 0.5) < 1e-9 && Math.abs(hp[0] - 0.6) < 1e-9 && Math.abs(hp[1] - 0.4) < 1e-9 && !bz && !br;
      el_(root, "#gs-r").innerHTML = `<span>r = ${f37(r)}, z = ${f37(z)}</span><span>h̃ = tanh(W_h x + U_h(r ⊙ hₜ₋₁)) = ${f37(hc)}</span><span>hₜ = <b>${f37(h)}</b>: ${(100 * (z[0] + z[1]) / 2).toFixed(0)}% old state, ${(100 - 100 * (z[0] + z[1]) / 2).toFixed(0)}% candidate</span><span>${slide ? "These are the slide's values: r ≈ (0.677, 0.632), z ≈ (0.692, 0.662), hₜ ≈ (0.629, 0.426)." : bz > 2 ? "Large update gate: the GRU copies hₜ₋₁ almost unchanged, so information and gradient pass straight through." : bz < -2 ? "Small update gate: the GRU overwrites its state with the candidate." : ""}</span>`; };
    $$("input", root).forEach(e => e.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.lstmMemory = {
  title: "Can the network remember one fact for 40 steps?", cap: "At step 1 a value of 1 is written to memory. Then 40 steps of distracting inputs (random ±0.5) arrive. LSTM cell: cₜ = f·cₜ₋₁ + i·c̃_t. Vanilla RNN state: hₜ = tanh(w·hₜ₋₁ + u·xₜ). How much of the original fact is left at the end?",
  html: () => `<canvas id="lm-c" style="height:280px" aria-label="Memory over time"></canvas><div class="slidergrid"><label for="lm-f">LSTM forget gate f <input id="lm-f" type="range" min="0" max="1" step="0.01" value="0.98"></label><label for="lm-i">LSTM input gate i (for distractors) <input id="lm-i" type="range" min="0" max="1" step="0.01" value="0.05"></label><label for="lm-w">vanilla recurrent weight w <input id="lm-w" type="range" min="0" max="1.5" step="0.01" value="0.8"></label><label for="lm-u">vanilla input weight u <input id="lm-u" type="range" min="0" max="1" step="0.01" value="0.5"></label></div><div class="row"><button class="btn sm" id="lm-n">New distractors</button></div><div class="readout" id="lm-r"></div>`,
  mount(root){
    let seed = 5;
    const draw = () => { const f = +el_(root, "#lm-f").value, i = +el_(root, "#lm-i").value, w = +el_(root, "#lm-w").value, u = +el_(root, "#lm-u").value, rnd = prng(seed), X = Array.from({ length: 40 }, () => rnd() - 0.5);
      // fact-only trajectories (distractors switched off) measure how much of the original survives
      const C = [1], H = [Math.tanh(1)], C0 = [1], H0 = [Math.tanh(1)];
      X.forEach(x => { C.push(f * C[C.length - 1] + i * Math.tanh(2 * x)); H.push(Math.tanh(w * H[H.length - 1] + u * x)); C0.push(f * C0[C0.length - 1]); H0.push(Math.tanh(w * H0[H0.length - 1])); });
      const p = new Plot(el_(root, "#lm-c"), { xmin: 0, xmax: 40, ymin: -1, ymax: 1.1 }); p.axes("time step", "state");
      p.line(C.map((v, t) => [t, v]), p.col.path, 2.4); p.line(H.map((v, t) => [t, v]), p.col.dnn, 2.4); p.line(C0.map((v, t) => [t, v]), p.col.path, 1, [3, 3]); p.line(H0.map((v, t) => [t, v]), p.col.dnn, 1, [3, 3]);
      p.text(1, 1.03, "solid: with distractors; dashed: fact alone", p.col.muted);
      el_(root, "#lm-r").innerHTML = `<span>LSTM: fact remaining after 40 steps = f⁴⁰ = <b>${Math.pow(f, 40).toFixed(3)}</b>; final cell ${C[40].toFixed(3)}</span><span>vanilla RNN: fact remaining ≈ <b>${H0[40].toFixed(3)}</b>; final state ${H[40].toFixed(3)}</span><span>${f > 0.95 && i < 0.2 ? "Forget gate open (f ≈ 1) and input gate mostly closed: the LSTM keeps the fact, the 'constant error carousel'." : f < 0.8 ? "With a small forget gate the LSTM forgets as fast as a vanilla RNN." : ""}</span>`; };
    el_(root, "#lm-n").onclick = () => { seed++; draw(); }; $$("input", root).forEach(e => e.addEventListener("input", draw)); draw(); return draw;
  }
};

}
