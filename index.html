{
/* ===== DNN M8 labs: attention ===== */
const smx8 = z => { const m = Math.max(...z.filter(isFinite)), e = z.map(v => isFinite(v) ? Math.exp(v - m) : 0), s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); };

LABS.attnWeights = {
  title: "Query meets keys: scores → softmax → weighted sum", cap: "The slides' dot-product example (p.29): keys k₁ = (0.5, 0.3), k₂ = (0.9, 0.7), k₃ = (0.4, 0.2) and query q = (0.8, 0.6). Drag the query (click the plot). Score eᵢ = q·kᵢ (optionally ÷√d), weights αᵢ = softmax(e), output c = Σ αᵢvᵢ, with values vᵢ = the day's gold price.",
  html: () => `<div class="lab-grid3"><canvas id="aw-c" style="height:300px;cursor:crosshair" aria-label="Query and keys"></canvas><canvas id="aw-b" style="height:300px" aria-label="Attention weights"></canvas></div><div class="ctrls"><label for="aw-s"><input type="checkbox" id="aw-s"> scale by √d (d = 2)</label><label for="aw-t">sharpness (multiply scores) <input id="aw-t" type="range" min="0" max="10" step="0.1" value="1"></label><button class="btn sm" id="aw-r">Reset to slide query</button></div><div class="readout" id="aw-o"></div>`,
  mount(root){
    const K = [[0.5, 0.3], [0.9, 0.7], [0.4, 0.2]], V = [6250, 6280, 6270]; let q = [0.8, 0.6];
    const draw = () => { const sc = el_(root, "#aw-s").checked ? 1 / Math.SQRT2 : 1, t = +el_(root, "#aw-t").value, e = K.map(k => (q[0] * k[0] + q[1] * k[1])), a = smx8(e.map(v => v * sc * t)), c = a.reduce((s, w, i) => s + w * V[i], 0);
      const p = new Plot(el_(root, "#aw-c"), { xmin: -1.2, xmax: 1.2, ymin: -1.2, ymax: 1.2 }), cols = [p.col.dnn, p.col.accent, p.col.path]; p.axes("dim 1", "dim 2");
      K.forEach((k, i) => { p.line([[0, 0], k], cols[i], 1 + 6 * a[i]); p.text(k[0] + 0.04, k[1] + 0.06, `k${i + 1}`, cols[i]); }); p.line([[0, 0], q], p.col.ink, 2.5, [5, 3]); p.dots([q], p.col.ink, 5); p.text(q[0] + 0.05, q[1] - 0.08, "q", p.col.ink);
      const b = new Plot(el_(root, "#aw-b"), { xmin: 0, xmax: 3, ymin: 0, ymax: 1 }), G = b.g; b.axes("", "weight αᵢ"); a.forEach((w, i) => { G.fillStyle = cols[i]; G.fillRect(b.sx(i + 0.2), b.sy(w), b.sx(0.6) - b.sx(0), b.sy(0) - b.sy(w)); b.text(i + 0.5, Math.min(0.95, w + 0.05), w.toFixed(3), b.col.ink, "center"); b.text(i + 0.5, 0.03, `day ${i + 1}`, b.col.bg, "center"); });
      el_(root, "#aw-o").innerHTML = `<span>scores e = (${e.map(v => v.toFixed(2)).join(", ")})</span><span>α = (${a.map(v => v.toFixed(3)).join(", ")})</span><span>context c = Σαᵢvᵢ = <b>₹${c.toFixed(1)}</b></span><span>${Math.abs(q[0] - 0.8) < 1e-9 && Math.abs(q[1] - 0.6) < 1e-9 && sc === 1 && t === 1 ? "Correct softmax of (0.58, 1.14, 0.44) is (0.276, 0.484, 0.240); the slide prints (0.21, 0.62, 0.17)." : t > 5 ? "High sharpness: softmax approaches a hard arg-max (one key wins)." : t < 0.3 ? "Low sharpness: weights approach uniform (plain averaging)." : ""}</span>`; };
    el_(root, "#aw-c").addEventListener("click", ev => { const r = ev.target.getBoundingClientRect(), p = new Plot(el_(root, "#aw-c"), { xmin: -1.2, xmax: 1.2, ymin: -1.2, ymax: 1.2 }); q = [p.ix(ev.clientX - r.left), p.iy(ev.clientY - r.top)]; draw(); });
    el_(root, "#aw-r").onclick = () => { q = [0.8, 0.6]; el_(root, "#aw-t").value = 1; el_(root, "#aw-s").checked = false; draw(); };
    $$("input", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.attnPool = {
  title: "Max, average and attention pooling", cap: "Values (3, 7, 2, 5) from the slides (p.26). Max pooling picks one, average weights all equally, attention uses learned, data-dependent weights that sum to 1. Drag the weights (they are renormalised).",
  html: () => `<canvas id="ap-c" style="height:240px" aria-label="Pooling comparison"></canvas><div class="slidergrid">${[0.1, 0.5, 0.2, 0.2].map((w, i) => `<label for="ap-${i}">raw weight on value ${i + 1} <input id="ap-${i}" type="range" min="0" max="1" step="0.01" value="${w}"></label>`).join("")}</div><div class="readout" id="ap-o"></div>`,
  mount(root){
    const V = [3, 7, 2, 5];
    const draw = () => { const raw = [0, 1, 2, 3].map(i => +el_(root, "#ap-" + i).value), s = raw.reduce((a, b) => a + b, 0) || 1, a = raw.map(v => v / s), att = a.reduce((t, w, i) => t + w * V[i], 0);
      const p = new Plot(el_(root, "#ap-c"), { xmin: 0, xmax: 8, ymin: 0, ymax: 8 }), G = p.g; p.axes("", "value");
      V.forEach((v, i) => { G.fillStyle = p.col.dnn; G.globalAlpha = 0.25 + 0.75 * a[i] / Math.max(...a); G.fillRect(p.sx(i + 0.15), p.sy(v), p.sx(0.7) - p.sx(0), p.sy(0) - p.sy(v)); G.globalAlpha = 1; p.text(i + 0.5, v + 0.3, `${v} (α=${a[i].toFixed(2)})`, p.col.ink, "center"); });
      [["max", Math.max(...V), p.col.bad], ["avg", 4.25, p.col.muted], ["attention", att, p.col.accent]].forEach(([n, v, c], k) => { G.fillStyle = c; G.fillRect(p.sx(4.6 + k * 1.1), p.sy(v), p.sx(0.8) - p.sx(0), p.sy(0) - p.sy(v)); p.text(5 + k * 1.1, v + 0.3, `${n} ${v.toFixed(2)}`, p.col.ink, "center"); });
      el_(root, "#ap-o").innerHTML = `<span>weights α = (${a.map(v => v.toFixed(2)).join(", ")}), sum 1</span><span>attention output Σαᵢvᵢ = <b>${att.toFixed(2)}</b> (slides' weights 0.1, 0.5, 0.2, 0.2 → 5.20)</span><span>all weight on one item = max-like; equal weights = average</span>`; };
    $$("input", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.scaleSaturation = {
  title: "Why divide by √d_k?", cap: "Dot products of random d-dimensional vectors have variance ≈ d. Without scaling, a softmax over 8 such scores becomes nearly one-hot as d grows, and its gradients vanish. Dividing by √d keeps the variance ≈ 1. Ten random draws, re-sampled with the button.",
  html: () => `<div class="lab-grid"><canvas id="ss-a" style="height:240px" aria-label="Unscaled weights"></canvas><canvas id="ss-b" style="height:240px" aria-label="Scaled weights"></canvas></div><div class="ctrls"><label for="ss-d">d_k <input id="ss-d" type="range" min="0" max="10" step="1" value="6"></label><button class="btn sm" id="ss-n">New random scores</button></div><div class="readout" id="ss-o"></div>`,
  mount(root){
    let seed = 3;
    const draw = () => { const d = Math.pow(2, +el_(root, "#ss-d").value), r = prng(seed), z = Array.from({ length: 8 }, () => gauss(r)), un = smx8(z.map(v => v * Math.sqrt(d))), sc = smx8(z);
      const grad = w => { const i = w.indexOf(Math.max(...w)); return w[i] * (1 - w[i]); };
      [["#ss-a", un, "unscaled qᵀk"], ["#ss-b", sc, "scaled qᵀk/√d"]].forEach(([id, w, lab]) => { const p = new Plot(el_(root, id), { xmin: 0, xmax: 8, ymin: 0, ymax: 1 }), G = p.g; p.axes(lab, "softmax weight"); w.forEach((v, i) => { G.fillStyle = v === Math.max(...w) ? p.col.path : p.col.dnn; G.fillRect(p.sx(i + 0.15), p.sy(v), p.sx(0.7) - p.sx(0), p.sy(0) - p.sy(v)); }); });
      el_(root, "#ss-o").innerHTML = `<span>d_k = <b>${d}</b>, score std ≈ √d = ${Math.sqrt(d).toFixed(1)}</span><span>largest weight: unscaled <b>${Math.max(...un).toFixed(3)}</b>, scaled ${Math.max(...sc).toFixed(3)}</span><span>softmax slope at the winner α(1 − α): unscaled ${grad(un).toExponential(1)}, scaled ${grad(sc).toFixed(3)}</span><span>${d >= 64 && Math.max(...un) > 0.95 ? "Saturated: almost all weight on one key and near-zero gradients; the reason Transformers use √d_k." : ""}</span>`; };
    el_(root, "#ss-n").onclick = () => { seed++; draw(); }; el_(root, "#ss-d").addEventListener("input", draw); draw(); return draw;
  }
};

LABS.maskLab = {
  title: "Self-attention with and without a causal mask", cap: "\"The customer was very happy with service\". Each row is a query word, each column a key word; cell colour is its attention weight. Weights come from illustrative embeddings (not a trained model). Causal masking sets future scores to −∞ before softmax, so each word can only use itself and earlier words, as in GPT-style generation.",
  html: () => `<div class="ctrls"><div class="seg" id="ml-m"><button data-m="full" aria-pressed="true">Self-attention (BERT-style)</button><button data-m="causal" aria-pressed="false">Masked (GPT-style)</button></div><label for="ml-q">query word <select id="ml-q"></select></label></div><canvas id="ml-c" style="height:300px" aria-label="Attention matrix"></canvas><div class="readout" id="ml-o"></div>`,
  mount(root){
    const W = ["The", "customer", "was", "very", "happy", "with", "service"], r = prng(8), D = 6, E = W.map(() => Array.from({ length: D }, () => gauss(r)));
    E[4] = E[3].map((v, i) => 0.7 * v + 0.5 * E[4][i]); E[2] = E[1].map((v, i) => 0.6 * v + 0.6 * E[2][i]); E[6] = E[1].map((v, i) => 0.5 * v + 0.7 * E[6][i]);
    let mode = "full"; el_(root, "#ml-q").innerHTML = W.map((w, i) => `<option value="${i}" ${i === 4 ? "selected" : ""}>${w}</option>`).join("");
    const A = () => W.map((_, i) => smx8(W.map((_, j) => mode === "causal" && j > i ? -Infinity : E[i].reduce((s, v, k) => s + v * E[j][k], 0) / Math.sqrt(D))));
    const draw = () => { const M = A(), qi = +el_(root, "#ml-q").value, cv = el_(root, "#ml-c"), p = new Plot(cv, { xmin: 0, xmax: 9, ymin: 0, ymax: 8.6, pad: { l: 8, r: 8, t: 8, b: 8 } }), G = p.g, n = W.length;
      for (let i = 0; i < n; i++) { p.text(1.85, n - i - 0.5, W[i], i === qi ? p.col.path : p.col.ink, "right"); for (let j = 0; j < n; j++) { const v = M[i][j], masked = mode === "causal" && j > i; G.fillStyle = masked ? p.col.bad : p.col.dnn; G.globalAlpha = masked ? 0.25 : 0.08 + 0.92 * v; G.fillRect(p.sx(2 + j) + 1, p.sy(n - i) + 1, p.sx(1) - p.sx(0) - 2, p.sy(0) - p.sy(1) - 2); G.globalAlpha = 1; if (i === qi) { G.strokeStyle = p.col.path; G.lineWidth = 2; G.strokeRect(p.sx(2 + j) + 1, p.sy(n - i) + 1, p.sx(1) - p.sx(0) - 2, p.sy(0) - p.sy(1) - 2); } } }
      W.forEach((w, j) => { G.save(); G.translate(p.sx(2.25 + j), p.sy(n + 0.2)); G.rotate(-0.5); G.fillStyle = p.col.muted; G.fillText(w, 0, 0); G.restore(); });
      el_(root, "#ml-o").innerHTML = `<span>row "${W[qi]}": ${W.map((w, j) => `${w} ${M[qi][j].toFixed(2)}`).join(" · ")}</span><span>${mode === "causal" ? `"${W[qi]}" sees ${qi + 1} of ${n} words; masked weights are exactly 0 (red).` : "Every word attends to every word, including later ones (bidirectional context)."}</span>`; };
    $$("#ml-m button", root).forEach(b => b.onclick = () => { mode = b.dataset.m; $$("#ml-m button", root).forEach(x => x.setAttribute("aria-pressed", x === b)); draw(); });
    el_(root, "#ml-q").addEventListener("change", draw); draw(); return draw;
  }
};

LABS.posEncLab = {
  title: "Sinusoidal positional encoding", cap: "PE(pos, 2i) = sin(pos/10000^{2i/d}), PE(pos, 2i+1) = cos(pos/10000^{2i/d}). Left: the encoding for 64 positions × d dimensions (colour = value; early dimensions oscillate fast, later ones slowly). Right: similarity PE(p)·PE(p + k) depends only on the offset k, which is why relative positions are easy to learn.",
  html: () => `<div class="lab-grid"><canvas id="pe-c" style="height:280px" aria-label="Positional encoding heatmap"></canvas><canvas id="pe-s" style="height:280px" aria-label="Similarity vs offset"></canvas></div><div class="slidergrid"><label for="pe-d">d_model <input id="pe-d" type="range" min="4" max="128" step="4" value="32"></label><label for="pe-p">position p <input id="pe-p" type="range" min="0" max="63" step="1" value="10"></label></div><div class="readout" id="pe-o"></div>`,
  mount(root){
    const PE = (pos, d) => Array.from({ length: d }, (_, j) => { const i = Math.floor(j / 2), w = 1 / Math.pow(10000, 2 * i / d); return j % 2 ? Math.cos(pos * w) : Math.sin(pos * w); });
    const draw = () => { const d = +el_(root, "#pe-d").value, P0 = +el_(root, "#pe-p").value, p = new Plot(el_(root, "#pe-c"), { xmin: 0, xmax: d, ymin: 0, ymax: 64 }), G = p.g, a = hexToRgb(p.col.dnn), b = hexToRgb(p.col.path);
      for (let pos = 0; pos < 64; pos++) { const v = PE(pos, d); v.forEach((x, j) => { const c = x >= 0 ? mix([255, 255, 255], b, x) : mix([255, 255, 255], a, -x); G.fillStyle = `rgb(${c})`; G.fillRect(p.sx(j), p.sy(64 - pos), p.sx(1) - p.sx(0) + 0.5, p.sy(0) - p.sy(1) + 0.5); }); }
      p.axes("dimension", "position (top = 0)"); p.line([[0, 64 - P0 - 0.5], [d, 64 - P0 - 0.5]], p.col.ink, 1.5);
      const base = PE(P0, d), sims = []; for (let k = -P0; k <= 63 - P0; k++) sims.push([k, PE(P0 + k, d).reduce((s, v, j) => s + v * base[j], 0)]);
      const q = new Plot(el_(root, "#pe-s"), { xmin: -63, xmax: 63, ymin: -d / 2, ymax: d / 2 + 1 }); q.axes("offset k", "PE(p)·PE(p+k)"); q.line(sims, q.col.accent, 2);
      el_(root, "#pe-o").innerHTML = `<span>PE(${P0})[0..5] = (${base.slice(0, 6).map(v => v.toFixed(3)).join(", ")})</span><span>‖PE‖² = d/2 = ${d / 2} for every position</span><span>Each sin/cos pair is a point rotating at its own speed; moving k positions rotates every pair by a fixed angle, a linear map M_k.</span>`; };
    $$("input", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.transformerFlow = {
  title: "Follow one sentence through a Transformer", cap: "Translate \"this book\" → \"yeh kitab\" (the slides' example). Step through the encoder layer (eqs 9–10) and decoder layer (eqs 12–14). Shapes use d_model = 512, 8 heads, d_ff = 2048, source length n = 2, target length m = 3 (⟨s⟩ yeh kitab).",
  html: () => `<div class="flow" id="tf9-f"></div><div class="stepbox" id="tf9-x" style="margin-top:10px"></div><div class="row" style="margin-top:8px">${ctrlBtns("tf9")}</div><div class="readout" id="tf9-o"></div>`,
  mount(root){
    const S = [
      ["enc", "Tokens → embeddings", "n × 512", "Each source token (\"this\", \"book\") is looked up in the embedding matrix E ∈ ℝ^{|V|×512}."],
      ["enc", "+ positional encoding", "n × 512", "Add position vectors so the model knows word order: X = Embedding(tokens) + PE(positions) (eq. 3)."],
      ["enc", "LayerNorm → multi-head self-attention", "n × 512", "8 heads of size 64; every source token attends to every source token (bidirectional). Z₁ = X + MHA(LN(X)) (eq. 9): the + X is the residual connection."],
      ["enc", "LayerNorm → feed-forward", "n × 2048 → n × 512", "The same 2-layer network (expand ×4, ReLU/GELU, contract) applied to each position separately. Z₂ = Z₁ + FFN(LN(Z₁)) (eq. 10)."],
      ["enc", "× N layers → H_enc", "n × 512", "Repeat N = 6 times (BERT-base 12). H_enc holds a context-aware vector for every source token (eq. 11)."],
      ["dec", "Target tokens (shifted) + PE", "m × 512", "Decoder input ⟨s⟩ yeh kitab during training (teacher forcing); at inference only what has been generated so far."],
      ["dec", "Masked self-attention", "m × 512", "Token t may only attend to positions ≤ t (mask −∞ above the diagonal, eqs 15–16). Z₁ = Y + MaskedMHA(LN(Y)) (eq. 12)."],
      ["dec", "Cross-attention to H_enc", "m × 512", "Queries from the decoder, keys and values from H_enc: \"kitab\" can look at \"book\". Z₂ = Z₁ + CrossAttn(LN(Z₁), H_enc) (eq. 13)."],
      ["dec", "Feed-forward, × N layers", "m × 512", "Z₃ = Z₂ + FFN(LN(Z₂)) (eq. 14), stacked N times (eq. 17)."],
      ["dec", "Linear + softmax", "m × |V|", "logits = D^{(N)} W_out + b_out; P(y_t | y_<t, x) = softmax(logits_t) (eqs 18–19). Pick the next token greedily, by sampling or beam search."]
    ]; let k = -1;
    const draw = () => { el_(root, "#tf9-f").innerHTML = S.map((s, i) => `<div class="fbox ${i === k ? "on" : ""}" style="${s[0] === "dec" ? "background:var(--dnn-soft)" : ""}"><span class="num">${i + 1}</span>${s[1]}<small>${i <= k ? s[2] : ""}</small></div>`).join("");
      el_(root, "#tf9-x").innerHTML = k < 0 ? "Press <b>Step</b> to start at the encoder (green-grey boxes); the decoder boxes are blue." : `<b>${k < 5 ? "Encoder" : "Decoder"} · ${S[k][1]}</b> (shape ${S[k][2]})<br>${S[k][3]}`;
      el_(root, "#tf9-o").innerHTML = `<span>step ${Math.max(0, k + 1)} of ${S.length}</span><span>Every sub-layer keeps the shape × 512, which is what makes residual additions possible.</span>`; };
    player(root, "tf9", () => { if (k < S.length - 1) k++; draw(); }, () => { k = -1; draw(); }, 1400, () => k >= S.length - 1); draw(); return draw;
  }
};

LABS.paramCalc9 = {
  title: "How many parameters does a Transformer have?", cap: "Weights only, following the slides: encoder layer ≈ 4d² (attention) + 8d² (FFN, d_ff = 4d) + 4d (two LayerNorms) ≈ 12d²; decoder layer adds cross-attention: ≈ 16d². Embeddings |V|·d, learned positions n_max·d. Presets are approximate published sizes.",
  html: () => `<div class="ctrls"><label for="pc9-a">architecture <select id="pc9-a"><option value="enc">encoder-only</option><option value="dec">decoder-only (GPT-style)</option><option value="ed">encoder–decoder</option></select></label><label for="pc9-p">preset <select id="pc9-p"><option value="">—</option><option value="enc,768,12,30522,512">BERT-base</option><option value="enc,1024,24,30522,512">BERT-large</option><option value="dec,768,12,50257,1024">GPT-2 small</option><option value="ed,512,6,37000,512">Transformer base (2017)</option></select></label></div><div class="slidergrid"><label for="pc9-d">d_model <input id="pc9-d" type="range" min="128" max="4096" step="64" value="768"></label><label for="pc9-L">layers N (per stack) <input id="pc9-L" type="range" min="1" max="96" step="1" value="12"></label><label for="pc9-V">vocabulary |V| <input id="pc9-V" type="range" min="1000" max="100000" step="1000" value="30000"></label><label for="pc9-n">n_max <input id="pc9-n" type="range" min="128" max="8192" step="128" value="512"></label></div><div class="tablewrap"><table class="data num" id="pc9-t"></table></div><div class="readout" id="pc9-o"></div>`,
  mount(root){
    const fmtN = v => v >= 1e9 ? (v / 1e9).toFixed(2) + "B" : v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : v.toLocaleString();
    const draw = () => { const a = el_(root, "#pc9-a").value, d = +el_(root, "#pc9-d").value, L = +el_(root, "#pc9-L").value, V = +el_(root, "#pc9-V").value, n = +el_(root, "#pc9-n").value;
      const enc = 4 * d * d + 8 * d * d + 4 * d, dec = 8 * d * d + 8 * d * d + 6 * d, emb = V * d + n * d; const rows = [["token + position embeddings", `${V.toLocaleString()}·${d} + ${n}·${d}`, emb]];
      if (a !== "dec") rows.push([`encoder: ${L} × (12d² + 4d)`, `${L} × ${fmtN(enc)}`, L * enc]);
      if (a === "dec") rows.push([`decoder-only: ${L} × (12d² + 4d)`, "masked self-attn + FFN (no cross-attention)", L * enc]);
      if (a === "ed") rows.push([`decoder: ${L} × (16d² + 6d)`, `${L} × ${fmtN(dec)}`, L * dec], ["target embeddings (if not shared)", `${V.toLocaleString()}·${d} + ${n}·${d}`, emb]);
      const tot = rows.reduce((s, r) => s + r[2], 0);
      el_(root, "#pc9-t").innerHTML = `<tr><th>part</th><th>formula</th><th>parameters</th></tr>` + rows.map(r => `<tr><td>${r[0]}</td><td class="small muted">${r[1]}</td><td>${fmtN(r[2])}</td></tr>`).join("") + `<tr><th>total</th><th></th><th>${fmtN(tot)}</th></tr>`;
      el_(root, "#pc9-o").innerHTML = `<span>embeddings share: <b>${(100 * emb / tot).toFixed(0)}%</b></span><span>doubling d_model ≈ quadruples per-layer parameters; doubling layers doubles them</span><span>decoder layer / encoder layer ≈ ${(dec / enc).toFixed(2)} (slides: 16/12 ≈ 1.33)</span>`; };
    el_(root, "#pc9-p").addEventListener("change", e => { if (!e.target.value) return; const [a, d, L, V, n] = e.target.value.split(","); el_(root, "#pc9-a").value = a; el_(root, "#pc9-d").value = d; el_(root, "#pc9-L").value = L; el_(root, "#pc9-V").value = V; el_(root, "#pc9-n").value = n; draw(); });
    $$("input,#pc9-a", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;
  }
};

LABS.vitPatches = {
  title: "Cut an image into patches (ViT)", cap: "A synthetic 224×224 image. ViT splits it into P×P patches, flattens each (P·P·3 numbers), projects it to d = 768, prepends a [CLS] token and adds learned position embeddings. Smaller patches = longer sequences and quadratically more attention.",
  html: () => `<div class="lab-grid3"><canvas id="vp-c" style="height:300px" aria-label="Image patches"></canvas><div class="stack" style="gap:6px"><div class="tablewrap"><table class="data num" id="vp-t"></table></div></div></div><div class="ctrls"><label for="vp-p">patch size P <select id="vp-p"><option>8</option><option>14</option><option selected>16</option><option>28</option><option>32</option></select></label><label for="vp-i">image size <select id="vp-i"><option>112</option><option selected>224</option><option>384</option></select></label></div><div class="readout" id="vp-o"></div>`,
  mount(root){
    const draw = () => { const P = +el_(root, "#vp-p").value, I = +el_(root, "#vp-i").value, g = Math.floor(I / P), N = g * g, cv = el_(root, "#vp-c"), p = new Plot(cv, { xmin: 0, xmax: 1, ymin: 0, ymax: 1, pad: { l: 8, r: 8, t: 8, b: 8 } }), G = p.g, s = Math.min(p.R - p.L, p.B - p.T), x0 = p.L, y0 = p.T;
      for (let i = 0; i < 64; i++) for (let j = 0; j < 64; j++) { const u = i / 64, v = j / 64, sun = Math.hypot(u - 0.7, v - 0.3) < 0.15, hill = v > 0.65 + 0.1 * Math.sin(u * 7); G.fillStyle = sun ? "#E8B23A" : hill ? "#3E8E5E" : `rgb(${120 + 80 * v},${170 + 50 * v},235)`; G.fillRect(x0 + u * s, y0 + v * s, s / 64 + 0.5, s / 64 + 0.5); }
      G.strokeStyle = "rgba(255,255,255,0.9)"; G.lineWidth = 1; for (let k = 0; k <= g; k++) { G.beginPath(); G.moveTo(x0 + k * s / g, y0); G.lineTo(x0 + k * s / g, y0 + s); G.stroke(); G.beginPath(); G.moveTo(x0, y0 + k * s / g); G.lineTo(x0 + s, y0 + k * s / g); G.stroke(); }
      if (g <= 16) { G.fillStyle = "#fff"; G.font = "10px " + cssVar("--f-mono"); for (let a = 0; a < g; a++) for (let b = 0; b < g; b++) G.fillText(String(a * g + b + 1), x0 + b * s / g + 2, y0 + a * s / g + 10); }
      el_(root, "#vp-t").innerHTML = [["patches N = (H·W)/P²", N], ["sequence length N + 1 ([CLS])", N + 1], ["numbers per flattened patch P·P·3", P * P * 3], ["patch projection W_p (P²·3 × 768)", (P * P * 3 * 768).toLocaleString()], ["position embeddings (N+1) × 768", ((N + 1) * 768).toLocaleString()], ["attention scores per head per layer (N+1)²", ((N + 1) ** 2).toLocaleString()]].map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join("");
      el_(root, "#vp-o").innerHTML = `<span>${P === 16 && I === 224 ? "Slides: 224×224/16² = 196 patches + [CLS] = 197 positions." : ""}</span><span>[CLS] has no pixels of its own; after L layers its vector summarises the whole image and feeds the MLP head.</span>`; };
    $$("select", root).forEach(x => x.addEventListener("change", draw)); draw(); return draw;
  }
};

LABS.loraLab = {
  title: "LoRA: fine-tune with a tiny low-rank update", cap: "Freeze the pretrained d×d matrix W and learn ΔW = B·A with B ∈ ℝ^{d×r}, A ∈ ℝ^{r×d}: W_new = W + α·BA (eq. 28). Trainable numbers per matrix fall from d² to 2dr. B starts at zero, so training starts exactly at the pretrained model.",
  html: () => `<canvas id="lo-c" style="height:200px" aria-label="Matrix sizes"></canvas><div class="slidergrid"><label for="lo-d">d (hidden size) <input id="lo-d" type="range" min="256" max="8192" step="256" value="768"></label><label for="lo-r">rank r <input id="lo-r" type="range" min="1" max="64" step="1" value="8"></label><label for="lo-L">layers <input id="lo-L" type="range" min="1" max="80" step="1" value="12"></label><label for="lo-m">matrices adapted per layer <input id="lo-m" type="range" min="1" max="6" step="1" value="2"></label></div><div class="readout" id="lo-o"></div>`,
  mount(root){
    const draw = () => { const d = +el_(root, "#lo-d").value, r = +el_(root, "#lo-r").value, L = +el_(root, "#lo-L").value, m = +el_(root, "#lo-m").value, full = d * d, lora = 2 * d * r, model = 12 * d * d * L;
      const p = new Plot(el_(root, "#lo-c"), { xmin: 0, xmax: 10, ymin: 0, ymax: 4, pad: { l: 8, r: 8, t: 8, b: 8 } }), G = p.g, sq = 3.2, rr = Math.max(0.06, sq * r / d * 4);
      G.fillStyle = p.col.surface2; G.fillRect(p.sx(0.3), p.sy(3.6), p.sx(sq) - p.sx(0), p.sy(0) - p.sy(sq)); p.text(1.9, 2, "W (frozen)", p.col.muted, "center"); p.text(1.9, 1.6, `${d}×${d}`, p.col.muted, "center");
      p.text(4.1, 2, "+", p.col.ink, "center"); G.fillStyle = p.col.accent; G.fillRect(p.sx(4.6), p.sy(3.6), p.sx(rr) - p.sx(0), p.sy(0) - p.sy(sq)); p.text(4.6 + rr / 2, 0.2, "B", p.col.accent, "center");
      G.fillStyle = p.col.path; G.fillRect(p.sx(5.2 + rr), p.sy(3.6), p.sx(sq) - p.sx(0), p.sy(0) - p.sy(rr)); p.text(5.2 + rr + sq / 2, 3.6 - rr - 0.25, `A (${r}×${d})`, p.col.path, "center");
      el_(root, "#lo-o").innerHTML = `<span>per matrix: full ${full.toLocaleString()} vs LoRA ${lora.toLocaleString()} (<b>${(100 * lora / full).toFixed(2)}%</b>)</span><span>whole model: ${(L * m * lora).toLocaleString()} trainable of ≈${(model / 1e6).toFixed(0)}M weights in the Transformer layers (${(100 * L * m * lora / model).toFixed(2)}%; embeddings excluded)</span><span>${d === 768 && r === 8 && L === 12 && m === 2 ? "BERT-base, r = 8 on W_Q and W_V: 294,912 trainable parameters, ≈0.27% of the full 110M model." : ""}</span><span>The merged weight W + αBA has the same shape, so inference costs nothing extra.</span>`; };
    $$("input", root).forEach(x => x.addEventListener("input", draw)); draw(); return draw;
  }
};

/* ======================= Content loading (separate files per session) ======================= */
let CAT=null, SUBJECTS=[], ALL_SESSIONS=[], SESS={};
const CACHE={};
async function getJSON(path){ const r=await fetch(path,{cache:"no-cache"}); if(!r.ok) throw new Error(path+" "+r.status); return r.json(); }
async function loadCatalog(){ CAT=await getJSON("content/catalog.json"); SUBJECTS=CAT.subjects;
  ALL_SESSIONS=SUBJECTS.flatMap(s=>s.sessions.map((x,i)=>Object.assign(x,{subject:s.id,subjectName:s.name,idx:i})));
  SESS=Object.fromEntries(ALL_SESSIONS.map(s=>[s.id,s])); }
const sessPath = sid => `content/${SESS[sid].subject}/${SESS[sid].code.toLowerCase()}/`;
async function loadSession(sid){ if(CACHE[sid]) return CACHE[sid]; const base=sessPath(sid);
  const [meta,simple,deep,interview,quiz]=await Promise.all(["meta","simple","deep-dive","interview","quiz"].map(f=>getJSON(base+f+".json")));
  return CACHE[sid]={meta,simple,deep,interview,quiz}; }
const built = () => ALL_SESSIONS.filter(s=>s.built);
const TOTAL = () => ({ topics: ALL_SESSIONS.reduce((a,s)=>a+s.topics.length,0), pages: ALL_SESSIONS.reduce((a,s)=>a+s.pages,0) });

/* ======================= State & persistence ======================= */
const DEFAULT_STATE = () => ({ v:2, updated:0, mode:"simple", schedule:[1,3,7,14,30], status:{}, read:{}, recent:[], cards:{}, revs:{}, quiz:{}, conf:{} });
let ST = DEFAULT_STATE();
const LS_KEY="udit-hub-progress-v1";
let db=null, uid=null, saveTimer=null;
function loadLocal(){ try{ const raw=localStorage.getItem(LS_KEY); if(raw) ST=Object.assign(DEFAULT_STATE(), JSON.parse(raw)); }catch(e){} }
function save(){ ST.updated=Date.now(); try{ localStorage.setItem(LS_KEY, JSON.stringify(ST)); }catch(e){}
  if(db&&uid){ clearTimeout(saveTimer); saveTimer=setTimeout(async()=>{ try{ await db.doc(`data/users/${uid}/progress`).set(JSON.parse(JSON.stringify(ST))); }catch(e){ setSync(false,"Saved on this device only"); } },1200); } }
function setSync(on,label){ $$(".sync").forEach(el=>{ el.classList.toggle("on",on); el.querySelector("span").textContent=label; }); }
async function initSync(){
  if(!window.claude || !claude.use){ setSync(false,"Progress saved on this device"); return; }
  try{ const [d,u]=await Promise.all([claude.use("db"),claude.use("user")]); if(!d||!u){ setSync(false,"Progress saved on this device"); return; }
    const id=await u.id(); if(!id){ setSync(false,"Progress saved on this device"); return; } db=d; uid=id;
    const snap=await db.doc(`data/users/${uid}/progress`).get();
    if(snap.exists){ const remote=snap.data(); if((remote.updated||0)>(ST.updated||0)){ ST=Object.assign(DEFAULT_STATE(), JSON.parse(JSON.stringify(remote))); try{ localStorage.setItem(LS_KEY, JSON.stringify(ST)); }catch(e){} render(); } else if(ST.updated) save(); }
    else if(ST.updated) save();
    setSync(true,"Progress synced to your account");
  }catch(e){ db=null; setSync(false,"Progress saved on this device"); } }
const status = sid => ST.status[sid] || (ST.status[sid]={});
function toggleStatus(sid,key){ const s=status(sid); s[key]=!s[key]; if(key==="completed"&&s.completed&&!ST.revs[sid]) ST.revs[sid]={step:0,due:today0()+ST.schedule[0]*DAY}; save(); }
function visit(sid,view){ ST.recent=[{sid,view,t:Date.now()},...ST.recent.filter(r=>r.sid!==sid)].slice(0,8); save(); }
function markRead(sid,id,on=true){ const a=new Set(ST.read[sid]||[]); on?a.add(id):a.delete(id); ST.read[sid]=[...a]; save(); }
function readTargets(sid){ const s=SESS[sid]; return s && s.built ? s.readIds : []; }
function sessionProgress(sid){ if(status(sid).completed) return 1; const t=readTargets(sid); if(!t.length) return 0; const r=new Set(ST.read[sid]||[]); return t.filter(x=>r.has(x)).length/t.length; }
function overallProgress(){ return ALL_SESSIONS.reduce((a,s)=>a+sessionProgress(s.id),0)/ALL_SESSIONS.length; }
/* spaced repetition */
const cardKey=(sid,i)=>sid+"#"+i;
function nextInterval(c,rating){ const sch=ST.schedule, cur=c?c.ivl:0; const up=v=>{ const n=sch.find(x=>x>v); return n!==undefined?n:Math.round(v*2); };
  if(rating==="again") return sch[0]; if(rating==="hard") return Math.max(sch[0],Math.round(cur*0.6)||sch[0]); if(rating==="good") return c?up(cur):sch[0]; return c?up(up(cur)):(sch[1]||sch[0]*3); }
function rateCard(k,rating){ const c=ST.cards[k], ivl=nextInterval(c,rating); ST.cards[k]={ivl,due:today0()+ivl*DAY,reps:(c?c.reps:0)+1,lapses:(c?c.lapses:0)+(rating==="again"?1:0),last:Date.now()}; save(); }
async function allFlashcards(){ const out=[]; for(const s of built()){ const C=await loadSession(s.id); C.meta.flashcards.forEach((c,i)=>out.push({sid:s.id,i,k:cardKey(s.id,i),card:c})); } return out; }
function dueCount(){ let n=0; built().forEach(s=>{ for(let i=0;i<s.cards;i++){ const c=ST.cards[cardKey(s.id,i)]; if(!c||c.due<=today0()) n++; } }); return n; }
function sessionReviewAdjust(sid,pct){ const r=ST.revs[sid]; if(!r) return; const sch=ST.schedule; if(pct<0.6) r.step=0; else if(pct>=0.85) r.step=Math.min(r.step+1,sch.length-1); r.due=today0()+sch[r.step]*DAY; save(); }
function completeSessionReview(sid,ok){ const r=ST.revs[sid]; if(!r) return; const sch=ST.schedule; r.step=ok?Math.min(r.step+1,sch.length):0; r.due=today0()+(sch[r.step]??sch[sch.length-1]*2)*DAY; save(); }
function weakTopics(){ const w={}; const add=(label,sid,why,score)=>{ const k=label+"|"+sid; w[k]=w[k]||{label,sid,why:new Set(),score:0}; w[k].why.add(why); w[k].score+=score; };
  Object.entries(ST.quiz).forEach(([sid,h])=>{ const last=h[h.length-1]; if(last&&SESS[sid]) last.misses.forEach(t=>add(t,sid,"missed in last quiz",2)); });
  Object.entries(ST.conf).forEach(([k,v])=>{ if(v===1){ const [sid,id]=k.split("|"); const q=CACHE[sid]?.interview.find(x=>x.id===id); if(q) add(q.q,sid,"marked shaky in interview prep",1); } });
  ALL_SESSIONS.forEach(s=>{ const st=status(s.id); if(st.difficult) add(s.title,s.id,"marked difficult",3); if(st.revise) add(s.title,s.id,"marked for revision",2); });
  return Object.values(w).sort((a,b)=>b.score-a.score); }

/* ======================= Router: every view has a permanent #token ======================= */
const SVIEWS=["simple","deep","split","interview","recall","practice"];
let VIEW={name:"home"}; let mounted=[];
function tokenFor(v){ if(v.name==="session") return v.id+"-"+v.view; if(v.name==="subject") return v.id; return v.name==="home"?"":v.name; }
function go(name,args={}){ if(name==="session"&&!args.view) args.view=SESS[args.id]?.built?ST.mode:"outline"; VIEW=Object.assign({name},args);
  if(VIEW.name==="session"&&["simple","deep","split"].includes(VIEW.view)){ ST.mode=VIEW.view; save(); }
  const t=tokenFor(VIEW); try{ history.replaceState(null,"",t?"#"+t:location.pathname+location.search); }catch(e){} render(); if(!args.keepScroll) window.scrollTo({top:0}); }
function parseHash(){ const h=(location.hash||"").slice(1); if(!h) return {name:"home"};
  if(["interview","revision","library","coverage"].includes(h)) return {name:h};
  if(SUBJECTS.find(s=>s.id===h)) return {name:"subject",id:h};
  const m=h.match(/^([a-z]+-m\d+)(?:-(simple|deep|split|interview|recall|practice|outline))?$/); if(m&&SESS[m[1]]) return {name:"session",id:m[1],view:m[2]||(SESS[m[1]].built?ST.mode:"outline")};
  return {name:"home"}; }
addEventListener("hashchange",()=>{ const v=parseHash(); if(tokenFor(v)!==tokenFor(VIEW)){ VIEW=v; render(); } });

  v.innerHTML=head(C)+`<div class="modebar"><div class="seg modes" role="tablist" aria-label="Learning mode">${modeBtn("simple","Simple Learning")}${modeBtn("deep","Deep Dive")}${modeBtn("split","Split View")}</div>
    <div class="seg modes alt" role="tablist" aria-label="Practice">${modeBtn("interview","Interview prep")}${modeBtn("recall","Quick recall")}${modeBtn("practice","Flashcards & quiz")}</div></div><div id="sbody"></div>${prevNext(s)}`;

  if(view==="simple"){ body.innerHTML=`<div class="single">${simpleHTML(s,C,"page")}</div>`; afterArticle(body,s,C); }

  else if(view==="recall") tabRecall(body,s,C);
  else tabPractice(body,s,C);
  if(VIEW.sec) requestAnimationFrame(()=>setTimeout(()=>{ const t=document.getElementById(VIEW.sec.startsWith("h")||["what","why","demo"].includes(VIEW.sec)?"s-"+VIEW.sec:"d-"+VIEW.sec)||document.getElementById("s-"+VIEW.sec)||document.getElementById("d-"+VIEW.sec); if(t){ t.scrollIntoView({block:"start"}); t.classList.add("flash"); setTimeout(()=>t.classList.remove("flash"),1600); } },200));
}

function simpleHTML(s,C,ctx){ const S=C.simple, inSplit=ctx==="split";

   ${part(7,"takeaways","Five important takeaways",`<ol class="takeaways">${S.takeaways.map(t=>`<li>${t}</li>`).join("")}</ol>`,[])}

   <section class="dsec" id="d-iq"><div class="sec-head"><h2>Advanced interview questions</h2></div><div class="list">${C.interview.filter(q=>q.level==="a").slice(0,6).map(q=>`<div><b class="small">${q.q}</b><div class="small muted">${q.short}</div></div>`).join("")}</div><div class="row" style="margin-top:10px"><button class="btn sm" data-go="session" data-id="${s.id}" data-view="interview">All ${C.interview.length} questions and simulation mode</button></div></section>
   <section class="dsec" id="d-sources"><div class="sec-head"><h2>Sources and review flags</h2></div><p class="small">Sections tagged with slide pages are reconstructed from the ${s.subject.toUpperCase()} Module ${s.code.slice(1)} slides. Sections tagged <span class="tag extra">Beyond the slides</span> are supplementary. Points that need your review:</p>
    <div class="list">${C.meta.flags.map(f=>`<div class="row" style="align-items:flex-start;flex-wrap:nowrap"><span class="chip warn">p.${f.page}</span><span class="small">${f.note}</span></div>`).join("")}</div>
    ${alsoCovered(s.id)}</section></article>`; }
function eqRange(a){ const out=[]; let st=a[0],pr=a[0]; for(let i=1;i<=a.length;i++){ if(a[i]===pr+1){ pr=a[i]; continue; } out.push(st===pr?st:`${st}–${pr}`); st=pr=a[i]; } return out.join(", "); }
function alsoCovered(sid){ const o=CAT.overlaps.filter(x=>x.refs.some(r=>r[0]===sid)); if(!o.length) return ""; return `<div class="panel" style="margin-top:14px"><h3>Also covered in your other material</h3><div class="list">${o.map(x=>`<div><b class="small">${x.concept}</b><div class="row" style="margin-top:4px">${x.refs.filter(r=>r[0]!==sid).map(r=>`<button class="chip ${SESS[r[0]].subject==="dnn"?"dnn":"src"}" data-go="session" data-id="${r[0]}" style="border:0;cursor:pointer">${SESS[r[0]].subject.toUpperCase()} ${SESS[r[0]].code} · p.${r[1]}</button>`).join("")}</div></div>`).join("")}</div></div>`; }

function afterArticle(root,s,C){ mountLabs(root);

  $$("[data-copy]",root).forEach(b=>b.onclick=()=>copyText(C.deep.code.find(c=>c.file===b.dataset.copy).code,b));
  $$(".mathbtn",root).forEach(b=>b.onclick=()=>{ if(VIEW.view==="split") syncTo(b.dataset.math,true); else go("session",{id:s.id,view:"deep",sec:b.dataset.math}); });

  $$(".checkq .qz",root).forEach(box=>{ const q=C.simple.check[+box.dataset.ci]; $$(".opt",box).forEach(o=>o.onclick=()=>{ if(box.dataset.done) return; box.dataset.done=1; const k=+o.dataset.k, ok=k===q.a;

    $(".fbslot",box).innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b> ${q.why} <button class="btn sm ghost mathbtn" data-math="${q.link}">Why, in the Deep Dive ⟶</button></div>`;
    $(".fbslot .mathbtn",box).onclick=()=>{ if(VIEW.view==="split") syncTo(q.link,true); else go("session",{id:s.id,view:"deep",sec:q.link}); };

/* ---------- Split view with topic sync ---------- */
let SPLIT={follow:true,full:null,tab:"simple",lock:0};
function splitView(body,s,C){
  const narrow=matchMedia("(max-width: 900px)").matches;
  body.innerHTML=`<div class="split ${narrow?"narrow":""} ${SPLIT.full?"full-"+SPLIT.full:""}" id="split" data-tab="${SPLIT.tab}">
    ${narrow?`<div class="seg splittabs" role="tablist"><button role="tab" data-t="simple" aria-selected="${SPLIT.tab==="simple"}">Simple Learning</button><button role="tab" data-t="deep" aria-selected="${SPLIT.tab==="deep"}">Deep Dive</button></div>`:""}
    <div class="pane left" id="paneL"><div class="panehead"><b>Simple Learning</b><span class="row" style="gap:6px"><label class="small"><input type="checkbox" id="follow" ${SPLIT.follow?"checked":""}> Follow along</label><button class="btn sm ghost" data-full="left">${SPLIT.full==="left"?"Exit full screen":"Expand"}</button></span></div><div class="panebody" id="pbL">${simpleHTML(s,C,"split")}</div></div>
    <div class="pane right" id="paneR"><div class="panehead"><b>Deep Dive</b><span class="row" style="gap:6px"><span class="small muted" id="synclbl"></span><button class="btn sm ghost" data-full="right">${SPLIT.full==="right"?"Exit full screen":"Expand"}</button></span></div><div class="panebody" id="pbR">${deepHTML(s,C,"split")}</div></div></div>`;
  afterArticle(body,s,C);
  $$("[data-full]",body).forEach(b=>b.onclick=()=>{ SPLIT.full=SPLIT.full===b.dataset.full?null:b.dataset.full; const el=$("#split"); el.classList.remove("full-left","full-right"); if(SPLIT.full) el.classList.add("full-"+SPLIT.full); $$("[data-full]",body).forEach(x=>x.textContent=SPLIT.full===x.dataset.full?"Exit full screen":"Expand"); setTimeout(redrawLabs,60); });
  $$(".splittabs button",body).forEach(b=>b.onclick=()=>{ SPLIT.tab=b.dataset.t; $("#split").dataset.tab=SPLIT.tab; $$(".splittabs button",body).forEach(x=>x.setAttribute("aria-selected",x.dataset.t===SPLIT.tab)); setTimeout(redrawLabs,60); });
  $("#follow",body).onchange=e=>{ SPLIT.follow=e.target.checked; };
  $$("#pbL .spart, #pbL .hstep",body).forEach(el=>el.addEventListener("click",e=>{ if(e.target.closest("button,input,select,label,canvas,a")) return; const l=(el.dataset.link||"").split(" ").filter(Boolean)[0]; if(l) syncTo(l,true,el); }));
  if(!narrow){ const obs=new IntersectionObserver(es=>{ if(!SPLIT.follow||Date.now()<SPLIT.lock) return; const vis=es.filter(e=>e.isIntersecting); if(!vis.length) return; const el=vis[0].target; const l=(el.dataset.link||"").split(" ").filter(Boolean)[0]; if(l) syncTo(l,false,el); },{root:$("#pbL"),rootMargin:"-25% 0px -65% 0px"});
    $$("#pbL .hstep, #pbL .spart[data-link]:not([data-link=''])",body).forEach(x=>obs.observe(x)); mounted.push({stop:()=>obs.disconnect()}); }
}
function relTop(el,pane){ return el.getBoundingClientRect().top-pane.getBoundingClientRect().top+pane.scrollTop; }
function syncTo(deepId,explicit,fromEl){ const pane=$("#pbR"), t=document.getElementById("d-"+deepId); if(!pane||!t) return; if(explicit) SPLIT.lock=Date.now()+1500;
  $$(".dsec.hl").forEach(x=>x.classList.remove("hl")); t.classList.add("hl"); $$("#pbL .active").forEach(x=>x.classList.remove("active")); if(fromEl) fromEl.classList.add("active");
  if(matchMedia("(max-width: 900px)").matches && explicit){ SPLIT.tab="deep"; $("#split").dataset.tab="deep"; $$(".splittabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.t==="deep")); }
  pane.scrollTo({top:relTop(t,pane)-8,behavior:reduceMotion()?"auto":"smooth"}); const lbl=$("#synclbl"); if(lbl) lbl.textContent="Showing: "+t.querySelector("h2").textContent; }
function syncLeft(simpleId){ const pane=$("#pbL"), t=document.getElementById("s-"+simpleId); if(!pane||!t) return; if(matchMedia("(max-width: 900px)").matches){ SPLIT.tab="simple"; $("#split").dataset.tab="simple"; }
  pane.scrollTo({top:relTop(t,pane)-8,behavior:reduceMotion()?"auto":"smooth"}); t.classList.add("flash"); setTimeout(()=>t.classList.remove("flash"),1500); }

/* ---------- Interview: list + simulation ---------- */
const LV={b:"Beginner",i:"Intermediate",a:"Advanced"}, KIND={concept:"Concept",scenario:"Scenario",coding:"Coding",compare:"Comparison"};
function qBody(sid,q){ const key=sid+"|"+q.id, c=ST.conf[key]||0;
  return `<div><h5>30-second answer</h5><div class="short">${q.short}</div></div><div><h5>Detailed technical answer</h5><div>${q.detail}</div></div><div><h5>Practical application</h5><div>${q.example}</div></div>
  <div class="grid2"><div><h5>Likely follow-up questions</h5><ul>${q.follow.map(x=>`<li>${x}</li>`).join("")}</ul></div><div><h5>Common interview traps</h5><ul>${q.mistakes.map(x=>`<li>${x}</li>`).join("")}</ul></div></div>
  <div class="conf" data-conf="${key}"><span class="muted">How confident are you?</span>${[[1,"Shaky"],[2,"Okay"],[3,"Solid"]].map(([n,l])=>`<button class="stbtn" data-c="${n}" aria-pressed="${c===n}"><i class="confdot c${n}"></i>${l}</button>`).join("")}</div>`; }
function bindConf(root){ $$("[data-conf]",root).forEach(box=>$$("button",box).forEach(b=>b.onclick=()=>{ const k=box.dataset.conf,n=+b.dataset.c; ST.conf[k]=ST.conf[k]===n?0:n; save(); $$("button",box).forEach(x=>x.setAttribute("aria-pressed",+x.dataset.c===ST.conf[k])); const dot=$(`[data-dot="${k}"]`); if(dot) dot.className="confdot c"+(ST.conf[k]||0); })); }
function questionList(el,items,opts={}){ const f=Object.assign({lvl:"all",kind:"all",q:""},el._f||{}); el._f=f;
  const draw=()=>{ const term=f.q.toLowerCase(); const list=items.filter(({q})=>(f.lvl==="all"||q.level===f.lvl)&&(f.kind==="all"||q.kind===f.kind)&&(!term||(q.q+q.short).toLowerCase().includes(term)));
    const seg=(name,vals)=>`<div class="seg" role="group">${vals.map(([k,l])=>`<button data-f="${name}" data-v="${k}" aria-pressed="${f[name]===k}">${l}</button>`).join("")}</div>`; const cnt=k=>items.filter(({q})=>q.level===k).length;
    el.innerHTML=`<div class="filters">${seg("lvl",[["all","All "+items.length],["b","Beginner "+cnt("b")],["i","Intermediate "+cnt("i")],["a","Advanced "+cnt("a")]])}${seg("kind",[["all","All types"],["concept","Concept"],["scenario","Scenario"],["coding","Coding"],["compare","Comparison"]])}<input id="qfilter" type="search" placeholder="Filter questions" value="${esc(f.q)}" aria-label="Filter questions"></div>
    <div>${list.map(({sid,q})=>`<div class="qcard"><button aria-expanded="false" data-q="${sid}|${q.id}"><span class="lvl ${q.level}">${LV[q.level]}</span><span class="qt">${q.q}${opts.showSession?`<span class="muted small"> · ${SESS[sid].subject.toUpperCase()} ${SESS[sid].code}</span>`:""}</span><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="chip">${KIND[q.kind]}</span><i class="confdot c${ST.conf[sid+"|"+q.id]||0}" data-dot="${sid}|${q.id}"></i></span></button><div class="qbody" hidden></div></div>`).join("")||`<div class="empty">No questions match these filters.</div>`}</div>`;
    $$("[data-f]",el).forEach(b=>b.onclick=()=>{ f[b.dataset.f]=b.dataset.v; draw(); });
    const inp=$("#qfilter",el); inp.oninput=()=>{ f.q=inp.value; clearTimeout(inp._t); inp._t=setTimeout(()=>{ draw(); const n=$("#qfilter",el); n.focus(); n.setSelectionRange(n.value.length,n.value.length); },250); };
    $$(".qcard > button",el).forEach(b=>b.onclick=()=>{ const body=b.nextElementSibling; if(body.hidden){ const [sid,id]=b.dataset.q.split("|"); const q=items.find(x=>x.sid===sid&&x.q.id===id).q; body.innerHTML=qBody(sid,q); body.hidden=false; typeset(body); hl(body); bindConf(body); } else body.hidden=true; b.setAttribute("aria-expanded",!body.hidden); });
    typeset(el); }; draw(); }
function simulation(el,items){ let lvl="all", order=[], i=0, revealed=false, res=[];
  const setup=()=>{ el.innerHTML=`<div class="panel sim"><h3>Interview simulation</h3><p class="small muted" style="margin-top:0">One question at a time. Answer out loud or type, then reveal and rate yourself. Ratings feed your weak-topics list.</p>
    <div class="row"><div class="seg">${[["all","Mixed"],["b","Beginner"],["i","Intermediate"],["a","Advanced"]].map(([k,l])=>`<button data-l="${k}" aria-pressed="${lvl===k}">${l}</button>`).join("")}</div><label class="small">Questions <select id="simn"><option>5</option><option selected>10</option><option>20</option></select></label><button class="btn primary" id="simgo">Start</button></div></div>`;
    $$("[data-l]",el).forEach(b=>b.onclick=()=>{ lvl=b.dataset.l; $$("[data-l]",el).forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===lvl)); });
    $("#simgo",el).onclick=()=>{ const pool=items.filter(x=>lvl==="all"||x.q.level===lvl).slice(); for(let k=pool.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [pool[k],pool[j]]=[pool[j],pool[k]]; } order=pool.slice(0,+$("#simn",el).value); i=0; res=[]; revealed=false; ask(); }; };
  const ask=()=>{ if(i>=order.length) return summary(); const {sid,q}=order[i];
    el.innerHTML=`<div class="panel sim"><div class="row" style="justify-content:space-between"><span class="eyebrow">Question ${i+1} of ${order.length} · ${LV[q.level]} · ${KIND[q.kind]}</span><button class="btn sm ghost" id="simstop">End</button></div><div class="bar" style="margin:8px 0 14px"><i style="width:${100*i/order.length}%"></i></div>
      <h3 class="simq">${q.q}</h3><label class="small muted" for="simans">Your answer (stays on this page only)</label><textarea id="simans" rows="4" placeholder="Talk it through or type key points…"></textarea>
      ${revealed?`<div class="qbody" style="padding:0;margin-top:14px">${qBody(sid,q)}</div><div class="row" style="margin-top:12px"><span class="small">How did you do?</span><button class="btn" data-r="1">Missed it</button><button class="btn" data-r="2">Partly</button><button class="btn primary" data-r="3">Nailed it</button></div>`:`<div class="row" style="margin-top:10px"><button class="btn primary" id="simrev">Reveal answer</button><button class="btn ghost" id="simskip">Skip</button></div>`}</div>`;

function flashDeck(el,cards,onDone){ let idx=0,shown=false;

    el.innerHTML=`<div class="flash"><div class="fcard"><div class="row" style="justify-content:space-between"><span class="eyebrow">Card ${idx+1} of ${cards.length}</span><span class="chip src">${SESS[c.sid].subject.toUpperCase()} ${SESS[c.sid].code} · p.${card[2]}</span></div><div class="side"><b>${card[0]}</b></div>${shown?`<div class="side ans">${card[1]}</div>`:""}

    typeset(el); if(!shown) $("#fcs",el).onclick=()=>{ shown=true; draw(); }; else $$("[data-r]",el).forEach(b=>b.onclick=()=>{ rateCard(c.k,b.dataset.r); shown=false; idx++; draw(); $("#nav").innerHTML=navHtml(false); }); }; draw(); }
async function quizStart(el,sids){ const qs=[]; for(const sid of sids){ const C=await loadSession(sid); C.quiz.forEach((q,i)=>qs.push(Object.assign({sid,i},q))); }
  el.innerHTML=`<div class="quiz">${qs.map((q,n)=>`<div class="qz" data-n="${n}"><div class="eyebrow" style="margin-bottom:6px">Q${n+1} · ${{mcq:"Multiple choice",multi:"Select all that apply",tf:"True or false",num:"Numerical",code:"Code reading"}[q.type]}${sids.length>1?` · ${SESS[q.sid].subject.toUpperCase()} ${SESS[q.sid].code}`:""}</div><div class="qtext ${q.type==="code"?"code":""}">${q.type==="code"?esc(q.q):q.q}</div>
    ${q.type==="num"?`<input id="qn${n}" type="number" step="any" style="background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:5px 8px;width:160px" aria-label="Answer for question ${n+1}">`:(q.type==="tf"?["True","False"]:q.opts).map((o,k)=>`<label class="opt"><input type="${q.type==="multi"?"checkbox":"radio"}" name="q${n}" value="${k}"><span>${q.type==="code"?`<code>${esc(o)}</code>`:o}</span></label>`).join("")}<div class="fbslot"></div></div>`).join("")}
    <div class="row"><button class="btn primary" id="qsub">Submit answers</button><span class="muted small">You can leave questions blank.</span></div><div id="qres"></div></div>`; typeset(el);
  $("#qsub",el).onclick=()=>{ let score=0; const misses=[]; qs.forEach((q,n)=>{ const box=$(`.qz[data-n="${n}"]`,el); let ok=false,picked=[];
      if(q.type==="num"){ const v=parseFloat($(`#qn${n}`,el).value); ok=isFinite(v)&&Math.abs(v-q.a)<=q.tol; } else { picked=$$(`input[name=q${n}]:checked`,box).map(i=>+i.value); const correct=q.type==="tf"?[q.a?0:1]:q.a; ok=picked.length===correct.length&&picked.every(p=>correct.includes(p)); $$(".opt",box).forEach((o,k)=>{ if(correct.includes(k)) o.classList.add("right"); else if(picked.includes(k)) o.classList.add("wrongpick"); }); }
      if(ok) score++; else misses.push(q.sid+"::"+q.topic);
      const wrongWhy=!ok&&q.wrong?picked.filter(p=>q.wrong[p]).map(p=>`<div><b>Why “${esc((q.opts||[])[p]||"")}” is wrong:</b> ${q.wrong[p]}</div>`).join(""):"";
      $(".fbslot",box).innerHTML=`<div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct.":"Not quite."}</b> ${q.type==="num"?`Answer: ${q.a}. `:""}${q.why} ${wrongWhy} <span class="chip src" style="margin-left:4px">p.${q.page}</span></div>`; $$("input",box).forEach(i=>i.disabled=true); });
    const pct=score/qs.length; sids.forEach(sid=>{ (ST.quiz[sid]=ST.quiz[sid]||[]).push({t:Date.now(),score,total:qs.length,misses:[...new Set(misses.filter(m=>m.startsWith(sid+"::")).map(m=>m.split("::")[1]))]}); sessionReviewAdjust(sid,pct); }); save();
    const recs=[...new Set(misses)].map(m=>{ const [sid,t]=m.split("::"); const sec=(CACHE[sid].meta.topicSection||{})[t]; return sec?{sid,sec,t}:null; }).filter(Boolean);
    $("#qres",el).innerHTML=`<div class="score"><b class="num">${score} / ${qs.length}</b><div><div>${pct>=.85?"Strong. Your next review has been pushed out.":pct>=.6?"Good. Review the misses below.":"Worth another pass through the session; your review was moved to tomorrow."}</div>${recs.length?`<div class="small muted" style="margin-top:6px">Weak topics: ${[...new Set(recs.map(r=>r.t))].map(esc).join(", ")}</div><div class="row" style="margin-top:8px">${[...new Map(recs.map(r=>[r.sid+r.sec,r])).values()].map(r=>`<button class="btn sm" data-go="session" data-id="${r.sid}" data-view="deep" data-sec="${r.sec}">Revisit: ${esc(r.t)}</button>`).join("")}</div>`:""}<div class="row" style="margin-top:8px"><button class="btn sm ghost" id="qagain">Retake quiz</button></div></div></div>`;
    $("#qsub",el).disabled=true; $("#qagain",el).onclick=()=>quizStart(el,sids); typeset(el); $("#qres",el).scrollIntoView({behavior:reduceMotion()?"auto":"smooth",block:"center"}); }; }

async function buildIndex(){ const I=[]; const add=(type,title,desc,go,args,body="")=>I.push({type,title:strip(title),desc:strip(desc),go,args,hay:(strip(title)+" "+strip(desc)+" "+strip(body)).toLowerCase()});
  SUBJECTS.forEach(S=>{ add("Subject",S.name,S.blurb,"subject",{id:S.id}); S.sessions.forEach(s=>{ add("Session",`${s.code} · ${s.title}`,`${S.name} · ${s.pages} pages`,"session",{id:s.id},s.topics.map(t=>t[0]).join(" ")); s.topics.forEach(t=>add("Topic",t[0],`${S.short} ${s.code} · ${s.title} · ${pgs(t[1],t[2])}`,"session",{id:s.id})); }); });
  for(const s of built()){ const C=await loadSession(s.id), tag=`${s.subject.toUpperCase()} ${s.code}`;
    C.simple.how.forEach(h=>add("Simple explanation",h.title,`${tag} · Simple Learning`,"session",{id:s.id,view:"simple",sec:h.id},h.html));
    C.deep.sections.forEach(x=>add("Deep Dive",x.title,`${tag} · ${x.tag==="extra"?"supplementary":"slides "+pgs(x.pages[0],x.pages[1])}${x.eqs?" · Eq. "+eqRange(x.eqs):""}`,"session",{id:s.id,view:"deep",sec:x.id},x.body));
    C.meta.recall.defs.forEach(([a,b])=>add("Definition",a,b,"session",{id:s.id,view:"recall"})); C.meta.recall.formulas.forEach(f=>add("Formula",f,tag,"session",{id:s.id,view:"recall"}));
    C.deep.code.forEach(c=>add("Code example",c.title,`${tag} · ${c.lib}`,"session",{id:s.id,view:"deep",sec:"code"},c.code)); C.interview.forEach(q=>add("Interview question",q.q,q.short,"session",{id:s.id,view:"interview"},q.detail)); }
  CAT.overlaps.forEach(o=>add("Across decks",o.concept,"Covered in "+o.refs.map(r=>SESS[r[0]].subject.toUpperCase()+" "+SESS[r[0]].code+" p."+r[1]).join(", "),"library",{})); return I; }
async function openSearch(){ const layer=$("#layer"); layer.innerHTML=`<div class="overlay" id="sov" role="dialog" aria-modal="true" aria-label="Search"><div class="sbox"><input id="sq" type="search" placeholder="Search subjects, concepts, formulas, questions, code…" aria-label="Search"><div class="sres" id="sr"><div class="grp empty">Loading index…</div></div></div></div>`;
  const inp=$("#sq"),res=$("#sr"); inp.focus(); $("#sov").onclick=e=>{ if(e.target.id==="sov") layer.innerHTML=""; }; INDEX=INDEX||await buildIndex(); let sel=0,hits=[];
  const order=["Session","Simple explanation","Deep Dive","Topic","Definition","Formula","Interview question","Code example","Across decks","Subject"];
  const run=()=>{ const q=inp.value.toLowerCase().trim(), toks=q.split(/\s+/).filter(Boolean);
    if(!toks.length){ res.innerHTML=`<div class="grp eyebrow">Try</div>${["gradient descent","backpropagation","attention","regularisation","softmax","normal equation"].map(t=>`<button data-try="${t}"><span class="t">${t}</span></button>`).join("")}`; $$("[data-try]",res).forEach(b=>b.onclick=()=>{ inp.value=b.dataset.try; run(); }); hits=[]; return; }
    hits=INDEX.map(it=>{ let sc=0; for(const t of toks){ if(!it.hay.includes(t)) return null; if(it.title.toLowerCase().includes(t)) sc+=3; } if(it.title.toLowerCase().includes(q)) sc+=5; return {it,sc}; }).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,60);
    const groups={}; hits.forEach(h=>(groups[h.it.type]=groups[h.it.type]||[]).push(h)); hits=[];
    res.innerHTML=order.filter(g=>groups[g]).map(g=>`<div class="grp eyebrow">${g}</div>`+groups[g].slice(0,5).map(h=>{ hits.push(h); return `<button data-h="${hits.length-1}"><div class="t">${esc(h.it.title.length>110?h.it.title.slice(0,108)+"…":h.it.title)}</div><div class="d">${esc(h.it.desc.slice(0,130))}</div></button>`; }).join("")).join("")||`<div class="grp empty">Nothing in your material matches “${esc(q)}”.</div>`;
    sel=0; mark(); $$("[data-h]",res).forEach(b=>b.onclick=()=>pick(+b.dataset.h)); };
  const mark=()=>$$("[data-h]",res).forEach(b=>b.classList.toggle("on",+b.dataset.h===sel)); const pick=i=>{ const h=hits[i]; if(!h) return; layer.innerHTML=""; go(h.it.go,Object.assign({},h.it.args)); };
  inp.oninput=run; inp.onkeydown=e=>{ if(e.key==="ArrowDown"){ sel=Math.min(sel+1,hits.length-1); mark(); e.preventDefault(); } else if(e.key==="ArrowUp"){ sel=Math.max(sel-1,0); mark(); e.preventDefault(); } else if(e.key==="Enter") pick(sel); else if(e.key==="Escape") layer.innerHTML=""; }; run(); }
document.addEventListener("keydown",e=>{ if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); openSearch(); } else if(e.key==="Escape"){ if($("#layer")&&$("#layer").innerHTML) $("#layer").innerHTML=""; else if(SPLIT.full&&$("#split")){ SPLIT.full=null; render(); } } });

/* ======================= Boot ======================= */
(async function boot(){ try{ const t=localStorage.getItem("udit-hub-theme"); if(t) document.documentElement.dataset.theme=t; }catch(e){}
  loadLocal(); shell(); try{ await loadCatalog(); }catch(e){ $("#view").innerHTML=`<div class="panel"><h3>Content could not load</h3><p class="muted">${esc(e.message)}. Reload the page to try again.</p></div>`; return; }
  VIEW=parseHash(); render(); initSync(); matchMedia("(prefers-color-scheme: dark)").addEventListener("change",redrawLabs);
  let rz,lastW=innerWidth; addEventListener("resize",()=>{ clearTimeout(rz); rz=setTimeout(()=>{ const crossed=(lastW>900)!==(innerWidth>900); lastW=innerWidth; if(crossed&&VIEW.view==="split") render(); else redrawLabs(); },200); }); })();

</script>



<div id="installbar" hidden style="position:fixed;right:16px;bottom:16px;z-index:60;display:flex;gap:6px;align-items:center;background:var(--surface,#fff);border:1px solid var(--line,#ccd);border-radius:12px;padding:6px 6px 6px 12px;box-shadow:0 6px 24px rgba(0,0,0,.12);font:500 .9rem var(--f-sans,system-ui)">
<span>Install as an app</span><button class="btn primary sm" id="installgo">Install</button><button class="btn sm ghost" id="installx" aria-label="Dismiss">✕</button></div>
<script>
(function(){
  if ("serviceWorker" in navigator && location.protocol !== "file:") addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
  var ev = null, bar = document.getElementById("installbar"), dismissed = false;
  try { dismissed = localStorage.getItem("udit-hub-install-dismissed") === "1"; } catch (e) {}
  addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); ev = e; if (!dismissed) bar.hidden = false; });
  document.getElementById("installgo").onclick = function(){ if (!ev) return; ev.prompt(); ev.userChoice.finally(function(){ bar.hidden = true; ev = null; }); };
  document.getElementById("installx").onclick = function(){ bar.hidden = true; try { localStorage.setItem("udit-hub-install-dismissed", "1"); } catch (e) {} };
  addEventListener("appinstalled", function(){ bar.hidden = true; });
})();
</script>
